事物发展到极点必然转化——朴素辩证法的经典表述"], ["天人合一", "", "「与天地合其德，与日月合其明」——人应效法天地之道"], ["形而上者谓之道", "", "「形而上者谓之道，形而下者谓之器」——道器之辨的源头"]]}, {"g": "君子之道（义理派最重）", "r": [["自强不息", "乾之德", "「天行健，君子以自强不息」——刚健进取"], ["厚德载物", "坤之德", "「地势坤，君子以厚德载物」——宽厚包容"], ["居安思危", "", "「君子安而不忘危，存而不忘亡，治而不忘乱」"], ["谦谦君子", "谦卦", "六十四卦中唯谦卦六爻皆吉——满招损，谦受益"], ["趣时", "", "「变通者，趣时者也」——把握时机、随时而变，是易的实践智慧"]]}]}, {"t": "象数与占筮（传统文化介绍）", "sub": "易之为用：筮法、卦气、后世象数学", "map": [["大衍筮法", "《系辞》所载的蓍草起卦法：分二挂一揲四"], ["纳甲与卦气", "汉易将卦爻配天干、节气"], ["梅花易数", "邵雍一系，以数起卦、观象占断"], ["义理为本", "历代大儒多重其理而慎其占"]], "spine": "易本为卜筮之书，但孔子「五十以学易」重的是其理而非其占——「善为易者不占」。学易的正途是明理修德，占筮部分作传统文化了解即可。", "fig": "xiaoxi", "g": [{"g": "大衍筮法（传统筮法）", "r": [["大衍之数", "", "「大衍之数五十，其用四十有九」——以五十根蓍草，虚一不用，用四十九根起卦"], ["四营成易", "", "分二（分为两份）、挂一（取一象三才）、揲四（四根一数）、归奇（余数归拢）"], ["十八变成卦", "", "三变得一爻，十八变成一卦（六爻）"], ["老少阴阳", "", "得数六为老阴（变）、七为少阳、八为少阴、九为老阳（变）"], ["变爻定占", "", "以变爻及其变化后的「之卦」来判断——重在体察变化之机"]]}, {"g": "汉代象数学", "r": [["卦气说", "", "以六十四卦配一年节气，讲阴阳消长与时令的对应"], ["纳甲", "京房", "将八卦、六爻配以天干地支，用于占断"], ["十二消息卦", "", "以十二卦象征一年阴阳的消长（如复一阳生、姤一阴生、乾纯阳、坤纯阴）"], ["爻辰·飞伏", "", "汉易的推演体例，象数派的技术性内容"]]}, {"g": "宋代象数与后世", "r": [["河图洛书", "", "相传为易之数理渊源，宋人以之推演象数（其说存争议）"], ["先天易学", "邵雍", "《皇极经世》以先天六十四卦方圆图推演宇宙历史之数"], ["梅花易数", "", "托名邵雍，以时间、方位、事物之数起卦占断的一种简便方法"], ["提醒", "理性看待", "以上为传统术数文化的介绍。占筮不具科学依据，不应作为现实决策的依据"]]}, {"g": "学易的正确态度", "r": [["善易者不占", "", "真正通晓易理的人，明变化之道于事前，不必依赖占筮"], ["洁静精微", "", "《礼记》评易教「洁静精微」——易培养的是精微的思辨与洁净的心性"], ["重理轻占", "", "历代大儒皆以义理修养为本"], ["现代价值", "", "易经的价值在其变化哲学、辩证思维与人生智慧，而非预测吉凶"]]}]}], "F": [{"t": "识一卦：从符号到卦名", "when": "看到一个六爻卦，如何认出它、理解它", "s": [{"b": "第一步：拆成上下两卦", "p": "六爻分为上卦（外，上三爻）和下卦（内，下三爻）。先各自认出是八卦中的哪一个。", "f": [["三爻全阳 ☰", "乾（天）"], ["三爻全阴 ☷", "坤（地）"], ["中间一阳、上下阴 ☵", "坎（水）"], ["中间一阴、上下阳 ☲", "离（火）"]]}, {"b": "第二步：用取象歌核对", "p": "「乾三连，坤六断；震仰盂，艮覆碗；离中虚，坎中满；兑上缺，巽下断」——对着这十六字，任何三爻卦都能秒认。"}, {"b": "第三步：合成卦名", "p": "上卦在前、下卦在后取象。如上坎（水）下离（火）合为「水火既济」；上离下坎为「火水未济」。", "trap": "上下顺序不能颠倒：水火既济与火水未济是两个相反的卦，念反了意思全反。"}, {"b": "第四步：观两象相合之情景", "p": "把上下两个自然象放在一起想象。如「天在上、地在下」看似正常，却是否卦（天地不交）；「地在上、天在下」反而是泰卦（天地交泰）——因为气要相交才通。"}]}, {"t": "读一爻：判断吉凶的四把尺子", "when": "分析某一爻时的标准动作", "s": [{"b": "第一把：当位否", "p": "看爻的阴阳与位的阴阳是否相合。阳爻居初三五（阳位）、阴爻居二四上（阴位）为当位。", "f": [["阳爻在阳位 / 阴爻在阴位", "当位，守正，多吉"], ["阳爻在阴位 / 阴爻在阳位", "不当位，失正，多有咎"]]}, {"b": "第二把：得中否", "p": "二爻居下卦之中、五爻居上卦之中为「得中」。得中比当位更重要——居中者即使不当位，也常无咎。", "trap": "记住「中」高于「正」：这是读爻最容易忽略却最关键的一条。九五既中又正，是最尊贵的爻位。"}, {"b": "第三把：有应否", "p": "初与四、二与五、三与上相应。一阴一阳为「有应」（得外援），同性为「无应」或「敌应」。"}, {"b": "第四把：承乘比", "p": "看与相邻爻的关系。阴爻在阳爻之下为「承」（顺），在其上为「乘」（逆，多不安）。"}, {"b": "综合判断", "p": "四把尺子综合起来看，再结合爻辞的具体断语（吉、凶、悔、吝、无咎），才能定这一爻的意义。单看一条容易偏。"}]}, {"t": "学易的次第：先象后理", "when": "这门课从哪里入手、按什么顺序学", "s": [{"b": "第一步：背熟八卦", "p": "用取象歌把八卦的卦画、卦名、卦象、性情记死。这是一切的基础，八卦不熟，六十四卦无从谈起。"}, {"b": "第二步：懂爻位规则", "p": "当位、得中、应比承乘——这套读卦法则要熟练。它是通用的，适用于所有六十四卦。"}, {"b": "第三步：精读几个关键卦", "p": "不必一上来背六十四卦。先吃透乾、坤（易之门户）、泰否、既济未济这几个纲领性的卦，触类旁通。"}, {"b": "第四步：读《易传》明义理", "p": "从《系辞》《文言》《大象传》入手，理解易的哲学——阴阳之道、变通之理、君子之德。这是易的灵魂。", "trap": "象数占筮部分作传统文化了解即可。学易的正途是明理修身，「善易者不占」。"}, {"b": "第五步：以易观事", "p": "把易理用于观察世事人生：盛极必衰（泰极否来）、谦以受益、居安思危、变通趣时。学易的终点是智慧，不是预测。"}]}]},

{"k": "hl", "name": "健康生活", "en": "HEALTHY LIVING", "no": "10", "eqLabel": "要点速查", "flLabel": "实践路径", "lede": "这门课不讲速成和捷径，只讲<strong>被反复验证过的基本盘</strong>：怎么吃、怎么动、怎么睡、怎么应对压力。健康不是靠某一种「超级食物」或某个网红方案，而是靠<strong>长期可持续的日常选择</strong>——90% 的效果来自把基础做对，剩下 10% 才是细节优化。<strong>本手册为通用健康知识科普，不构成医疗、营养或运动处方。若你有慢性病、正在服药、处于孕期哺乳期，或有饮食失调相关困扰，请务必咨询医生或注册营养师后再做调整。</strong>", "M": [{"t": "总论：健康的底层逻辑", "sub": "先建立框架，再谈细节", "map": [["四根支柱", "饮食 · 运动 · 睡眠 · 压力管理——缺一根都会塌"], ["长期主义", "能坚持十年的普通方案，胜过坚持十天的完美方案"], ["个体差异", "同样的方案对不同人效果不同；基因、肠道菌群、生活节奏都有影响"], ["证据分级", "随机对照试验 > 队列研究 > 动物实验 > 个人经验"]], "spine": "健康没有秘诀。绝大多数收益来自四件朴素的事：吃得像样、动起来、睡得够、别长期紧绷。剩下的都是锦上添花。", "fig": "zhizhu", "g": [{"g": "四根支柱", "r": [["饮食", "影响最大", "决定体重、代谢、炎症水平、肠道健康。也是最难坚持的一环"], ["运动", "性价比最高", "改善心肺、维持肌肉与骨密度、调节情绪。缺乏运动的危害独立于体重存在"], ["睡眠", "最被低估", "长期睡眠不足会扰乱食欲激素、损害免疫与认知，且无法靠周末补回来"], ["压力管理", "最容易忽视", "慢性压力会升高皮质醇，影响睡眠、食欲与免疫，形成恶性循环"]]}, {"g": "建立正确预期", "r": [["改变需要时间", "身体不是开关", "代谢与体成分的变化以月计，不以天计。两周看不到变化是正常的"], ["不要追求完美", "关键", "「80 分坚持一年」远好于「100 分坚持两周」。允许自己有例外的日子"], ["先做减法", "", "戒掉一个坏习惯（如含糖饮料、久坐不动），往往比新增十个好习惯更有效"], ["一次只改一件事", "实操建议", "同时改变饮食+运动+作息，失败率极高。先固定一项，成为习惯后再加下一项"]]}, {"g": "怎么辨别健康信息的真伪", "r": [["警惕绝对化表述", "", "「彻底治愈」「排出毒素」「无需运动」——正规研究不会这样说话"], ["看证据来源", "", "有没有人体试验？样本量多大？是不是厂商赞助的？"], ["区分相关与因果", "常见误导", "「吃 X 的人更健康」可能只是因为吃 X 的人本身生活方式更好"], ["小心「单一食物神话」", "", "没有任何一种食物能决定健康。整体饮食模式才是关键"], ["个案 ≠ 证据", "", "「我朋友吃这个瘦了 20 斤」说明不了任何普遍规律"]]}]}, {"t": "饮食基础：吃什么、怎么配", "sub": "先把结构搭对，再谈具体食材", "map": [["三大宏量营养素", "蛋白质 · 碳水化合物 · 脂肪，各有各的作用，都不能长期缺"], ["食物质量", "优先选择加工程度低的天然食物"], ["餐盘法则", "一个简单可视化的搭配方法，不用称重计算"], ["水与饮品", "最容易被忽略的热量与健康来源"]], "spine": "与其纠结吃多少克，不如先把「吃什么」搞对：多吃完整食物、少吃深加工食品，这一条的收益超过任何精细计算。", "fig": ["canpan","shouzhang","tanshui","gigl"], "g": [{"g": "三大营养素的作用", "r": [["蛋白质", "构建与修复", "肌肉、酶、免疫细胞的原料。来源：鱼、禽、蛋、瘦肉、豆制品、乳制品。每餐都应包含"], ["碳水化合物", "主要能量来源", "优先选择<strong>全谷物、薯类、豆类</strong>等消化较慢的；精制糖与白面制品尽量少"], ["脂肪", "不是敌人", "参与激素合成与脂溶性维生素吸收。优选橄榄油、坚果、深海鱼；限制反式脂肪"], ["膳食纤维", "常被忽略", "促进肠道健康、增加饱腹感、稳定血糖。来源：蔬菜、水果、全谷、豆类"], ["常见误区", "", "「戒碳水」「戒脂肪」这类极端做法难以持续，且可能带来营养缺口"]]}, {"g": "碳水化合物：从淀粉到血糖", "r": [["三个层级", "结构决定一切", "单糖（葡萄糖·果糖·半乳糖）→ 双糖（蔗糖·乳糖·麦芽糖）→ 多糖（淀粉·糖原·纤维素）。层层堆叠，越大越需要拆解"], ["淀粉是什么", "关键认知", "<strong>淀粉本质就是一长串葡萄糖聚合而成</strong>。米饭嚼久了发甜，就是唾液淀粉酶把它剪成葡萄糖的过程"], ["蔗糖是什么", "", "就是白砂糖 ＝ 葡萄糖 + 果糖各一半。所以吃糖等于同时摄入这两种单糖"], ["纤维素为什么不算热量", "", "它也是葡萄糖串成的，但连接方式（β-1,4 键）人体没有酶能拆开——于是原样通过肠道，成为膳食纤维"], ["糖原", "身体的备用电池", "肝糖原可释放入血维持血糖；肌糖原只供肌肉自用，不能回补血糖"]]}, {"g": "葡萄糖 vs 果糖：两条完全不同的路", "r": [["葡萄糖的路径", "", "经小肠吸收后直接入血 → 全身细胞都能利用 → 刺激胰岛素分泌 → 触发饱腹信号"], ["果糖的路径", "关键差异", "主要在<strong>肝脏</strong>代谢 → 几乎不直接升血糖 → 对胰岛素刺激很弱 → <strong>基本不触发饱腹信号</strong>"], ["果糖的陷阱", "低 GI 不等于健康", "果糖 GI 仅 19，听起来很健康。但正因绕过了血糖与胰岛素这套信号系统，大脑收不到「吃饱了」的反馈，容易过量"], ["过量果糖的去向", "", "肝脏代谢能力有限，过量时更易转化为脂肪堆积在肝脏（与非酒精性脂肪肝相关）"], ["水果 ≠ 含糖饮料", "务必分清", "水果中的果糖被纤维和水分包裹，吸收慢、总量有限；饮料中是游离果糖，一瓶可顶数个水果的量"], ["实用结论", "", "限制的是<strong>添加糖与含糖饮料</strong>，不是完整水果"]]}, {"g": "GI 与 GL：怎么衡量升糖", "r": [["GI（血糖生成指数）", "衡量「质」", "以葡萄糖为 100 作基准，比较吃下含 50 克碳水的某食物后，两小时内血糖上升的幅度"], ["GI 分级", "", "高 GI ≥ 70（白米饭 83·白面包 75）｜中 GI 56–69｜低 GI ≤ 55（整粒燕麦 55·豆类约 30·果糖 19）"], ["GI 的缺陷", "为什么需要 GL", "它只管质不管量。西瓜 GI 高达 72，但 94% 是水，实际吃一份摄入的碳水很少"], ["GL（血糖负荷）", "衡量「质 × 量」", "<strong>GL = GI × 实际摄入的可利用碳水克数 ÷ 100</strong>"], ["GL 分级", "", "高 GL ≥ 20｜中 GL 11–19｜低 GL ≤ 10。西瓜一份（120 克）的 GL 仅约 4，属低负荷"], ["两者的分工", "一句话", "GI 说的是「这种碳水升糖多快」，GL 说的是「你实际吃的这份会造成多大冲击」。<strong>实际吃饭时 GL 更有参考价值</strong>"]]}, {"g": "GI 不是固定值：五个可控因素", "r": [["加工程度", "影响最大", "越细越高：整粒燕麦 55 → 速食燕麦片 79。颗粒完整度决定消化速度"], ["烹饪时间", "", "煮越久 GI 越高——淀粉糊化程度高了更易被酶分解"], ["搭配", "最实用", "配蛋白质、脂肪、纤维一起吃可降低整餐 GI。这就是「先吃菜和肉，再吃主食」的道理"], ["温度", "有意思", "米饭放凉会形成<strong>抗性淀粉</strong>，人体消化不了，相当于部分变成了纤维，GI 因而降低"], ["加醋", "", "醋能延缓胃排空，降低餐后血糖峰值"], ["重要提醒", "别本末倒置", "低 GI ≠ 健康。果糖 GI 只有 19，但没人会说果葡糖浆是健康食品。GI/GL 只评估血糖反应，不评估营养密度与加工程度"]]}, {"g": "餐盘法则：不用计算的搭配法", "r": [["一半蔬菜", "最容易做到的改进", "深色叶菜、十字花科（西兰花、白菜）、各色蔬菜换着吃"], ["四分之一蛋白质", "", "一掌大小的鱼、禽、蛋、豆制品或瘦肉"], ["四分之一主食", "", "优先全谷物、杂粮、薯类，替代部分白米白面"], ["加一点好脂肪", "", "一小把坚果、几片牛油果、适量橄榄油"], ["水果适量", "", "作为加餐而非饭后甜点；完整水果优于果汁"], ["为什么这样管用", "", "自动控制了热量密度和营养密度，不需要称重和记录"]]}, {"g": "加工程度：一个实用的判断标准", "r": [["完整食物", "优先", "蔬菜、水果、蛋、鱼、豆、坚果、全谷——看得出原本的样子"], ["适度加工", "可以吃", "豆腐、酸奶、全麦面包、冷冻蔬菜——加工是为了保存或消化"], ["深度加工食品", "限制", "配料表很长、含大量添加糖/精制油/添加剂的：含糖饮料、膨化零食、加工肉制品"], ["一个实用技巧", "", "看配料表：成分越少越好；糖排在前三位的要警惕；认不出的成分多则慎选"]]}, {"g": "水与饮品", "r": [["白水最优", "", "没有热量、没有添加糖。口渴时首选"], ["含糖饮料", "影响最大的单一改变", "一瓶含糖饮料的糖常超过每日建议上限。戒掉它往往是收益最快的一步"], ["咖啡与茶", "适量有益", "多数成年人适量饮用无害；但注意下午后摄入会影响睡眠"], ["酒精", "越少越好", "目前证据不支持「适量饮酒有益健康」的旧说法。能不喝就不喝"], ["果汁 ≠ 水果", "", "榨汁去掉了纤维，糖分吸收更快。吃完整水果更好"]]}]}, {"t": "抗炎饮食", "sub": "慢性低度炎症与日常饮食的关系", "map": [["什么是慢性炎症", "不同于受伤后的急性炎症；是长期低水平的免疫激活状态"], ["促炎因素", "深加工食品、过量添加糖、反式脂肪、长期睡眠不足、久坐、慢性压力"], ["抗炎食物", "蔬果、全谷、深海鱼、橄榄油、坚果、香辛料"], ["代表性膳食模式", "地中海饮食是研究最充分的抗炎膳食模式之一"]], "spine": "抗炎饮食不是某种特殊食谱，而是一种整体模式：多吃植物性完整食物与优质脂肪，少吃深加工食品与添加糖。它与「均衡饮食」的建议高度重合。", "g": [{"g": "先理解「慢性炎症」", "r": [["急性 vs 慢性", "别混淆", "急性炎症（红肿热痛）是身体的正常修复反应；这里说的是<strong>慢性低度炎症</strong>，无明显症状但长期存在"], ["为什么值得关注", "", "观察性研究显示，慢性炎症水平与心血管疾病、2型糖尿病、部分癌症等风险相关"], ["不是「排毒」", "理性看待", "抗炎饮食不能「清除毒素」，也不能治愈疾病。它的作用是降低长期风险，属于预防层面"], ["证据的局限", "诚实说明", "多数抗炎饮食研究是观察性的，能显示相关但难以证明因果。不宜夸大效果"]]}, {"g": "常见的促炎因素", "r": [["深度加工食品", "影响最明确", "高糖、高精制油、高钠、低纤维的组合"], ["过量添加糖", "", "含糖饮料、甜点、隐藏在酱料中的糖"], ["反式脂肪", "应尽量避免", "部分氢化植物油。看配料表中的「氢化」「起酥油」「植脂末」"], ["精制碳水占比过高", "", "白米白面为主、蔬菜和蛋白质不足的饮食结构"], ["非饮食因素", "同样重要", "长期睡眠不足、久坐、慢性压力、吸烟——这些的影响不亚于饮食"]]}, {"g": "有抗炎潜力的食物", "r": [["深色蔬菜", "每天都吃", "菠菜、西兰花、羽衣甘蓝等，富含多酚与维生素"], ["浆果与深色水果", "", "蓝莓、草莓、樱桃等，花青素含量较高"], ["富含 Omega-3 的鱼", "每周 2 次左右", "三文鱼、沙丁鱼、鲭鱼等深海鱼"], ["特级初榨橄榄油", "", "含羟基酪醇等多酚，是地中海饮食的核心油脂"], ["坚果与种子", "每天一小把", "核桃、杏仁、亚麻籽、奇亚籽"], ["全谷物与豆类", "", "燕麦、糙米、藜麦、各类豆子——同时提供纤维"], ["香辛料", "锦上添花", "姜黄、生姜、大蒜、肉桂等。注意：日常用量的效果远小于研究中的提取物剂量"], ["绿茶", "", "含儿茶素。适量饮用即可，不必刻意大量"]]}, {"g": "地中海饮食：研究最充分的模式", "r": [["核心特征", "", "大量蔬果与全谷、以橄榄油为主要油脂、常吃鱼与豆类、适量坚果、少量红肉"], ["为什么被推荐", "", "在多项长期研究中与较低的心血管疾病风险相关，且可持续性好"], ["本土化实践", "实用建议", "不必照搬地中海食材。用同样的<strong>原则</strong>搭配本地食物即可：多蔬菜、多杂粮、常吃鱼豆、用好油、少加工"], ["重要提醒", "", "任何膳食模式都不能替代疾病治疗。已确诊疾病者的饮食调整须由医生或注册营养师指导"]]}]}, {"t": "运动与健身", "sub": "三类运动缺一不可", "map": [["有氧运动", "改善心肺功能与代谢健康"], ["力量训练", "维持肌肉量与骨密度，随年龄增长愈发重要"], ["柔韧与平衡", "减少受伤风险，维持活动能力"], ["核心原则", "循序渐进 · 动作质量优先 · 允许恢复"]], "spine": "最好的运动是你能长期坚持的那一种。强度和花样都不如「持续做下去」重要——每周三次的散步远胜于每年一次的健身房年卡。", "fig": ["zhoukuang","xinlv","ranzhi","bmi","calc"], "g": [{"g": "三类运动的分工", "r": [["有氧运动", "打底", "快走、慢跑、游泳、骑车、跳绳。改善心肺耐力、血压、血糖调节"], ["力量训练", "最被低估", "自重训练、哑铃、弹力带、器械。30 岁后肌肉量自然流失，力量训练是唯一有效的对抗手段"], ["柔韧与平衡", "预防受伤", "拉伸、瑜伽、太极。中老年人尤其重要——预防跌倒的价值极高"], ["日常活动量", "别忽略", "走楼梯、步行通勤、做家务。这部分累计的消耗常超过专门锻炼"]]}, {"g": "公共健康机构的一般性建议", "r": [["有氧运动", "成年人", "每周至少 150 分钟中等强度，或 75 分钟高强度，可拆成每天 20–30 分钟"], ["中等强度是什么感觉", "实用判断", "能说话但不能唱歌。心率略快、微微出汗"], ["力量训练", "", "每周至少 2 次，覆盖主要肌群（腿、背、胸、肩、臂、核心）"], ["减少久坐", "独立于运动", "每坐 30–60 分钟起身活动几分钟。长时间久坐的危害不能靠一次锻炼抵消"], ["起点比目标重要", "", "做不到 150 分钟没关系。从「比现在多一点」开始，任何增加都有益"]]}, {"g": "新手的实操建议", "r": [["从走路开始", "门槛最低", "每天快走 20–30 分钟，坚持两周，再考虑增加强度或项目"], ["力量训练先学动作", "关键", "深蹲、硬拉、卧推等动作，宁可空杆或自重练到标准，再加重量"], ["循序渐进原则", "", "每周增加的训练量控制在 10% 左右，给身体适应时间"], ["安排恢复日", "", "肌肉在休息时增长，不是在训练时。同一肌群间隔 48 小时左右"], ["疼痛信号", "务必重视", "训练后的酸痛正常；<strong>关节刺痛、尖锐疼痛、持续疼痛不正常</strong>——立即停止并就医"], ["何时该先咨询医生", "", "有心血管疾病、关节损伤、长期不运动且年龄较大，或运动中出现胸闷、眩晕时"]]}, {"g": "新陈代谢：身体每天烧掉多少", "r": [["总消耗的四个组成", "先看结构", "基础代谢（BMR，约 60–70%）+ 食物热效应（TEF，约 10%）+ 运动消耗（EAT）+ 非运动性活动（NEAT）"], ["BMR 基础代谢率", "最大的一块", "维持呼吸、心跳、体温、器官运转所需的最低能量。<strong>躺着不动也要消耗</strong>"], ["NEAT 常被忽略", "差异极大", "走路、站立、做家务、坐立不安。不同人之间 NEAT 差异可达数百千卡/天，往往比刻意运动的影响更大"], ["TDEE 每日总消耗", "实际用的数", "TDEE ＝ BMR × 活动系数。这才是「你一天大概消耗多少」"], ["Mifflin-St Jeor 公式", "目前较准的估算", "男：10×体重(kg) + 6.25×身高(cm) − 5×年龄 + 5　｜　女：同上但最后 −161"], ["活动系数", "", "久坐 1.2｜轻度活动 1.375｜中度 1.55｜高度 1.725｜极高 1.9"], ["影响代谢的因素", "", "肌肉量（最可控）· 年龄 · 性别 · 体型 · 遗传 · 激素状态 · 环境温度"], ["为什么肌肉重要", "关键", "肌肉组织的静息代谢率高于脂肪组织。增肌能小幅提高 BMR，且提升日常活动能力"]]}, {"g": "这些数字该怎么用（重要）", "r": [["公式只是估算", "诚实说明", "个体实际值与公式估算的偏差可达 ±10–15%。影响因素包括体成分、肠道菌群、激素、遗传等"], ["代谢适应", "别忽略", "长期低能量摄入会导致 BMR 下降与 NEAT 减少（身体自动省电）。这也是极端节食难以持续的原因之一"], ["「代谢慢」多半是误解", "", "真正的病理性代谢低下（如甲减）需医学诊断。大多数人的差异来自体成分与活动量，而非「天生代谢慢」"], ["怎么用这些数字", "实用建议", "把它当作<strong>起点参考</strong>而非精确目标。观察两周体重与精力的实际变化，再据此微调，比信任任何公式都可靠"], ["不建议做的事", "", "不必每天称重、不必精确计算每一餐。数字焦虑本身会影响饮食行为与情绪"], ["什么时候该找专业人士", "", "有代谢性疾病（糖尿病·甲状腺问题）· 正在服药 · 孕哺期 · 有饮食失调相关困扰 · 或想做较大幅度的体重调整时"]]}, {"g": "BMI：一个粗糙但有用的筛查工具", "r": [["怎么算", "", "BMI ＝ 体重(kg) ÷ 身高(m)²。例：70kg、1.75m → 70 ÷ 1.75² ≈ 22.9"], ["WHO 标准", "国际通用", "偏瘦 <18.5｜正常 18.5–24.9｜超重 25–29.9｜肥胖 ≥30"], ["亚洲标准", "更严格·更适用", "亚洲人群在较低 BMI 时已出现代谢风险。中国标准：正常 18.5–23.9｜超重 24–27.9｜肥胖 ≥28"], ["最大局限", "必须知道", "<strong>BMI 分不清肌肉和脂肪</strong>。健美运动员 BMI 常超 28 却体脂很低；久坐者 BMI 正常也可能体脂偏高（「瘦胖子」）"], ["其他局限", "", "不反映脂肪分布、不适用于孕妇/儿童/老人/运动员、不同族裔风险阈值不同"], ["它的正确定位", "关键", "BMI 是<strong>群体筛查工具</strong>，用来在人群层面发现风险倾向；不是个体诊断标准，更不是评判身材的尺子"], ["更值得看的指标", "", "腰围（男 ≥90cm / 女 ≥85cm 提示腹型肥胖）· 腰臀比 · 体脂率 · 体能与代谢指标（血压血糖血脂）"], ["提醒", "", "若对体重或体型有持续困扰、或已出现极端节食/暴食倾向，请寻求医生或注册营养师帮助，而不是反复称重"]]}, {"g": "心率区间：怎么衡量运动强度", "r": [["最大心率估算", "两个公式", "简易：220 − 年龄　｜　更准（Tanaka）：208 − 0.7 × 年龄。都只是估算，个体差异可达 ±10–12 次"], ["储备心率法", "更精确", "目标心率 ＝（最大心率 − 静息心率）× 强度% + 静息心率。考虑了个人基础水平，比单纯百分比准确"], ["静息心率怎么测", "", "晨起未活动时测 1 分钟。它本身也是心肺功能指标——长期运动者会逐渐降低"], ["区间 1（50–60%）", "恢复区", "轻松散步。用于热身、放松、恢复日"], ["区间 2（60–70%）", "基础耐力区", "能正常说话。所谓「燃脂区」指的就是这里——但含义常被误解（见下一组）"], ["区间 3（70–80%）", "有氧耐力区", "说话开始费劲。改善心肺功能最有效的区间"], ["区间 4（80–90%）", "乳酸阈区", "只能说短句。提升耐力上限，但消耗大、需充分恢复"], ["区间 5（90–100%）", "最大强度", "无法说话。仅短时间间歇使用，新手不宜"]]}, {"g": "「燃脂心率」的真相（重要）", "r": [["流行说法", "", "「低强度运动才燃脂，心率超过某值就只烧糖不烧脂」——这个说法<strong>混淆了比例与总量</strong>"], ["事实的前半段", "说法有依据", "低强度时，供能中脂肪占的<strong>百分比</strong>确实更高（约 50–60%）；高强度时脂肪占比下降（约 30–40%）"], ["事实的后半段", "被忽略的部分", "但高强度时<strong>总消耗</strong>大得多。占比虽低，脂肪的<strong>绝对消耗量</strong>反而可能更高"], ["举个数", "直观对比", "30 分钟慢走：消耗约 120 千卡 × 55% ≈ 66 千卡来自脂肪　｜　30 分钟跑步：消耗约 300 千卡 × 35% ≈ 105 千卡来自脂肪"], ["还有后燃效应", "EPOC", "高强度运动后数小时内代谢率仍偏高，额外增加消耗。低强度基本没有这个效应"], ["那低强度没用吗", "并非如此", "低强度的优势在<strong>可持续、易恢复、受伤风险低</strong>，适合新手、恢复日与长时间运动。它的价值在于「能坚持」"], ["真正决定减脂的是什么", "核心结论", "是<strong>总能量收支</strong>，不是某个心率区间。而饮食对能量收支的影响通常大于运动"], ["实用建议", "", "别纠结燃脂区。选你能坚持的强度，把总活动量提上去；有余力再加一点高强度间歇"]]}, {"g": "不用心率带也能判断强度", "r": [["说话测试", "最实用", "能唱歌＝太轻｜能正常对话＝中等强度｜只能说短句＝较高强度｜说不出话＝高强度"], ["自觉用力程度（RPE）", "0–10 分", "3–4 分＝中等｜5–6 分＝偏高｜7–8 分＝高强度。凭主观感受打分，与心率相关性不错"], ["为什么它们够用", "", "心率会受咖啡因、睡眠、情绪、气温、脱水影响，未必准确反映当下强度。主观感受有时反而更可靠"], ["手环手表的准确性", "理性看待", "腕式光学心率在稳态有氧时较准，在高强度间歇、力量训练时误差较大。看趋势比看单次数值更有意义"], ["需要留意的信号", "", "运动中出现胸痛胸闷、头晕、异常气促、心律不齐——立即停止并就医，不要用「心率区间」去解释这些症状"]]}, {"g": "常见误区", "r": [["「局部减脂」", "做不到", "仰卧起坐不能专门减肚子。脂肪消耗是全身性的"], ["「力量训练会变壮」", "多虑了", "增肌需要长期高强度训练加充足热量。一般训练只会让线条更好、代谢更高"], ["「必须练到力竭」", "", "对新手弊大于利。留有余力的训练更可持续、受伤风险更低"], ["「出汗多 = 效果好」", "", "出汗量主要取决于环境温度和个人体质，与消耗无必然关系"], ["「运动了就能随便吃」", "", "运动消耗常被高估。半小时慢跑的消耗，一块蛋糕就能抵消"]]}]}, {"t": "睡眠与恢复", "sub": "最便宜也最有效的健康投资", "map": [["睡眠的作用", "记忆巩固、激素调节、免疫修复、代谢清理"], ["睡眠不足的连锁反应", "食欲激素紊乱、注意力下降、情绪不稳、免疫力降低"], ["睡眠卫生", "可操作的环境与习惯调整"], ["何时需要就医", "持续失眠、打鼾伴呼吸暂停、白天严重嗜睡"]], "spine": "睡眠不是可以透支的资源。长期睡不够会同时破坏饮食控制、运动表现和情绪稳定——它是那根拖垮其余三根支柱的绳子。", "g": [{"g": "为什么睡眠这么重要", "r": [["激素调节", "与体重直接相关", "睡眠不足会升高饥饿素、降低瘦素，导致食欲增加、更想吃高热量食物"], ["认知与情绪", "", "影响注意力、判断力、情绪调节能力。长期不足与焦虑抑郁风险相关"], ["免疫功能", "", "睡眠期间免疫系统进行修复。长期不足会削弱抵抗力"], ["无法补回来", "重要认知", "周末补觉能缓解部分困倦，但无法完全弥补工作日的累积亏空"]]}, {"g": "睡眠卫生：可操作的调整", "r": [["固定作息", "最有效的一条", "每天同一时间睡和起，包括周末。生物钟稳定比睡够时长更重要"], ["睡前一小时远离屏幕", "", "蓝光与信息刺激都会延迟入睡。改为阅读纸质书、拉伸、洗澡"], ["卧室环境", "", "黑暗、安静、凉爽（18–22℃左右）。必要时用遮光帘和耳塞"], ["下午后不摄入咖啡因", "", "咖啡因半衰期约 5–6 小时，下午的咖啡可能影响夜间睡眠"], ["睡前不大量进食或饮酒", "", "酒精会让人快速入睡但破坏深睡眠结构，整体睡眠质量下降"], ["白天晒太阳", "调节生物钟", "早晨接触自然光有助于稳定昼夜节律"], ["睡不着怎么办", "别硬躺", "躺 20 分钟仍无睡意就起身，做点安静的事，有困意再回床"]]}, {"g": "什么时候该看医生", "r": [["持续失眠", "", "入睡困难或早醒持续一个月以上，且影响白天功能"], ["打鼾伴呼吸暂停", "需重视", "睡眠中被观察到呼吸停止、夜间憋醒、白天严重嗜睡——可能是睡眠呼吸暂停"], ["白天难以维持清醒", "", "充足睡眠后仍嗜睡，可能提示其他健康问题"], ["提醒", "", "本节为一般性睡眠知识。安眠类药物必须由医生处方，不可自行购买或参照他人用药"]]}]}, {"t": "压力管理与心理健康", "sub": "被忽略的第四根支柱", "map": [["急性 vs 慢性压力", "短期压力有益适应；长期压力损害健康"], ["身体表现", "睡眠障碍、消化问题、免疫下降、血压升高"], ["可操作的方法", "运动、呼吸练习、社交连接、自然接触、边界管理"], ["何时需要专业帮助", "情绪持续低落、功能受损、有自伤念头时"]], "spine": "压力本身不是敌人，长期得不到缓解的压力才是。关键不在于消除压力源，而在于建立稳定的恢复机制。", "g": [{"g": "慢性压力如何影响身体", "r": [["激素层面", "", "长期皮质醇升高，影响血糖、血压、免疫与睡眠"], ["行为层面", "常被忽视", "压力大时更容易情绪性进食、饮酒、熬夜、放弃运动——这些次生影响往往更大"], ["恶性循环", "", "压力→睡不好→更疲惫→更难应对压力。打破环节的任一点都有帮助"]]}, {"g": "有证据支持的缓解方法", "r": [["规律运动", "效果最确切", "有氧运动对情绪的改善在多项研究中得到支持"], ["呼吸练习", "随时可用", "缓慢深呼吸（如吸气 4 秒、呼气 6 秒）能快速降低生理唤醒水平"], ["正念与冥想", "", "每天 10 分钟即可。有大量应用可以入门，重点是规律而非时长"], ["社交连接", "被严重低估", "高质量的人际关系是长期健康最强的预测因素之一"], ["接触自然", "", "即使是公园散步也有帮助。研究显示自然环境有助于降低压力反应"], ["设立边界", "实操", "学会拒绝、区分「必须做」与「可以不做」、给工作设结束时间"], ["限制信息摄入", "", "持续刷新闻和社交媒体会维持高唤醒状态。设定固定时段查看"]]}, {"g": "什么时候需要专业帮助", "r": [["持续情绪低落", "", "超过两周的情绪低落、兴趣丧失，且影响日常功能"], ["焦虑影响生活", "", "持续担忧无法控制，伴心悸、失眠、回避行为"], ["功能受损", "", "无法正常工作、学习或维持人际关系"], ["出现自伤念头", "立即求助", "如果有伤害自己的想法，请尽快联系心理危机干预热线、精神科医生或信任的人。这不是软弱，寻求帮助是有效的"], ["寻求帮助的途径", "", "精神科/心理科门诊、有资质的心理咨询师、学校或单位的心理服务"], ["重要说明", "", "本手册不能替代专业诊疗。心理健康问题和身体疾病一样，是可以被有效帮助的"]]}]}, {"t": "常见误区与信息辨别", "sub": "省下被智商税收走的钱", "map": [["营养领域", "超级食物、排毒、极端节食"], ["运动领域", "局部减脂、速成计划、过度训练"], ["补剂", "多数人不需要；食物优先"], ["辨别方法", "看证据等级、警惕绝对化、区分相关与因果"]], "spine": "健康领域的骗局有一个共同点：把复杂的问题包装成简单的答案，并且往往要你花钱。真正有效的建议大多免费、朴素、且听起来不够刺激。", "g": [{"g": "营养领域的常见误区", "r": [["「超级食物」", "没有这回事", "没有任何单一食物能显著改变健康。多样化的整体饮食才是关键"], ["「排毒」「清宿便」", "伪概念", "肝脏和肾脏就是人体的解毒系统。所谓排毒产品多为泻药或利尿剂"], ["「碱性食物治病」", "已被证伪", "食物无法改变血液 pH 值——人体有严格的酸碱平衡调节机制"], ["极端节食", "代价很大", "极低热量或单一食物的方案短期可能掉秤，但难以维持，且易致营养缺乏与反弹"], ["「无糖 = 健康」", "看清楚", "无蔗糖不等于无糖，也不等于低热量。仍需看配料表和营养成分表"]]}, {"g": "补剂：多数人不需要", "r": [["食物优先原则", "", "天然食物中的营养素以复合形式存在，吸收和协同作用优于单一提取物"], ["可能需要补充的情况", "", "医生诊断的缺乏（如缺铁性贫血）、特定人群（孕期叶酸、日照不足者的维生素D）、严格素食者的 B12"], ["脂溶性维生素过量有害", "", "维生素 A、D、E、K 会在体内蓄积，过量可能中毒。不要自行大剂量补充"], ["与药物相互作用", "务必注意", "某些补剂会影响药物代谢。正在服药者补充前应咨询医生或药师"], ["一句话原则", "", "补剂是用来「补不足」的，不是用来「求更好」的。先把饮食搭好"]]}, {"g": "怎么辨别健康信息", "r": [["看是谁在说", "", "有相关资质吗？是在卖东西吗？利益相关会影响结论"], ["看证据等级", "", "系统综述/RCT > 队列研究 > 病例报告 > 动物/细胞实验 > 个人经验"], ["警惕这些词", "红旗信号", "「彻底根治」「无副作用」「医生不告诉你的」「祖传秘方」「三天见效」"], ["区分相关与因果", "最常见的误导", "观察到两件事同时出现，不代表一个导致另一个"], ["剂量决定效果", "", "「某成分被证明抗癌」通常是细胞实验中的高浓度提取物，与日常食用量差距巨大"], ["共识优于个例", "", "以权威机构指南和系统综述为准，而非某位专家的个人主张"]]}, {"g": "值得记住的几条朴素原则", "r": [["吃真正的食物", "", "以完整、少加工的食物为主"], ["动起来，别久坐", "", "形式不重要，持续最重要"], ["睡够觉", "", "这是免费且高效的健康投资"], ["维持社会连接", "", "孤独对健康的影响不亚于吸烟"], ["不吸烟、少饮酒", "收益最明确", "这两条的健康收益超过绝大多数「养生」措施"], ["定期体检", "", "早发现早干预。具体项目与频率遵医嘱"]]}]}], "F": [{"t": "从零开始：第一个月怎么走", "when": "不要同时改变所有事", "s": [{"b": "第 1 周：只做一件事", "p": "选<strong>一个</strong>最容易的改变，做满一周。推荐：戒掉含糖饮料，或每天走 20 分钟。", "f": [["容易做到", "戒含糖饮料、每天走路、提前半小时睡"], ["先别碰", "复杂食谱、高强度训练计划、严格计算热量"]]}, {"b": "第 2 周：巩固 + 加一项", "p": "上周那件事继续做，再加一项。比如已经在走路了，就加「每餐加一份蔬菜」。"}, {"b": "第 3 周：处理最大的短板", "p": "诚实评估：饮食、运动、睡眠、压力，哪一项最差？针对它做一个小改变。"}, {"b": "第 4 周：检查可持续性", "p": "问自己：这些改变我能再坚持三个月吗？如果不能，说明设得太难了——降低难度，别放弃整个计划。", "trap": "最常见的失败模式：第一周雄心勃勃改五件事，第三周全线崩溃。宁可慢，不要停。"}, {"b": "之后：每月只加一项", "p": "把节奏放到以月为单位。一年下来就是十二个稳固的习惯，这比任何速成计划都强。"}]}, {"t": "一顿饭怎么搭", "when": "不用称重、不用计算的实操方法", "s": [{"b": "第一步：先决定蔬菜", "p": "把餐盘的一半留给蔬菜。这一步做到了，其余自然就均衡了。", "f": [["深色叶菜", "菠菜、油菜、芥蓝——每天至少一种"], ["十字花科", "西兰花、白菜、萝卜"], ["其他颜色", "番茄、胡萝卜、彩椒、菌菇"]]}, {"b": "第二步：加一份蛋白质", "p": "一掌大小。鱼、禽、蛋、豆制品、瘦肉轮换着来。", "f": [["每周 2 次左右", "深海鱼（三文鱼、沙丁鱼等）"], ["日常", "鸡蛋、鸡胸、豆腐、豆类"], ["限制", "加工肉制品（香肠、培根、火腿）"]]}, {"b": "第三步：主食换一部分为粗粮", "p": "不必全换。白米里掺糙米/燕麦/杂豆，或用红薯、土豆替代部分主食。"}, {"b": "第四步：加一点好脂肪", "p": "一小把坚果、几片牛油果，或用橄榄油拌菜。"}, {"b": "第五步：喝水", "p": "饭前喝水有助于控制食量。把含糖饮料换成白水、茶或黑咖啡。", "trap": "外食时的实用策略：先吃蔬菜和蛋白质，主食放后面；酱料另外放，蘸着吃而非拌着吃。"}]}, {"t": "运动计划怎么排", "when": "一个可持续的每周框架", "s": [{"b": "先定频率，再定内容", "p": "每周能拿出几天？三天就按三天排，不要按理想状态排。", "f": [["每周 2 天", "2 次全身力量训练 + 日常多走路"], ["每周 3 天", "2 次力量 + 1 次有氧"], ["每周 4–5 天", "2–3 次力量 + 2 次有氧 + 拉伸"]]}, {"b": "力量训练怎么排", "p": "全身训练优于分部位训练（对新手）。每次覆盖：腿、推（胸肩）、拉（背）、核心。", "f": [["下肢", "深蹲、臀桥、箭步蹲"], ["上肢推", "俯卧撑、哑铃卧推、肩推"], ["上肢拉", "划船、引体（可用弹力带辅助）"], ["核心", "平板支撑、死虫式"]]}, {"b": "有氧怎么安排", "p": "中等强度 20–40 分钟，或高强度间歇 15–20 分钟。快走、慢跑、骑车、游泳都可以。"}, {"b": "留出恢复", "p": "同一肌群间隔 48 小时。每周至少一天完全休息。", "trap": "进步发生在恢复期。练得越多≠效果越好——睡不够、吃不够时增加训练量，反而会退步。"}, {"b": "每 4 周回顾一次", "p": "能不能多做一组？重量能不能加一点？走路能不能快一点？以「比上个月多一点」为标准，不与他人比较。"}]}, {"t": "怎么判断一个健康说法靠不靠谱", "when": "五个问题过一遍", "s": [{"b": "① 谁在说？有什么资质？", "p": "注册营养师、有相关专业背景的医生 > 健身网红、带货主播。"}, {"b": "② 有没有在卖东西？", "p": "如果一个说法的终点是「所以你需要买这个产品」，先打个问号。"}, {"b": "③ 证据是什么等级？", "p": "", "f": [["较强", "系统综述、大样本随机对照试验"], ["中等", "前瞻性队列研究"], ["较弱", "小样本、动物实验、细胞实验"], ["不算证据", "个人经验、名人代言、「祖传」"]]}, {"b": "④ 是相关还是因果？", "p": "「吃 X 的人更长寿」——这些人可能同时收入更高、运动更多、不吸烟。观察性研究很难剥离这些因素。"}, {"b": "⑤ 剂量对得上吗？", "p": "细胞实验里的有效浓度，往往需要你每天吃几公斤某种食物才能达到。", "trap": "最重要的一条：如果某个说法听起来太好、太简单、太快见效，它多半不成立。真正有效的健康建议通常朴素、缓慢、且不需要你花钱。"}]}, {"t": "一周三练：完整训练计划", "when": "新手到中级通用，A/B 两套交替", "s": [{"b": "整体安排", "p": "周一 A · 周三 B · 周五 A，下周轮换为 B/A/B。同一肌群自然间隔 48 小时以上。", "f": [["周一 / 周四", "A 组（偏下肢与推）"], ["周三 / 周六", "B 组（偏后链与拉）"], ["其余日", "休息或散步、拉伸"]]}, {"b": "每次训练前：热身 5–8 分钟", "p": "别跳过。热身能显著降低受伤概率。", "f": [["快走或原地踏步 3 分钟", "升高体温"], ["动态拉伸", "开合跳 20 次 · 髋绕环 10 次 · 肩绕环 15 次"], ["空杆/自重预热", "正式组之前先用很轻的重量做 1 组 10 次"]]}, {"b": "A 组：下肢 + 推", "p": "每个动作 3 组，组间休息 60–90 秒。", "f": [["① 深蹲 3×8–12", "脚与肩同宽略外八 · 下蹲时膝盖跟着脚尖方向 · 髋部先后坐 · 背保持挺直"], ["② 俯卧撑 或 哑铃卧推 3×8–12", "做不了标准俯卧撑就跪姿或推墙 · 肘部约 45 度不外张"], ["③ 哑铃肩推 3×10–12", "核心收紧不塌腰 · 推到头顶不锁死肘"], ["④ 臀桥 3×12–15", "顶峰停 1 秒挤臀 · 不要靠腰发力"], ["⑤ 平板支撑 3×20–40 秒", "身体一条直线 · 不塌腰不撅臀"]]}, {"b": "B 组：后链 + 拉", "p": "同样每个动作 3 组。", "f": [["① 罗马尼亚硬拉 3×8–12", "膝微屈固定 · 髋向后推 · 重量贴着腿下滑 · 感受腘绳肌拉伸"], ["② 哑铃划船 3×8–12", "背部收紧 · 肘贴身体后拉 · 想象把肩胛骨往中间夹"], ["③ 高位下拉 或 弹力带下拉 3×10–12", "没器械就用弹力带挂门上 · 不要靠身体后仰借力"], ["④ 箭步蹲 3×10（每侧）", "前腿膝盖不超过脚尖太多 · 上身保持直立"], ["⑤ 死虫式 3×10（每侧）", "腰部始终贴地 · 慢速控制"]]}, {"b": "训练后：拉伸 5 分钟", "p": "每个部位静态拉伸 20–30 秒，不弹震。重点拉当天练过的肌群。"}, {"b": "怎么进步：渐进超负荷", "p": "这是唯一让身体持续改变的原则。", "f": [["第一阶段", "先把次数做满（如从 3×8 做到 3×12）"], ["第二阶段", "次数满了再加重量（每次加最小档，约 5%）"], ["加重后", "次数会掉回 8 次，再重新往上加——如此循环"], ["记录", "用手机备忘录记下每次的重量和次数，否则无从判断是否进步"]]}, {"b": "四个安全底线", "p": "", "f": [["动作质量优先", "宁可轻，不可歪。姿势错了加重量只会受伤"], ["留 1–2 次余力", "新手不必练到力竭，可持续更重要"], ["疼痛立即停", "酸痛正常；关节刺痛、尖锐痛、持续痛不正常"], ["先咨询医生", "有心血管疾病、关节伤病、长期不运动且年龄较大者，开始前请先就医评估"]], "trap": "前两周会觉得「太轻松了」——这是对的。让身体先适应动作模式，第三周再开始认真加量，受伤风险会低很多。"}, {"b": "练不动的时候怎么办", "p": "状态差就减量而不是停练。把 3 组减到 2 组、重量减 20%，做完就走。保持习惯比单次强度重要得多。"}]}, {"t": "一周饮食方案：可直接照做", "when": "用手掌估份，不称重不算热量", "s": [{"b": "先记住一顿饭的公式", "p": "1 掌蛋白质 + 2 拳蔬菜 + 1 捧主食 + 1 拇指油脂。三餐都套这个公式，就不会差。", "f": [["蛋白质", "鱼 / 鸡胸 / 鸡蛋 / 豆腐 / 瘦肉 / 虾"], ["蔬菜", "深色叶菜为主，各色轮换"], ["主食", "杂粮饭 / 燕麦 / 红薯 / 玉米 / 全麦"], ["油脂", "橄榄油 / 坚果 / 牛油果"]]}, {"b": "早餐：三个模板轮换", "p": "10 分钟内能做好的。", "f": [["模板一", "水煮蛋 2 个 + 燕麦粥一碗 + 一小把坚果 + 一个水果"], ["模板二", "全麦面包 2 片 + 煎蛋 + 牛奶/无糖豆浆 + 番茄黄瓜"], ["模板三", "杂粮粥 + 卤蛋 + 凉拌菠菜/木耳 + 一小块豆干"]]}, {"b": "午餐：外食与自带都适用", "p": "", "f": [["自带", "杂粮饭一捧 + 清蒸鱼/鸡胸一掌 + 两样炒青菜 + 汤"], ["食堂点餐", "先夹两份素菜，再选一份蒸/炖/烤的荤菜，主食减半"], ["外卖", "选「一荤两素」套餐 · 有汤先喝汤 · 油大的菜过一下水"], ["避开", "炸物 · 红烧糖醋类 · 勾芡浓汤 · 含糖饮料"]]}, {"b": "晚餐：比午餐略清淡", "p": "同样的公式，主食可减到半捧到一捧。睡前 3 小时吃完。", "f": [["示例一", "豆腐炖鱼 + 清炒时蔬 + 半碗糙米饭"], ["示例二", "鸡胸沙拉（大量蔬菜 + 鸡胸 + 橄榄油醋汁）+ 一小块红薯"], ["示例三", "番茄鸡蛋汤 + 白灼虾 + 蒜蓉西兰花 + 小半碗杂粮饭"]]}, {"b": "加餐:饿了就吃，但选对东西", "p": "", "f": [["优先", "水果 · 无糖酸奶 · 一小把坚果 · 水煮蛋 · 毛豆"], ["少选", "饼干 · 面包 · 果汁 · 能量棒 · 含糖酸奶"], ["时机", "两餐之间饿了再吃；不饿就不必刻意加"]]}, {"b": "每周的采购清单", "p": "周末一次买齐，工作日就不用临时决定。", "f": [["蛋白质", "鸡蛋一板 · 鸡胸或鱼 3–4 份 · 豆腐 2 块 · 无糖酸奶"], ["蔬菜", "深色叶菜 3 种 · 西兰花或菜花 · 番茄黄瓜 · 菌菇"], ["主食", "燕麦 · 糙米或杂粮 · 红薯 · 全麦面包"], ["油脂坚果", "橄榄油 · 混合坚果一袋（分装成小份）"], ["水果", "当季水果 2–3 种"]]}, {"b": "备餐:每周花一小时，工作日省很多", "p": "周末把耗时的部分做好，工作日只需组合。", "f": [["提前煮", "杂粮饭分装冷冻 · 水煮蛋一次煮一周 · 鸡胸整块煎好切片"], ["提前洗切", "蔬菜洗净沥干冷藏 · 坚果分装成小份"], ["不要提前", "叶菜别提前炒（会出水变味）· 沙拉酱吃前再加"]]}, {"b": "两条比食谱更重要的原则", "p": "", "f": [["先加后减", "先保证每餐有蔬菜和蛋白质，不够的部分自然会挤掉零食——比一上来就戒东西容易坚持"], ["允许例外", "每周有 1–2 餐随便吃，完全不影响整体效果。反而是「破戒后自暴自弃」危害最大"]], "trap": "份量要按自己的情况调：本表是通用模板，实际需要量取决于身高体重、活动量与目标。以「吃完不撑、两三小时不饿、体重和精力稳定」为准，观察两周再调整。"}, {"b": "什么情况下别照搬本方案", "p": "这套模板面向的是健康成年人的日常饮食。", "f": [["需先咨询专业人士", "有糖尿病、肾病、痛风、消化系统疾病等慢性病者"], ["", "正在服药（部分药物与食物有相互作用）"], ["", "孕期、哺乳期、青少年生长期"], ["", "有暴食、催吐、过度节食等饮食失调相关困扰者"]], "trap": "以上情况的饮食调整需要个体化评估，请由医生或注册营养师指导，不要照搬任何通用方案（包括本表）。"}]}]},

{"k":"nj","name":"黄帝内经","en":"HUANGDI NEIJING","no":"11","eqLabel":"经文速查","flLabel":"研读思路","lede":"《黄帝内经》是中医一切理论的<strong>总源头</strong>——中基、中诊、针灸、倪师课程,追到底都是这本书。它不是药方集,而是一部两千年前写成的<strong>「生命说明书」</strong>:讲天地四时如何影响人,人该怎么活、为什么会病、病了怎么想。本科目专为<strong>零基础研读</strong>设计:每条先给原文名句,再给白话,再给一个现代人能懂的比喻。建议按顺序读:先知道它是什么书 → 再读养生两篇(最好懂)→ 然后进入阴阳、藏象、经络、病机的理论深水区。<strong>内容为经典研读笔记,不构成任何诊疗建议。</strong>","M":[{"t":"总论:这是一部什么书","sub":"先搞清楚来历与打开方式,再谈读懂","map":[["书的构成","《素问》81篇:讲道理(养生·阴阳·藏象·病机·诊法·治则);《灵枢》81篇:讲经络针刺,古称《针经》"],["成书","非一人一时之作;战国至西汉陆续写成汇编;托名黄帝以示尊崇"],["体裁","黄帝问、岐伯答的对话体;「岐黄之术」由此得名"],["地位","中医四大经典之首;后世一切流派的共同源头"],["历代整理","唐·王冰重编《素问》并补运气七篇;明·张介宾《类经》分类注释;隋·杨上善《太素》"],["小白路径","先读名句;再读全篇白话;最后回到原文"]],"spine":"《黄帝内经》不是黄帝写的,也几乎没有药方——它讲的是天地、四时、身体如何构成一个整体。把它当作古人写给生命的「使用说明书」来读,就读对了。","g":[{"g":"它是一部什么书","r":[["不是黄帝写的","托名","「黄帝」是托名。全书由战国至西汉的许多医家陆续写成、汇编,托黄帝之名以示尊崇——好比把重要文集冠以先贤之名。所以书里不同篇章风格、深浅不一,读到矛盾处不必惊讶"],["《素问》","81篇","「素」是根本、平素,「问」是问答——追问生命根本的81篇对话。养生、阴阳、藏象、病机、诊法、治则都在这一部里,本科目内容也以《素问》为主"],["《灵枢》","81篇·又称《针经》","偏重经络、腧穴、针刺,是针灸学的老祖宗。「灵枢」意为神灵机枢——生命运转的机关。本手册针灸科目的理论根基全在这里"],["全书几乎没有药方","很多人惊讶","一百六十二篇里只散见13个方(后世称「内经十三方」)。它教的不是「病了吃什么药」,而是「人为什么会病、怎么才能不病」——先立世界观,再谈方法论"],["对话体","黄帝问·岐伯答","岐伯是黄帝的老师,后世尊称中医为「岐黄之术」即由此来。读的时候不妨把自己代入提问的黄帝——他问的常常正是你想问的"]]},{"g":"它从哪里来","r":[["成书年代","战国—西汉","语言风格、思想层次不一,是几百年间多位医家作品的汇编。《汉书·艺文志》已著录《黄帝内经》十八卷——至迟西汉已成书"],["王冰整理","唐·公元762年","今天读到的《素问》主要是王冰重新编次、注释的本子。他补入的「运气七篇」(讲五运六气)篇幅极大、极难,小白可以先整体跳过"],["《难经》是它的注脚","延伸阅读","相传扁鹊(秦越人)所作,用81个问答解释《内经》的难点,常与《内经》并读"],["四大经典之首","地位","《黄帝内经》《难经》《伤寒杂病论》《神农本草经》并称四大经典,内经居首——它是理论源头,其余是发挥与应用"]]},{"g":"核心思想(全书总纲,四个词)","r":[["天人相应","总纲一","人是天地的缩影:四季、昼夜、气候、方位都在身体上有对应。养生要顺天时,治病要看节气——这是全书反复出现的底层逻辑"],["整体观","总纲二","五脏六腑、形体官窍、精神情志是一张互相牵连的网,牵一发而动全身——所以中医不头痛医头:咳嗽可能从肝治,失眠可能从胃治"],["治未病","总纲三","「圣人不治已病治未病」——最高明的医学是让人不生病。全书把养生放在第一、二篇,分量重于治病,这个编排本身就是态度"],["阴阳平衡","总纲四","健康=「阴平阳秘」;疾病=阴阳失衡;治疗=把失衡调回来。全书一切内容,最后都能归结到这四个字"]]},{"g":"小白怎么读","r":[["先读三篇","入门捷径","《上古天真论》《四气调神大论》(养生)+《阴阳应象大论》(理论总纲)——最好懂、最实用、名句最密集。本科目第2、3、4章就是这三篇"],["名句先行","方法","先把几十条千古名句读懂记熟,骨架就有了;再读全篇,血肉自然长上去。「经文速查」视图就是按这个思路编的"],["白话对照","别硬啃","第一遍务必配白话译本。读古文像看带字幕的外语片——先看懂剧情,再欣赏原声"],["与其他科目的关系","定位","中基是《内经》理论的现代教材化;针灸源自《灵枢》;倪师人纪第一部就是《内经》——这门课是它们共同的源头","别以为学了中基就不必读原文:教材是「翻译」,原文里有翻译丢掉的味道和整体感"]]}]},{"t":"养生之道:上古天真论","sub":"素问第一篇——人怎样活到一百岁","fig":"njtiangui","map":[["长寿总纲","法于阴阳;和于术数;食饮有节;起居有常;不妄作劳"],["折寿清单","以酒为浆;以妄为常;醉以入房;起居无节;务快其心"],["生命节律","女子以七为节(7—49岁);男子以八为节(8—64岁);天癸主生殖"],["精神养生","恬惔虚无,真气从之;精神内守,病安从来"],["四种人格","真人;至人;圣人;贤人"]],"spine":"这一篇回答一个终极问题:上古的人为什么能活过百岁,而「今时之人,年半百而动作皆衰」?答案不是仙丹,而是一张朴素得惊人的清单:顺应自然、饮食有节、作息规律、不透支自己。","g":[{"g":"千古名句","r":[["法于阴阳,和于术数","养生总纲八字","顺应自然规律(阴阳),用恰当的方法调养(术数:导引、按摩、呼吸吐纳等养生术)。这八个字是全书养生思想的总开关——先顺天,再用术"],["食饮有节,起居有常,不妄作劳","三大纪律","吃喝有节制、作息有规律、不过度劳累(体劳、心劳、房劳都算)。做到了就能「形与神俱,而尽终其天年,度百岁乃去」——形体和精神一起健康到老"],["以酒为浆,以妄为常","反面教材","把酒当水喝、把胡来当日常,「醉以入房,以欲竭其精」「务快其心,逆于生乐」——两千年前描写的,正是今天的酗酒、熬夜、纵欲、及时行乐。结局是「半百而衰」","这段是《内经》最「扎心」的段落:对照自查,比读十本养生书有用"],["恬惔虚无,真气从之;精神内守,病安从来","精神养生第一句","内心安静淡泊,真气就运行顺畅;精神收在里面不向外空耗,病从哪里来?——可以理解为古代版的「停止精神内耗」"],["志闲而少欲,心安而不惧,形劳而不倦","理想状态","欲望少一点、心安定一点、身体劳动但不过劳——三句话就是一张写给现代人的心理处方。后文「美其食,任其服,乐其俗」:吃什么都香、穿什么都自在,是知足的最高境界"]]},{"g":"女七男八:生命的节律","r":[["女子七岁一节","一七至七七","7岁肾气盛,齿更发长 → 14岁(二七)天癸至、月事以时下 → 21岁真牙生 → 28岁(四七)筋骨坚、身体盛壮(巅峰) → 35岁面始焦、发始堕 → 42岁面皆焦、发始白 → 49岁(七七)天癸竭、地道不通(绝经)"],["男子八岁一节","一八至八八","8岁齿更发长 → 16岁(二八)天癸至、精气溢泻 → 24岁筋骨劲强 → 32岁(四八)筋骨隆盛(巅峰) → 40岁肾气衰、发堕齿槁 → 48岁面焦发白 → 56岁筋不能动、天癸竭 → 64岁齿发去"],["天癸","关键概念","肾精中主管生殖发育的物质,近似「生殖机能/激素」的古代表达。天癸至则能生育,天癸竭则生育力止——女七七、男八八"],["肾气是整条节律的引擎","为什么","从换牙、长高、生育到衰老,全由肾气盛衰驱动——这是中医「肾主生长发育生殖」「齿为骨之余」「发为肾之华」的原始出处"],["巅峰在28/32岁","此后下坡","四七、四八之后开始走下坡——《内经》的提醒是:养生要趁早,下坡路上更要减速慢行","不要读成宿命论:节律是大势,养生的意义正在于延缓下坡的斜率——同是49岁,保养与透支者的「生理年龄」可以差十岁"]]},{"g":"四种理想人格(由高到低)","r":[["真人","最高","「提挈天地,把握阴阳,呼吸精气,独立守神」,寿敝天地——与道合一的理想极限,当方向看,不当目标追"],["至人","次之","「淳德全道,和于阴阳,调于四时」,游行天地之间——德行淳厚、完全顺应自然的人"],["圣人","再次·最可学","「处天地之和,从八风之理,适嗜欲于世俗之间,无恚嗔之心」——住在人间、不脱离世俗,但欲望不累其心、烦恼不伤其身。对普通人最有参考价值的一档:入世而不内耗"],["贤人","第四","「法则天地,象似日月」,顺应规律调养,「可使益寿而有极时」——努力可及的下限:认真模仿自然规律,就能延年"]]},{"g":"落到今天怎么用","r":[["「节」字诀","饮食","不是苦行,是「有节」:定时定量、七八分饱、不以酒为浆。《内经》从不叫人绝食辟谷,只叫人别过头"],["「常」字诀","起居","固定的睡点起点比睡够时长更重要;熬夜是「起居无节」的现代主形态——生物钟乱了,睡十小时也补不回来"],["「不妄」字诀","劳作","工作、运动都可以,「妄」(过度、透支)不可以。判断标准:劳而能复(休息后能恢复)是劳,劳而不复是妄"]]}]},{"t":"四气调神:跟着季节过日子","sub":"素问第二篇——一年的作息表","fig":"njsiqi","map":[["春三月·发陈","夜卧早起;广步于庭;被发缓形;以使志生"],["夏三月·蕃秀","夜卧早起;无厌于日;使气得泄;使志无怒"],["秋三月·容平","早卧早起;与鸡俱兴;使志安宁;收敛神气"],["冬三月·闭藏","早卧晚起;必待日光;去寒就温;无泄皮肤"],["总原则","春夏养阳,秋冬养阴;逆之则灾害生"],["治未病","不治已病治未病;渴而穿井,斗而铸锥,不亦晚乎"]],"spine":"一年四季是一场「生、长、收、藏」的循环:春生发、夏盛长、秋收敛、冬封藏。人跟着走就顺,逆着走就病——而且这一季的账,常常下一季才来讨。","g":[{"g":"四季起居(原文+白话)","r":[["春三月,此谓发陈","夜卧早起,广步于庭","「发陈」=推陈出新,万物发芽。晚点睡、早点起,到庭院大步走,头发散开、衣带放松,让心志像草木一样生发,「生而勿杀,予而勿夺」。关键词:舒展、生发、不压抑——春天最忌把自己捂着、憋着"],["夏三月,此谓蕃秀","夜卧早起,无厌于日","万物繁茂秀美。别嫌白天长、别怕出汗,「使气得泄,若所爱在外」;情绪上「使志无怒」。夏天该出的汗要出——这是一年里阳气宣泄的季节","整个夏天躲在空调房「无汗过夏」,该宣泄的被憋住,「奉收者少,秋为痎疟」——秋天容易咳嗽感冒,就是夏天欠的账"],["秋三月,此谓容平","早卧早起,与鸡俱兴","万物成熟收敛,天气以急,地气以明。开始早睡,情绪收着点,「使志安宁,以缓秋刑;收敛神气,使秋气平」。悲秋不是矫情,是「收」的季节性情绪——收得太过就成了悲"],["冬三月,此谓闭藏","早卧晚起,必待日光","水冰地坼,天地封藏。早睡晚起等太阳,「去寒就温,无泄皮肤,使气亟夺」;心志「若伏若匿,若有私意,若已有得」——像藏着小秘密一样安静满足。冬天大汗淋漓的剧烈运动反而伤阳"]]},{"g":"总纲名句","r":[["春夏养阳,秋冬养阴","全篇总纲","春夏顺其生长之气养「阳」,秋冬顺其收藏之气养「阴」,「以从其根」。后世「冬吃萝卜夏吃姜」「三伏贴冬病夏治」「冬令进补」全从这一句化出"],["逆春气,则少阳不生,肝气内变","四逆四伤","逆春伤肝(夏为寒变)、逆夏伤心(秋为痎疟)、逆秋伤肺(冬为飧泄)、逆冬伤肾(春为痿厥)——这一季违逆,下一季还账。身体是有记账本的"],["夫四时阴阳者,万物之根本也","为什么要顺","四季阴阳是万物的根本,「与万物沉浮于生长之门」——人不是站在自然之外的观察者,而是随四季一起沉浮的万物之一"]]},{"g":"治未病:全书最著名的一段","r":[["圣人不治已病治未病","千古名句","「不治已乱治未乱……夫病已成而后药之,乱已成而后治之,譬犹渴而穿井,斗而铸锥,不亦晚乎!」——病成了才吃药,就像渴了才挖井、开战了才铸兵器。晚了"],["三个层次","后世发挥","未病先防(养生防病)→ 既病防变(有病早治,防止传变)→ 瘥后防复(病愈防复发)。现代「预防医学」「早筛早治」的古代宣言"],["为什么放在第二篇","编排的深意","全书先讲怎么活(第一、二篇都是养生),再讲怎么治病——《内经》的价值排序清清楚楚:预防重于治疗,养生高于用药"]]},{"g":"现代生活对照","r":[["熬夜","四季皆逆","春夏「夜卧」也不是熬到凌晨——古人的「夜卧」约当今晚十一点前。子时(23—1点)胆经当令、阴阳交替,是四季通用的睡觉红线"],["季节性情绪","有出处","春天要「生」而生不出来则郁(春天抑郁高发),秋天「收」得太过则悲(悲秋)——情绪跟着季节波动是正常的,过了头才是问题;顺着季节安排情绪出口,比硬扛聪明"],["运动的季节性","微汗与大汗","春夏可以酣畅出汗(使气得泄),秋冬以温和运动为主、微汗即可(无泄皮肤)——一年四季用同一张健身计划表,本身就是「逆四时」"]]}]},{"t":"阴阳应象:天地的语法","sub":"素问第五篇——全书理论总纲","map":[["总纲句","阴阳者,天地之道也;万物之纲纪;变化之父母;生杀之本始;神明之府也"],["清浊升降","清阳为天,浊阴为地;清阳出上窍,浊阴出下窍;阳化气,阴成形"],["转化与极变","重阴必阳,重阳必阴;寒极生热,热极生寒;壮火食气,少火生气"],["五行归类","东风木酸肝筋目怒;南热火苦心脉舌喜;中湿土甘脾肉口思;西燥金辛肺皮鼻忧;北寒水咸肾骨耳恐"],["诊治名句","善诊者,察色按脉,先别阴阳;阳病治阴,阴病治阳;治病必求于本"]],"spine":"如果全书只许留一篇,多数医家会留《阴阳应象大论》。「应象」的意思是:天地之象与人身之象互相对应——阴阳五行不是玄学,而是古人给万事万物建立对应关系的一套「语法」。学会这套语法,后面每一篇都是它的例句。","g":[{"g":"开篇总纲","r":[["阴阳者,天地之道也","全书第一名句","阴阳是天地的总规律、万物的总纲领、一切变化的父母、生与死的根源、一切神妙功能的仓库——所以「治病必求于本」,这个「本」就是阴阳。中医看病的第一刀,永远是先分阴阳"],["阳化气,阴成形","六个字的世界观","阳负责功能、能量、无形的运动;阴负责物质、形体、有形的凝聚。发热消瘦是阳太过「化气」;肿块积液是阴太过「成形」——后世临床发挥极多的一句"],["清阳出上窍,浊阴出下窍","人身的升降","清阳从耳目口鼻出(视听呼吸发声),浊阴从前后二阴出(二便);「清阳发腠理,浊阴走五藏;清阳实四支,浊阴归六府」——人体是一台升清降浊的机器:该升的不升则头晕乏力,该降的不降则腹胀便秘"],["重阴必阳,重阳必阴","物极必反","阴到极点转阳,阳到极点转阴;「寒极生热,热极生寒」——高热到极点反见寒战肢冷(热深厥深),是古人对「物极必反」的临床观察。也提醒:任何养生法推到极端都会走向反面"]]},{"g":"气味精形的转化链","r":[["阳为气,阴为味","饮食如何变成你","气(功能,无形)属阳,味(饮食物,有形)属阴。「味归形,形归气,气归精,精归化」——吃进去的东西滋养形体,形体产生功能,功能化生精,精再化生一切。一条从餐桌到生命力的流水线"],["味厚则泄,薄则通","中药理论的源头","味厚者(如大黄)泄下,味薄者(如茯苓)通利;气厚者(如附子)发热,气薄者(如薄荷)发泄——中药「四气五味」的理论地基就打在这一段"],["壮火食气,少火生气","补过头的警告","过亢的火(壮火)吞噬正气,温和的火(少火)滋生正气——猛药大补反而伤身、温和调养才真正养人的经典依据","进补的人最该背这句:人参鹿茸吃出鼻血口疮,就是把「少火」补成了「壮火」"]]},{"g":"五行归类:五条一条龙","r":[["东方生风(木)","记这条,其余照推","东—风—木—酸—肝—筋—目—怒—呼:东方生风,风生木,木生酸,酸入肝;肝主筋、开窍于目、在志为怒、在声为呼。一个方位牵出一整条对应链"],["南方生热(火)","","南—热—火—苦—心—脉—舌—喜—笑:心主血脉、开窍于舌、在志为喜、在声为笑"],["中央生湿(土)","","中—湿—土—甘—脾—肉—口—思—歌:脾主肌肉、开窍于口、在志为思、在声为歌"],["西方生燥(金)","","西—燥—金—辛—肺—皮毛—鼻—忧—哭:肺主皮毛、开窍于鼻、在志为忧、在声为哭"],["北方生寒(水)","","北—寒—水—咸—肾—骨—耳—恐—呻:肾主骨、开窍于耳、在志为恐、在声为呻"],["怒伤肝,悲胜怒","情志相胜疗法","五志相胜:怒伤肝、悲胜怒;喜伤心、恐胜喜;思伤脾、怒胜思;忧伤肺、喜胜忧;恐伤肾、思胜恐——用一种情绪制约另一种,古代的「情绪疗法」,后世医案里真有用大喜治愈忧思的例子"]]},{"g":"诊治名句","r":[["善诊者,察色按脉,先别阴阳","诊断第一步","高手看病,先分阴阳:「审清浊而知部分;视喘息、听音声而知所苦;观权衡规矩而知病所主」——望闻问切的每一步,都在给阴阳投票"],["阳病治阴,阴病治阳","治疗的辩证法","「从阴引阳,从阳引阴;以右治左,以左治右」——病在阳可从阴治,左病可以右取(针灸的缪刺)。不与疾病正面硬刚,而是从它的对面下手"],["因其轻而扬之,因其重而减之","因势利导","病轻的宣散它,病重的削减它;「其高者,因而越之(吐法);其下者,引而竭之(泻法);中满者,泻之于内」——顺着病势与病位选择出路,把邪气从最近的门送出去"],["形不足者,温之以气;精不足者,补之以味","补的分工","形体虚弱(乏力怕冷)用温养阳气之法;精血亏虚用厚味滋补之品——补气与补精路线不同,不能一概「多吃点好的」"]]}]},{"t":"藏象:身体里的朝廷","sub":"灵兰秘典论·六节藏象论·五藏别论·本神","map":[["十二官","心=君主;肺=相傅;肝=将军;胆=中正;膻中=臣使;脾胃=仓廪;大肠=传道;小肠=受盛;肾=作强;三焦=决渎;膀胱=州都"],["藏象思维","藏居于内,象见于外;从外在表现推知内脏功能"],["五脏与六腑","脏:藏精气而不泻,满而不能实;腑:传化物而不藏,实而不能满"],["奇恒之腑","脑;髓;骨;脉;胆;女子胞"],["五脏藏神","心藏神;肝藏魂;肺藏魄;脾藏意;肾藏志"]],"spine":"《灵兰秘典论》把身体写成一个朝廷:心是君主,肺是宰相,肝是将军,肾是工程总管……「凡此十二官者,不得相失也」——朝廷安不安,关键看君主明不明:「主明则下安,主不明则十二官危」。","g":[{"g":"十二官(按原文次序)","r":[["心者,君主之官","神明出焉","皇帝:主宰全身,产生神志。「主明则下安,以此养生则寿;主不明则十二官危」——心神清明,全身各部才各安其位。中医把心放在最高位,管的不只是血,更是「神」"],["肺者,相傅之官","治节出焉","宰相:辅佐君主,治理调节全身。肺主一身之气、朝百脉——像宰相总理政务,一呼一吸间调度全身的节律"],["肝者,将军之官","谋虑出焉","将军:性子刚急,主深谋远虑。肝血足则有勇有谋;肝气郁则易怒、优柔——「大动肝火」的语源"],["胆者,中正之官","决断出焉","大法官:公正果断。「胆识」「胆小」「胆怯」这些词都从这里来;《六节藏象论》更说「凡十一藏,取决于胆也」——决断力是全局的开关"],["膻中者,臣使之官","喜乐出焉","内臣(即心包):代君主传达命令、代君受过(外邪犯心先犯心包),喜乐情绪由此而出"],["脾胃者,仓廪之官","五味出焉","国家粮仓:受纳、运化饮食,五味营养由此供应全身——后勤部长,兵马未动粮草先行"],["大肠者,传道之官","变化出焉","物流干线:传送糟粕,使之变化成形排出体外"],["小肠者,受盛之官","化物出焉","分拣中心:接受胃初步消化的食物,泌别清浊——有用的吸收,无用的下传"],["肾者,作强之官","伎巧出焉","工程总管:主骨生髓,是体力、精力与精巧技能的底座。「作强」即强力劳作之本——肾气足的人,耐力和手上功夫都好"],["三焦者,决渎之官","水道出焉","水利总管:疏通沟渠,是全身水液运行的通道——中医史上争论最多的一「官」,记住功能即可:通调水道"],["膀胱者,州都之官","津液藏焉,气化则能出","水库:储存津液,要靠「气化」才能排尿——所以排尿异常,中医常从「气化不利」找原因,而不只盯着膀胱本身"]]},{"g":"藏与泻:脏腑分工(五藏别论)","r":[["五脏:藏精气而不泻","满而不能实","五脏像仓库,职责是储藏精气——宜「满」(精气充盈)不宜「实」(被有形之物堵实)。仓库要装满粮,但不能堆满杂物"],["六腑:传化物而不藏","实而不能满","六腑像通道,职责是传导饮食糟粕——宜通不宜停,「六腑以通为用」的出处。走廊里可以过人(实),但不能住人(满)"],["奇恒之腑","似腑非腑,似脏非脏","脑、髓、骨、脉、胆、女子胞:形态中空像腑,功能藏精像脏,故称「奇恒」(异于平常)","胆是唯一的「双重身份」——既是六腑之一,又是奇恒之腑,因为它藏的胆汁是「精汁」而非糟粕"],["魄门亦为五藏使","肛门也归五脏管","「魄门」(肛门)的启闭受五脏支配,排便情况反映五脏功能——中医问诊必问二便的经典依据:大便里有全身的情报"]]},{"g":"六节藏象论:五脏之「本」","r":[["心者,生之本","其华在面,其充在血脉","心是生命之本、「神之变也」——心的状态写在脸上(华在面):面色红润有光泽,是心血充足的招牌"],["肺者,气之本","其华在毛,其充在皮","肺是气之本、「魄之处也」——皮肤毛发的润泽度反映肺气盛衰,「肺主皮毛」由此来"],["肾者,主蛰,封藏之本","其华在发,其充在骨","肾像冬眠的动物(蛰),是封藏之本、「精之处也」——头发的浓密光泽是肾精的旗帜:「发为肾之华」"],["肝者,罢极之本","其华在爪,其充在筋","「罢极」=耐受疲劳。肝主筋、藏血,是运动耐力之本——指甲(爪为筋之余)的坚脆光枯反映肝血盛衰"],["脾胃者,仓廪之本","其华在唇,其充在肌","脾胃是「营之居也」——口唇的色泽反映脾的运化,肌肉的丰瘦反映营养的供给:「脾主肌肉」"]]},{"g":"灵枢·本神:五脏藏神","r":[["心藏神","广义之神","「两精相搏谓之神」——父母两精结合产生的生命力总称。心所藏的神统摄魂魄意志——所以安神先安心"],["肝藏魂","随神往来者谓之魂","魂主梦境、直觉、夜间的精神活动——肝血虚则夜卧不安、多梦易惊;「魂不守舍」说的就是它"],["肺藏魄","并精而出入者谓之魄","魄主与生俱来的本能:痛痒感知、反射动作、新生儿的吸吮——「魄力」「体魄」的语源:身体层面的精神力"],["脾藏意,肾藏志","记忆与定力","「心有所忆谓之意」——意是记忆与念头,思虑过度则伤脾;「意之所存谓之志」——志是定向与毅力,恐则伤志。想得多的人吃不下饭,受惊的人立不下决心"],["从心到智:认知七步","所以任物者谓之心","心(接收)→意(念头)→志(定向)→思(反复琢磨)→虑(深谋远虑)→智(妥善处置)——《内经》版的认知心理学:从接收信息到智慧决策的完整链条"]]}]},{"t":"经络气血:生命的运输网","sub":"灵枢·经脉·营卫生会·决气","map":[["经脉之重","经脉者,所以能决死生,处百病,调虚实,不可不通"],["十二经流注","肺→大肠→胃→脾→心→小肠→膀胱→肾→心包→三焦→胆→肝→复始"],["营卫二气","营行脉中,卫行脉外;昼夜五十周而大会"],["六气(决气)","精;气;津;液;血;脉"],["睡眠机制","卫气昼行于阳则寤,夜入于阴则寐"]],"spine":"《灵枢》把人体想象成一张水网:十二条主干河道首尾相连,气血像河水昼夜循环五十周。「决死生,处百病,调虚实」——诊断和治疗,都是在这张网上做文章。","g":[{"g":"经脉总纲","r":[["经脉者,决死生,处百病","灵枢·经脉","经脉可以判断死生、处理百病、调节虚实,「不可不通」——针灸、推拿一切外治法的理论总依据。河道通,水就活;经脉通,人就安"],["十二经流注顺序","一个时辰一经","肺→大肠→胃→脾→心→小肠→膀胱→肾→心包→三焦→胆→肝→(次日回到肺)。从寅时(3—5点)肺经开始,每经当令一个时辰——「子午流注」和「凌晨三四点醒是肺的问题」这类说法的源头"],["是动病·所生病","每经两份病历","《经脉》篇给每条经列了「是动则病……」「是主某所生病者……」两组病候——经络病的原始档案,针灸「循经取穴」的主治依据全从这里来"],["经脉深,络脉浅","看得见的是络","「经脉十二者,伏行分肉之间,深而不见……诸脉之浮而常见者,皆络脉也」——手臂上看得见的青筋是络脉不是经脉;经脉要靠体表定位去找,看是看不见的"]]},{"g":"营卫:气的昼夜班表(营卫生会)","r":[["营行脉中,卫行脉外","一内一外","营气(营养之气)在脉内随血运行,滋养全身;卫气(防卫之气)在脉外温煦体表、开合毛孔——像城内的粮道与城墙外的巡逻兵,一个管补给,一个管安保"],["昼夜五十周,会于夜半","循环的节律","营卫各自昼夜运行五十周,半夜子时「大会」——「夜半而大会,万民皆卧,命曰合阴」:子时是营卫交会、天地合阴的时刻,此时不睡,错过的是全天最大的一次「例会」"],["老人为什么觉少","昼不精,夜不瞑","「老者之气血衰……营气衰少而卫气内伐,故昼不精,夜不瞑」——年老气血衰,营卫运行失序,所以白天没精神、夜里睡不实。两千年前对老年睡眠障碍的解释"],["夺血者无汗,夺汗者无血","血汗同源","大失血的人不可再发汗,大汗的人不可再放血(伤血)——因为汗血同出一源(津血同源)。这条治疗禁忌被《伤寒论》原样继承:「衄家不可发汗」"]]},{"g":"决气:一气分六名","r":[["精","先身而生","「两神相搏,合而成形,常先身生,是谓精」——父母之精结合,先于身体存在的那份「原始资本」"],["气","若雾露之溉","「上焦开发,宣五谷味,熏肤、充身、泽毛,若雾露之溉」——气像雾露一样弥散布护全身:温养皮肤、充实形体、润泽毛发"],["津与液","稀者为津,稠者为液","津:清稀,走体表,「腠理发泄,汗出溱溱」——出汗出的是津;液:稠厚,走深处,注入骨节、脑髓、耳目。「津脱者,腠理开,汗大泄;液脱者,骨属屈伸不利,脑髓消」——脱津是大汗虚脱,脱液是关节涩滞、头昏耳鸣","运动大汗后口渴乏力是「伤津」,久病消瘦、关节干涩是「伤液」——程度深浅不同,补法也不同"],["血","中焦受气取汁","「中焦受气取汁,变化而赤,是谓血」——中焦(脾胃)提取饮食精汁,变化成红色就是血。「脾胃为气血生化之源」的原始出处:血是吃出来的,但要靠脾胃「变化」出来"],["六名一源","总结","精、气、津、液、血、脉,六种形态本是一气所化,源头都在水谷与胃——「五谷与胃为大海也」。所以补什么,最后都绕不开养脾胃"]]}]},{"t":"病因病机:病是怎么来的","sub":"百病始生·举痛论·至真要大论","map":[["正邪关系","邪之所凑,其气必虚;正气存内,邪不可干;两虚相得,乃客其形"],["外感三部","伤于上:风雨;伤于下:清湿;伤于内:喜怒不节"],["九气为病","怒则气上;喜则气缓;悲则气消;恐则气下;寒则气收;炅则气泄;惊则气乱;劳则气耗;思则气结"],["病机十九条","五脏五条;上下二条;风寒湿三条;火热九条"],["阴阳失衡","阳胜则热,阴胜则寒;阴平阳秘,精神乃治;生病起于过用"]],"spine":"《内经》看病因,永远内外合看:外有风寒暑湿,内有七情劳伤。但真正的关键是那句「邪之所凑,其气必虚」——外邪只是导火索,自身正气之虚才是火药。","g":[{"g":"正与邪:发病的总逻辑","r":[["邪之所凑,其气必虚","评热病论","邪气能侵入的地方,一定是正气先虚了。同乘一部电梯,有人感冒有人没事——病毒是公平的,正气不是"],["正气存内,邪不可干","刺法论","正气充实于内,邪气就无从侵犯——与上句一体两面,中医「扶正固本」思想的总依据:与其杀敌,不如筑墙"],["风雨寒热,不得虚,邪不能独伤人","百病始生","单有外邪伤不了人:「两虚相得,乃客其形」——外面的「虚邪之风」遇上里面的「身形之虚」,两虚相遇,病才落到身上。一个巴掌拍不响"],["三部之气,所伤异类","进攻路线","伤于上者,风雨(从头面肩背入);伤于下者,清湿(从足胫入);喜怒不节则伤脏(从内而生)——外邪分上下两路,情志直捣内部"],["风者,百病之长也","外邪的先锋","风是外邪的带头大哥:寒、湿、燥、热常附着风邪侵入(风寒、风热、风湿)——所以外感病名多带「风」字,防风就是防第一道门"]]},{"g":"九气为病(举痛论):情绪如何搅动气机","r":[["怒则气上","气血上冲","盛怒时气血逆冲向上,「甚则呕血及飧泄」——气得面红耳赤、头晕呕血,是有生理机制的。高血压的人尤须记住这四个字"],["喜则气缓","过喜涣散","喜则气和志达本是好事,过喜则心气涣散不收——范进中举而疯,即「喜伤心」的极端案例"],["悲则气消","悲哀耗气","「悲则心系急,肺布叶举……故气消矣」——大哭一场后那种被掏空的虚脱感,就是「气消」"],["恐则气下","气陷于下","恐惧使气下陷,「精却……下焦胀」——吓得腿软、大小便失禁,「屁滚尿流」的生理学"],["惊则气乱","心无所倚","突受惊吓,「心无所倚,神无所归,虑无所定」——惊与恐不同:惊是不知而受吓(乱),恐是已知而害怕(下)"],["思则气结","气机郁结","思虑过度,「心有所存,神有所归,正气留而不行」——想事情想到吃不下饭,就是思则气结、脾气被捆住了"],["寒则气收,炅则气泄,劳则气耗","环境与劳倦","寒使气收敛凝滞(冷得缩成一团);热(炅)使腠理开、大汗气泄(中暑虚脱);过劳则「喘息汗出,外内皆越」而耗气——九气合起来,把「情绪与环境如何改变气的运动方向」说尽了"]]},{"g":"病机十九条(至真要大论)","r":[["诸风掉眩,皆属于肝","五脏条·肝","凡是「风」性症状——肢体摇动(掉)、头晕目眩,多与肝有关(肝风内动)。帕金森样震颤、眩晕,中医第一反应是查肝"],["诸寒收引,皆属于肾","五脏条·肾","收缩拘挛、蜷缩怕冷属肾寒;「诸气膹郁,皆属于肺」——胸闷气逆属肺;「诸湿肿满,皆属于脾」——水湿肿胀属脾;「诸痛痒疮,皆属于心」——疮疡痛痒属心(火)"],["火热九条为最多","火热为病最广","「诸热瞀瘛」「诸躁狂越」「诸逆冲上」「诸胀腹大」「诸病有声,鼓之如鼓」等属火属热者共九条——金元刘完素据此发挥出「火热论」,主张「六气皆能化火」"],["有者求之,无者求之","使用说明","「审察病机,无失气宜」「盛者责之,虚者责之」——症状出现了要追查,该出现而没出现也要追查;属实要问为什么实,属虚要问为什么虚。十九条是查案指南,不是判决书","「皆属于」=「多与……有关」,是侦查方向而非结论——见眩晕就断肝风,是机械套用;还要核实有无肝的其他证据"]]},{"g":"阴阳失衡的病理","r":[["阳胜则热,阴胜则寒","四大格局","阳偏胜→热证;阴偏胜→寒证;《调经论》再补两条:「阳虚则外寒,阴虚则内热」——实热、实寒、虚寒、虚热,寒热的四种基本格局到齐"],["阴平阳秘,精神乃治","健康与死亡的定义","阴气平和、阳气固密,精神才安治;「阴阳离决,精气乃绝」——阴阳彻底分离,生命就终结。一句给出健康的定义,一句给出死亡的定义"],["阳气者,若天与日","生气通天论","阳气之于人,如太阳之于天空,「失其所则折寿而不彰」——护阳思想的第一名句。同篇还有「阳气者,烦劳则张」:过度烦劳,阳气亢张外越,煎厥、薄厥(类似中暑、中风急症)由此而生"],["生病起于过用","经脉别论","「春秋冬夏,四时阴阳,生病起于过用,此为常也」——饮食过用、劳倦过用、情志过用、药物过用……五个字概括大部分慢性病的来路:病不是突然来的,是「过」出来的"]]}]},{"t":"病证与诊治:从看病到分寸","sub":"热论·咳论·痹论·痿论·脉要精微·异法方宜","map":[["名篇病证","热论:六经分证;咳论:五脏六腑皆令人咳;痹论:风寒湿三气杂至;痿论:治痿独取阳明;厥论:寒厥热厥"],["诊法","诊法常以平旦;切脉动静而视精明;察五色;听音声"],["治则","治病必求于本;谨察阴阳,以平为期;正治反治;三因制宜"],["用药分寸","大毒治病,十去其六;谷肉果菜,食养尽之"],["医患关系","病为本,工为标;标本不得,邪气不服"]],"spine":"最后看《内经》怎么「落地」:热病按六经传变,咳嗽五脏六腑皆有份,痹是风寒湿三气杂至……并记住开方的分寸——「大毒治病,十去其六」:药到六七分就收手,剩下的交给饮食调养。","g":[{"g":"病证名篇名句","r":[["今夫热病者,皆伤寒之类也","热论","广义「伤寒」=一切外感热病。一日巨阳(太阳)受之→二日阳明→三日少阳→四日太阴→五日少阴→六日厥阴——外感病逐日深入的「六经」模型;「其未满三日者,可汗而已;其满三日者,可泄而已」。张仲景《伤寒论》正是在这个骨架上盖起大楼"],["五藏六府皆令人咳","咳论","「非独肺也」——咳嗽不全是肺的事:五脏六腑的病都可以传给肺引起咳(胃寒犯肺、肝火犯肺……)。久咳不愈只治肺,常常就是治错了地方"],["风寒湿三气杂至,合而为痹","痹论","三种邪气混合侵袭形成痹证(关节肌肉痛):风气胜=行痹(游走性痛)、寒气胜=痛痹(剧痛得温则减)、湿气胜=着痹(重着麻木)——关节痛的三分法沿用至今"],["治痿独取阳明","痿论","痿证(肢体萎弱无力)治疗独重阳明(脾胃)——「阳明者,五藏六府之海,主润宗筋;宗筋主束骨而利机关也」:肌肉无力,根子常在脾胃化源不足。补肌肉,先补消化"],["阳气衰于下,则为寒厥","厥论","手足逆冷分两种:阳气衰则寒厥(真冷),阴气衰(阳盛格阴)则热厥(假冷真热)","手脚凉不一定是「体寒」——热厥也四肢冰凉(热深厥亦深)。一凉就猛灸猛补附子,可能火上浇油"]]},{"g":"诊法(脉要精微论)","r":[["诊法常以平旦","为什么早晨看病","清晨「阴气未动,阳气未散,饮食未进,经脉未盛……气血未乱,故乃可诊有过之脉」——干扰因素最少,最能看出底色。今天体检要求空腹晨检,同一个道理"],["切脉动静,而视精明,察五色","四诊合参","切脉+看眼神(精明)+察面色+「观五藏有余不足,六府强弱,形之盛衰」——「参伍决死生之分」:多路证据互相参照,单凭一样都不下结论"],["色贵有神:如帛裹朱","望色的秘诀","五色是「气之华」:红要像白绢裹着朱砂(含蓄红润),不要像赭石(枯暴外露);白要如鹅羽,不欲如盐——同一种颜色,润泽含蓄则生,枯槁暴露则危。看的不是颜色本身,是颜色里的「神」"],["五藏者,中之守也","失守则危","声音重浊如从室中言(中气之湿)、言语错乱(神明之乱)、遗尿失禁(膀胱不藏)、泄利不禁(仓廪不藏)——「得守者生,失守者死」:这些日常细节,是脏气存亡的报警器"],["头者,精明之府","五府之察","头倾视深,精神将夺;背曲肩随,府(胸中)将坏;腰者肾之府,转摇不能,肾将惫;膝者筋之府,屈伸不能,行则偻附,筋将惫——从体态直接读出内脏的衰败:老人的弯腰驼背、行走艰难,每一样都对着一「府」"]]},{"g":"治则总汇","r":[["治病必求于本","阴阳应象","一切治疗先求根本(阴阳)——发热不只是退热,要问为什么热;疼痛不只是止痛,要问为什么痛。这是中医与「对症处理」的分水岭"],["谨察阴阳所在而调之,以平为期","至真要大论","查明阴阳失衡在哪里,调到平衡为止——「以平为期」四个字是治疗的终点线:不是越补越好,也不是赶尽杀绝,平了就收手"],["寒者热之,热者寒之","正治(逆治)","寒证用热药,热证用寒药;「虚则补之,实则泻之;坚者削之,客者除之,劳者温之,结者散之」——正面迎击,是最常规的打法"],["微者逆之,甚者从之","反治(从治)","病轻、表象与本质一致时用正治;病重、出现假象时用反治:热因热用、寒因寒用、塞因塞用、通因通用——例如真寒假热,反而要用热药「顺着」假热治"],["三因制宜(异法方宜论)","因地因人因时","东方之域治宜砭石,西方毒药,北方灸焫,南方九针,中央导引按跷——五方水土、饮食、体质不同,治法各异。「圣人杂合以治,各得其所宜」:高手不迷信单一疗法,组合拳按人下菜"]]},{"g":"用药与医患的分寸","r":[["大毒治病,十去其六","五常政大论","猛烈之药,病去六分就停;常毒去七、小毒去八、无毒之药也只去九,「谷肉果菜,食养尽之,无使过之,伤其正也」——最后一段路交给饮食调养,不许用药「赶尽杀绝」。过度治疗之戒,两千年前已写明","「是药三分毒」的理论源头:停药的时机和开药的时机同样重要"],["病为本,工为标","汤液醪醴论","病人是根本,医生是辅助;「标本不得,邪气不服」——病人不配合,再好的医生也无效;「精神不进,志意不治,故病不可愈」:病人自己的求生意志,是一切疗效的前提"],["拘于鬼神者,不可与言至德","五藏别论","迷信鬼神的人,没法跟他谈医学至理;「恶于针石者,不可与言至巧」——《内经》时代就明确与巫术切割:医学面对的是可以讲道理的身体,不是神鬼"],["善言天者,必有验于人","举痛论","谈天道必须能在人身上验证,「善言古者,必有合于今;善言人者,必有厌(合)于己」——理论要经得起验证,古理要对得上今事。《内经》自己立下的科学态度,也是读《内经》该有的态度"]]}]}],"F":[{"t":"怎么读懂一段经文","when":"拿到任何一段《内经》原文时的通用五步","s":[{"b":"先断句,朗读三遍","p":"用带标点的版本顺口读三遍。古文先「顺口」再「入心」——拗口卡壳的地方,往往正是关键概念所在。"},{"b":"查三类字","p":"卡住的字分三类查,各有各的查法。","f":[["通假字","如「俛」通「俯」、「蚤」通「早」——按读音猜,再查注本确认"],["古今异义","「走」=跑;「汤」=热水;「去」=离开——别用现代义硬套"],["专有名词","天癸、宗筋、腠理、痎疟——查中医术语词典,别望文生义"]]},{"b":"用白话复述一遍","p":"能用自己的话把这段讲给别人听,才算读懂;讲不通、绕不过去的地方,就是还没懂的地方——回到原文再啃。"},{"b":"找「应象」","p":"问自己:这段话在天地间对应什么象?在身体上对应什么事?《内经》的道理几乎都是类比——找到那个类比,记忆和理解一步到位。"},{"b":"落一条到生活","p":"每段经文至少提取一条可实践的点,哪怕只是「今晚早点睡」。经典只有用起来,才不会读成古董。","trap":"第一遍不要钻注家争议——王冰说、张介宾说、今人说各执一词,先取大意,细节留给第二遍。"}]},{"t":"用病机十九条分析一个症状","when":"见到一个症状,想练习中医思维时","s":[{"b":"锁定症状关键词","p":"把症状翻译成十九条里的用词:眩晕→「掉眩」;抽搐→「瘛」;水肿→「肿满」;躁狂→「躁越」。"},{"b":"查归属,立案侦查","p":"对照十九条找到「皆属于X」——如「诸风掉眩,皆属于肝」,把肝列为头号嫌疑。"},{"b":"核实证据","p":"「有者求之,无者求之」——找该脏的旁证:眩晕若属肝,应有胁胀、易怒、脉弦等;没有旁证,就要怀疑其他线索。","f":[["旁证充分","按该脏论治的方向深入"],["旁证不足","换嫌疑人:眩晕也可属痰(「无痰不作眩」)、属虚(「无虚不作眩」)——十九条之外还有后世补充"]]},{"b":"分虚实","p":"「盛者责之,虚者责之」——同一个脏的问题,实(肝阳上亢)与虚(肝血不足)治法相反,必须问一句:是太过还是不及?"},{"b":"回教材验证","p":"带着结论回到中基、中诊的对应章节核对——经文给方向,教材给规范,两边对上了才算闭环。","trap":"「皆属于」是侦查方向,不是判决书——跳过核实直接开方,是学《内经》最常见的翻车姿势。"}]},{"t":"把《内经》养生排进一天与一年","when":"想让经典落地,而不是停在书上时","s":[{"b":"一年:定四季基调","p":"按《四气调神》排全年:春舒展(多户外、早起、少压抑)、夏宣泄(该出汗出汗)、秋收敛(早睡、情绪收)、冬封藏(避寒、不大汗、藏精神)。"},{"b":"一天:过「小四季」","p":"一天是缩微的一年:晨=春(舒展启动)、昼=夏(全力输出)、暮=秋(收尾减速)、夜=冬(封藏入睡)——晚十一点前入睡,就是每天的「冬藏」。"},{"b":"饮食:守「节」字","p":"「食饮有节」:定时定量、七八分饱、五味不偏(过酸伤脾、过咸伤心……《生气通天论》五味偏嗜各有其害)、不以酒为浆。"},{"b":"情志:每天一段「恬惔虚无」","p":"给自己留一段不刷手机、不接收信息的空白(散步、静坐、发呆都算)——「精神内守」的现代最小实现。"},{"b":"复盘:查「过用」","p":"每周用「生病起于过用」自查一遍:最近哪样过了?(熬夜?久坐?思虑?酒肉?)——找到「过」,下周把它调回「节」。","trap":"养生清单不必一次全上——《内经》的精神是「常」与「节」,细水长流;三天打鱼式的极端养生,本身就是「过用」。"}]},{"t":"查证「内经云」的真伪","when":"看到别人引用「《内经》说……」想核实时","s":[{"b":"先存疑","p":"网络流传的「内经名句」相当一部分查无出处或张冠李戴——「不为良相,便为良医」是范仲淹的事,与《内经》无关。"},{"b":"判断该在哪一部","p":"讲养生、阴阳、病机、诊法的多在《素问》;讲经络、腧穴、针刺、营卫的多在《灵枢》——先猜对书,再找篇。"},{"b":"全文检索","p":"用电子版全文检索关键词(选原文数据库或权威点校本电子版)——检索不到的「名句」,基本可以断定不是原文。","f":[["检索命中","进入下一步核对上下文"],["检索不到","可能是后世医家语(如「肾为先天之本」出自明代)或今人编造——注明真实出处或弃用"]]},{"b":"核对上下文","p":"断章取义是常态:引用前后各多读几句,确认原意——如「阴阳者,天地之道也」紧接着「治病必求于本」,合起来才是完整的意思。","trap":"引用经典最忌二手转引——转一次错一分,回到原文是唯一解药。"}]}]},

{"k":"os","name":"嵌入式操作系统","en":"EMBEDDED RTOS","no":"12","eqLabel":"要点速查","flLabel":"开发与排障","lede":"这门课回答一个工程问题:单片机上那几十 KB 的 <strong>RTOS(实时操作系统)</strong>到底做了什么,为什么值得学。思路是——<strong>先懂裸机的难处(为什么需要 OS)→ 再懂任务与调度(OS 的心脏)→ 然后是中断、通信、内存(OS 的四肢)→ 最后是实时性设计与工程排障(上战场)</strong>。全程用 <strong>FreeRTOS</strong> 作贯穿实例(市占率最高、概念最通用),原理讲透后,换 RT-Thread、uC/OS、Zephyr 只是换方言。第 9 章专讲 <strong>AUTOSAR CP/AP</strong>:CP 是把通用 RTOS「静态化、制度化、可认证化」,AP 是把 Linux/QNX 世界「服务化、车规化」——通用原理与车规标准在此汇合。每条先讲概念,再给白话比喻,涉及 API 的注明函数名——面向<strong>零 RTOS 基础</strong>的读者,但深度按工程实战要求给足。","M":[{"t":"总论:为什么需要操作系统","sub":"从裸机的难处说起","map":[["三种形态","裸机(前后台);RTOS(FreeRTOS等);嵌入式Linux"],["OS是什么","管理CPU时间与资源的「调度员」;把一颗CPU变成多个「虚拟CPU」"],["实时性","硬实时:错过期限=失败;软实时:偶尔迟到可容忍"],["主流RTOS","FreeRTOS;RT-Thread;uC/OS;Zephyr;VxWorks;QNX;车规:OSEK/AUTOSAR"],["学习路径","裸机原理 → 任务调度 → 中断时钟 → 通信同步 → 内存 → 实时设计 → 选型与Linux → AUTOSAR → 工程排障"]],"spine":"操作系统本质是一个「餐厅经理」:客人(任务)很多、厨师(CPU)只有一个,经理决定谁先上灶、谁先等着、锅铲(资源)给谁用。裸机没有经理,一个人守摊什么都自己盯;RTOS 就是给你的芯片请了个经理。","g":[{"g":"三种形态:什么时候用哪个","r":[["裸机(前后台系统)","main大循环+中断","一个 while(1) 大循环按顺序轮着做事(后台),紧急事情靠中断插队(前台)。像一个人守摊:来回巡视各个摊位,电话响了先接电话。简单、省资源、完全可控——功能少时是最优解"],["RTOS","几十KB的调度内核","在裸机之上加一个小内核:把程序拆成多个「任务」,由调度器决定谁运行。像给摊位雇了几个伙计加一个班长。功能多、时序要求复杂时,裸机的大循环会失控,这时上RTOS"],["嵌入式Linux","有MMU的大系统","完整操作系统:进程、虚拟内存、文件系统、网络栈、驱动框架。需要 MMU、MB 级内存。像开了一家连锁店,管理系统很重但功能齐全——跑界面、跑网络服务、跑复杂算法时用它"],["怎么选","一条经验线","纯采集控制、单一功能→裸机;多任务并发、毫秒级时序、几百KB内存→RTOS;要跑协议栈全家桶/界面/AI→Linux;既要实时又要复杂功能→双核 AMP:一核RTOS一核Linux","不是越高级越好——用Linux做电机电流环,就像雇整个物业公司来看一扇门"]]},{"g":"实时性:RTOS 的「实时」是什么意思","r":[["实时≠快","最常见的误解","实时的意思是「确定性」:规定时间内必然响应,而不是平均速度快。高铁快但不保证准点到秒,地铁慢但班次分毫不差——实时系统要的是地铁"],["硬实时","错过=失败","超过期限结果就是错误甚至灾难:气囊点火、电机换相、飞控姿态环。期限是刚性约束,必须最坏情况也满足"],["软实时","迟到可容忍","偶尔超时只是体验下降:界面刷新、日志上传、音频缓冲。可以按平均性能设计"],["确定性的敌人","抖动(jitter)","中断被关太久、高优先级任务被挡、缓存未命中……都让响应时间忽长忽短。实时设计的大半功夫,是消灭「有时候会慢」"]]},{"g":"主流 RTOS 一览(先认脸,后深交)","r":[["FreeRTOS","本课贯穿实例","市占率最高,亚马逊维护(MIT协议),几乎所有MCU厂商官方支持。内核小(~9个C文件),概念最标准——学通它等于学通RTOS通用语"],["RT-Thread","国产生态最全","国产,除内核外有完整的组件生态(文件系统、网络、GUI、软件包市场),文档中文友好。国内物联网项目常见"],["uC/OS-II/III","教科书经典","代码风格严谨、注释详尽,配套书《嵌入式实时操作系统uC/OS》是很多人的启蒙教材;商业授权,新项目用得渐少但学习价值高"],["Zephyr","Linux基金会","设备树、Kconfig 等 Linux 式基建,多架构、协议栈全,西门子/诺德等大厂押注——现代化但学习曲线较陡"],["VxWorks / QNX","商业高可靠","航天(火星车跑VxWorks)、汽车(QNX做仪表/座舱)等安全关键领域的商业选择——贵,但认证齐全。知道它们在金字塔顶即可"],["OSEK/AUTOSAR OS","车规是标准不是选型","汽车ECU的OS由行业标准约束:CP(经典平台)的OS承OSEK血统——静态配置、天花板协议;AP(自适应平台)底座是QNX/Linux。第9章专章展开,把通用RTOS知识接到车规工作场景"]]},{"g":"这门课怎么学","r":[["先原理后API","顺序别反","先懂「为什么需要队列」,再背 xQueueSend 的参数——API 是原理的注脚。只背API的人换个RTOS就失忆,懂原理的人换RTOS像换方言"],["一定要跑起来","动手","找块手头的开发板(STM32即可)移植FreeRTOS,把每章概念写成小实验:两个任务闪两个灯,就是你的「Hello World」"],["读内核源码是分水岭","进阶","FreeRTOS 内核只有 tasks.c、queue.c、list.c 等寥寥几个文件,通读一遍(配《FreeRTOS内核实现与应用开发实战》类书籍),从「会用」跨入「懂了」"],["盯住三个问题","主线","任何RTOS机制,都问三句:谁在什么时候运行(调度)?数据怎么安全传递(通信)?内存从哪来到哪去(资源)?——全书就这三条主线"]]}]},{"t":"从裸机说起:程序是怎么跑起来的","sub":"不懂裸机,学RTOS是空中楼阁","map":[["上电之后","复位向量 → 拷贝data段/清bss → 调用main"],["三块内存","Flash:代码+常量;RAM:变量+栈+堆;寄存器:CPU的手"],["栈","函数调用/局部变量/现场保护的「草稿纸」;向下生长"],["中断","硬件的插队电话;向量表=电话簿;ISR=接线员"],["前后台的极限","大循环变慢;时序互相拖累;delay卡死一切"]],"spine":"RTOS 的一切魔法——任务、切换、调度——底层全是裸机三件套:栈、寄存器、中断。这一章把三件套讲清,下一章的「上下文切换」就只是水到渠成的一步。","g":[{"g":"上电到 main:被忽略的序幕","r":[["复位向量","上电第一步","CPU 上电后从固定地址取两个数:栈顶初值(装入SP)和复位处理函数地址(装入PC)——这就是「向量表」开头两项。程序不是从 main 开始的,是从这里"],["启动文件做的事","startup_xxx.s","把初始化数据从 Flash 拷到 RAM(.data段)、把未初始化变量清零(.bss段)、设置时钟,最后才跳到 main——所以全局变量「天生有值」不是魔法,是启动代码搬的"],["链接脚本","内存的户口本","告诉链接器:代码放Flash哪段、变量放RAM哪段、栈和堆各留多大。RTOS工程报「内存不够」时,第一个要看的就是它(.ld / .sct 文件)"],["main 里的 while(1)","为什么不能返回","嵌入式的 main 永不返回——返回了 CPU 就没事干了(裸机没有「退出程序」的概念)。RTOS 工程里 main 的结局则是启动调度器:vTaskStartScheduler(),从此控制权交给内核,正常情况下永不回来"]]},{"g":"栈:一切切换魔法的基础","r":[["栈是什么","函数的草稿纸","每次函数调用,返回地址、局部变量、需要保护的寄存器都压进栈;返回时弹出。像一摞草稿纸:新算题拿新纸压上面,算完撕掉露出上一张"],["栈向下生长","高地址→低地址","多数架构(含ARM Cortex-M)栈从高地址往低地址长。栈溢出=草稿纸摞穿了桌面,压坏了下面别人的变量——嵌入式最阴险的bug来源"],["寄存器组","CPU的双手","R0-R12通用寄存器、SP(栈指针)、LR(返回地址)、PC(下一条指令)、xPSR(状态)。CPU「正在做的事」完全由这组寄存器定义——把它们全部存起来,就等于给CPU拍了张快照"],["快照=上下文","提前剧透","「上下文(context)」就是这组寄存器快照。RTOS切换任务=把当前任务的快照存进它自己的栈,再从下一个任务的栈里恢复它的快照——下一章的主角,底层就这么朴素"]]},{"g":"中断:硬件的插队机制","r":[["中断是什么","电话铃","外设(定时器、串口、引脚)有急事时向CPU发信号,CPU立刻暂停手头的事去处理,处理完回来继续。像正在记账时电话响了:插书签、接电话、挂了回来接着记"],["向量表","电话簿","一张函数指针表:几号中断来了就跳到几号函数(ISR,中断服务程序)。硬件自动查表跳转,不用你轮询"],["硬件自动保护现场","Cortex-M特性","进中断时硬件自动把 R0-R3、R12、LR、PC、xPSR 压栈(共8个字),出中断自动弹回——这个机制被RTOS巧妙借用来做任务切换(PendSV),后面会呼应"],["中断优先级与嵌套","NVIC","每个中断可设优先级,高优先级可打断低优先级的ISR(嵌套)。RTOS会划一条线(如 configMAX_SYSCALL_INTERRUPT_PRIORITY):线上的中断完全不受内核管、绝对实时,但不许调用RTOS API","中断优先级配错是FreeRTOS工程头号惨案来源——在高于「线」的中断里调 FromISR API,系统随机崩溃"]]},{"g":"前后台系统的极限:为什么终于需要RTOS","r":[["大循环的时序纠缠","一个拖全家","while(1){读传感器;算控制;刷屏;处理串口;}——刷屏一旦花50ms,控制环也被拖到50ms周期。所有事务共享一条时间线,谁慢谁连累全体"],["delay是毒药","忙等卡死一切","裸机的 delay_ms(500) 是CPU空转数数:这500ms里除了中断,什么都做不了。想「闪灯的同时跑控制」,裸机要靠状态机+时间戳硬拆,代码迅速面条化"],["拆状态机拆到失控","复杂度爆炸","裸机高手的出路是把每件事拆成状态机、用定时器打拍子——三五个事务还行,十几个事务互相有时序依赖时,维护成本指数上升"],["RTOS给的答案","每个事务一条时间线","每个事务写成独立任务,各自想delay就delay(阻塞时CPU自动去干别的),互不拖累;紧急任务随时抢占。代价:几十KB Flash、每任务几百字节RAM、学习成本——本课就是来付这个学习成本的"]]}]},{"t":"任务与调度:RTOS的心脏","sub":"一颗CPU如何伪装成多颗","fig":"ostask","map":[["任务是什么","独立函数+独立栈+TCB档案;通常是带阻塞的无限循环"],["任务状态","运行;就绪;阻塞;挂起——一张状态机图"],["调度算法","抢占式:优先级高者立刻上;时间片:同级轮流;协作式:主动让"],["上下文切换","存快照→换栈指针→恢复快照;Cortex-M用PendSV做"],["FreeRTOS API","xTaskCreate;vTaskDelay;vTaskDelete;vTaskSuspend;uxTaskPriorityGet"]],"spine":"调度的真相只有一句话:CPU切换任务快到你察觉不到,于是「同时运行」的幻觉产生了——就像一个杂技演员轮流颠五个盘子,盘子们都以为有专人伺候自己。","g":[{"g":"任务:员工、档案与工位","r":[["任务=函数+栈+TCB","三件套","任务本体是个普通C函数(通常 while(1) 循环);每个任务有自己的私有栈(工位/草稿纸)和一个TCB(任务控制块——员工档案:优先级、状态、栈顶指针都记在里面)"],["任务的标准长相","循环+阻塞","void vTask(void *p){ for(;;){ 等事件/延时(阻塞); 干活; } }——关键是必须有阻塞点(vTaskDelay、等队列等),让出CPU。没有阻塞点的任务是「霸台员工」,比它优先级低的任务永远没机会","写了个不含任何阻塞的任务,然后发现低优先级任务全饿死——新手第一坑"],["创建任务","xTaskCreate","参数:任务函数、名字、栈深(单位是「字」不是字节!)、传入参数、优先级、句柄。栈给多大是永恒难题:先给宽裕值(如512字),跑起来后用 uxTaskGetStackHighWaterMark 量实际用量再收紧"],["空闲任务","IdleTask","调度器自动创建的优先级0任务:所有任务都阻塞时它上台(CPU总得有事干)。它负责回收被删任务的内存,也是低功耗休眠的挂载点(idle hook)"],["任务数量的度","不是越多越好","按「独立时序线」划分任务:同一节奏的事务合成一个任务,不同节奏/不同紧急度才分开。任务过多=切换开销+栈内存+复杂度白白上升。十个以内是多数中小项目的常态"]]},{"g":"任务状态机(配图)","r":[["运行 Running","正在台上","正在占用CPU的那一个(单核同一时刻只有一个)。谁上台由调度器按「就绪队列里优先级最高者」决定"],["就绪 Ready","后台候场","随时能跑,只等CPU空出来。同优先级的就绪任务排成一队轮流(时间片)"],["阻塞 Blocked","等着叫号","在等某件事:延时到期、队列来数据、信号量可用……事件没来绝不占CPU。阻塞是RTOS效率的来源:等待不耗CPU","阻塞≠挂起:阻塞是任务自己在等事件(事件来了自动醒),挂起是被人为按下暂停键(必须显式恢复)"],["挂起 Suspended","被停职","vTaskSuspend 强制暂停,不参与任何调度,直到 vTaskResume。调试时隔离可疑任务很好用,正常业务逻辑里少用(容易忘了恢复)"],["状态迁移就六条箭头","看图记","就绪⇄运行(调度/被抢占)、运行→阻塞(等事件)、阻塞→就绪(事件到)、任意→挂起、挂起→就绪。把图画在草稿纸上默写一遍,任务管理就通了"]]},{"g":"调度算法:班长按什么规则吹哨","r":[["抢占式调度","RTOS默认","高优先级任务一就绪,立刻打断当前任务上台(当前任务退回就绪队列)。像老板推门进来,员工手头的活立刻放下——「实时」的保障就在这个「立刻」"],["时间片轮转","同级内公平","同优先级的就绪任务每个tick轮换一次(FreeRTOS: configUSE_TIME_SLICING)。注意只在同级内轮——不同级永远是高者优先"],["协作式调度","已少用","任务不主动让(taskYIELD),谁也抢不了它。系统简单但实时性差,现代RTOS基本只作选项保留"],["FreeRTOS的就绪队列","每级一条链表","每个优先级一条就绪链表+一个位图记录哪些级非空;调度=查位图最高置位→取该级链表头。O(1)完成,几条指令的事——「调度器很重」是误解"],["优先级数字","FreeRTOS大=高","FreeRTOS里数字越大优先级越高(0是空闲任务);而Cortex-M的中断优先级数字越小越高——两套体系方向相反,别搞混","uC/OS 恰好又反过来(数字小=优先级高)……跨RTOS工作时务必先确认方向"]]},{"g":"上下文切换:换班的全过程","r":[["切换三步","存→换→取","①把当前任务的寄存器快照压进它自己的栈;②把TCB里记录的「下一任务栈顶」装入SP;③从新栈弹出新任务的快照。SP一换,世界就换了——每个任务的栈里存着它「上次演到哪」"],["PendSV:专职换班员","Cortex-M惯例","切换动作放在PendSV(最低优先级的可挂起异常)里做:任何中断想触发切换,只需「挂起」PendSV,等所有中断处理完、最后离场时才真正切换——保证切换永不打断中断,时序干净"],["SysTick触发时机","每个tick查一次","系统心跳中断(如1ms)里检查:有没有更高优先级任务醒了?同级要不要轮片?要切就挂PendSV。加上API调用时的主动检查,构成全部切换时机"],["切换开销","几微秒级","Cortex-M上一次切换约百条指令量级(主频72MHz时约1-2μs)。设计时别让任务以「每秒几万次」的频率互相唤醒——那是把经理累死在换班上"],["psp/msp双栈指针","任务栈与中断栈分离","Cortex-M有两个栈指针:任务用PSP,中断用MSP。中断不啃任务的栈,任务栈只需按自己的最大深度分配——这是RTOS能给每任务分小栈的硬件底气"]]},{"g":"常用任务API速记(FreeRTOS)","r":[["xTaskCreate / vTaskDelete","生与死","创建/删除任务。删除后TCB与栈由空闲任务回收——所以删任务后要给空闲任务留运行机会。能不动态删就不删:嵌入式偏爱「任务一次建好,跑到断电」"],["vTaskDelay / vTaskDelayUntil","两种延时","Delay:从「现在」起睡N个tick(相对);DelayUntil:睡到「上次唤醒时刻+周期」(绝对)。做固定周期的控制环必须用 DelayUntil——Delay会把任务执行时间累积成周期漂移","控制环用 vTaskDelay(10) 导致周期实际是「10ms+执行时间」,越跑越歪——用 vTaskDelayUntil 才是真10ms"],["vTaskSuspend / vTaskResume","暂停/恢复","人为按下/松开暂停键;vTaskSuspendAll 则是暂停整个调度器(临界区的温和版:中断照常,只是不换任务)"],["uxTaskGetStackHighWaterMark","栈水位计","返回该任务栈的历史最小剩余量(单位字)。定期打出来看,是防栈溢出的第一道哨"],["vTaskList / 运行时统计","任务体检表","configUSE_TRACE_FACILITY 打开后可打印所有任务的状态、优先级、栈余量、CPU占比——排障时的第一张化验单"]]}]},{"t":"中断与时钟:系统的心跳与插队","sub":"ISR写作规则·临界区·tick与软件定时器","map":[["ISR三原则","快进快出;只记留言不办事;用FromISR版API"],["顶半/底半","中断里只置信号,唤醒任务干重活(deferred processing)"],["临界区","关中断:taskENTER_CRITICAL;只关调度:vTaskSuspendAll"],["系统心跳","SysTick每1ms一跳;tick驱动延时/超时/时间片"],["软件定时器","守护任务代跑回调;回调禁止阻塞"]],"spine":"中断处理的黄金法则是「接线员模式」:电话(中断)响了,接线员只记下留言(置标志/发通知),挂断,让办公室里的专员(任务)去办正事——ISR里干重活,整个系统的实时性就被你拖垮了。","g":[{"g":"ISR 写作三原则","r":[["快进快出","微秒级离场","ISR执行期间,同级及更低的中断全被挡在门外。ISR里做长运算/等待/打印,等于接线员抱着电话聊天,全公司电话占线——ISR只做:读硬件、清标志、发通知,立刻走人"],["两套API之谜","xQueueSend vs xQueueSendFromISR","普通API可能阻塞(ISR绝不允许睡着!)且内部临界区实现不同,所以FreeRTOS给ISR单独一套 *FromISR 版本。在ISR里误用普通版=随机死机","编译器不会拦你——在ISR里调了 vTaskDelay 或普通版API,可能跑几天才崩一次,极难排查"],["唤醒后要不要立刻切换","portYIELD_FROM_ISR","FromISR API会告诉你「刚才是否唤醒了更高优先级任务」(pxHigherPriorityTaskWoken);ISR结尾用 portYIELD_FROM_ISR(flag) 请求立即切换——不写它,唤醒的任务要等下个tick才上台,白白晚1ms"],["顶半/底半模式","标准套路","ISR(顶半):收数据进缓冲/置事件→唤醒处理任务;任务(底半):慢慢解析、算、回应。串口收发、网络包处理全是这个骨架——Linux的中断顶半底半、tasklet是同一思想的大号版本"]]},{"g":"临界区:短暂的独占","r":[["为什么需要","一条C语句≠一步到位","count++ 编译后是「读-改-写」三步,中断/切换插在中间就丢更新(竞态)。临界区=把这几步变成不可打断的原子操作"],["关中断临界区","taskENTER/EXIT_CRITICAL","把优先级低于「那条线」的中断全关掉(高于线的实时中断照常)。最彻底,但每关1μs,全系统响应就恶化1μs——只包住几条语句,绝不包函数调用/循环","在临界区里调用可能阻塞的API是自杀:中断关着,唤醒它的事件永远进不来"],["挂起调度器","vTaskSuspendAll/xTaskResumeAll","温和版:中断照常响应,只是不许换任务。保护「只有任务之间共享、中断不碰」的数据时用它,对实时性伤害小得多"],["选择的口诀","跟谁抢,用什么锁","和ISR抢数据→关中断临界区(短!);只和其他任务抢→挂调度器或互斥量;长时间独占→必须用互斥量(阻塞等待,不冻结系统)"]]},{"g":"tick:系统的节拍器","r":[["SysTick","心跳中断","一个专用硬件定时器按 configTICK_RATE_HZ(常用1000Hz=1ms)周期打拍子。每拍做三件事:系统时间+1、检查有没有延时到期的任务该醒、同级时间片轮转"],["tick粒度=延时精度","1ms心跳,±1ms误差","vTaskDelay(1) 实际睡0~1ms(取决于调用时刻离下一拍多远)。要微秒级精度的定时,别用tick——用硬件定时器"],["tick率的权衡","不是越高越好","1000Hz:1ms粒度,每秒1000次心跳中断开销;100Hz:开销小但粒度粗。多数项目1000Hz;电池设备考虑tickless(空闲时停跳,靠低功耗定时器补账)"],["数tick会溢出吗","32位约49.7天","xTaskGetTickCount 的32位计数约49.7天回绕一圈。FreeRTOS内部延时链表处理了回绕,但你自己拿tick做「时间戳差值」时要用无符号减法技巧","(uint32_t)(now-then) 的无符号回绕减法天然正确;写成 now>then 判断则49天后必出鬼"]]},{"g":"软件定时器:批量闹钟","r":[["它是什么","守护任务代跑回调","想要「500ms后做X」「每2s做Y」又不想为每件事开任务?软件定时器把回调挂到一个专门的「定时器守护任务」里按时执行——一个任务养一群闹钟,省内存"],["回调里的纪律","不许阻塞","所有定时器回调共享守护任务:你在回调里睡1秒,其他所有闹钟全部晚点。回调只做快事,慢事发通知给业务任务","回调里调用 vTaskDelay/等队列=堵死整条定时器流水线,现象是「别的定时器莫名不准」"],["单次与周期","one-shot / auto-reload","单次:到点响一声就停(超时检测、按键消抖);周期:响完自动重装(定期采样、心跳包)。xTimerStart/Stop/Reset均经命令队列发给守护任务——注意它们也可能等队列,有超时参数"],["和硬件定时器分工","精度分界","软件定时器:精度=tick级(ms),数量随便加;硬件定时器:精度=时钟级(ns~μs),数量有限。PWM、输入捕获、微秒定时必须硬件;业务级「过一会儿做某事」用软件"]]}]},{"t":"通信与同步:任务如何安全对话","sub":"队列·信号量·互斥量·事件组·任务通知","map":[["队列","带锁的传送带;拷贝语义;满/空可阻塞可超时"],["信号量","二值:门铃(事件通知);计数:停车位牌(资源计数)"],["互斥量","单间钥匙;有所有权;优先级继承;不可用于ISR"],["事件组","多条件会合:等A且B,或A或B"],["任务通知","最轻最快的点对点信号;每任务自带信箱"]],"spine":"为什么不直接用全局变量传数据?因为抢占随时发生——你写到一半就被人读走一半。RTOS的通信原语,本质都是「自带锁和叫号器的全局变量」:数据安全送达,收不到就安心睡,到货自动叫醒。","g":[{"g":"队列:数据的传送带","r":[["拷贝语义","值被复制进队列","xQueueSend 把数据整份拷进队列内部存储,发送方的原变量随后可自由复用——代价是大结构体拷贝慢。大数据的惯用法:队列里传指针,数据放缓冲池","传指针时要约定「谁负责释放、何时可写」——发出去的缓冲在对方用完前不许动,否则又绕回竞态"],["满与空的两头阻塞","天然流控","队列空时接收者睡(xQueueReceive带超时),满时发送者睡——生产者-消费者的流量控制白送。超时参数:0=不等,portMAX_DELAY=死等,其余=最多等N个tick"],["一收多发/一发多收","都合法","多个任务可向同一队列发(常见:多路传感器→一个处理任务);多任务从同一队列收也合法但每条数据只有一个任务拿到(抢单模式)"],["超时返回要检查","errQUEUE_FULL","每个Send/Receive都可能超时失败,返回值必须判——「发进去了吧大概」是嵌入式版的掩耳盗铃。失败分支要有对策:丢弃?重试?计数上报?"]]},{"g":"信号量:门铃与车位牌","r":[["二值信号量","门铃","只有0/1两个状态:Give=按铃,Take=等铃响。典型:ISR按铃唤醒处理任务(不带数据的「有事了」通知)。多次连按只算一次——铃没有记忆","事件可能丢:处理期间又来两次Give,醒来只处理一轮。要计数就用计数信号量或任务通知的计数模式"],["计数信号量","停车位计数牌","初值N=车位数:Take成功=占一位(计数-1),空了就等;Give=腾一位。管理「同类资源池」(N个缓冲区、N条DMA通道)或统计未处理事件数"],["实现小秘密","长度N、宽度0的队列","FreeRTOS里信号量就是「不存数据的队列」:只用计数,不拷贝内容——所以API手感和队列如出一辙"],["Give不会阻塞","方向不对称","Take可等待,Give(向满信号量再Give)立即返回失败——理解成「按铃永远按得下去,车位牌满了再举牌无效」"]]},{"g":"互斥量:单间的钥匙","r":[["与二值信号量的本质区别","所有权","互斥量有主人:谁Take谁才配Give(钥匙谁借谁还);二值信号量无主人(A按铃B接都行)。保护共享资源必须用互斥量,不是二值信号量——因为下一条:"],["优先级继承","堵车时借红灯权","低优任务L持锁时,高优任务H来等锁→L临时被抬到H的优先级,尽快跑完还锁,防止中优任务M插队把L(连带H)挡死。只有互斥量有这个机制,二值信号量没有(详见第7章火星车事故)"],["递归互斥量","同一人可重复上锁","同一任务对同一互斥量嵌套Take N次,需对应Give N次才真正释放——函数A(拿锁)调函数B(也拿同一把锁)的场景。普通互斥量这么干会自己死锁自己"],["两条铁律","ISR禁用·拿放同层","①ISR里绝不可用互斥量(ISR不能睡、也谈不上「所有权」);②谁拿谁放、尽快放,持锁期间不调可能阻塞的API——拿着钥匙进屋睡着,全楼人堵门口"]]},{"g":"事件组与任务通知","r":[["事件组:多条件会合","等A且B,或A或B","一个位图,每位代表一个事件;xEventGroupWaitBits可等「任意一位」(或)或「全部位」(与)。典型:任务要等「传感器就绪 且 网络连上 且 配置加载完」再开工——三个门铃并成一个会合点"],["任务通知:自带信箱","最轻最快","每个任务TCB里内置一个32位通知值:xTaskNotify直发给目标任务,无需创建任何中间对象,速度比信号量快约45%。能用它替代的场景:二值/计数信号量、单收者事件位、长度1的邮箱"],["任务通知的限制","一对一","只能发给「指定任务」:一个收件人、无排队缓冲(增强版可选覆盖/累加)。多对多、要缓冲、要广播时回到队列/事件组"],["怎么选:一张决策表","从轻到重","「叫一声」→任务通知;「叫醒并给个数」→通知(累加/覆盖);「传数据」→队列;「资源计数」→计数信号量;「保护共享区」→互斥量;「多条件会合」→事件组——先试最轻的,不够再升级"]]},{"g":"经典问题与陷阱","r":[["生产者-消费者","标准骨架","ISR/采集任务产数据→队列→处理任务消费。队列长度=容忍的突发量:太短丢数据,太长占内存且掩盖「消费不过来」的真问题(延迟悄悄堆积)"],["死锁四条件","记「互斥·持有·不剥夺·环路」","A拿锁1等锁2,B拿锁2等锁1,永久对峙。预防最实用的两招:全局固定加锁顺序(人人先1后2);Take用带超时版本,超时即回退释放"],["裸全局变量+标志位","看似能跑的定时炸弹","「flag=1通知,while(!flag)等待」:忙等烧CPU、读改写竞态、编译器还可能把flag优化掉。volatile只解决「编译器缓存寄存器」这一件事,不解决原子性与顺序——它不是并发安全符","「加了volatile就线程安全了」是嵌入式圈流传最广的错觉:volatile≠原子≠内存屏障"],["共享外设也是共享资源","别只盯变量","两个任务都用同一个I2C/SPI/串口,和共享变量一样要互斥——常见做法:外设配一把互斥量,或干脆「一个外设一个管家任务」,别人都发队列请求(用消息把并发串行化)"]]}]},{"t":"内存管理:寸土寸金的艺术","sub":"为什么嵌入式怕malloc·五种堆·栈的守护","map":[["三大顾虑","碎片化;时间不确定;泄漏无人救"],["FreeRTOS五种堆","heap_1只分不收;heap_2简单回收;heap_3包装libc;heap_4合并碎片(默认);heap_5多区域"],["静态分配","xTaskCreateStatic;编译期定生死;车规最爱"],["栈守护","水位监测;溢出钩子;哨兵字节"],["内存池","固定大小块;零碎片;O(1)分配"]],"spine":"PC程序员挥霍内存,嵌入式程序员数着字节过日子。malloc在嵌入式的名声,像市区里的临时停车:车来车往之后,空位七零八落——总面积够,大巴(大块申请)就是停不进。这叫碎片化,而嵌入式一跑就是几年,不重启。","g":[{"g":"为什么嵌入式对 malloc 皱眉","r":[["碎片化","停车场效应","反复malloc/free不同大小的块,空闲内存被切成零散小段:总量还剩10KB,但最大连续块只剩512B,申请1KB失败。设备要连续跑几年,碎片只积不散——第380天深夜分配失败,谁来debug?"],["时间不确定","实时系统之敌","malloc要遍历空闲链表找合适的块,耗时取决于当时的碎片形状——同一行代码这次2μs下次200μs。硬实时路径上不允许这种「看心情」的延迟"],["失败与泄漏无人兜底","没有操作系统爸爸","PC上进程崩了OS回收一切;MCU上泄漏就永远漏了,malloc返回NULL没人管就是野指针飞行。所以嵌入式纪律:每次分配判NULL,且尽量根本不做运行时分配"],["行业共识","初始化期分配,运行期不分配","车规(MISRA C、AUTOSAR CP)干脆禁止运行时动态分配:所有内存编译期/启动期定死。民用项目至少做到:启动阶段建好一切,进入主循环后不再malloc"]]},{"g":"FreeRTOS 的五种堆(heap_1~5)","r":[["heap_1","只分不收","最简单:一根指针往后挪,不支持free。适合「建好就跑到断电」的系统——不能free听起来是缺陷,其实是自律:根除碎片与泄漏"],["heap_2","回收但不合并","支持free,但相邻空闲块不合并,碎片风险高——历史遗留,新项目跳过它直接用heap_4"],["heap_3","libc包装","把malloc/free套上临界区变线程安全。堆大小由链接脚本决定,行为取决于工具链的libc——想统一可控就别用它"],["heap_4","合并碎片·默认之选","free时把相邻空闲块合并成大块,显著抗碎片;可用 xPortGetFreeHeapSize / MinimumEver 观测水位。绝大多数项目的默认答案"],["heap_5","多区域版heap_4","RAM不连续(片内SRAM+片外SDRAM)时,把多块区域纳入同一个堆管理。用前必须先 vPortDefineHeapRegions"]]},{"g":"静态分配:编译期定生死","r":[["xTaskCreateStatic","自带干粮建任务","任务栈和TCB由你静态定义好传进去,内核一个字节都不用堆——队列/信号量/定时器都有对应Static版。configSUPPORT_STATIC_ALLOCATION=1开启"],["静态的好处","上电即知成败","内存够不够,链接时就报错,而不是运行到某天才失败;map文件里每一字节去向清清楚楚——可审计、可认证(功能安全最看重这个)"],["混合策略","常驻静态,临时才堆","实践常态:任务/队列等「常驻家具」静态建,真正短生命周期的缓冲用heap_4——并监控堆最低水位,留30%余量"],["内存池(固定块)","第三条路","预切N个等大块,分配=取一块,释放=还一块:O(1)、零碎片、时间恒定。uC/OS、RT-Thread内置;FreeRTOS可自己用队列存空闲块指针实现——网络包、消息缓冲的经典方案"]]},{"g":"栈的守护:最凶的溢出","r":[["任务栈给多大","先富养再精算","影响因素:局部变量(尤其大数组!)、调用深度、中断压栈、printf这类大胃口函数。方法:先给宽裕值→跑遍最坏路径→读HighWaterMark→留50%余量收紧","栈上开 char buf[512] 一把梭是溢出头号元凶——大缓冲放静态区或内存池,别放栈"],["水位检测","uxTaskGetStackHighWaterMark","内核建栈时填满0xA5,水位=从未被碰过的0xA5还剩多少。定期打印各任务水位,是最便宜的健康监测"],["溢出钩子","configCHECK_FOR_STACK_OVERFLOW","方案1:切换时查SP是否越界;方案2:再查栈底哨兵字节是否被踩(推荐,能抓到「越界又缩回」)。触发 vApplicationStackOverflowHook——钩子里别干复杂事:记录现场,复位"],["MPU:硬件级隔离","越界即抓现行","带MPU的芯片可给每任务划内存权限区,越界访问立刻触发MemManage异常——从「事后验尸」升级为「当场抓获」。FreeRTOS-MPU版支持,车规OS(下下章)的内存分区就是这思想的制度化"]]}]},{"t":"实时性与可靠性设计","sub":"指标·优先级设计·经典事故·防御机制","fig":"osinv","map":[["三个指标","中断延迟;调度延迟;抖动——都按最坏情况算"],["优先级怎么定","RMS:周期越短优先级越高;利用率界约69%"],["经典事故","优先级反转(火星探路者);饿死;死锁;关中断过久"],["防御机制","看门狗(集中监护喂狗);HardFault抓现场;断言"],["低功耗","tickless idle:空闲时停心跳,低功耗定时器补账"]],"spine":"1997年,火星探路者号在火星上反复重启,险些任务失败——地面排查发现元凶是「优先级反转」:一个低优先级任务拿着锁,把高优先级任务间接挡死,触发看门狗。修复方式是远程打开互斥量的优先级继承开关。这一章讲的,就是这类「平时不出、一出要命」的问题。","g":[{"g":"实时性指标:量化「快而稳」","r":[["中断延迟","事件→ISR第一条指令","硬件事件发生到ISR开跑的时间。被什么拉长?——关中断的临界区、更高优先级ISR。最坏值=最长关中断时间+最长同级以上ISR链"],["调度延迟","唤醒→任务真正运行","高优先级任务被唤醒到它实际上台的时间:PendSV要等所有中断退出,还要做上下文切换。RTOS厂商标称的「xμs切换」都是理想值,你系统的最坏值取决于你写的最长临界区"],["抖动 jitter","周期的呼吸","1ms周期的控制环,实际每拍0.98~1.05ms晃动——对滤波器、PID都是噪声源。来源:tick对齐、共享总线、缓存、更高优先级插队"],["怎么测","GPIO+逻辑分析仪最实在","任务/ISR进出各翻转一个GPIO,逻辑分析仪看波形:周期、抖动、执行时长、被抢占情况一目了然。软件侧配合DWT周期计数器(Cortex-M的CYCCNT)打时间戳——比printf准三个数量级"]]},{"g":"优先级设计:一套方法而不是拍脑袋","r":[["RMS单调速率法","周期越短,优先级越高","理论最优的静态分配法:1ms的环>10ms的环>100ms的日志。直觉也通:越急的节拍越不容忍等待——先按RMS排,再按业务微调"],["利用率检验","CPU别排太满","RMS可调度的理论界约69%(任务数多时);工程经验:CPU利用率控制在50-70%,留突发余量。utilization=Σ(执行时间/周期),逐任务量出来算一遍"],["同级要慎用","时间片≠免费午餐","把不相干任务设成同级靠时间片轮转,时序会互相耦合(每人1个tick轮着走)。能分出主次就分级;真正对称并行的工作才同级"],["「全都设最高」综合征","等于全都最低","优先级是相对的:全体最高=没有优先级。规则:硬实时环最高、时序敏感中间、日志/界面/统计垫底;并且高优先级任务必须「短跑冲刺」——跑得越久,越没资格站高位"],["中断与任务的分工","ISR只抢跑道不跑马拉松","需要μs级响应→放ISR(但只做μs级的事);ms级时序→高优先级任务;其余→普通任务。把马拉松塞进ISR,等于让全系统给一个中断陪跑"]]},{"g":"经典事故档案","r":[["优先级反转(配图)","火星探路者,1997","L持锁→H等锁→M(不碰锁)抢占L跑个没完→H被M间接挡死。探路者号上:气象任务(L)持总线锁,通信任务(M)长跑,数据分发(H)超时触发看门狗整机重启。修复:互斥量开优先级继承——L被临时抬到H级,M插不了队","教训入行必读:JPL事后报告承认测试期见过此现象但当作「毛刺」放过——间歇性怪问题,不查到根因不能算修好"],["饿死 starvation","低优先级永世不得翻身","高优先级任务没有阻塞点(或负载太满),低优先级任务永远分不到CPU:现象常是「日志停了」「看门狗喂不上」。药方:每个任务必须有阻塞点;用运行时统计核对各任务CPU占比"],["死锁 deadlock","互相锁门","两任务各持一锁互等对方。四个必要条件(互斥、持有等待、不可剥夺、循环等待)破一个即可——工程首选:全局统一加锁顺序+带超时的Take+超时后释放重试"],["关中断过久","自己造的延迟","在临界区里刷屏、算FFT、等标志……全系统中断延迟直接等于你的临界区长度。审查铁律:grep 所有 ENTER_CRITICAL,逐个确认「几条语句内必出」"]]},{"g":"防御机制:假设一定会出事","r":[["看门狗的正确姿势","集中监护,不是各自打卡","多任务系统别让「谁跑到就谁喂狗」——一个任务卡死其他任务照喂,狗白养了。正解:监护任务收集各任务的「心跳签到」(事件位),全员到齐才喂硬件狗;谁缺勤,记录现场再复位","把喂狗放在定时器回调里是最危险的写法:业务全死了定时器还在准时喂狗,故障被完美掩盖"],["窗口看门狗","喂早了也复位","普通狗只怕饿,窗口狗还怕「喂太勤」——程序跑飞恰好疯狂喂狗的场景能被抓住。车规常配独立+窗口双狗"],["HardFault不是死,是线索","抓现场","HardFault handler里把栈上的R0-R3/LR/PC/xPSR和SCB故障寄存器(CFSR/HFSR/BFAR)存进不掉电RAM再复位;重启后上报。PC值+map文件+反汇编,九成崩溃能定位到行"],["断言与防御式编程","早死早超生","configASSERT 打开!内核在参数非法、中断优先级配错等场景会直接assert——开发期宁可当场卡死暴露问题,也别让它带病潜行到量产。发布版把assert改成「记录+复位」"],["tickless低功耗","顺带一提","电池设备:空闲时停掉SysTick,睡到「下一个最近的到期时刻」由低功耗定时器唤醒,醒后把tick计数一次补上——configUSE_TICKLESS_IDLE。低功耗与实时性是一对需要谈判的矛盾"]]}]},{"t":"更大的地图:选型与嵌入式Linux","sub":"RTOS横向对比·Linux何时登场·双世界混合","map":[["选型五维度","实时等级;内存预算;生态组件;安全认证;团队熟悉度"],["嵌入式Linux","MMU+进程隔离;内核态/用户态;PREEMPT_RT;Yocto/Buildroot"],["混合架构","AMP:A核跑Linux+M核跑RTOS;RPMsg/共享内存互通"],["接口标准","POSIX(pthread);CMSIS-RTOS2;OSEK(通往车规)"],["一句总结","没有最好的OS,只有匹配需求的OS"]],"spine":"选OS像选车:跑赛道(硬实时)选方程式(RTOS),拉全家(生态功能)选SUV(Linux),很多产品干脆是「拖着房车的赛车」——双核异构,一核实时一核Linux。判断力来自搞清楚:你的需求里,哪部分是赛道,哪部分是全家。","g":[{"g":"选型五维度(工程决策清单)","r":[["实时等级","最坏情况说了算","μs级确定性(电机、电源、传感器融合)→RTOS甚至裸机+中断;10ms级且可偶尔超→PREEMPT_RT Linux也能接;先把「最严时序要求」写成数字,再谈选型"],["内存与成本","KB还是MB","RTOS:几十KB Flash/几KB RAM起步,MCU单芯片搞定;Linux:至少数十MB RAM+存储,要MPU/SoC。BOM成本差一个数量级"],["生态组件","别自己造轮子","要文件系统、TCP/IP、蓝牙、GUI、OTA?看各家组件成熟度:RT-Thread/Zephyr组件全,FreeRTOS+第三方库自由拼装,Linux应有尽有。项目工期常被「缺的那个组件」决定"],["安全认证","出厂要不要盖章","医疗(IEC 62304)、工业(IEC 61508/SIL)、汽车(ISO 26262/ASIL)需要认证版内核:SafeRTOS、uC/OS认证版、QNX、VxWorks Cert……认证费用与流程可能比开发本身还贵,立项就要问清楚"],["团队熟悉度","被低估的第一要素","团队精通FreeRTOS,项目又没有硬性认证/生态需求,就别为「技术先进」换Zephyr——OS迁移的隐性成本(踩坑、调试工具链、直觉重建)以人月计"]]},{"g":"嵌入式Linux:另一个世界","r":[["MMU带来质变","进程=带围墙的任务","有了MMU,每个进程活在自己的虚拟地址空间:野指针只崩自己,内核照常——RTOS里所有任务住一个大通铺,一人翻身全屋遭殃。这是Linux「稳」的硬件根基"],["内核态/用户态","应用与内核隔离","应用通过系统调用进内核,不能直接摸硬件;驱动生活在内核里(或用户态框架)。开发感受:RTOS里你就是整个系统,Linux里你是系统里的房客"],["Linux实时吗","PREEMPT_RT补丁","主线Linux是分时系统,毫秒级抖动;PREEMPT_RT(已并入主线)把关中断区改成可抢占、中断线程化,最坏延迟可压到几十μs——够格「软实时+」,但仍难与RTOS的μs级确定性硬碰"],["构建系统","Yocto / Buildroot","嵌入式Linux发行版是「按菜谱自己烤」:Buildroot简单直接适合入门,Yocto层化配方适合产品线复用——第一次构建几小时起步,做好心理建设"],["何时必须Linux","一票否决项","要跑浏览器/复杂GUI、Python生态、容器、复杂网络服务、大文件系统、多进程隔离安全模型——这些在RTOS上要么没有要么残废。反之若都用不上,Linux的启动秒级、内存MB级就全是纯开销"]]},{"g":"双世界混合:AMP架构","r":[["异构双核","A核+M核","主流SoC(STM32MP1、i.MX8、TI Sitara)常配Cortex-A(跑Linux)+Cortex-M(跑RTOS):A核管界面/网络/业务,M核管电机/采样/毫秒时序——赛车拖房车落了地"],["核间通信","RPMsg/共享内存/邮箱","Linux侧remoteproc负责给M核加载固件、RPMsg基于共享内存+邮箱中断收发消息。设计要点:把「实时闭环」完整留在M核,核间只传设定值与状态——别把控制环拆到两个核上"],["各睡各的觉","故障隔离红利","Linux升级/崩溃/重启期间,M核控制环照转不误——电机不会因为界面死机而失控。安全关键部分放M核,是这个架构最值钱的理由"]]},{"g":"接口标准:让代码可搬家","r":[["POSIX","pthread那一套","Linux/QNX/VxWorks/Zephyr(子集)都讲POSIX方言:pthread_create、mutex、mq……按POSIX写的代码在这些系统间迁移成本低。FreeRTOS也有POSIX兼容层(功能子集)"],["CMSIS-RTOS2","ARM的统一插座","ARM定义的RTOS抽象API:osThreadNew、osMessageQueuePut……底下可接FreeRTOS/RTX/ThreadX。STM32CubeMX生成的就是它——中间层便于换内核,但调试时要习惯「多剥一层皮」"],["OSEK/VDX","通往车规的桥","九十年代欧洲车企定的车用OS标准:静态配置、Basic/Extended任务、资源天花板协议——它就是下一章AUTOSAR CP OS的直系祖先。概念上可视为「把FreeRTOS们的动态自由全部换成编译期确定性」"]]}]},{"t":"AUTOSAR:车规世界的操作系统","sub":"CP与AP——从MCU控制器到智驾计算机","map":[["定位","不是一个OS,是汽车软件架构标准:分层+接口+方法论"],["CP经典平台","MCU;C语言;编译期静态配置;硬实时;刹车发动机车身"],["CP分层","SWC应用层 / RTE / BSW(MCAL·ECU抽象·服务层);OS在服务层"],["CP的OS","OSEK血统;Basic/Extended任务;调度表;资源天花板;OS-Application分区"],["AP自适应平台","SoC;C++14;POSIX(QNX/Linux);ara::com面向服务;智驾座舱OTA"],["共存","一辆车:动力底盘CP+域控中央AP,SOME/IP互联"]],"spine":"AUTOSAR 把「操作系统」从技术问题升格为供应链问题:几十家供应商给一辆车写软件,必须用同一套分层、接口和配置方法才能拼到一起。CP 是把前面八章的 RTOS 知识「制度化、静态化、可认证化」;AP 则是把第八章的 Linux/QNX 世界「服务化、车规化」。","g":[{"g":"AUTOSAR 是什么","r":[["一句话定位","标准,不是产品","AUTOSAR(AUTomotive Open System ARchitecture)是全球主机厂+供应商共同制定的汽车软件架构标准:统一分层、接口与开发方法论。你买到的是Vector/EB/ETAS等厂商的「实现」,标准本身免费公开"],["为什么车规要它","供应链拼图","一辆车上百个控制器来自几十家供应商,主机厂要能「A家的应用搬到B家的芯片、C家的协议栈」——没有统一架构,每次换供应商都推倒重来。学AUTOSAR的本质是学「车圈怎么分工协作」"],["CP与AP一句话","刹车用CP,智驾用AP","CP(Classic Platform):MCU、C语言、编译期静态配置、微秒级硬实时——发动机、制动、转向、车身。AP(Adaptive Platform):高性能SoC、C++14、POSIX、面向服务、可动态部署——智能驾驶、座舱、网联OTA。一静一动,一硬一软"],["与前八章的接线","旧知识全用得上","CP的OS=第3/5/7章那套抢占式优先级调度的车规化(OSEK血统);AP的底座=第8章的POSIX世界(QNX/PREEMPT_RT Linux)。前面是地基,这章是「制度大楼」"]]},{"g":"CP:三层蛋糕与RTE","r":[["三层架构","ASW / RTE / BSW","应用层(SWC组件)只写业务逻辑;RTE(运行时环境)是自动生成的「接线板」;BSW(基础软件)管硬件与系统服务。应用与硬件彻底解耦:换芯片,理论上应用层一行不改"],["BSW再切三层","MCAL·ECU抽象·服务层","MCAL:芯片厂提供的最底层驱动(直接摸寄存器);ECU抽象层:屏蔽板级差异;服务层:OS、通信(Com/PduR/CanIf)、存储(NvM)、诊断(Dcm/Dem)、看门狗管理(WdgM)——OS只是服务层的一个住户"],["SWC与端口","应用的乐高块","应用被拆成SWC(软件组件),彼此只通过端口通信:Sender-Receiver(发数据)或Client-Server(调服务)。谁连谁不写在代码里,画在ARXML配置里——「组件化到极致」"],["RTE:灵魂胶水","配置生成的接线板","RTE代码由工具根据ARXML自动生成:把SWC端口的读写翻译成实际的OS调用/信号访问,把SWC里的Runnable(可运行实体,一段函数)映射到OS任务里按序执行。「哪个Runnable进哪个任务、什么触发」是CP集成工程师的日常核心","初学最大不适:逻辑不在代码里,在配置里。追一个信号要跨代码与ARXML两个世界——习惯「配置即程序」"],["开发形态","写少量代码+大量配置","流程:定义SWC与接口(ARXML)→工具(EB tresos / Vector DaVinci)配置BSW与映射→生成RTE与OS→集成编译。改任务周期不是改代码,是改配置重新生成"]]},{"g":"CP的OS:OSEK血统,一切皆静态","r":[["静态是信仰","编译期定死一切","任务数量、优先级、栈、资源、Alarm全部在配置里写死,运行时不许创建/删除——换来的是:内存可精确审计、行为可完全预测、认证材料好写。对比FreeRTOS的xTaskCreate自由,这里是「计划经济」"],["Basic vs Extended任务","一次性 vs 常驻","Basic任务:没有等待态,被激活→跑完→TerminateTask结束,像一次性函数调用,切换开销小——周期Runnable多映射到它;Extended任务:可WaitEvent挂起等事件,像FreeRTOS的常驻循环任务——需要「等消息干活」的场景用它"],["调度表 Schedule Table","时刻表驱动","在一个Counter上定义一串「到点动作」(激活任务/设事件),整表可与全局时间同步——比「任务自己delay」更强的确定性:适合曲轴同步喷油、时间触发架构(与FlexRay/TSN配合)"],["资源与天花板协议","锁的车规做法","OSEK Resource用「优先级天花板」:任务拿到资源立刻升到该资源的天花板优先级——高优任务根本没机会「来了再等」,从机制上根除死锁与无界反转。对比FreeRTOS互斥量的优先级继承(出了事再补救),天花板是「上锁即免疫」","GetResource/ReleaseResource必须严格配对且不许在持资源时Wait——违反直接违规"],["OS-Application与内存分区","MPU制度化","任务/ISR分组为OS-Application,配合MPU实现分区隔离(可扩展级别SC3/SC4):QM级软件飞了,ASIL级分区不受污染——ISO 26262混合关键级部署的地基。第6章MPU那条的制度化版本"],["Alarm与Counter","车规软件定时器","Counter由硬件定时器驱动计数,Alarm挂在Counter上到点触发(激活任务/设事件/回调)——对应FreeRTOS软件定时器,但依旧:静态配置,数量编译期确定"]]},{"g":"AP:自适应平台","r":[["为什么需要AP","智驾算力上车","视觉感知、规划、大模型上车后,MCU+静态配置撑不住了:需要多核SoC、动态加载、服务化架构、频繁OTA。AP就是给「车里那台高性能计算机」定的标准"],["技术底座","C++14+POSIX PSE51","AP应用(Adaptive Application)用C++写,跑在符合POSIX PSE51子集的OS上——实践中就是QNX或加实时补丁的Linux。第8章的知识在这里直接续费"],["ara::com与SOME/IP","面向服务通信","不再是CP的「信号连线」,而是服务发现+方法调用+事件订阅(SOA):ara::com是标准API,SOME/IP是最常用的车载协议(另可绑DDS)——把微服务思想搬进车,服务可以在不同ECU间迁移部署"],["Execution/State Management","车规版systemd","EM按Machine/Execution Manifest启动并监控各进程,SM管理系统状态机(启动/运行/降级/关闭)——加上PHM(平台健康管理)喂狗监诊,构成AP的「进程生命周期铁三角」"],["与CP共存","一辆车两个世界","动力底盘继续CP(硬实时+低成本),域控/中央计算跑AP(算力+灵活),中间经网关做信号↔服务转换,骨干网走SOME/IP over 车载以太网——「软件定义汽车」的架构底图就是CP+AP混合"]]},{"g":"学习建议(接着你已有的接触往深走)","r":[["用映射表入门CP","旧钩挂新知","FreeRTOS任务→OSEK Task(注意Basic/Extended之分);互斥量→Resource(继承换成天花板);软件定时器→Alarm;队列→Com信号/IOC;vTaskDelay周期→调度表/Alarm周期激活。每学一个CP概念,先找它在通用RTOS里的影子,再记「车规改了什么、为什么改」"],["规范当字典,别当小说","SWS_OS与SWS_RTE","CP几十份规范里,与本课直通的是《SWS_OS》(操作系统)和《SWS_RTE》:精读概念章,其余用到再查。配一套工具链(EB tresos/DaVinci评估版或Vector公开教程)把「配置→生成→集成」流程亲手走一遍,胜读十遍PDF"],["AP从demo入手","先跑通再深挖","从官方/开源示例跑通一个ara::com服务(一个Provider一个Consumer),重点吃透Manifest配置与服务发现;再看EM/SM状态流。C++与POSIX基础不牢就先补第8章"],["面试/评审高频点","心里有数","CP:RTE是什么生成的、Basic/Extended区别、天花板协议为什么免疫反转、OS-Application与ASIL分区;AP:CP与AP选型边界、SOME/IP服务发现流程、EM怎么管进程——都在本章条目里,可当自查清单"]]}]},{"t":"工程实践:移植、调试与排障","sub":"从建工程到抓住那只「偶发的鬼」","map":[["移植三件套","SysTick(心跳);PendSV/SVC(切换);临界区(开关中断)"],["FreeRTOSConfig.h","tick率;优先级数;栈溢出检查;断言;统计开关"],["调试四板斧","RTOS感知断点;RTT/串口日志;SystemView/Tracealyzer;GPIO+逻辑分析仪"],["崩溃定位","HardFault寄存器;map文件;栈回溯;反汇编"],["质量","MISRA C;代码评审盯共享数据;仿真(QEMU/Renode)"]],"spine":"RTOS工程的bug分两种:一种printf就能看见,另一种只在「特定时序」出现——复现要三天,踩点要毫秒。这一章的全部内容,就是把第二种bug从「玄学」变成「流程」。","g":[{"g":"移植与工程搭建","r":[["移植其实很小","port层三件事","FreeRTOS跨芯片只需实现port层:①一个周期中断当心跳(SysTick);②上下文切换(PendSV+启动用的SVC);③临界区开关中断宏。主流芯片官方都有现成port——「移植」大多数时候=选对port目录+填对config"],["FreeRTOSConfig.h","全局开关面板","必看项:configTICK_RATE_HZ(心跳)、configMAX_PRIORITIES(级数,够用就好,每级耗RAM)、configMINIMAL_STACK_SIZE、configCHECK_FOR_STACK_OVERFLOW=2、configASSERT定义、configUSE_TRACE_FACILITY(统计)。开发期把检查类全开,量产再权衡"],["中断优先级配置","再强调一次","Cortex-M上必须把「调用FromISR API的中断」优先级数值设得 ≥ configMAX_SYSCALL_INTERRUPT_PRIORITY(即逻辑优先级不高于它)。90%的「FreeRTOS莫名死机」终点都是这里+configASSERT没开","STM32 HAL默认把所有中断设为最高优先级0——不改就用FromISR,必炸"],["目录结构建议","内核/驱动/业务分层","kernel(FreeRTOS原样,不改!)/ bsp(芯片与板级)/ middleware(协议栈组件)/ app(任务与业务)。内核源码永远保持可整包升级——改过内核的工程,三年后没人敢动"]]},{"g":"调试四板斧","r":[["RTOS感知调试","IDE里看任务","主流IDE(Keil/IAR/CubeIDE/Ozone)装RTOS插件后可见:所有任务状态、栈使用、当前运行者——断点停下先看「这一刻谁在跑、谁在等什么」,比盯单条调用栈信息量大得多"],["日志:RTT优于printf","别让日志毁了时序","SEGGER RTT走调试口内存交换,单条μs级,几乎不扰动时序;printf走串口一条几ms,足以把你要抓的时序bug「治好」(海森bug:一加日志就不复现)。日志里带上tick时间戳与任务名"],["可视化追踪","SystemView / Tracealyzer","内核埋点+上位机画时间线:每个任务何时运行、被谁抢占、ISR何时插入、队列何时满——优先级反转、抖动、CPU占比在图上一眼看穿。排「时序类」问题的核武器"],["GPIO+逻辑分析仪","最朴素最可信","任务进出翻GPIO,几块钱的逻辑分析仪就能量出真实周期/抖动/执行时长。当你怀疑一切软件工具时,示波器不说谎"]]},{"g":"崩溃与「偶发鬼」定位","r":[["HardFault流程化","三步定位","①handler里抓栈帧(PC/LR)与CFSR/BFAR/MMFAR;②拿PC查map文件落在哪个函数;③反汇编看具体指令与访问地址。把这套写成固定代码+固定操作,崩溃定位从「玄学」变「查表」"],["偶发问题三件套","先抓证据再猜","①不掉电RAM日志环形缓冲(重启后还在);②故障时自动dump任务列表+栈水位+堆水位;③长跑测试(过夜/温循/压力注入)主动把它逼出来。原则:没有现场,不下结论"],["高频嫌疑人名单","按命中率排序","栈溢出(查水位/哨兵)→中断优先级配错(查NVIC全表)→ISR里用错API(grep FromISR)→竞态裸共享(评审共享变量)→野指针/内存越界(MPU或金丝雀)→堆碎片(查MinimumEverFree)。按这个顺序过一遍,大多数「鬼」现形"],["复现即胜利","把毫秒踩点自动化","偶发bug的解药是「可复现」:写压力脚本把可疑时序高频触发(如每ms发一包+随机延时),复现周期从三天压到三分钟,剩下的就是普通调试"]]},{"g":"质量与规范","r":[["MISRA C精神","不是八股,是保命","车规/高可靠圈的C子集规范:禁隐式类型戏法、禁运行时动态分配、要求单一出口……核心思想「把C里容易写错的自由都关掉」。即使不强制认证,共享数据与ISR边界相关条款也值得全员执行"],["评审清单","盯三个高危区","①所有ISR:够短吗?用的都是FromISR吗?②所有共享数据:谁读谁写?锁对了吗?③所有阻塞调用:超时了走哪条分支?——RTOS工程评审,80%的收益来自这三问"],["仿真与CI","QEMU/Renode","内核逻辑与协议解析可在QEMU/Renode仿真跑单元测试,进CI每次提交自动回归——硬件相关10%留板上,其余90%逻辑不该等板子"],["文档化时序设计","画出来才看得见","任务清单(周期/优先级/最坏执行时间/通信对象)+一张数据流图,是RTOS项目最值钱的两页纸——新人看两页顶读两周代码,评审时序问题也全靠它"]]}]}],"F":[{"t":"新项目OS选型决策","when":"新产品立项,决定裸机/RTOS/Linux/车规平台时","s":[{"b":"写下最严时序要求","p":"把需求翻译成数字:最快控制环周期?最大可容忍抖动?错过期限的后果?——「快」不算需求,「1ms周期、抖动<5%、超时即安全风险」才算。"},{"b":"分横竖两刀","p":"竖刀切实时等级,横刀切功能复杂度。","f":[["μs级硬实时+功能简单","裸机或RTOS"],["ms级并发+几百KB内存","RTOS(FreeRTOS/RT-Thread)"],["要GUI/网络全家桶/AI","嵌入式Linux"],["两者都要","AMP双核:A核Linux+M核RTOS"]]},{"b":"车规项目走标准线","p":"量产车ECU基本没有自由选型:传统控制器→AUTOSAR CP(问主机厂要求的版本与工具链);域控/智驾→AP(QNX或Linux底座)或主机厂自研中间件。","f":[["ASIL等级高","认证内核+分区(SC3/SC4或QNX)"],["预研/演示","可先FreeRTOS快速原型,量产前迁移"]]},{"b":"核对认证与生态","p":"需要功能安全认证吗(26262/61508/62304)?缺的组件(蓝牙栈/文件系统/OTA)哪家有现成的?认证与组件缺口常常一票否决。"},{"b":"最后称一称团队","p":"技术合适但团队陌生的OS,把学习成本(以人月计)写进排期再决策——多数「先进选型」死于低估这一项。","trap":"警惕简历驱动开发:为了「用过Zephyr/AP」而选它,项目会替你付学费。"}]},{"t":"任务划分与优先级设计","when":"新写一个RTOS应用,或重构一团乱麻的旧工程时","s":[{"b":"列事务清单","p":"把系统要做的事全列出来,标注:周期(或触发源)、最坏执行时间、错过的后果、依赖哪些数据。这张表是后面一切的输入。"},{"b":"按时序线合并成任务","p":"同节奏且相关的事务合成一个任务;不同周期、不同紧急度、会互相拖累的分开。目标:任务数最少但时序互不纠缠(通常5-10个)。","f":[["μs级响应","进ISR,任务只做后半程"],["同外设的多个操作","合成一个管家任务,串行化"]]},{"b":"按RMS排优先级","p":"周期越短优先级越高;事件驱动的按「可容忍延迟」折算周期参与排序。同级仅留给真正对称的工作。"},{"b":"设计通信拓扑","p":"每条数据流选原语:叫一声→任务通知;传数据→队列;保护共享→互斥量;多条件→事件组。画一张任务-队列连线图,禁止「裸全局变量+标志」。","trap":"两个任务互发队列且都满时可能互等死锁——数据流尽量单向,回包走另一条队列或通知。"},{"b":"算CPU利用率并验证","p":"Σ(执行时间/周期)≤50-70%;上板后用运行时统计+SystemView核对实际占比与抖动,与设计表对账——对不上的就是隐患。","trap":"别忘了把ISR的时间算进去:一个1kHz、每次100μs的ISR就是10%的CPU,而且是最高优先级的10%。"}]},{"t":"死机/跑飞排障流程","when":"系统卡死、复位、行为诡异,尤其「偶发」时","s":[{"b":"先分类:死的姿势","p":"完全僵死(中断也不响)?看门狗复位?HardFault?还是活着但某任务停摆?——姿势不同,凶手圈子不同。","f":[["彻底僵死","死循环+关中断,或时钟/电源硬件"],["HardFault","野指针/栈溢出/非法指令"],["看门狗复位","某任务饿死或死锁"],["部分停摆","该任务阻塞在某个永不到来的事件"]]},{"b":"抓现场","p":"HardFault:读栈帧PC/LR+CFSR/BFAR;僵死:调试器attach看PC停在哪、任务列表什么状态;复位:不掉电RAM里的日志与复位原因寄存器(RCC->CSR)。"},{"b":"过高频嫌疑人名单","p":"按命中率:栈水位→NVIC优先级全表→ISR里的API(grep FromISR)→临界区长度→共享数据锁→堆最低水位。每项要么排除要么坐实,不跳步。"},{"b":"上追踪工具复现","p":"SystemView/逻辑分析仪挂上,写压力脚本放大可疑时序,把「三天一次」压成「三分钟一次」——能稳定复现,问题已解决一半。"},{"b":"修复后回归+加哨","p":"修复要能解释全部症状;然后把这次的检测手段固化:断言、水位监控、日志——同一只鬼不该抓第二次。","trap":"「重启一下就好了」不是修复。间歇性问题不查到根因,只是把事故日期改到了量产之后(参考火星探路者)。"}]},{"t":"从FreeRTOS思维迁入AUTOSAR CP","when":"通用RTOS背景的人接手车规CP项目时","s":[{"b":"先换世界观:配置即程序","p":"CP里逻辑分两半:代码(SWC/Runnable)+配置(ARXML)。追问题要两边一起看——先接受「任务不是create出来的,是配置生成的」。"},{"b":"建立概念映射表","p":"用旧知识挂新概念,逐条对照。","f":[["FreeRTOS任务","OSEK Task(分Basic/Extended)"],["互斥量+优先级继承","Resource+天花板协议"],["软件定时器","Alarm/调度表"],["队列","Com信号/IOC"],["main里启动调度器","EcuM/BswM状态管理启动OS"]]},{"b":"跟一条信号走全程","p":"选一个真实信号(如车速),从总线(CanIf→PduR→Com)到RTE到SWC读取,再反向写一遍——一条信号走通,CP分层就从图变成了实感。"},{"b":"看懂任务映射表","p":"打开OS配置,看每个任务里按什么顺序挂了哪些Runnable、被什么激活(Alarm周期?事件?)——这张映射表就是CP版的「任务清单」,时序问题都从它查起。"},{"b":"工具链走一遍闭环","p":"在EB tresos/DaVinci里改一个周期→重新生成→编译烧录→验证。走通「配置→生成→集成」闭环后,你就从「会RTOS的人」变成了「能干CP活的人」。","trap":"别试图绕开工具手改生成代码——下次生成全部覆盖。所有改动必须落在配置或SWC源码里。"}]}]},

{"k":"sh","name":"伤寒论","en":"SHANGHAN LUN","no":"13","eqLabel":"条文方证速查","flLabel":"辨证思路","lede":"如果说《黄帝内经》回答「人为什么会病」,《伤寒论》就回答「病了怎么开方」——它是中医史上第一部<strong>理法方药齐全的临床操作手册</strong>,被尊为「方书之祖」,书里的方子(经方)沿用一千八百年至今。本科目专为<strong>零基础研读</strong>设计:以<strong>六经辨证</strong>为骨架、<strong>方证对应</strong>为抓手,每条先给原文,再给白话,再给一个能记住的比喻;末章撷取《金匮要略》要方,补上杂病的另一半。建议先读总论与六经总纲立框架,再按太阳→阳明少阳→三阴的顺序走一遍,最后用「经方思维」一章把散珠串成项链。<strong>内容为经典研读笔记,不构成诊疗建议;经方药物多峻猛,切勿据此自行用药。</strong>","M":[{"t":"总论:方书之祖的来历","sub":"一场大疫,催生了中医临床学的开山之作","map":[["作者与时代","张仲景(约150-219);东汉建安年间大疫;「感往昔之沦丧,伤横夭之莫救」"],["原书与流传","《伤寒杂病论》16卷 → 战乱散佚 → 晋·王叔和整理 → 宋代校定分为《伤寒论》与《金匮要略》"],["体量","《伤寒论》398条条文;113方(缺一方);用药不过90余味"],["地位","方书之祖;六经辨证体系的建立者;后世经方派的源头"],["学习路径","六经框架 → 主证主方 → 方证对应 → 类方家族"]],"spine":"读《伤寒论》之前先知道一件事:它不是理论著作,是一位医生在大疫之后写下的「急诊手册」——族人二百多,不到十年死了三分之二,其中七成死于伤寒。所以书里没有玄谈,全是「什么脉、什么证、用什么方、怎么煎、喝完观察什么」——两千年前的循证精神。","g":[{"g":"其书其人","r":[["张仲景","医圣","名机,南阳人,约生于150年。相传举孝廉、官长沙太守,故称「张长沙」。《伤寒杂病论》自序说:宗族二百余口,建安纪年以来未及十年,死者三分之二,「伤寒十居其七」——这本书是从尸山血海里写出来的"],["原书的流散与重编","一书变两书","原书《伤寒杂病论》十六卷,写成不久即逢战乱散佚。西晋太医令王叔和搜集整理出伤寒部分;北宋校正医书局最终定型为两本:《伤寒论》(外感病)与《金匮要略》(杂病)——所以读伤寒必配金匮,才是仲景全貌"],["版本常识","宋本与康平本","通行本为宋本(赵开美刻本),398条、113方。日本传回的康平本等可作校勘参考——初学认准宋本条文号即可(如「第12条桂枝汤」),注家讨论都以此为坐标"],["方书之祖","为什么地位这么高","它第一次把「辨证」和「论治」焊在一起:每条都是「证候→病机→方药」的完整闭环,方子精炼到平均四五味药、剂量煎法服法俱全——后世方剂学的源头活水,「经方」二字专指这里的方"]]},{"g":"这本书凭什么不朽","r":[["六经辨证","把外感病装进六个抽屉","把疾病由表入里、由阳转阴的全过程分为太阳、阳明、少阳、太阴、少阴、厥阴六个阶段(六经)——任何一个外感病走到任何一步,都能在六个抽屉里找到位置和对策。这是中医第一个完整的辨证体系"],["方证对应","有是证,用是方","「桂枝汤证」「柴胡汤证」——证与方直接挂钩,见到这组证候就用这张方,不必绕道玄理。这种「拼图式」的确定性,正是经方派两千年生命力的来源,也是初学者最好的抓手"],["药少而精","平均四五味","113方中,五味药以内的占大半;桂枝汤五味、四逆汤三味、甘草汤一味——每味药都有明确任务,加一味减一味都是新方。学经方=学中医的「最小作战单元」"],["煎服法也是方的一部分","细节见真章","桂枝汤要求:啜热稀粥一升助药力、温覆取微汗、「不可令如水流离」、中病即止、禁生冷酒肉——疗效的一半在这些细节里。读方不读煎服法,等于抄菜谱不看火候"]]},{"g":"与手册其他科目的接线","r":[["承《黄帝内经》","理论→临床","六经之名源于《内经·热论》,但仲景把它从「日传一经」的理论模型改造成活的临床框架——先读过内经科目的六经章,再看伤寒会有「原来如此」之感"],["接方剂学","源头→流变","方剂学里的桂枝汤、小柴胡汤、白虎汤、承气汤全部出自本书——方剂科目讲「怎么组方」,本科目讲「什么时候用」,互为表里"],["通倪师人纪","课程→原典","倪师人纪的《伤寒论》《金匮》两部就是讲这本书——听过课的,本科目是原文补课;没听过的,本科目是听课前的地图"],["怎么学","方证入手,不啃注家","初学路径:记六经提纲 → 背核心方证(约30个) → 用类方家族串联 → 最后才碰注家争鸣。一上来就读注解丛书,是伤寒学习最常见的沉没成本"]]}]},{"t":"六经总纲:一张病位病性地图","sub":"六条提纲背下来,全书有了骨架","fig":"shliujing","map":[["三阳","太阳:表·寒(脉浮头项强痛恶寒);阳明:里·热实(胃家实);少阳:半表半里(口苦咽干目眩)"],["三阴","太阴:里·虚寒(腹满而吐食不下);少阴:心肾虚衰(脉微细但欲寐);厥阴:寒热错杂(消渴气上撞心)"],["传变","循经传:太阳→阳明→少阳→三阴;表里传;直中:外邪不经三阳直入三阴"],["合病并病","两经同时起病=合病;一经未罢又传一经=并病"],["总原则","三阳病多实多热,治以祛邪;三阴病多虚多寒,治以扶正"]],"spine":"六经不是六条经络,而是六个「战局」:太阳是边境遭遇战,阳明是主力决战,少阳是拉锯战;打到三阴,战场已经烧进本土——太阴是后勤崩溃,少阴是统帅病危,厥阴是最后的混战。辨六经,就是判断战争打到了哪一步。","g":[{"g":"三阳:正邪都还有力气","r":[["太阳之为病","脉浮,头项强痛而恶寒","第1条,全书总提纲之一。太阳主一身之表,外邪来袭第一道防线:脉浮(气血趋表迎敌)、头项强痛(太阳经循行部位)、恶寒(卫阳被遏)——记住「有一分恶寒,便有一分表证」。战局:边境遭遇战,敌我皆锐"],["阳明之为病","胃家实是也","第180条。邪入阳明化热成实:「胃家」指整个胃肠。两种打法——经证(白虎汤证:大热大汗大渴脉洪大,热而未结)与腑证(承气汤证:燥屎内结,痞满燥实)。战局:主力决战,火力全开","「实」是关键字:阳明无虚证(基本如此)——见到大虚大寒就不是阳明"],["少阳之为病","口苦,咽干,目眩也","第263条。邪在半表半里,正邪分争:口苦咽干目眩是胆火上炎的信号,加上往来寒热、胸胁苦满、默默不欲饮食、心烦喜呕(小柴胡四大主证)。战局:拉锯战,时进时退——所以寒热「往来」"],["三阳小结","病位一表一里一夹缝","太阳表、阳明里、少阳半表半里;治法对应:汗(解表)、清下(清热攻下)、和(和解)——「汗吐下和」四法的三个用武之地。三阳阶段正气尚足,治疗以祛邪为主"]]},{"g":"三阴:正气开始撑不住","r":[["太阴之为病","腹满而吐,食不下,自利益甚","第273条。脾阳虚衰,运化罢工:肚子胀、吃不下、越拉越厉害、时腹自痛——全是「寒湿困脾」的图景。战局:后勤系统崩溃,前线再打也没粮了。主方:理中汤辈温中散寒"],["少阴之为病","脉微细,但欲寐","第281条,六个字写尽危候。心肾阳衰:脉微细(鼓动无力)、但欲寐(精神萎靡,似睡非睡)——生命之火将熄的画面。战局:统帅病危,全线告急。主方:四逆汤回阳救逆,「急温之,宜四逆汤」","少阴也有热化证(黄连阿胶汤证:心中烦不得卧)——阴虚火旺一路,别把少阴等同于纯寒"],["厥阴之为病","消渴,气上撞心,心中疼热,饥而不欲食","第326条。病至最深层,阴阳错杂、寒热混战:上热(消渴心中疼热)下寒(饥而不欲食,食则吐蛔)。战局:两败俱伤的巷战,寒热虚实搅成一团。主方:乌梅丸寒热并用"],["三阴小结","虚寒为本","太阴脾、少阴心肾、厥阴肝——层层深入,阳气节节败退;治疗以扶正温阳为主,「保住阳气」是三阴阶段的最高纲领。这也是后世扶阳派(倪师一脉推重)的立论根据"]]},{"g":"传变:病是怎么走的","r":[["循经传","太阳→阳明→少阳→太阴→少阴→厥阴","教科书顺序,由表入里、由阳入阴。但临床不是列车时刻表——可以跳站(越经传)、可以停站不走(不传)、也可以两站同时着火(合病)","判断传没传,看证不看天数:「伤寒二三日,阳明少阳证不见者,为不传也」——证候说了算"],["直中","不经三阳,直入三阴","体质虚弱者外邪长驱直入,一病就是三阴证(直中少阴最险)——老人「一场感冒人就没了」的古代解释。提示:虚人外感,起手就要顾护阳气"],["合病与并病","两经纠缠","合病:两经同时起病(如太阳阳明合病,葛根汤);并病:一经未罢又累及一经(如太阳少阳并病)——方随证变,常用合方"],["表里传","互为表里的两经相传","太阳↔少阴(表里),故太阳病误汗伤阳易陷少阴;阳明↔太阴,实则阳明、虚则太阴——同一个胃肠,热实为阳明、虚寒即太阴,一枚硬币的两面"]]}]},{"t":"太阳病:表证的世界","sub":"桂枝汤与麻黄汤——全书的两大门神","map":[["中风与伤寒","中风:汗出恶风脉浮缓(表虚)→桂枝汤;伤寒:无汗恶寒脉浮紧身疼痛(表实)→麻黄汤"],["桂枝汤","桂枝·芍药·炙甘草·生姜·大枣;啜粥温覆取微汗;群方之冠"],["麻黄汤","麻黄·桂枝·杏仁·炙甘草;发汗峻剂;无汗而喘"],["葛根汤","项背强几几+无汗;桂枝汤加葛根麻黄"],["青龙汤","大青龙:外寒内热(不汗出而烦躁);小青龙:外寒内饮(咳喘清稀痰)"]],"spine":"太阳病开篇的第一个大问题是:同样是感冒,为什么有人有汗、有人无汗?有汗=毛孔已开、营卫不和,用桂枝汤「调和」;无汗=毛孔紧闭、寒邪束表,用麻黄汤「破门」。分清这两张方,伤寒论已经入门三分之一。","g":[{"g":"中风与伤寒:第一道岔路","r":[["太阳中风","阳浮而阴弱","第2条:「发热,汗出,恶风,脉缓者,名为中风」——此「中风」非脑卒中,是「被风吹中」。特征是<strong>有汗</strong>:毛孔开着关不上(表虚),营卫不和。像城门坏了关不严,敌人随风进出"],["太阳伤寒","或已发热,或未发热,必恶寒","第3条:「体痛,呕逆,脉阴阳俱紧者,名为伤寒」——特征是<strong>无汗</strong>:寒主收引,毛孔冻得死死的(表实),阳气憋在里面出不去,故身疼痛、发热恶寒俱重。像城门被冰封死,里外不通"],["一字之辨","有汗桂枝,无汗麻黄","这是伤寒论第一口诀。汗与无汗背后是「表虚/表实」之别,用反了都出事:表虚再用麻黄汤峻汗,汗漏不止;表实用桂枝汤,力道不够病不解","「表虚」不是体虚,是「表的开合失灵」——中风患者可以很壮实,别望文生义"],["恶寒·恶风·发热","三个信号的读法","恶寒:加衣被仍怕冷(卫阳被遏);恶风:见风才怕(表已疏);发热:正邪交争。太阳病三者常并见,轻重之别提示表虚表实"]]},{"g":"桂枝汤:群方之冠","r":[["组成与结构","五味药的精密仪器","桂枝三两(辛温通阳,把卫气鼓出去)+芍药三两(酸收敛阴,把营阴拉回来)——一散一收,调和营卫;生姜助桂枝、大枣助芍药、炙甘草居中调和。像修一扇关不严的门:桂枝推、芍药拉,把门轴校正"],["煎服法","疗效的另一半","服药后「啜热稀粥一升余,以助药力」,盖被温覆一时许,取「遍身漐漐微似有汗」——<strong>微汗</strong>即止,「不可令如水流离,病必不除」;一服汗出病愈,停后服,不必尽剂;禁生冷、黏滑、肉面、五辛、酒酪","大汗淋漓=伤了正气还赶不走邪——「发汗要发得温柔」是仲景反复强调的分寸"],["适用之广","不止于感冒","凡「营卫不和」皆可用:无故自汗(第53、54条「病常自汗出」)、产后体虚感冒、体虚人的调理——后世称它「外证得之解肌和营卫,内证得之化气调阴阳」"],["禁忌","酒客与里热","「酒客病,不可与桂枝汤」(湿热内盛者忌甘温);咽喉干燥、淋家、疮家、衄家、亡血家慎汗——桂枝汤虽和缓,仍是汗法"]]},{"g":"麻黄汤与开表诸方","r":[["麻黄汤","破冰船","麻黄(开毛孔)+桂枝(助汗)+杏仁(平喘)+炙甘草:主治「头痛发热,身疼腰痛,骨节疼痛,恶风,无汗而喘」(第35条)——八证俱全的表实图景。发汗峻剂,得汗即止","「无汗而喘」是眼目:毛孔闭死,肺气无处宣泄故喘——汗一出,喘自平。虚人、汗家、心悸者禁用"],["葛根汤","脖子僵的感冒","桂枝汤+葛根+麻黄:「太阳病,项背强几几,无汗恶风」(第31条)——「几几」形容脖子后背僵紧如小鸟伸颈。葛根专解「项背强」,兼升津液。现代常借治风寒感冒初起+颈肩僵痛"],["大青龙汤","外寒内热的憋屈","麻黄汤加倍麻黄+石膏姜枣:「脉浮紧,发热恶寒,身疼痛,不汗出<strong>而烦躁</strong>」(第38条)——表被寒闭、里已化热,人烦躁得像高压锅。发汗最峻之方,「若脉微弱,汗出恶风者,不可服之,服之则厥逆」","「不汗出而烦躁」六字是眼目;误用于表虚人,大汗亡阳——仲景亲自写了警告"],["小青龙汤","外寒内饮的咳喘","麻黄桂枝芍药+干姜细辛五味子半夏炙甘草:「伤寒表不解,心下有水气,干呕发热而咳」(第40条)——外有寒、内有清稀水饮(痰白如泡沫、遇冷即咳)。老慢支、过敏性鼻炎清涕如水者的经典思路"]]}]},{"t":"太阳变证:误治之后的世界","sub":"半部伤寒论,都在教「治坏了怎么办」","map":[["坏病总则","观其脉证,知犯何逆,随证治之——十二字心法"],["痞证","五泻心汤;心下痞,按之濡"],["水证","五苓散:蓄水口渴小便不利;苓桂术甘:心下逆满气上冲胸"],["血证","桃核承气汤:蓄血如狂,少腹急结"],["虚烦与结胸","栀子豉汤:虚烦不得眠;陷胸汤:结胸硬痛"]],"spine":"《伤寒论》最了不起的部分,不是治对了怎么办,而是治错了怎么救——误汗、误下、误吐之后的几十种变局,各有出路。总则十二个字:「观其脉证,知犯何逆,随证治之」。这句话后来成为整个中医临床的座右铭:不管病历多乱,回到眼前的脉证重新出发。","g":[{"g":"总则与虚烦","r":[["坏病十二字诀","观其脉证,知犯何逆,随证治之","第16条。病被误治后不按常规传变,称「坏病」——救法不是查手册对号,而是回到当下脉证重新辨证。这十二个字是全书方法论的浓缩,也是中医临床的总口诀"],["栀子豉汤","虚烦不得眠","误治后「虚烦不得眠,若剧者,必反覆颠倒,心中懊憹」(第76条)——胸中有股说不清的烦热,翻来覆去睡不着(懊憹:烦得抓心挠肝)。栀子+豆豉两味,清宣胸膈郁热——轻巧如拨开一层闷布"],["桂枝甘草汤","叉手自冒心","发汗过多,「其人叉手自冒心,心下悸,欲得按」(第64条)——汗为心之液,过汗伤心阳,心慌得要用手按住才安。桂枝炙甘草两味,辛甘化阳补心阳——两味药也是方,经方之精练如此"]]},{"g":"痞证:五泻心汤","r":[["什么是痞","心下痞,按之濡","误下伤中,邪气内陷:胃脘部堵闷不舒,但按下去是软的(「按之濡」)、不痛——气机痞塞而无实物。与结胸(硬满疼痛拒按)是一软一硬的对照"],["半夏泻心汤","寒热错杂痞·祖方","心下痞+呕+肠鸣下利:寒热错杂于中焦。半夏干姜(辛开)+黄芩黄连(苦降)+参草枣(甘补)——「辛开苦降」法的祖方:像同时用热水和冷水冲开一个堵塞的管道。现代治慢性胃炎、幽门螺杆菌相关胃病常借此思路"],["生姜/甘草泻心汤","兄弟方","生姜泻心汤:痞+干噫食臭(嗳气带食物馊味,水食停滞)——半夏泻心减干姜加生姜;甘草泻心汤:痞+下利日数十行、谷不化(中虚更甚)——重用炙甘草。一家三方,只在一两味药的进退"],["大黄黄连泻心汤","热痞","心下痞+关上脉浮(热邪壅聚):大黄黄连用<strong>麻沸汤浸渍</strong>须臾绞汁——不煎只泡,取其气之轻扬清热消痞,不取其味之重浊攻下。煎法即治法的绝例"],["附子泻心汤","热痞+阳虚","心下痞而复恶寒汗出:三黄泡汁清痞热+附子<strong>另煎</strong>取汁扶阳——一锅之内寒热异治,分煎合服。仲景组方之巧,常在这种地方让人拍案"]]},{"g":"水证与血证","r":[["五苓散","蓄水证","太阳病发汗后「烦渴,小便不利」甚则「水入则吐」(水逆,第71-74条):水停下焦,气化不利——喝了吐、渴却尿少。猪苓茯苓泽泻白术桂枝,化气利水。白话:水管堵在膀胱这段,水积着,上面却喊渴"],["苓桂术甘汤","水气上冲","「心下逆满,气上冲胸,起则头眩,脉沉紧」(第67条):脾阳虚,水饮停在心下,一起身就天旋地转。茯苓桂枝白术炙甘草——温阳化饮的祖方,「病痰饮者,当以温药和之」的具体化。现代常用于内耳眩晕类思路"],["桃核承气汤","蓄血如狂","「热结膀胱,其人如狂,血自下,下者愈……少腹急结」(第106条):热与血结于下焦,人烦躁如狂、小腹拘急硬痛。桃仁大黄芒硝桂枝甘草,破血下瘀——「如狂」提示:瘀热扰心神,精神症状可以从血分论治"],["真武汤(预告)","阳虚水泛","太阳病过汗伤阳也可直接陷入「振振欲擗地」的真武汤证——阳虚水泛,详见少阴章。此处先记:太阳误治的终点站之一,就是少阴"]]},{"g":"结胸与其他","r":[["大陷胸汤","结胸","误下太早,热与水结于胸膈:「心下痛,按之石硬」「从心下至少腹硬满而痛不可近」(第135-137条)——与痞的「按之濡」相对,这是硬满剧痛拒按。大黄芒硝甘遂,峻药攻逐——峻剂治重证,中病即止"],["小陷胸汤","小结胸","「正在心下,按之则痛,脉浮滑」:范围小、按才痛——痰热互结的轻版。黄连半夏瓜蒌实,清热化痰开结。现代常借治痰热胸痛胃痛"],["炙甘草汤","脉结代,心动悸","「伤寒,脉结代,心动悸,炙甘草汤主之」(第177条):气血阴阳俱虚,心脏失养,脉跳一跳停一停。炙甘草人参桂枝生姜+生地麦冬阿胶麻仁大枣,清酒同煎——通阳复脉、滋阴养血,后世治心律失常的祖方,又名「复脉汤」"]]}]},{"t":"阳明与少阳:清、下、和三法","sub":"白虎·承气·柴胡——三大名方阵地","map":[["阳明经证","白虎汤:大热·大汗·大渴·脉洪大;热而未结"],["阳明腑证","三承气汤:痞满燥实;急下存阴"],["发黄","茵陈蒿汤:瘀热在里,身黄如橘子色"],["少阳主方","小柴胡汤:往来寒热·胸胁苦满·默默不欲饮食·心烦喜呕;但见一证便是"],["少阳兼证","大柴胡:兼里实;柴胡桂枝:兼表;柴胡加龙牡:兼烦惊"]],"spine":"阳明与少阳是两种完全不同的战争:阳明是敌人在开阔地列阵,正面强
