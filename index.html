攻——热盛用清(白虎),结实用下(承气);少阳是敌人卡在关隘,强攻不得——汗之不可(不在表)、下之不可(不在里),只能「和解」,派小柴胡汤去谈判。","g":[{"g":"阳明经证:白虎汤","r":[["四大症","大热·大汗·大渴·脉洪大","阳明气分热盛,热势弥漫全身而未成结:高热、汗如蒸笼、渴饮不止、脉来如洪水。白虎汤(石膏知母粳米炙甘草)辛寒清热——像给烧红的炉膛泼一瓢雪水"],["白虎加人参汤","热盛伤气津","四大症+「时时恶风」「背微恶寒」(气津已伤):白虎加人参益气生津。糖尿病消渴的经典借用思路之一"],["使用界线","表不解不可与","「其表不解,不可与白虎汤」——还有恶寒表证时误用寒凉,冰伏其邪。石膏虽好,认准「热在气分、表已全解」再出手"]]},{"g":"阳明腑证:三承气汤","r":[["腑实的图景","痞满燥实","热与肠中糟粕结成燥屎:痞(堵)、满(胀)、燥(屎干)、实(拒按)+潮热谵语、手足濈然汗出、腹满痛绕脐痛。热被实裹住,不下不解"],["大承气汤","峻下·四症俱全","大黄芒硝枳实厚朴:痞满燥实俱备、潮热谵语者用之。「急下存阴」三证(第252-254条):热实烧灼津液危在旦夕时,下之反而是救阴——攻下即抢救,时机就是生命","先煎枳朴后下大黄、芒硝溶服——煎法保攻力;「得下,余勿服」中病即止"],["小承气·调胃承气","轻重两档","小承气(去芒硝):痞满实而燥不甚,轻下;调胃承气(去枳朴加甘草):燥实而无痞满,和胃缓下——三承气按「结的程度」分档,不是随便选"],["茵陈蒿汤","阳明发黄","「瘀热在里,身必发黄」——身黄如橘子色、小便不利、腹微满。茵陈栀子大黄,清热利湿退黄:湿热黄疸的千年祖方,现代肝胆病治疗仍在化裁使用"]]},{"g":"少阳:小柴胡汤的天下","r":[["小柴胡汤证","四大主证","往来寒热(正邪拉锯)、胸胁苦满(少阳经气郁滞)、默默不欲饮食(胆热犯胃)、心烦喜呕——加提纲的口苦咽干目眩,便是少阳全图。柴胡黄芩(解郁清胆)+半夏生姜(和胃止呕)+参草枣(扶正),七味成方"],["但见一证便是","不必悉具","第101条:「伤寒中风,有柴胡证,但见一证便是,不必悉具」——四大主证不必凑齐,抓住一个典型证即可出方。这是方证对应「抓主证」思想的经典表达","「一证」指特征性证(如往来寒热、胸胁苦满),不是随便什么症状都算——抓主证≠抓到篮里都是菜"],["和解之法","三禁","少阳病禁汗、禁吐、禁下(邪不在表不在里,误治徒伤正气)——只能和解:扶正达邪,调枢机。少阳如门轴(枢),小柴胡就是给门轴上油"],["妇人热入血室","经期感冒的名条","「妇人中风……经水适断……如疟状,发作有时」——经期外感,邪乘虚入血室(胞宫),寒热如疟、暮则谵语,小柴胡汤主之。妇科借用极多的名条文"]]},{"g":"柴胡类方","r":[["大柴胡汤","少阳+阳明","往来寒热胸胁苦满+「呕不止,心下急,郁郁微烦」+便秘:少阳未解又兼里实。小柴胡去参草+大黄枳实芍药——和解与轻下并行。现代胆囊炎、胰腺炎思路常见其影"],["柴胡桂枝汤","少阳+太阳","发热微恶寒、肢节烦疼(表未罢)+微呕心下支结(少阳):小柴胡与桂枝汤各取其半——合方治合病的示范作"],["柴胡加龙骨牡蛎汤","少阳+烦惊","「胸满烦惊,小便不利,谵语,一身尽重」(第107条):少阳枢机不利兼心神浮越。小柴胡加龙牡铅丹(今多不用铅丹)桂苓大黄——镇惊安神。现代常借治焦虑、失眠、惊恐类思路"],["柴胡桂枝干姜汤","少阳+太阴","胸胁满微结、口渴、但头汗出、往来寒热心烦——少阳有热兼太阴虚寒(胆热脾寒)。柴胡黄芩+桂枝干姜天花粉牡蛎炙甘草——寒温并用,「上热下寒」体质的常用思路"]]}]},{"t":"三阴病:保住阳气的战争","sub":"理中·四逆·乌梅丸——虚寒世界的三张王牌","map":[["太阴","理中汤(丸):温中散寒;自利不渴者属太阴"],["少阴寒化","四逆汤:回阳救逆;真武汤:阳虚水泛;附子汤:阳虚身痛"],["少阴热化","黄连阿胶汤:心中烦不得卧"],["少阴咽痛","猪肤汤·甘草汤·桔梗汤"],["厥阴","乌梅丸:寒热错杂蛔厥;当归四逆:血虚寒厥;白头翁:热利下重"]],"spine":"三阴病的主旋律只有一句:阳气还剩多少?太阴丢的是脾阳(消化的火),少阴丢的是心肾之阳(生命的火种),厥阴则是残阳与邪气的最后缠斗。所以三阴的方,姜、附、参轮番上阵——扶阳,是贯穿三阴篇的总纲。","g":[{"g":"太阴:脾阳的沦陷","r":[["辨证眼目","自利不渴者,属太阴","第277条:「以其藏有寒故也,当温之,宜服四逆辈」——拉肚子但不渴(寒湿,非热利),是太阴的招牌。腹满时痛、喜温喜按,一派虚寒"],["理中汤(丸)","温中祖方","人参白术干姜炙甘草:干姜温中散寒、参术草健脾益气——中焦的火重新点起来,运化自动恢复。丸剂缓图、汤剂速效,「腹中未热,益至三四丸」——服后腹中觉热为起效标志"],["桂枝加芍药汤","太阴腹痛","「本太阳病,医反下之,因尔腹满时痛者,属太阴也」——误下伤脾,桂枝汤芍药加倍,和络缓急止痛;痛甚加饴糖即小建中汤方向"]]},{"g":"少阴寒化:生死线上的方","r":[["四逆汤","回阳救逆第一方","附子干姜炙甘草三味:主「四肢厥逆,恶寒蜷卧,下利清谷,脉微欲绝」——手脚凉过肘膝、拉出未消化食物、脉摸不太到,生命之火将熄。附子生用、干姜守中,炙甘草缓峻——三味药,是中医的「电击除颤」","「病皆与方相应者,乃服之」——四逆汤是救命方也是烈药,现代使用附子必须久煎、遵医嘱,严禁自行试药"],["通脉四逆汤","阴盛格阳","四逆证+「身反不恶寒,其人面色赤」——寒极于内,把残阳格拒于外,反见面红身热(假热)。四逆汤加重姜附剂量,破阴回阳——认不出「真寒假热」,一剂凉药就是催命符。厥论「热深厥深」的镜像"],["真武汤","阳虚水泛","「心下悸,头眩,身瞤动,振振欲擗地」(第82条)/「腹痛,小便不利,四肢沉重疼痛,自下利」(第316条):肾阳虚,水无所主,泛滥为患——心慌头晕、肌肉跳动、站立不稳如要扑倒。附子温阳+苓术利水+芍药生姜——北方水神「真武」镇水之名,恰如其分。现代心衰水肿的经典借鉴思路"],["附子汤","阳虚身痛","「身体痛,手足寒,骨节痛,脉沉者」:阳虚寒湿浸渍筋骨。附子(倍量)人参苓术芍——与真武汤仅一味之差(人参易生姜),主治重心从「水泛」移到「痛与虚」——经方一味药之差即是两个世界"],["少阴急下三证","存阴","少阴篇也有大承气汤急下三条(320-322):热邪伤津太急,「口燥咽干」即下——虚人患实证,救津液如救火。三阴篇里藏着阳明法,提醒:六经是活的"]]},{"g":"少阴热化与咽痛","r":[["黄连阿胶汤","心中烦,不得卧","第303条:少阴热化,阴虚火旺——心火在上烧、肾水在下亏,烦躁到躺不住。黄连黄芩清心火+阿胶鸡子黄芍药滋肾阴——「泻南补北」交通心肾。顽固失眠的经典思路之一","鸡子黄要等药汁稍凉再搅入(「小冷,内鸡子黄」)——煎服法里全是细节"],["猪苓汤","阴虚水热互结","「咳而呕渴,心烦不得眠」+小便不利:阴虚有热兼水停。猪苓茯苓泽泻+滑石阿胶——利水而不伤阴,与五苓散(气化不利)对照记忆"],["少阴咽痛诸方","一味药也是方","咽痛轻者甘草汤(生甘草一味);不差者桔梗汤(加桔梗);猪肤汤润燥利咽——咽喉是少阴经循行处,少阴病常见咽痛,仲景连咽痛都分层处理"]]},{"g":"厥阴:寒热错杂的终局","r":[["乌梅丸","蛔厥·久利","「蛔厥者,其人当吐蛔……乌梅丸主之。又主久利」(第338条):上热下寒,蛔虫不安其位(古时肠道蛔虫遇寒上窜)。乌梅(酸敛安蛔)+黄连黄柏(清上热)+附子干姜桂枝细辛椒(温下寒)+参归(补虚)——十味药寒热酸辛甘并投,乱局用「杂方」,以杂治杂。现代借治溃疡性结肠炎等寒热错杂久利"],["当归四逆汤","血虚寒厥","「手足厥寒,脉细欲绝者」(第351条):血虚受寒,四肢冰凉+脉细如丝(与四逆汤的阳衰脉微不同——这是「血管里的血不够又遇冷收缩」)。当归桂枝芍药细辛通草甘草大枣——养血温经通脉。现代冻疮、雷诺现象类思路的祖方"],["白头翁汤","热利下重","「热利下重者,白头翁汤主之」(第371条):湿热痢疾——里急后重、下利脓血、渴欲饮水。白头翁黄连黄柏秦皮,清热凉血止痢——厥阴篇里的纯热证,再次提醒:厥阴是寒热混战区,两头都有"],["厥的辨证","凡厥者,阴阳气不相顺接","「厥者,手足逆冷者是也」(第337条)——但厥分寒厥(四逆辈)、热厥(白虎/承气)、血虚厥(当归四逆)、痰厥、蛔厥……手脚凉是「果」,断「因」才能出方——与内经厥论一脉相承"]]}]},{"t":"经方思维:方证对应的功夫","sub":"从「背方子」到「会用方」的那一步","fig":"shguizhi","map":[["方证对应","有是证,用是方;抓主证,不必悉具"],["药证","桂枝证·柴胡证·附子证——药与证的直接挂钩"],["类方家族","桂枝汤族;麻黄汤族;柴胡汤族;承气汤族;四逆汤族;泻心汤族"],["加减法则","病进一分,药进一味;倍芍药、加附子、去芍药各有指征"],["经方与时方","经方:药少力专结构严;时方:后世灵活加减"]],"spine":"经方的学法不是背113个孤立的方,而是认识几个「家族」:桂枝汤生出二十多个变方,柴胡汤、承气汤、四逆汤各成一族——记住族长(主方)和每个孩子改了哪味药、为什么改,一百多个方就变成了五六棵树。","g":[{"g":"方证对应:经方的核心算法","r":[["有是证,用是方","确定性的来源","经方的用法不是「根据理论推导」,而是「证候拼图匹配」:见「往来寒热+胸胁苦满」即小柴胡,见「汗出恶风脉浮缓」即桂枝汤——证与方之间是两千年验证过的映射表。先匹配,后说理,是经方派与理论派的分野"],["抓主证","但见一证便是","每张方都有一两个「特征证」:大青龙的「不汗出而烦躁」、真武的「振振欲擗地」、栀子豉的「心中懊憹」——主证如指纹,认出指纹即可锁定;次证用来核对与排除","抓主证的前提是先分六经定大方向——跳过六经直接对症状,容易「按图索骥」抓错"],["排除法同样重要","禁忌条文","仲景写「可与」也写「不可与」:表不解不可白虎、酒客不可桂枝、脉微弱不可大青龙——每张方的「负面清单」和主治同等重要,这正是安全性所在"]]},{"g":"药证:更小的积木","r":[["桂枝证·芍药证","一味药一个信号","后世(如日本古方派、胡希恕一脉)提炼「药证」:桂枝主气上冲,芍药主挛急痛,柴胡主胸胁苦满,附子主脉微恶寒,大黄主腹满实痛——方证之下再拆一层,加减便有了依据"],["剂量即信息","同方不同量=不同方","桂枝汤芍药加倍=桂枝加芍药汤(治腹痛);再加饴糖=小建中汤(温中补虚)——药味没变,剂量一动,主治全变。经方的剂量结构是方义的一部分,不可随手增减"],["煎服法承载药效方向","泡·煎·先下·后下","大黄黄连泻心汤沸水泡(取气清痞)vs承气汤煎服(取味攻下);附子回阳生用、止痛炮用——同一味药,炮制煎法不同,走向完全不同"]]},{"g":"类方家族(配图:桂枝汤家族树)","r":[["桂枝汤族","群方之冠的子孙","加葛根=项背强;加附子=汗漏不止阳虚;去芍药=脉促胸满;加厚朴杏子=兼喘;倍芍药=腹满时痛;倍芍加饴=小建中(虚劳里急);加龙牡=惊悸遗精——一张方随一个证素进退一味,像族谱一样清晰"],["柴胡汤族","枢机一族","小柴胡为祖:+大黄枳实=大柴胡(兼里实);+桂枝=柴胡桂枝(兼表);+龙牡=柴胡加龙牡(兼烦惊);+干姜牡蛎=柴胡桂枝干姜(兼太阴寒)——把「少阳兼X」全部覆盖"],["承气家族与四逆家族","攻与救两族","承气族按痞满燥实的组合分大/小/调胃三档;四逆族按阳衰程度分四逆→通脉四逆→通脉四逆加猪胆汁(阴阳离决前最后一搏),再旁及真武、附子汤——攻邪与救阳,各有梯度,像药物的「剂量爬梯」"],["记忆策略","背树不背叶","先背六个族长(桂枝、麻黄、柴胡、白虎、承气、四逆)+泻心,再记每族的分支「改了哪味、对应哪证」——113方瞬间收敛为「6+1棵树」。这也是复习时自测的框架:默画家族树"]]},{"g":"经方的现代视角","r":[["经方vs时方","两种风格","经方:药少(平均4-5味)、量明、结构严密如公式;时方(宋以后):药多而灵活、面面俱到。不必站队——经方练「准」,时方练「全」,方剂学科目里两者都有"],["剂量之谜","一两等于几克","汉代一两约合今13.8g,按此桂枝汤剂量远大于现代常用量——学界长期争议(有「重剂起沉疴」派与谨慎派)。初学记住:古方剂量结构(比例)比绝对值更重要,实际用量遵现代规范与医嘱","这也是「切勿自行抓药」的原因之一:剂量、炮制、煎法、禁忌,每一环都有专业门槛——附子乌头类更是性命攸关"],["现代研究的注脚","参考","小柴胡汤、半夏泻心汤、真武汤等在日本汉方与国内均有大量临床研究;葛根汤、麻杏石甘汤在流感研究中屡被检验——经典不靠情怀续命,靠的是可重复的临床有效性(当然,证据等级参差,保持科学审慎)"]]}]},{"t":"金匮要略撷要:杂病的另一半","sub":"外感之外,内伤杂病的开山之作","map":[["总纲","上工治未病:见肝之病,知肝传脾,当先实脾;五脏元真通畅,人即安和"],["胸痹","瓜蒌薤白白酒汤类:胸痹心痛,喘息咳唾"],["虚劳","小建中汤;肾气丸;酸枣仁汤"],["痰饮","病痰饮者,当以温药和之;苓桂术甘汤"],["妇人病","当归芍药散;温经汤;甘麦大枣汤"]],"spine":"《金匮要略》与《伤寒论》本是一书:伤寒讲外感的「纵向传变」,金匮讲杂病的「横向分科」——二十五篇按病分门,从胸痹、虚劳、痰饮到妇人病,是中医内科学、妇科学的共同祖先。此章撷取最常用的骨干方,作为进入金匮的门票。","g":[{"g":"总纲名句","r":[["上工治未病","见肝之病,知肝传脾,当先实脾","第一篇第一条:高手治病,治的是「还没病的地方」——肝病会传脾(木克土),所以治肝先把脾护住。既是治疗学总纲(截断传变),也与内经「治未病」一脉双流"],["五脏元真通畅,人即安和","健康的定义","「若五脏元真通畅,人即安和;客气邪风,中人多死」——脏腑真气通畅就是健康;并提出病因三条路径(经络受邪入脏腑/四肢九窍血脉壅塞/房室金刃虫兽)——后世「三因学说」的雏形"],["四季脾旺不受邪","脾胃的地位","「四季脾旺不受邪,即勿补之」——脾气旺盛则百邪难入,这句与「实脾」呼应,是后世补土派(李东垣)的种子"]]},{"g":"胸痹与心痛","r":[["胸痹总纲","阳微阴弦","「夫脉当取太过不及,阳微阴弦,即胸痹而痛」——上焦阳虚(阳微)+下焦阴寒上乘(阴弦):胸中阳气不振,阴邪占据阳位。冠心病胸痛的经典中医模型"],["瓜蒌薤白三方","通阳散结梯队","瓜蒌薤白白酒汤(胸痹喘息咳唾、胸背痛)→瓜蒌薤白半夏汤(痛甚不得卧,加半夏)→枳实薤白桂枝汤(胸满胁下逆抢心,加枳朴桂)——薤白通胸阳、瓜蒌开胸结,按痰浊轻重列成三档"],["人参汤与橘枳姜汤","虚实两途","同是胸痹:属虚寒者人参汤(即理中汤)温补;属气滞者橘枳姜汤行气——「同病异治」的金匮示范"]]},{"g":"虚劳与失眠","r":[["小建中汤","虚劳里急","「虚劳里急,悸,衄,腹中痛,梦失精,四肢酸疼,手足烦热,咽干口燥」——一堆看似矛盾的虚象(又冷又热又痛又烦),根子是中焦虚、阴阳两不足。桂枝汤倍芍药加饴糖——「建中」:把中焦这个「兵工厂」重建起来,气血自生。体虚儿童、慢性疲劳的经典思路","甘温除热:手足烦热、咽干反用温药——虚人的「热」是虚性亢奋,滋补反而退热。反直觉,但这正是辨证的深度"],["肾气丸","虚劳腰痛·消渴·痰饮","「虚劳腰痛,少腹拘急,小便不利者,八味肾气丸主之」——地黄山药山萸+茯苓泽泻丹皮+桂枝附子:六味滋阴打底,一点桂附「少火生气」——微微之火温煦全局,后世六味地黄丸即由此减桂附而来。金匮里它一方治五病(脚气、虚劳、痰饮、消渴、转胞),异病同治的典范"],["酸枣仁汤","虚烦不得眠","「虚劳虚烦不得眠,酸枣仁汤主之」:肝血不足、虚热内扰——累却睡不着。酸枣仁(重用)+知母茯苓川芎甘草——养肝血清虚热,与黄连阿胶汤(阴虚火旺)、栀子豉汤(郁热)构成失眠三方鼎立"]]},{"g":"痰饮·水气·妇人病","r":[["痰饮总纲","当以温药和之","「病痰饮者,当以温药和之」——水饮属阴邪,得温则化;通治方向不是猛攻猛利,而是温药「和」之(苓桂术甘汤为代表)。慢性水饮病(慢支、心衰水肿、胃内停水)的总战略"],["四饮分类","痰饮·悬饮·溢饮·支饮","水停肠胃为痰饮、停胁下为悬饮(十枣汤)、溢于四肢为溢饮(大小青龙)、停胸膈迫肺为支饮(葶苈大枣泻肺汤等)——按水停的位置分型定治,古人版的「积液定位诊疗」"],["当归芍药散","妇人腹痛","「妇人怀妊,腹中㽲痛」「妇人腹中诸疾痛」:肝脾不和、血水互结——当归芍药川芎(和血)+苓术泽泻(利水):血水同治。日本汉方妇科第一常用方,痛经、妊娠腹痛的经典思路"],["温经汤","冲任虚寒兼瘀","「妇人年五十所,病下利(下血)数十日不止,暮即发热,少腹里急,腹满,手掌烦热,唇口干燥」——冲任虚寒、瘀血内停:吴茱萸桂枝当归川芎芍药丹皮+胶麦参草姜夏——温清消补一炉,更年期崩漏、月经不调的名方"],["甘麦大枣汤","脏躁","「妇人脏躁,喜悲伤欲哭,象如神灵所作,数欠伸」——无故悲伤想哭、呵欠连连(今视角近焦虑抑郁、癔症样表现)。甘草小麦大枣三味食材成方——以「粮食」养心安神,温柔到极点的一张方"]]}]},{"t":"研读与应用:把伤寒论读成活书","sub":"版本·注家·背诵清单·安全边界","map":[["读本选择","宋本条文为纲;白话本入门;注家为镜"],["注家地图","柯琴《来苏集》;尤在泾《贯珠集》;近人:胡希恕·刘渡舟·郝万山;倪师人纪"],["背诵清单","六经提纲6条+核心方证约30条"],["学习闭环","读条文→画家族树→方剂学对照→倪师课程印证"],["安全边界","经方峻猛;附子乌头麻黄有毒性风险;不自行用药"]],"spine":"伤寒论的读法古人早有定论:「白文(原文)读千遍,其义自见」——但现代人更高效的路径是三步走:先用白话本把398条通读一遍知其大概,再用家族树把方证串起来,最后带着问题去翻注家。注家是镜子,照的还是原文。","g":[{"g":"读本与注家","r":[["第一本书怎么选","白话入门+原文对照","入门选带白话串讲的本子(如郝万山《伤寒论讲稿》即其讲课整理);案头备一本宋本原文(条文编号版)——一切讨论都锚定条文号,这是伤寒学界的「坐标系」"],["古代注家两座峰","柯琴与尤在泾","柯琴《伤寒来苏集》:以方类证,「六经为百病立法」——把伤寒论从外感专书解放为通治百病之书;尤在泾《伤寒贯珠集》:以治法类证,条理最清。二选一深读即可"],["近现代三家","胡希恕·刘渡舟·倪海厦","胡希恕:方证对应+八纲解六经(「六经来自八纲」),经方实战派宗师;刘渡舟:脏腑经络解伤寒,学院派集大成;倪师人纪:以针药并用、扶阳视角讲伤寒——三家角度不同,恰好互补。听倪师课的,建议配胡希恕讲records对照,视角立体"],["日本古方派","他山之石","吉益东洞「万病一毒」、汤本求真《皇汉医学》:极端的方证对应路线,弃病机只认方证——矫枉过正,但其「腹诊」技术与药证研究值得借鉴"]]},{"g":"背诵清单(最小必背集)","r":[["六经提纲","6条","太阳(1)、阳明(180)、少阳(263)、太阴(273)、少阴(281)、厥阴(326)——本科目第2章已逐条讲过,先背这6条,六经地图就钉在脑子里了"],["太阳核心","约12条","桂枝汤(12·13)、麻黄汤(35)、葛根汤(31)、大青龙(38)、小青龙(40)、五苓散(71)、苓桂术甘(67)、栀子豉(76)、半夏泻心(149)、小陷胸(138)、桃核承气(106)、坏病总则(16)"],["阳明少阳","约8条","白虎加人参(26/168)、大承气(208/242)、急下存阴(252-254择一)、茵陈蒿(236)、小柴胡(96·101)、大柴胡(103)"],["三阴与金匮","约10条","理中(386·太阴277)、四逆(323)、真武(82/316)、黄连阿胶(303)、乌梅丸(338)、当归四逆(351)、白头翁(371);金匮:治未病、胸痹总纲、痰饮温药和之、虚劳小建中——合计三十余条,构成「最小可运转」的伤寒知识核"],["背法","条文+方歌双轨","条文背原文(定证),方歌背组成(定药)——方剂学科目的方歌直接复用;每天早晚各过一族(家族树顺序),两周一轮"]]},{"g":"学习闭环与应用边界","r":[["四步闭环","读→画→对→印","①读条文(白话先行)②画家族树(默画自测)③方剂学对照(组成功效主治)④倪师课程/医案印证(看活的用法)——四步转完一圈,知识就从纸面立起来了"],["医案是最好的老师","从案例反推","读医案时先盖住处方,自己按六经辨证推一遍再对答案——《经方实验录》(曹颖甫)、胡希恕医案都是极好的练习册"],["安全边界","再强调一次","经方多峻药:附子乌头有心脏毒性、麻黄升压、大黄芒硝伤正、甘遂峻毒——剂量炮制煎法俱是专业门槛。本科目的定位是「读懂」而非「使用」:身体有恙,找执业中医师;学习验证,从医案与跟诊开始","「学了几个方就给家人开药」是中医爱好者最危险的阶段——半瓶水的自信,比无知更危险(参考:桂枝下咽,阳盛则毙——仲景自己的警告)"],["与考试的关系","如果考研考经典","中医考研涉及伤寒者,本科目的条文号与方证是骨架,细化背诵按考纲增补——但先有骨架再填肉,永远比零散背题快"]]}]}],"F":[{"t":"六经辨证:拿到外感第一步","when":"任何外感病(感冒发热类)想用伤寒论框架分析时","s":[{"b":"先定表里","p":"问:恶寒吗?脉浮吗?——「有一分恶寒,便有一分表证」。恶寒+脉浮+头身痛=病在表(太阳);但热不寒、口渴便结=病入里(阳明);寒热往来=卡在半表半里(少阳)。"},{"b":"再定虚实(阴阳)","p":"精神与脉是分水岭:烦躁高热脉有力=三阳(正气足,打得起来);萎靡蜷卧脉微细=三阴(正气溃,先救阳)。","f":[["精神尚可,脉有力","走三阳路线,继续下一步"],["但欲寐,脉微细","直接按少阴处理,「急温之」——别再纠结表证"]]},{"b":"三阳内部细分","p":"太阳:再分有汗(桂枝汤证)无汗(麻黄汤证);阳明:再分经证(白虎:大热大汗大渴)腑证(承气:痞满燥实);少阳:抓「口苦咽干目眩+往来寒热+胸胁苦满」任一主证。"},{"b":"查兼夹与变证","p":"兼项背强→葛根;兼喘→加厚朴杏子;兼烦躁→大青龙;兼水饮咳喘→小青龙;误治后出现痞、悸、眩、烦——转入变证各方,用「观其脉证,知犯何逆,随证治之」。"},{"b":"落方后核对禁忌","p":"对照该方的「不可与」清单(表不解不可白虎、脉微弱不可大青龙、酒客不可桂枝……)——匹配主证之后,永远再走一遍排除法。","trap":"本流程是研读与分析框架——实际用药请找执业中医师。学习者的正确用法:拿身边的感冒案例在纸上推演,再看医生怎么开,对答案。"}]},{"t":"读懂一条条文","when":"面对任何一条原文时的拆解方法","s":[{"b":"先断结构","p":"仲景条文的标准结构:「病名/前提+脉+证+方」——例:「太阳病(前提),头痛发热,汗出恶风(证),桂枝汤主之(方)」。先把四段切开,再逐段读。"},{"b":"抓「眼目」二字","p":"每条常有一两个决定性的字:大青龙的「烦躁」、真武的「振振欲擗地」、栀子豉的「懊憹」、小柴胡的「往来」——找到眼目,这条就记住了一半。"},{"b":"查「主之/宜/可与」的分量","p":"「主之」=对证主方,拿准了;「宜」=较合适;「可与/不可与」=斟酌与禁忌——仲景用词的确定度分三档,读出分寸感。","f":[["主之","方证关系最铁,优先背"],["宜/可与","参考性条文,理解即可"]]},{"b":"对比前后条文","p":"伤寒条文常成对出现:12条桂枝汤对35条麻黄汤(有汗无汗)、痞对结胸(濡对硬)、白虎对承气(散热对结实)——单条记不住的,拉出对照条一起看,差异处即考点。"},{"b":"落到家族树上","p":"读完问:这条的方属于哪个家族?与族长差几味药?为什么差?——把新条文挂上已有的树,而不是另立山头。","trap":"不要第一遍就钻注家分歧(「此条柯琴认为…尤在泾认为…」)——先让仲景自己说话,读三遍原文再开注家。"}]},{"t":"方证对应实操(纸上推演)","when":"拿一个医案或身边病例做伤寒式分析练习时","s":[{"b":"收集四诊拼图","p":"按「寒热·汗·头身·胸腹·饮食·二便·口渴·睡眠·精神+脉舌」十项过一遍,把散乱的症状收成一张清单——信息不全的项,标注「缺」。"},{"b":"六经定位","p":"用上一套流程(表里→虚实→细分)把病例放进六经地图,得出「太阳表实」「少阳兼里实」这样的定位。"},{"b":"候选方匹配主证","p":"在该经的方阵里找主证吻合度最高的方:逐条核对「该方的特征证有没有出现」,列出支持项与矛盾项。","f":[["主证吻合,无矛盾项","初步锁定"],["有矛盾项","矛盾项往往提示兼夹或变证——考虑合方或家族内换方"]]},{"b":"禁忌与体质核查","p":"过该方的负面清单+病人体质(虚人?孕妇?酒客?)——经方的安全性一半写在禁忌条文里。"},{"b":"对答案与复盘","p":"医案:揭开原处方对照,分析差异(他为什么加这味?);真实病例:看执业医师处方印证。把推演错误记入错题——方证对应的功夫全在复盘里长。","trap":"推演≠处方。这个流程练的是「伤寒式思维」,不是发处方权——落到真实用药,永远是执业医师的事。"}]},{"t":"用家族树背方剂","when":"记不住一百多个方,或复习自测时","s":[{"b":"先立六族一系","p":"六个族长:桂枝汤、麻黄汤、小柴胡汤、白虎汤、大承气汤、四逆汤;外加泻心汤系——先把七个「根方」的组成、主证、病机背到脱口而出。"},{"b":"每族画树","p":"以族长为根,每个变方标两样:改了哪味药+对应新增哪个证——如桂枝汤「+葛根=项背强」「+附子=汗漏不止」。一张A4纸画一族。"},{"b":"每日两族,循环过","p":"早晚各默画一族(不看书画,画完对照补漏)——两周一个循环;画错的分支用红笔标记,下轮优先。"},{"b":"跨族横向对比","p":"定期做横向题:同是咳喘,小青龙vs麻杏石甘vs苓桂术甘怎么分?同是下利,理中vs四逆vs白头翁vs甘草泻心怎么分?——横向鉴别是从「背下来」到「用得出」的桥。","f":[["答得出鉴别点","该组过关"],["混淆","回到各方的「眼目」重新抓特征证"]]},{"b":"挂载金匮方","p":"金匮骨干方按同法挂树:小建中挂桂枝族、苓桂术甘挂痰饮系、肾气丸自成滋补一系——两书一张网,复习一体化。","trap":"家族树背的是「结构」,方歌背的是「组成」——两者并行,别用一个替代另一个;只背方歌不画树,方子永远是散珠。"}]}]},

{"k":"cb","name":"车载总线","en":"AUTOMOTIVE BUS","no":"14","eqLabel":"协议速查","flLabel":"联调与排障","lede":"一辆车上百个控制器,靠什么互相说话?答案是<strong>车载总线</strong>——CAN 是当家四十年的主力,LIN 管便宜的末梢,车载以太网正在接管大流量,UDS 诊断协议则是售后与刷写的通用语言。这门课从「为什么需要总线」讲起,把 <strong>CAN 从电平讲到 DBC</strong>、把 <strong>UDS 从会话讲到刷写</strong>、把<strong>车载以太网从 100BASE-T1 讲到 SOME/IP</strong>,配整套测试排障方法——与嵌入式操作系统科目的 AUTOSAR 章互相接线:那边讲软件架构怎么分层,这边讲报文在线上怎么跑。面向<strong>零总线基础</strong>的读者,深度按车规工程实战给足。","M":[{"t":"总论:汽车为什么需要总线","sub":"从一捆铜线的噩梦说起","fig":"cbnet","map":[["没有总线的世界","点对点接线:n个设备两两互联,线束爆炸"],["总线的本质","一对线大家共用;用「协议」决定谁说话、说什么、错了怎么办"],["车内网络全景","动力/底盘:CAN·CAN FD;车身末梢:LIN;智驾座舱:以太网;诊断:UDS"],["E/E架构演进","分布式ECU → 域集中 → 中央计算+区域控制器"],["学习路径","CAN物理层→帧与仲裁→DBC信号→诊断UDS→LIN→以太网→测试排障"]],"spine":"上世纪八十年代的豪华车,线束重达几十公斤、接点上千个——每加一个功能就要拉一把新线。博世发明 CAN 总线的初衷朴素至极:让所有控制器共用一对线说话。从此「加功能」变成了「加报文」,汽车电子的大厦才盖得起来。","g":[{"g":"为什么需要总线","r":[["线束爆炸问题","n×(n-1)/2","点对点接线,10个ECU两两互联要45条线路;总线只要一对线挂10个节点。线束是整车第三重的部件(仅次于车身和发动机)——总线直接省的是重量、成本和故障点"],["总线的三个基本问题","协议就是答案","共用一对线,立刻要回答:①谁有权说话(仲裁/调度)②说的内容怎么组织(帧格式)③听错了怎么办(校验与错误处理)——任何总线协议,本质都是这三题的答案。带着这三问学CAN,结构自然清晰"],["车规的特殊要求","恶劣环境下的可靠","发动机舱-40~125°C、点火系统强电磁干扰、安全件毫秒级实时——所以车载总线的设计哲学是「可靠压倒带宽」:CAN只有1Mbps,但错误检测能力冠绝同侪"],["广播与事件","车载通信的基本形态","CAN是广播式:每帧发到线上人人可听,靠ID过滤各取所需——「车速」发一次,仪表、ABS、导航都能用。这和点对点的TCP思维完全不同,是理解DBC与网关的前提"]]},{"g":"车内网络全景图(配图)","r":[["动力/底盘域","CAN / CAN FD","发动机、变速箱、ABS/ESP、转向——毫秒级实时、安全关键,500kbps CAN 或 2-5Mbps CAN FD;通常独立成段并做网关隔离"],["车身域","CAN(低速)+ LIN","车门、车窗、灯光、空调:实时性要求低。骨干用125-250kbps车身CAN,末梢(车窗电机、雨刮、按键板)用更便宜的LIN——一分钱一分货的分层"],["智驾/座舱域","车载以太网","摄像头视频流、激光雷达点云、高精地图、OTA大包——MB级带宽需求,100BASE-T1/1000BASE-T1以太网+SOME/IP服务化通信"],["诊断线","OBD口背后","维修店插的OBD-II口,背后走的多是CAN(DoCAN/ISO-TP)或以太网(DoIP);UDS协议在其上跑——第5章专章"],["网关","翻译官","不同网段速率、协议不同,网关ECU负责报文路由与协议转换(CAN↔CAN FD↔以太网)——整车网络的十字路口,也是排障时的重点怀疑对象"]]},{"g":"E/E架构演进:你正处在换代期","r":[["分布式","一个功能一个ECU","传统架构:上百个小ECU各管一摊,靠CAN互联——成熟便宜,但线束复杂、算力分散、OTA困难"],["域集中","五大域控","动力域、底盘域、车身域、座舱域、智驾域各设一个域控制器(高算力SoC),域内小ECU降级为执行器——AUTOSAR AP就在域控上跑(接os科目第9章)"],["中央计算+区域","Zonal架构","一个中央计算平台+几个按物理位置划分的区域控制器(Zonal ECU):区域控制器就近接传感器执行器,骨干用以太网——线束最短化,特斯拉等新势力的方向"],["对学习的含义","CAN不会死,以太网必须学","换代期的现实:动力底盘的实时小数据仍是CAN FD天下,大流量走以太网,两套并存还要互通(网关)——所以本课两条腿都练,不押一边"]]}]},{"t":"CAN基础:从电平到一帧报文","sub":"差分线·显隐性·仲裁·帧结构","fig":"cbframe","map":[["物理层","双绞线差分信号;CAN_H/CAN_L;终端电阻120Ω×2"],["显性与隐性","显性0(有电压差)压过隐性1(无差)——线与逻辑"],["仲裁","逐位比较ID:ID越小优先级越高;非破坏性仲裁"],["帧结构","SOF·ID·RTR·控制场·数据(0-8字节)·CRC·ACK·EOF"],["位定时","波特率与采样点;常用500k(动力)/250k/125k(车身)"]],"spine":"CAN 最精妙的设计只有一条:把「0」定义为强势(显性)、「1」定义为弱势(隐性)——多个节点同时发言时,发0的自动压过发1的。仲裁、应答、错误标志,全从这一条生长出来。理解了显性隐性,CAN 就通了一半。","g":[{"g":"物理层:两根线的艺术","r":[["差分信号","抗干扰的根基","CAN_H与CAN_L传相反的信号,接收端只看两线「差值」:干扰同时打在两根线上(双绞线保证这点),一相减就抵消了——发动机舱那种电磁环境里能稳定通信,靠的就是差分+双绞"],["显性与隐性","0强1弱","显性(逻辑0):CAN_H≈3.5V、CAN_L≈1.5V,差2V;隐性(逻辑1):两线都≈2.5V,差0V。总线上只要有一个节点发显性,整条线就是显性——物理上的「线与」:0永远赢","万用表快速判断:总线空闲时H、L都约2.5V;H-L差值持续异常(如始终2V)提示有节点卡在显性——「总线卡死」排障第一步"],["终端电阻","两端各120Ω","高速CAN两端各接120Ω(并联后60Ω),吸收信号反射。测量:断电下量H-L间电阻,约60Ω正常;120Ω=丢了一端;40Ω=多接了——排障必查项,新手接板子忘终端电阻是保留节目"],["拓扑与分支","线形为主","高速CAN要求线形拓扑,分支(stub)尽量短(500kbps下建议<30cm)——星形、长分支会反射出错。布线问题引起的「偶发错误帧」,示波器一看波形毛刺便知"]]},{"g":"仲裁:不用裁判的抢话权","r":[["逐位仲裁","边发边听","总线空闲时任何节点都可开始发送;多节点同发时,各自边发ID边监听:发隐性1却听到显性0的,说明有人ID更小(优先级更高),立即退出转为接收——胜者浑然不觉,败者稍后重发。零仲裁开销、报文零损坏,这叫「非破坏性仲裁」"],["ID即优先级","越小越大牌","ID数值越小优先级越高——所以整车通信矩阵里,安全关键报文(如刹车指令)分配小ID,娱乐信息给大ID。ID分配表是整车厂的核心设计文档之一"],["实时性的代价","低优先级可能饿死","总线负载高时,大ID报文可能一直抢不到话语权——所以车规要求总线负载率典型控制在30-50%以下,留出最坏情况余量。负载率是CANoe里第一个要看的指标"],["标准帧与扩展帧","11位与29位ID","标准帧11位ID(2048个),乘用车常用;扩展帧29位ID,J1939(商用车)用它编码源地址与参数组——同一总线可混跑,扩展帧优先级天然低于同前缀标准帧"]]},{"g":"帧结构:一帧报文的解剖(配图)","r":[["数据帧全景","从SOF到EOF","SOF(1位显性,打拍子)→ 仲裁场(ID+RTR)→ 控制场(IDE·DLC数据长度)→ 数据场(0-8字节)→ CRC场(15位校验)→ ACK槽 → EOF(7位隐性)。一帧最多8字节数据——CAN的「短消息」本色"],["ACK槽","全班齐喊「收到」","发送者在ACK槽发隐性,任何正确收到该帧的节点都在此位打一个显性——发送者听到显性就知道「至少有人收到了」。注意:ACK只代表「有节点校验通过」,不代表目标应用收到——这是初学最常见的误解","总线上只有一个节点时发送必然报错(没人ACK)——单板调试「明明代码没问题却一直发送失败」,九成是这个"],["位填充","连续5个同电平插1个反位","连续5个相同电平后自动插入一个相反位(接收方自动剔除)——保证信号足够跳变以维持同步。示波器上看到的「多余位」不是错,是规则"],["远程帧与过载帧","冷知识","远程帧(RTR=隐性)请求他人发送某ID数据——实际工程几乎不用(直接周期发送更简单);过载帧用于接收方请求延迟——现代控制器基本见不到。知道即可,重点全在数据帧"]]},{"g":"位定时与波特率","r":[["波特率约定","全网必须一致","一条总线上所有节点波特率必须相同:动力CAN常用500kbps,车身125/250kbps,CAN FD仲裁段500k+数据段2-5Mbps。波特率不匹配的现象:满屏错误帧——排障基础项"],["位时间的切分","同步段·传播段·相位段","每一位被切成若干时间份额(Tq):同步段+传播段+相位缓冲段1/2;接收方在「采样点」(常设75-80%)读电平。采样点全网应一致——网关两侧采样点差异过大也能造成诡异误码"],["再同步","靠边沿对表","节点靠帧内的电平跳变不断校正自己的位时钟(所以需要位填充保证跳变)——晶振精度要求由此而来:CAN允许约1.5%总偏差,车规晶振通常0.5%以内"]]}]},{"t":"CAN进阶:错误处理与CAN FD","sub":"CAN最值钱的部分:它怎么对待错误","map":[["五种错误检测","位错误;填充错误;CRC错误;格式错误;ACK错误"],["错误帧","发现错误立即广播6个显性位,全网作废这一帧,自动重发"],["错误计数器","TEC/REC;主动错误→被动错误→Bus Off 三级降级"],["Bus Off","计数器≥256,节点自我禁言;需复位或自动恢复"],["CAN FD","仲裁段不变+数据段提速(2-8Mbps);数据最长64字节;CRC加强"]],"spine":"CAN 的可靠性哲学是「宁可全网重来,不许一帧错误蒙混」:任何节点发现错误,立刻用错误帧把这一帧砸掉,发送方自动重发。而错误计数器则是给「爱惹事的节点」准备的降级机制——错误越多,权限越小,最后自我禁言(Bus Off)。这套设计让CAN在恶劣环境里跑了四十年。","g":[{"g":"错误检测与错误帧","r":[["五重检测","层层设卡","位错误(发的和听的不一致)、填充错误(连续6个同电平)、CRC错误、格式错误(固定位被破坏)、ACK错误(没人应答)——一帧要蒙混过关,得同时骗过五道关卡,漏检率理论上低于千亿分之一量级"],["错误帧机制","当场砸帧","任一节点检测到错误,立即发送6个连续显性位(故意违反位填充规则)——全网都能识别「这帧作废」,发送方自动重发。好处:错误不扩散;代价:一个疯狂报错的节点能把全网拖住——所以需要下一条"],["错误计数器","TEC与REC","每个节点维护发送错误计数器(TEC)和接收错误计数器(REC):出错加分(发送错误+8)、成功减分(-1)。加减规则的设计让「偶发错误」很快被原谅,「持续错误」快速升级"],["三级状态","主动→被动→Bus Off","TEC/REC<128:主动错误状态(可发显性错误帧);≥128:被动错误(只能发隐性错误标志,不许打扰别人);TEC≥256:Bus Off——节点断开总线,自我禁言","Bus Off是排障高频词:某ECU「掉线」常是它硬件/软件问题导致连续发送错误自我禁言——查它自己,别先怀疑总线"],["Bus Off恢复","自动或复位","协议允许监听到128×11个隐性位后自动恢复;实际工程常由软件控制恢复策略(如延时重连、次数限制+DTC上报)——AUTOSAR CanSM模块管的就是这事(接os科目AUTOSAR章)"]]},{"g":"CAN FD:老树新枝","r":[["为什么需要FD","8字节不够用了","ECU刷写、标定数据、日益膨胀的信号——经典CAN每帧8字节+1Mbps上限成了瓶颈。CAN FD(Flexible Data-rate)2012年由博世推出,现已是新车型主流"],["两项核心改进","更快+更长","①数据段变速:仲裁段维持500kbps(保住仲裁机制),仲裁结束后切到2-8Mbps发数据;②数据场扩到最长64字节(DLC编码:9-15对应12/16/20/24/32/48/64)。实效带宽提升约3-8倍"],["CRC加强与保护","更长的帧需要更强的校验","17/21位CRC+填充位计数(避免经典CAN的一个校验盲点)——FD在加长加速的同时把可靠性补强了"],["兼容性","不能混发","经典CAN节点收到FD帧会报错——同一网段要么全FD(FD控制器可收发经典帧),要么靠网关隔离。改造存量网络时这是主要工程约束"],["再往后:CAN XL","10Mbps+2048字节","博世后续推出CAN XL(数据场至2048字节,速率10Mbps+),定位补在CAN FD与以太网之间——知道演进方向即可,当前工程主力仍是FD"]]},{"g":"波形与物理层排障","r":[["示波器看什么","三板斧","①电平:显性差压约2V、隐性约0V;②边沿:上升沿干净无振铃(振铃=反射,查终端电阻与分支);③位宽:与波特率对得上。逻辑分析仪+CAN解码器可以直接把波形翻译成帧"],["常见波形病","对症索引","持续显性=某节点卡死或短路;振铃严重=终端电阻缺失/拓扑不良;电平偏移=接地差(共模超范围);偶发毛刺=干扰源(点火线圈、电机)——线束与EMC问题,软件工程师也要能认出来,才不会白查三天代码"],["错误帧统计","健康度仪表","CANoe/CANalyzer的错误帧计数与总线负载率是两个健康指标:偶发错误帧(<百万分之一)可接受;规律性错误帧要查(常与特定报文/特定工况相关)"]]}]},{"t":"DBC与通信矩阵:报文里的信号","sub":"从「一串字节」到「车速=63.5km/h」","map":[["三层抽象","节点(ECU)→ 报文(Message/ID)→ 信号(Signal)"],["DBC文件","描述整车通信矩阵的标准格式;CANoe等工具的粮食"],["信号编码","起始位·长度·字节序(Intel/Motorola)·缩放factor·偏移offset"],["发送类型","周期型(Cyclic);事件型(Event);周期+事件混合"],["网络管理","OSEK NM / AUTOSAR NM:协调全网睡眠与唤醒"]],"spine":"总线上跑的只是「ID+8个字节」,谁来规定第3字节的低4位是档位、第4-5字节乘0.1是车速?答案是通信矩阵(DBC)——整车厂发布的「字典」。拿到DBC,天书般的字节流立刻变成有名有姓的信号;没有DBC,抓一天包也只是看热闹。","g":[{"g":"通信矩阵与DBC","r":[["通信矩阵是什么","整车的话语分工表","主机厂定义:哪个ECU发哪些报文(ID、周期、长度)、每个报文里装哪些信号、谁接收——Excel矩阵表与DBC文件是同一信息的两种载体。供应商开发的第一步就是「拿矩阵」"],["DBC文件结构","BO_与SG_","BO_行定义报文(ID、名字、长度、发送节点);SG_行定义信号(起始位|长度@字节序+符号 (factor,offset) [min|max] 单位 接收节点)——文本格式,可以用记事本打开读懂。会手读DBC是车载工程师的识字能力"],["物理值换算","raw × factor + offset","线上传的是原始值(raw),显示用物理值:如车速信号 factor=0.05625、offset=0,raw=1000 → 56.25km/h。标定和排障时经常要手算这一步——尤其怀疑「工具解析错了」的时候"],["字节序","Intel与Motorola","Intel(小端):低字节在前;Motorola(大端):高字节在前——跨字节信号两种排法完全不同,DBC里@1为Intel、@0为Motorola。字节序配错是「信号值诡异跳变」的经典原因","同一张网里两种字节序可以并存(按信号定义),移植解析代码时必须逐信号核对——想当然统一按小端,踩坑率极高"]]},{"g":"发送类型与调度","r":[["周期型","心跳式广播","最常见:车速、转速等按固定周期(10/20/100ms)持续广播——接收方还能用「超时未收到」判断发送方掉线(超时监控,通常3倍周期)"],["事件型","变了才说","车门开关、按键——状态变化时发送(常连发N次防丢);省带宽但不能做超时监控"],["混合型","周期+事件","平时慢周期心跳,变化时立即加发——兼顾带宽与实时。矩阵里的发送类型直接决定接收方的超时策略,联调时两边要对齐"],["报文超时监控","掉线检测","接收方对周期报文设超时(如3×周期):超时→置信号默认值+记DTC——「仪表上车速突然归零/横杠」背后常是超时逻辑在起作用。排障时分清:是发送方没发,还是网关没转,还是接收方误判"]]},{"g":"网络管理与J1939","r":[["为什么要网络管理","一起睡一起醒","停车后ECU要睡眠省电,但任何一个节点还醒着,总线就得保持活跃——AUTOSAR NM用专门的NM报文协调:大家都同意睡才睡,任何节点可唤醒全网。「亏电」问题排查绕不开NM"],["唤醒源分析","谁不让大家睡","CANoe抓NM报文看谁在持续请求保持唤醒(常见元凶:某ECU故障反复自唤醒、诊断设备忘拔)——整车静态电流超标的标准排查路径"],["J1939简介","商用车的方言","卡车/工程机械用J1939:29位ID里编码了优先级+参数组编号(PGN)+源地址;信号定义全行业统一(SPN)——不需要各厂DBC就能互通。乘用车工程师知道概念即可,跨行时不陌生"],["整车联调的常识","矩阵版本对齐","联调翻车高频原因:两家供应商拿的矩阵版本不一致(V3.2对V3.5,某信号挪了位)——开工先对版本号+校验和,比对波形省三天"]]}]},{"t":"UDS诊断:售后与刷写的通用语言","sub":"ISO 14229——每个车载工程师的必修课","map":[["诊断栈","UDS(14229) over ISO-TP(15765-2) over CAN/以太网(DoIP)"],["ISO-TP","把>8字节的诊断数据切包重组:单帧/首帧/连续帧/流控帧"],["核心服务","0x10会话;0x22/2E读写DID;0x19/14读清DTC;0x27安全访问;0x31例程;0x34-37传输数据"],["DTC","故障码三字节+状态字节;快照与扩展数据"],["刷写流程","进编程会话→安全解锁→擦除→传数据→校验→复位"]],"spine":"UDS 是一问一答的主仆协议:诊断仪(Tester)发请求,ECU 答响应——肯定响应是「服务号+0x40」,否定响应是固定的 0x7F 加拒绝原因码(NRC)。学 UDS 的诀窍是把它当「对话脚本」来读:每一次维修店读码、每一次 OTA 刷写,线上跑的都是这套一问一答。","g":[{"g":"诊断栈与ISO-TP","r":[["三层栈","应用层压在传输层上","UDS(ISO 14229)定义「说什么」;ISO-TP(ISO 15765-2)解决「CAN一帧只有8字节,诊断数据几KB怎么传」;底下是CAN或以太网(DoIP)。抓包时看到的0x02/0x10/0x21开头字节,就是ISO-TP在干活"],["ISO-TP四种帧","切包与流控","单帧SF(≤7字节,首字节0x0N=长度);首帧FF(0x1X+总长,开启多帧);连续帧CF(0x21,0x22…滚动计数);流控帧FC(0x30,接收方回复:继续发/等待/溢出+块大小BS+间隔STmin)——刷写慢?先看FC里的STmin是不是被设大了"],["物理寻址与功能寻址","点名与广播","物理寻址:对单个ECU的请求ID一对一;功能寻址(如0x7DF):广播给全网,谁匹配谁答——「读全车DTC」就是功能寻址的典型用法"],["肯定与否定响应","+0x40与0x7F","请求0x22,肯定响应0x62;否定响应固定0x7F 0x22 NRC。常见NRC:0x11服务不支持、0x13长度错、0x22条件不满足、0x31请求超范围、0x33安全拒绝、0x78响应待定(「稍等,在处理」)——背下这几个,看log速度翻倍"]]},{"g":"核心服务速查","r":[["0x10 会话控制","三种会话","01默认会话、02编程会话、03扩展会话——很多服务(写数据、例程、刷写)只在扩展/编程会话开放;会话有S3超时(默认5s),不发3E TesterPresent心跳就掉回默认会话","「刚解锁又提示安全拒绝」的经典原因:忘发3E心跳,会话超时回落,解锁状态一并失效"],["0x22/0x2E 读写DID","按「数据标识符」存取","DID是两字节编号的数据条目:如F190=VIN码、F195=软件版本。0x22读、0x2E写(写通常要求扩展会话+安全解锁)——标定、产线写码、售后查版本全靠这对服务"],["0x19/0x14 DTC","读码与清码","0x19按子功能读DTC(02按状态掩码读、04读快照、06读扩展数据);0x14清除。DTC三字节编码(如P0562→存储值),状态字节8个位(testFailed、confirmed、pending…)——读懂状态位,才分得清「历史故障」与「当前故障」"],["0x27 安全访问","种子-密钥","请求种子(0x27 01)→ECU回随机种子→诊断仪用保密算法算密钥→发回(0x27 02)→通过则解锁——防止随意写入与刷写。各厂算法保密,供应商拿到的是加密dll/so"],["0x31 例程控制","让ECU干一件事","启动/停止/查询例程:擦除Flash、自检、标定动作都包装成例程(RID两字节)——刷写流程里「擦除」就是0x31调用例程0xFF00"],["0x3E/0x11","心跳与复位","0x3E TesterPresent保持会话;0x11 ECUReset(01硬复位/03软复位)——刷写结束的最后一步几乎总是0x11"]]},{"g":"刷写流程与DoIP","r":[["标准刷写九步","背下来","①扩展会话+读版本预检 ②控制DTC记录关闭(0x85)+关非诊断通信(0x28) ③进编程会话(0x10 02) ④安全解锁(0x27) ⑤擦除(0x31例程) ⑥请求下载(0x34:地址+长度)→传输数据(0x36分块)→退出传输(0x37) ⑦完整性校验(0x31校验例程) ⑧写指纹/版本(0x2E) ⑨复位(0x11)——OTA与产线刷写都是这套骨架的变体","刷写失败救砖的关键:Bootloader要保证「编程会话随时可进」——App刷坏了还能靠Boot重刷。理解Boot/App分区,刷写才算入门"],["DoIP","以太网上的UDS","ISO 13400:UDS报文封装在TCP/UDP里跑车载以太网——大数据量刷写(智驾域控几个GB)非DoIP不可,速度比CAN快两个数量级。诊断口正在从「OBD插CAN」过渡到「OBD插以太网」"],["OBD与UDS的关系","法规与厂家","OBD-II(排放相关法规诊断,服务0x01-0x0A)是法定最小集,全行业统一;UDS是厂家全功能诊断——同一个OBD口,两套协议并存。别把「能读OBD」当成「会诊断」,UDS才是工程主战场"]]}]},{"t":"LIN与低速总线:末梢神经","sub":"能用便宜的,绝不用贵的","map":[["LIN定位","单线·主从·20kbps以内;车窗雨刮座椅按键的专属"],["LIN帧","主机发帧头(同步间隔+同步场+PID),指定从机答数据"],["调度表","主机按表轮询;LDF文件=LIN版的DBC"],["FlexRay","时间触发·10Mbps·双通道冗余——渐被以太网+CAN FD替代"],["传感器总线","SENT:单向数字传感器;PSI5:安全气囊传感器"]],"spine":"LIN 的存在理由一个字:省。单根线、无晶振(靠同步场对表)、从机芯片成本比 CAN 低一截——车窗升降用得着 CAN 的仲裁和五重校验吗?用不着。「按重要程度分配预算」是整车电子架构的第一性原理,LIN 就是这个原理的化身。","g":[{"g":"LIN 协议要点","r":[["主从架构","没有仲裁,只有点名","一主多从(最多16个),只有主机能发起通信:主机发「帧头」点名,被点到的从机(或主机自己)发数据——从根上消灭了总线冲突,也就不需要仲裁。简单=便宜=可靠(对低要求场景)"],["帧头三件套","间隔+同步+PID","同步间隔(≥13位显性,喊「都听着」)→同步场(0x55,从机借它校准波特率——所以从机不用精密晶振)→受保护标识符PID(6位ID+2位校验)。之后数据场1-8字节+校验和"],["调度表","按剧本轮询","主机按调度表(schedule table)循环点名:车窗状态每20ms问一次、灯光每50ms……实时性由表保证,确定性极强。LDF文件描述整个LIN网络(相当于DBC),工具(CANoe.LIN)直接加载"],["休眠唤醒","一根线也要省电","主机发睡眠命令(0x3C保留帧),全网休眠;任何节点拉低总线250μs-5ms即可唤醒——车门把手一碰就唤醒车身网络,背后就是这机制"],["排障要点","从机不答的三板斧","①主机有没有点名(抓帧头)②PID校验对不对③从机波特率同步是否成功——LIN问题结构简单,顺着「点名-应答」链查,比CAN好排得多"]]},{"g":"FlexRay:壮志未酬的贵族","r":[["设计初衷","时间触发的确定性","10Mbps、双通道冗余、TDMA时间片(每个节点在分配的时隙里说话,微秒级确定)——为线控转向/制动这类「绝不能迟到」的应用设计,宝马奥迪曾大规模使用"],["为什么退潮","贵,且被夹击","节点成本高、开发复杂;下有CAN FD补足带宽、上有车载以太网+TSN提供确定性——新平台大多不再选它。存量车型仍在,知道概念、会认帧即可"],["留下的遗产","时间触发思想","「按时刻表通信」的思想被TSN(时间敏感网络)和CAN的调度表继承——学FlexRay的价值在思想不在协议本身"]]},{"g":"传感器专用总线","r":[["SENT","单向数字传感","SAE J2716:传感器→ECU单向传输(节气门位置、压力温度),脉宽编码数字量——替代模拟电压传输,抗干扰且省ADC。示波器解码即可读值"],["PSI5","气囊专用","两线、传感器供电与数据共线、曼彻斯特编码:碰撞传感器→气囊控制器——安全件专用总线,冗余与诊断能力按功能安全设计"],["怎么定位这些","认识≠深学","SENT/PSI5是「遇到再查」的知识:知道它们存在、知道波形长什么样、知道工具能解码——面试或排障时不露怯即可,主战场仍是CAN/LIN/以太网"]]}]},{"t":"车载以太网:大流量时代","sub":"100BASE-T1·SOME/IP·DoIP·TSN","map":[["物理层","100BASE-T1/1000BASE-T1:单对双绞线跑全双工100M/1G"],["组网","交换机(Switch)架构;VLAN划分;与IT以太网同宗"],["SOME/IP","车载中间件:服务发现·远程调用·事件订阅"],["DoIP","以太网诊断:UDS over TCP/IP"],["TSN","时间敏感网络:给以太网加上「准点」能力"]],"spine":"车载以太网解决的是 CAN 永远解决不了的问题:一颗 800 万像素摄像头每秒产出的数据,等于几万条 CAN 报文。但以太网进车付出的代价也真实——「尽力而为」的 IT 网络,要靠 TSN、网关和大量工程约束,才能学会汽车要求的「分毫不差」。","g":[{"g":"物理层与组网","r":[["100BASE-T1","单对线的魔术","IT以太网(100BASE-TX)要两对线,车载版用回声消除技术在「单对非屏蔽双绞线」上跑全双工100Mbps——线束减半,连接器车规化。1000BASE-T1(1G)用于摄像头/激光雷达骨干"],["交换式组网","不再是总线","以太网是点对点+交换机:每条链路独享带宽,交换机按MAC/VLAN转发——「广播共享一对线」的CAN思维要切换成「网络拓扑+转发表」的IT思维。域控内部SoC之间、域控之间的骨干,都是交换机连的"],["协议栈","熟悉的TCP/IP","MAC/VLAN(802.1Q)→IPv4/v6→TCP/UDP→应用(SOME/IP、DoIP、AVB音视频……)——IT网络知识直接复用,抓包工具就是Wireshark(车载插件)"],["与CAN共存","网关做翻译","信号→服务的转换在网关/域控完成:如把CAN上的车速信号封装成SOME/IP事件发布——「信号世界」与「服务世界」的边界,正是当下车企软件平台的施工重地(接os科目AUTOSAR AP章)"]]},{"g":"SOME/IP:服务化通信","r":[["三种交互","RPC·事件·字段","方法调用(Request/Response,像函数远程调用)、事件通知(Event,订阅后推送)、字段(Field,带getter/setter的状态)——CAN的「广播信号」变成了「按需订阅的服务」"],["服务发现SOME/IP-SD","先找到再通信","服务端广播Offer(我提供服务0x1234),客户端Find/Subscribe——动态发现代替静态配置,服务可以在不同ECU间迁移部署。抓包看SD报文,是调SOME/IP的第一步"],["序列化","字节到结构","SOME/IP定义了参数序列化规则(对齐、长度字段、TLV可选)——两端结构体定义不一致时,解出来的就是乱码。接口定义(ARXML/IDL)版本对齐,和DBC版本对齐同样是联调铁律"],["何时用它","大数据+灵活部署","感知结果、地图、座舱服务——需要大带宽或跨ECU灵活调用的场景;毫秒级硬实时小信号(如扭矩指令)仍是CAN FD更合适。选型不是宗教,按时延与带宽画线"]]},{"g":"DoIP 与 TSN","r":[["DoIP栈","刷写提速两个量级","车辆发现(UDP广播)→路由激活→UDS over TCP:诊断仪与整车经以太网直连,几GB的域控固件半小时内刷完(CAN要一夜)。产线与OTA的主流方案"],["TSN家族","让以太网学会准点","时间同步(802.1AS,μs级全网对表)、时间感知整形(802.1Qbv,按时刻表放行关键流量)、帧抢占(802.1Qbu)——给「尽力而为」的以太网装上时刻表,满足控制类流量的确定性。智驾骨干网的标配方向"],["车载以太网测试","工具生态","CANoe.Ethernet、Wireshark+SOME/IP解析、iperf打流量、802.1AS对时验证——测试思路从「看波形」升级为「看链路+看时延分布」,IT网络功底开始值钱"]]}]},{"t":"测试与工具链:让总线看得见","sub":"CANoe为核心的日常武器库","map":[["工具谱系","CANoe(仿真+测试);CANalyzer(分析);示波器/逻辑分析仪;开源:SavvyCAN·BusMaster·candump"],["三大日常","抓包看trace;加载DBC解信号;仿真缺席节点"],["CAPL","CANoe脚本语言:自动化测试与残余总线仿真"],["排障流程","物理层→数据链路层→应用层,自下而上"],["常见故障","无ACK;终端电阻;波特率不配;Bus Off;超时;矩阵版本"]],"spine":"车载总线工程师的日常,一半时间在「让看不见的报文变得看得见」:接上 CANoe、加载 DBC、盯 trace 窗口——车速为什么跳变?报文停发还是数值错?网关转没转?工具用得熟,排障效率差十倍;这一章就是工具与排障的实战地图。","g":[{"g":"工具谱系","r":[["CANoe","仿真+测试全家桶","Vector家的行业标准:加载DBC/LDF/ARXML,实时解码信号、图形化显示、仿真整车节点(残余总线仿真)、CAPL脚本自动化测试——车厂与供应商的通用语言。贵,但公司都会买"],["CANalyzer与硬件","分析用轻量版","CANalyzer=CANoe去掉仿真能力;配套硬件VN1630/VN5620等接口卡。预算有限的替代:PCAN+PCAN-View、CANable+SavvyCAN、Linux下SocketCAN+candump/cansniffer——原理相通,别被工具绑架"],["示波器的位置","物理层的最终裁判","协议工具都说「没收到」,只有示波器能回答「线上到底有没有信号、波形健不健康」——第3章的波形三板斧,配合协议解码功能,是硬件相关问题的终审法院"],["残余总线仿真","一个人演一台车","被测ECU需要全车报文才能正常工作——CANoe按DBC把其余节点全部仿真出来(周期报文自动发、交互逻辑CAPL写)——供应商没有整车也能测自己的件,这是台架测试的核心技术"]]},{"g":"CAPL与自动化","r":[["CAPL是什么","事件驱动的C方言","on message(收到某报文)、on timer、on key触发代码块,语法类C——写残总仿真逻辑、自动化测试用例、故障注入(篡改信号、停发报文、发错误帧)都靠它"],["典型用例结构","激励-观测-判决","设置前置条件(如点火ON)→注入激励(发某信号=X)→观测响应(某报文里的状态位)→判决通过与否+记录——通信测试用例的标准三段式,几百条用例跑回归"],["故障注入测试","专挑坏的试","停发报文(测超时处理)、发错DLC、发超范围值、总线短路(硬件盒)——车规测试的重头是「错的输入下行为是否安全」,与功能安全E2E要求呼应(下一章)"]]},{"g":"排障方法论:自下而上","r":[["第一层:物理层","有没有信号","量终端电阻(60Ω)→示波器看波形电平/振铃→查波特率配置——「完全不通」的问题80%死在这一层:接反了、忘终端电阻、波特率不匹配、地没共"],["第二层:数据链路层","帧对不对","看错误帧统计与类型→查ACK(单节点无应答?)→看Bus Off(哪个节点掉线)→总线负载率——CANoe的Statistics窗口五分钟定位"],["第三层:应用层","内容对不对","报文在不在(周期对吗)→信号解析对不对(DBC版本!字节序!)→数值合理吗(factor/offset)→网关转发了吗(两侧同时抓)——「信号不对」的问题几乎都在矩阵版本与解析配置上"],["黄金问题清单","排障口袋卡","①改过什么?(新刷的件/新换的线束)②单挂还是整网?(隔离变量)③规律还是偶发?(偶发→录长trace抓现场)④两侧同时抓了吗?(网关问题必需)——四问问完,方向基本明了","「偶发问题」的解药与OS科目同款:可复现>一切——写CAPL脚本高频复现,把三天一遇压成三分钟一遇"]]}]},{"t":"通信安全与新趋势","sub":"SecOC·E2E·OTA——总线世界的下一个十年","map":[["CAN的先天缺陷","无认证无加密:谁都能发,收方无法辨真伪"],["SecOC","AUTOSAR方案:报文附加MAC认证码+新鲜度值防重放"],["E2E保护","功能安全通信:CRC+计数器+超时,端到端校验"],["OTA","整车升级:差分包+双分区+回滚;UDS/DoIP承载"],["趋势","Zonal架构;以太网骨干;SDV软件定义汽车"]],"spine":"2015 年那次著名的吉普远程入侵事件,黑客从车机一路打进 CAN 总线,拧动了方向盘——从此「车内网络默认可信」的时代结束了。信息安全(防黑客)与功能安全(防故障)成了通信设计的双保险:SecOC 管「报文是不是真的」,E2E 管「报文是不是对的」。","g":[{"g":"信息安全:SecOC","r":[["CAN为什么裸奔","设计年代问题","1986年的设计假设「车内都是自己人」:报文无源认证、无加密——任何接入总线的设备(OBD口、被攻破的车机)都能伪造刹车信号。联网汽车时代,这成了最大的攻击面"],["SecOC机制","MAC+新鲜度","AUTOSAR SecOC给关键报文附加:截短的MAC(消息认证码,基于共享密钥算出)+新鲜度值(计数器/时间戳,防重放攻击)——收方验证不过即丢弃。带宽代价:8字节报文挤出几字节放认证信息,CAN FD的64字节此时显出价值"],["密钥管理","比算法更难的部分","密钥怎么灌装(产线)、怎么更新、怎么按车唯一化——车企安全体系的核心工程;R155/R156法规(UN)已强制新车型做网络安全管理体系(CSMS)。知道法规背景,理解为什么「突然全公司都在搞安全」"],["纵深防御","不止总线一层","域间防火墙(网关过滤规则)、入侵检测IDS(监控异常报文模式)、安全启动(固件签名验证)——SecOC只是链条一环;安全是体系,不是单点"]]},{"g":"功能安全:E2E保护","r":[["解决什么问题","通信链路的随机故障","比特翻转、报文丢失、重复、乱序、延迟——硬件故障也能造成「收到了错误数据」。ASIL等级高的信号(扭矩、转向指令)要求端到端保护:发送端加保护,接收端验证,中间环节(网关、协议栈)都不可信"],["E2E三件套","CRC+计数器+超时","每帧携带:CRC(数据完整性)+滚动计数器(检测丢帧/重复/乱序)+数据ID(检测串线);接收端校验失败进入安全状态(用默认值/降级)——AUTOSAR E2E库提供标准Profile(P01/P02/P05…),两端选同一Profile"],["与SecOC的分工","防故障vs防攻击","E2E防随机硬件故障(功能安全,ISO 26262),SecOC防恶意伪造(信息安全,ISO/SAE 21434)——高安全等级信号两个都要带。面试高频辨析题"],["排障新维度","校验失败也是线索","「信号收到了但应用不用」——查E2E状态:计数器跳变(丢帧?)、CRC错(数据被网关改动?)——排障清单从此多一层"]]},{"g":"OTA与未来架构","r":[["OTA全链路","云到ECU","云端差分包→车机/OTA管家下载验签→整车升级编排(哪些ECU、什么顺序、电量条件)→DoIP/UDS刷入→双分区切换+失败回滚——第5章的刷写九步是最后一公里,前面还有一整条供应链"],["双分区与回滚","刷坏不变砖","A/B分区:新固件写入B区,校验通过才切换启动指针;失败回滚A区——智驾域控标配。小ECU资源不够双分区,靠Boot保底(编程会话永远可进)"],["Zonal与SDV","总线的十年之变","区域架构把「按功能布线」改成「按位置布线」:区域控制器就近聚合IO,骨干全以太网——CAN退居区域内部末梢;软件定义汽车(SDV)则把功能从ECU解绑,靠服务化(SOME/IP)+OTA持续交付。学到这里回看第1章的演进图,闭环完成"],["给学习者的路线","下一步","实操:弄一个USB-CAN工具+两块开发板,把本课流程亲手跑一遍;进阶:读ISO 11898(CAN)、14229(UDS)原文选段;跟产品:关注SOME/IP与TSN的实车落地——协议会换代,「三层排障+矩阵思维」的方法论不换代"]]}]}],"F":[{"t":"新ECU接入联调流程","when":"手上的件第一次挂上台架/整车网络时","s":[{"b":"对齐通信矩阵版本","p":"和主机厂/对端确认DBC(或ARXML)版本号与发布日期,加载进CANoe——版本不一致是联调翻车第一大原因,先对齐再上电。"},{"b":"物理层三查","p":"终端电阻(断电量H-L约60Ω)→波特率/采样点配置→接线与共地。","f":[["台架单挂被测件","CANoe侧要开终端电阻或外接120Ω"],["整车环境","确认接入的网段正确——挂错网段什么都收不到"]]},{"b":"上电看基础收发","p":"trace里看:被测件的周期报文有没有按矩阵周期出现?DLC对不对?它该收的报文收到后有没有反应(如状态位变化)?"},{"b":"残余总线仿真补环境","p":"被测件依赖的其他节点报文,用CANoe按DBC仿真发出(如点火信号、整车状态)——很多件「不发报文」只是因为没收到点火ON。"},{"b":"过一遍交互用例","p":"按通信测试用例跑:超时处理(停发它依赖的报文)、错误值注入、NM睡眠唤醒配合——记录问题按「发送方/网关/接收方」归类反馈。","trap":"联调禁忌:两边各自盯自己的log隔空吵架——网关两侧同时抓包,一张对齐时间戳的trace顶十轮扯皮。"}]},{"t":"CAN总线故障排查","when":"总线不通、错误帧刷屏、节点掉线时","s":[{"b":"定性:哪种坏法","p":"完全不通(一帧没有)/错误帧刷屏/特定节点掉线/偶发错误——四种坏法,四条路径。","f":[["完全不通","走物理层:电阻→波形→波特率"],["错误帧刷屏","查波特率不匹配、某节点物理层故障"],["单节点掉线","查该节点Bus Off(TEC溢出)与其供电"],["偶发","录长trace+示波器等触发,查干扰与负载"]]},{"b":"物理层检查","p":"量终端电阻60Ω;示波器看显性差压(约2V)、边沿振铃、位宽;检查共地与线束破损——「软件问题」有八成先要排除这层。"},{"b":"链路层统计","p":"CANoe Statistics:错误帧类型与数量、总线负载率、各节点报文周期抖动——错误帧集中在某节点发送时段,嫌疑人就锁定了。"},{"b":"应用层核对","p":"报文在但信号不对:DBC版本→字节序→factor/offset→网关映射表;报文超时:发送方停发还是网关没转(两侧抓包对照)。"},{"b":"复现与回归","p":"找到疑因后做最小复现(如断开嫌疑节点观察错误帧是否消失);修复后跑通信回归用例,并把该故障加入用例库。","trap":"改一处验一处:同时换线束+刷软件+改配置,好了也不知道是哪个好了——下次照坏。"}]},{"t":"UDS实操:读码清码与刷写","when":"用诊断仪/脚本对ECU做诊断操作时","s":[{"b":"建立会话","p":"物理寻址发0x10 03进扩展会话;周期发0x3E 00保持(TesterPresent)——一切读写操作的地基。","f":[["响应0x50 03","会话OK,继续"],["无响应","查诊断请求/响应ID配置(矩阵里的DiagReq/Resp)与ISO-TP参数"]]},{"b":"读信息定位","p":"0x22读版本类DID(F190 VIN/F195软件版本)确认对象正确;0x19 02按状态掩码读DTC,0x19 04/06读快照与扩展数据看故障环境。"},{"b":"处理DTC","p":"分析状态字节:testFailed=当前故障(先修故障再清码);仅confirmed/历史=可0x14清除后观察是否复现。","trap":"上来就清码是售后大忌——快照数据(故障时车速/电压/里程)一清就没了,先读全再清。"},{"b":"刷写走九步","p":"预检→0x85/0x28关DTC与通信→0x10 02编程会话→0x27解锁→0x31擦除→0x34/36/37传数据→0x31校验→0x2E写指纹→0x11复位——每步核对肯定响应再走下一步。"},{"b":"失败处置","p":"记录失败步骤与NRC;传输中断先重试0x34起步;彻底失败依赖Boot保底重刷——确认「编程会话可进」就没有真砖。","trap":"0x78(响应待定)不是失败,是「等我一下」——脚本里要延长等待而不是重发,否则把流程搅乱。"}]},{"t":"从trace定位一个信号问题","when":"「仪表显示不对/功能偶发失灵」这类应用层问题","s":[{"b":"把现象翻译成信号","p":"查矩阵:该功能依赖哪些报文哪些信号、谁发、经不经网关——画一条「信号链路图」:源ECU→(网关)→目标ECU。"},{"b":"在故障点抓包","p":"CANoe加载正确版本DBC,在目标ECU入口抓:信号值对吗?周期稳吗?有无超时中断?","f":[["信号值就错","向上游查:源头就错还是网关改的(两侧对照)"],["信号正确","问题在目标ECU内部处理——转应用排查"],["报文时断时续","查源ECU状态(Bus Off?复位?)与网关负载"]]},{"b":"对照触发条件","p":"偶发问题:设CANoe触发器(信号超范围/报文超时自动标记),让车主/测试员复现工况,录环形缓冲trace——拿到带前后文的现场。"},{"b":"手工验算","p":"对可疑信号手算一遍raw→物理值(factor/offset/字节序),排除「工具解析错」;必要时对照另一台正常车的trace做差异对比。"},{"b":"闭环","p":"定位后出问题单(带trace截图与条文式复现步骤);修复验证后把该场景写进CAPL自动化用例——同一个坑,不踩第二次。","trap":"没有DBC版本信息的trace等于半份证据——存档trace时永远连同DBC版本、软件版本、车辆配置一起存。"}]}]},

{"k":"ec","name":"嵌入式C进阶","en":"EMBEDDED C","no":"15","eqLabel":"要点速查","flLabel":"实战与排坑","lede":"C 语言人人都「会」,但嵌入式的坑几乎全埋在「会」与「懂」之间:变量为什么被优化没了(volatile)、结构体为什么莫名变大(对齐)、开了 -O2 为什么就出错(未定义行为)、中断和主循环共享变量为什么偶尔错乱(原子性)。这门课不从 hello world 讲起,专讲<strong>嵌入式场景下 C 的深水区</strong>:内存模型、指针、关键字、位操作、类型陷阱、中断边界、MISRA 与未定义行为——每条先讲机制,再给「踩坑现场」,再给正确写法。它是嵌入式操作系统科目的地基篇,也是车载总线科目里解析报文代码的安全手册。","M":[{"t":"总论:嵌入式C与桌面C的距离","sub":"同一门语言,两种世界观","map":[["四大差异","资源以KB计;直接摸硬件;交叉编译;错了没有操作系统兜底"],["工具链","交叉编译器(arm-gcc/armclang);链接脚本;map文件;调试器"],["C标准","C90/C99/C11;嵌入式主流C99;MISRA约束子集"],["学习主线","内存模型→指针→关键字→位操作→类型→中断边界→UB"],["一句总纲","嵌入式C的功力=对「编译器和硬件之间发生了什么」的理解深度"]],"spine":"桌面程序员眼里 C 是「一种编程语言」,嵌入式程序员眼里 C 是「汇编的人类可读封装」——每行代码都要能回答:它编译成什么指令、访问哪块内存、耗多少周期、被中断打断会怎样。这门课全部内容,就是把这层「透视能力」建起来。","g":[{"g":"四大差异","r":[["资源以KB计","抠字节的艺术","桌面进程动辄GB内存;MCU常见64KB-1MB Flash、8-256KB RAM——所以嵌入式C斤斤计较:变量放哪个段、结构体多大、栈吃多深,map文件里每个字节都有名有姓(第2章展开)"],["直接摸硬件","指针指向真实电路","*(volatile uint32_t*)0x40021018 = 0x01; 这行代码拨动的是真实的时钟使能开关——地址不是抽象,是芯片手册里的寄存器。写错地址没有段错误提示,只有「板子怎么不动了」"],["交叉编译","在x86上造ARM的粮","代码在PC编译、在目标板运行:编译器(arm-none-eabi-gcc等)、链接脚本、启动文件、烧录调试器(J-Link/ST-Link)构成工具链——「本机能跑」在嵌入式语境里不存在,一切以目标板为准"],["没有兜底","错误的代价裸露","桌面上野指针→段错误+核心转储;MCU上野指针→改掉某个寄存器,现象可能是三天后电机抽搐一下——没有MMU、没有OS保护(除非上MPU),写对是唯一防线。这也是MISRA存在的理由(第8章)"]]},{"g":"工具链常识","r":[["编译四步","预处理→编译→汇编→链接","宏展开与头文件(预处理)→C到汇编(编译)→汇编到目标文件(汇编)→拼接与地址分配(链接)。「为什么改了宏没生效」「为什么undefined reference」——知道错误发生在哪一步,排查快十倍"],["链接脚本与map","内存的分配合同","链接脚本(.ld)规定代码/数据放哪;map文件是执行结果清单:每个函数、每个变量的地址与大小——「Flash满了砍谁」「这个变量为什么在这」全在里面。会读map是嵌入式C的识字关"],["编译警告是金","-Wall -Wextra起步","嵌入式的运行期错误难抓,把问题拦在编译期性价比最高:警告全开+警告当错误(-Werror)是纪律;再加静态分析(cppcheck/PC-lint/Clang analyzer)——「零警告」不是洁癖,是防线"],["优化等级","-O0到-Os","调试用-O0/-Og(代码与源码对应);发布常用-Os(体积优先)——「开优化就出bug」的代码不是编译器错了,是你的代码埋了UB或漏了volatile(第9章专章清算)"]]},{"g":"C标准与方言","r":[["标准演进","C90→C99→C11","嵌入式主流是C99:stdint.h固定宽度类型、inline、designated initializer、单行注释;C11加了_Static_assert、原子库(嵌入式编译器支持参差)。项目用哪个标准,开工先确认(编译器-std选项)"],["编译器方言","GCC扩展与#pragma","__attribute__((packed))、__attribute__((section))、#pragma pack——工程离不开但不可移植:封装进宏(如PACKED)集中管理,换编译器只改一处"],["MISRA的位置","戴着镣铐的自由","车规C的行业规范:禁掉C里容易写错的自由(后面各章的坑,多数有对应MISRA条款)——本课讲「为什么」,MISRA是「所以规定」;懂了为什么,镣铐就成了护具(第8章)"]]}]},{"t":"内存模型:每个变量住在哪","sub":"看懂内存布局,一半的诡异bug自动破案","fig":"ecmem","map":[["五大段","text(代码);rodata(常量);data(已初始化);bss(未初始化清零);堆与栈"],["Flash与RAM","代码常量住Flash;变量住RAM;data段开机从Flash拷到RAM"],["栈","向下生长;局部变量与调用现场;溢出=最阴险的bug"],["堆","malloc领地;嵌入式慎用(碎片/不确定)"],["map文件","每个符号的住址簿"]],"spine":"「全局变量为什么开机就有值?」「局部变量为什么是随机数?」「const数组为什么不占RAM?」——三个新手之问,一张内存布局图全部说清:开机时启动代码把data段从Flash搬进RAM、把bss清零,而栈上的局部变量没人替你打扫,住进去时床上是上一位住客的东西。","g":[{"g":"五大段(配图)","r":[["text段","代码本体","编译后的机器指令,烧在Flash里,运行时只读——函数指针的值就是它在text段里的地址"],["rodata段","只读常量","const全局变量、字符串字面量:住Flash不占RAM——所以大查找表要声明const(省RAM),字符串别当可写缓冲用(写它=写Flash地址,轻则无效重则异常)","const局部变量仍在栈上!「const放Flash」只对静态存储期(全局/static)成立——作用域决定住址"],["data段","已初始化的全局/static","int g_count = 5; 初值5烧在Flash,变量住RAM——启动代码开机把初值从Flash逐字节拷到RAM。「开机就有值」的魔法来源,代价是同一份数据占Flash+RAM两份空间"],["bss段","未初始化的全局/static","int g_buf[1000]; 不占Flash(只记大小),启动时整段清零——所以「全局变量默认为0」是启动代码干的活,不是天赋。大数组放bss比放data省Flash"],["堆与栈","动态的两端","堆从低往高长(malloc管辖),栈从高往低长(函数调用管辖)——两者相向而行,中间的空隙就是余量;撞上的那天,就是最难查的崩溃(接os科目内存章)"]]},{"g":"栈的深入","r":[["栈帧","一次调用一层","每次函数调用压入:返回地址、保存的寄存器、局部变量——函数返回即整层弹出。局部变量「随机值」的真相:那块栈内存刚被上一个函数用过,垃圾还在"],["返回局部变量地址","经典错误","return buf;(buf是局部数组)——返回后栈帧作废,那块内存随时被覆写:调用方拿到的指针指向「已退房的房间」。正确做法:调用方传缓冲区进来,或用static/全局(注意重入问题,第7章)","这个bug常「看起来能跑」——房间还没被再次入住时数据还在——直到某天调用路径变化,值突然变乱。UB的典型嘴脸"],["栈深度估算","最坏路径","最深调用链×各层局部变量+中断压栈(可能嵌套)——printf族是栈大户(数百字节起)。RTOS下每任务独立小栈,更要精算(用OS科目的水位法实测)"],["递归禁令","嵌入式基本禁用","递归深度不可控=栈深不可控——MISRA直接禁止。改写为循环+显式栈,深度自己掌控"]]},{"g":"map文件与内存排查","r":[["读map三件事","谁大·谁在哪·还剩多少","按大小排序找Flash/RAM大户(常发现:一个调试用大数组忘了删);查某变量地址(判断「谁踩了它」时要用);看各段总量与剩余——内存告急时的作战地图"],["「谁踩了我的变量」","地址相邻即嫌疑","变量A莫名被改:map里查A的地址,看它前面住的是谁——前邻的数组越界写,正好踩进A家。配合调试器的数据断点(watchpoint,对A地址设写断点),当场抓获肇事指令"],["section指定","把变量安排到指定地址","__attribute__((section(\".ram2\"))) 把大缓冲放到第二块RAM;不掉电RAM区放故障日志(接os科目HardFault章)——链接脚本+section属性配合,内存布局尽在掌握"]]}]},{"t":"指针深水区:地址+类型的双重身份","sub":"指针不难,难的是类型在背后做的事","map":[["指针本质","一个地址+一套「怎么解读这块内存」的类型说明"],["指针运算","p+1前进的是sizeof(*p)字节,不是1字节"],["数组与指针","数组名≈首元素指针,但sizeof与&行为不同"],["函数指针","回调·中断向量表·状态机跳转表的基石"],["野与悬垂","未初始化=野指针;指向已释放内存=悬垂指针"]],"spine":"理解指针只需一句话:指针 = 地址 + 类型。地址决定「在哪」,类型决定「从这个地址开始取几个字节、怎么解释、p+1 跳多远」。所有指针的诡异行为——运算步长、强转陷阱、二级指针——都是这两个成分在起作用。","g":[{"g":"本质与运算","r":[["地址+类型","双成分模型","uint8_t *p8 和 uint32_t *p32 存同一个地址,但 *p8 取1字节、*p32 取4字节;p8+1 前进1、p32+1 前进4——同一地址,两副眼镜。强制类型转换换的就是眼镜,不动地址"],["指针运算的单位","sizeof(*p)","p+n = 地址 + n×sizeof(*p)。数组遍历、报文解析全靠它;也因此 void* 不能做运算(不知道步长)——GCC扩展当1字节算,但那是方言不是标准"],["强转解析报文","车载常用但有雷","uint32_t v = *(uint32_t*)&buf[3]; 把字节流按32位取——两颗雷:对齐(奇地址取32位,某些架构直接HardFault)和字节序(接总线科目DBC章)。安全写法:memcpy到局部变量,或逐字节移位拼装——编译器会优化,不吃亏","「在STM32上能跑」不等于对:Cortex-M支持非对齐访问(部分指令除外),换个架构就炸——可移植性坑的典型"],["const与指针四组合","读法:从右往左","const int *p(指向const:值不可改,指针可移)、int *const p(const指针:指针不可移,值可改)、const int *const p(都锁死)、int *p(都自由)——从右往左念:「p是一个(const)指针,指向(const)int」。API设计里用const标注「我不会改你的数据」,是接口的君子协议"]]},{"g":"数组与指针的貌合神离","r":[["退化规则","何时数组变指针","表达式里数组名多数场合退化为首元素指针(传参必退化);但 sizeof(arr) 给整个数组大小、&arr 是「指向整个数组的指针」(+1跳整个数组)——三个例外记住,面试与排坑双保险"],["传参丢长度","数组参数是假的","void f(int arr[100]) 里的arr就是int*,sizeof(arr)=指针大小——100是写给人看的注释。所以C函数传数组必须配长度参数:f(arr, len)——缓冲区安全的第一课"],["多维数组","行指针的步长","int m[3][4] 里,m[i] 是第i行首地址,m+1 跳一整行(16字节)——传二维数组参数必须写明列数 f(int m[][4]):编译器要靠它算行步长"],["指针数组vs数组指针","int *a[4] vs int (*a)[4]","前者:4个指针的数组;后者:指向「4个int的数组」的一个指针——括号决定结合。菜单表、字符串表用前者;遍历二维数组用后者"]]},{"g":"函数指针与二级指针","r":[["函数指针","代码也有地址","void (*cb)(uint8_t*) = handler; 存的是函数入口地址——回调注册(驱动收包回调)、状态机跳转表(state_table[state]())、中断向量表(第2章:向量表就是函数指针数组)全靠它。typedef先给类型起名,可读性天壤之别"],["回调模式","驱动与应用解耦","驱动层收完数据调 app 注册的回调——上层换逻辑不动驱动。嵌入式分层架构的粘合剂;注意回调运行在谁的上下文(中断?任务?)决定它能干什么(接os科目ISR规则)"],["二级指针","改指针本身时用","函数要修改调用者的指针(如链表头插、分配内存给对方),必须传 int**——传int*只是指针的副本。判断口诀:「要改谁,就传谁的地址」"],["野指针与悬垂指针","两种坟场","野:声明未初始化就用(局部指针初值是栈垃圾);悬垂:指向已free/已出栈的内存。纪律:指针声明即初始化(=NULL或有效地址),free后立即置NULL,不返回局部地址——三条纪律灭掉九成指针事故"]]}]},{"t":"关键字精讲:volatile·const·static·extern","sub":"每个都认识,连起来全是坑","map":[["volatile","禁止优化缓存:每次都真实访存——寄存器/中断共享/DMA缓冲三场景"],["const","只读承诺+省RAM(静态存储期入Flash)+接口标注"],["static","三用法:文件私有全局;函数内持久变量;私有函数"],["extern","声明「在别处定义」;头文件声明·源文件定义"],["组合拳","volatile const:只读但会变(状态寄存器);static volatile:私有共享变量"]],"spine":"volatile 的本质一句话:告诉编译器「这个变量会在你看不见的地方被改变(硬件、中断、DMA),禁止你自作聪明地缓存它」。忘写 volatile 的代码在 -O0 下常常「能跑」,一开 -O2,编译器把循环里的变量缓存进寄存器——等标志位的 while 永远等不到,三年老工程师也在这翻车。","g":[{"g":"volatile:三大必用场景","r":[["硬件寄存器","场景一","#define REG (*(volatile uint32_t*)0x4002101C)——寄存器的值由硬件改变,且「读/写本身有副作用」(读清零、写触发)。不加volatile,编译器可能合并两次写、删掉「无用」的读——硬件时序全乱"],["中断与主循环共享","场景二","volatile uint8_t g_flag; ISR置位、主循环while(!g_flag)等待——不加volatile,-O2下编译器把g_flag读进寄存器只读一次,死循环诞生。所有「ISR写、别处读」的变量一律volatile","volatile保证「每次真实访存」,不保证原子性:多字节变量的撕裂读写它管不了——那是第7章临界区的事。「加了volatile就线程安全」是C语言第一大谣言"],["DMA缓冲区","场景三","DMA在CPU背后改内存——CPU视角与内存实况脱节,读DMA缓冲必须volatile(有Cache的芯片还要管Cache一致性,那是另一层)"],["不该用的地方","不是性能开关","普通变量加volatile=禁止优化=白白变慢;它也不是同步原语——该用临界区/原子操作的地方,volatile替代不了"]]},{"g":"const:承诺与位置","r":[["三重价值","防错+省RAM+文档","①编译器帮你拦「误写」;②静态存储期的const进Flash(rodata),大表省RAM(第2章);③函数参数const T*向调用者承诺「只读不改」——白纸黑字的接口文档"],["const≠不变","只是「你不许改」","volatile const uint32_t *status_reg:硬件状态寄存器——会变(volatile),但你只能读(const)。两个关键字同用毫不矛盾:一个说「它会变」,一个说「你别改」"],["强转去const","合法但危险","(int*)&const_var 绕过检查——若对象真在Flash,写入无效甚至异常;MISRA禁止。看到「去const强转」就该警觉:不是接口设计错了,就是有人走捷径"]]},{"g":"static:一词三义","r":[["文件级static","私有全局","static修饰全局变量/函数=只在本文件可见(内部链接)——模块封装的手段:头文件只暴露API,内部状态static藏住。防止命名冲突+明确归属,MISRA要求「能static尽量static」"],["函数内static","有记忆的局部变量","static变量住data/bss段(不在栈上),函数退出值仍在——计数器、一次性初始化标志。代价:函数因此不可重入(第7章)——中断里可能调到的函数慎用"],["static与初始化时机","编译期定值","static/全局的初始化必须是编译期常量(C语言,C++放宽)——「用函数返回值初始化全局变量」编不过,这是C与C++的经典差异题"]]},{"g":"extern与链接","r":[["声明vs定义","一次定义,处处声明","定义分配存储(int g_x;),声明只说「它在别处」(extern int g_x;)——头文件放声明,唯一一个.c放定义。头文件里写定义=每个包含它的.c都定义一次=链接报重复定义"],["undefined reference","链接期三查","①定义的.c没参与编译(Makefile漏了)②函数名拼写/大小写不一致③C++混编没加extern \"C\"(名字修饰)——按频率排查,五分钟内解决"],["头文件规范","自包含+守卫","每个头文件:include guard(#ifndef/#define/#endif或#pragma once)+自包含(用到的类型自己include)——「换个包含顺序就编译不过」的工程,都是欠了这两条的债"]]}]},{"t":"位操作与寄存器:C里的电烙铁","sub":"置位·清位·翻转·测试——嵌入式的四则运算","map":[["四大基本功","置位 |= (1u<<n);清位 &= ~(1u<<n);翻转 ^=;测试 & 后判断"],["掩码操作","读改写:reg = (reg & ~MASK) | (value << shift)"],["移位陷阱","有符号右移实现定义;移位数≥位宽是UB;1<<31要写1u<<31"],["位域","语法甜但可移植性苦:布局由编译器定——跨平台协议慎用"],["寄存器访问","volatile指针+芯片手册;读改写的原子性隐患"]],"spine":"位操作四板斧的核心是掩码思维:先造一个「只有目标位是1」的掩码 (1u<<n),然后——想置1就「或」它,想清0就「与」它的反,想翻转就「异或」它,想读取就「与」它再判断。四招练熟,寄存器操作、协议打包、标志管理全部通吃。","g":[{"g":"四大基本功与读改写","r":[["置位与清位","|= 与 &= ~","REG |= (1u<<5) 把第5位置1、其余不动;REG &= ~(1u<<5) 清0——「其余不动」是关键:直接赋值REG = 0x20会把别的位全清掉,驱动互踩的常见事故源"],["多位字段读改写","三步曲","写某个多位字段(如波特率选择占bit4-6):reg = (reg & ~(0x7u<<4)) | (val<<4)——先清后写;读:val = (reg>>4) & 0x7。总线科目里信号打包解包,就是这套操作在报文字节上的应用"],["翻转与测试","^= 与 &","LED翻转 PORT ^= (1u<<3);测试 if (REG & (1u<<7))——注意结果是「非零」不是「等于1」:if((REG&0x80)==1)是经典错误(0x80≠1)","位测试结果与1比较、把&写成&&——两个手滑bug编译器不报错,靠警告选项(-Wall会提示部分)与评审来拦"],["宏封装","可读性工程","#define SET_BIT(r,n) ((r) |= (1u<<(n))) 或用CMSIS的寄存器位定义(RCC_CR_HSEON)——裸数字魔法值(reg |= 0x2000)三月后没人看懂,包括你自己"]]},{"g":"移位的陷阱","r":[["无符号是本分","1u的u不能省","1<<31:int字面量1移到符号位=UB(C90)/实现定义——写1u<<31。位操作全程用无符号类型(uint32_t),是MISRA强制也是自保"],["有符号右移","实现定义","-8>>1是算术移位(补符号)还是逻辑移位(补0)由编译器定——跨编译器代码不许依赖。需要算术移位就明确写除法或强转,让意图落在纸面"],["移位数越界","≥位宽是UB","uint32_t x; x<<32 是UB(常见于「移位数是变量」的代码路径)——移位前断言或掩码(shift & 31)。硬件乘除模块的驱动里出过真实事故"],["整型提升暗算","uint8_t的陷阱","uint8_t a=0x80; a<<1 时a先被提升为int再移位——结果0x100而不是0(可能是你想要的,也可能不是);(uint8_t)(a<<1)明确截断。第6章整型提升专讲,位操作是重灾区"]]},{"g":"位域与寄存器映射","r":[["位域的甜","语法直观","struct { uint32_t en:1; uint32_t mode:3; } 直接reg.mode=5——比掩码好读。芯片厂头文件(如某些SDK)也这么定义寄存器"],["位域的苦","布局不可移植","位分配顺序(先低位还是先高位)、跨字节排布、对齐——全是实现定义:GCC与其他编译器可能不同,大小端机器必不同。<strong>协议报文、跨平台数据结构禁用位域</strong>,用移位掩码手工打包——总线科目的报文代码必须遵守","「位域版协议结构体在A平台好好的,B平台全乱」是跨平台移植经典事故——DBC解析代码用移位实现,别用位域"],["寄存器结构体映射","CMSIS风格","typedef struct { volatile uint32_t CR; volatile uint32_t SR; ... } UART_T; #define UART0 ((UART_T*)0x40011000)——结构体成员顺序+对齐严格对照手册偏移;volatile逐成员或整体加,漏了就是隐形炸弹"],["读改写的原子性","中断也在改寄存器","主循环REG |= A(读改写三步)途中被中断打断、中断里改了同一寄存器B位→主循环写回时把B覆盖——共享寄存器的读改写要关中断,或用芯片提供的原子置位/清位寄存器(BSRR类设计正是为此)"]]}]},{"t":"整数与类型:安静的暗礁","sub":"隐式转换·溢出·对齐·字节序","fig":"ecalign","map":[["整型提升","小于int的类型运算前自动升为int"],["有无符号混算","比较时有符号被转无符号:-1 > 1u 成立!"],["溢出","无符号回绕(定义明确);有符号溢出=UB"],["固定宽度","stdint.h:uint8_t/int32_t;嵌入式禁裸int横行"],["对齐与填充","结构体成员按对齐排布,编译器塞入padding;字节序:大端小端"]],"spine":"C 的类型系统像个过分热心的管家:你没吩咐,它就悄悄把 uint8_t 升成 int、把 -1 转成 4294967295、在结构体里塞进你看不见的填充字节。它从不报告这些动作——直到某个比较表达式莫名为真、某个 sizeof 大得离谱,你才发现管家早已重新布置了房间。","g":[{"g":"隐式转换","r":[["整型提升","先升int再运算","小于int的类型(uint8_t/int16_t等)参与运算前提升为int:uint8_t a=200,b=100; a+b 按int算=300不回绕——但赋回uint8_t才截断。位操作、比较、算术全受影响,「小类型的运算结果」永远先问一句:提升后是什么"],["有无符号比较","史诗级陷阱","if (-1 > 1u):-1被转换为无符号(0xFFFFFFFF),条件成立!常见现场:for (uint32_t i = len-1; i >= 0; i--) 当len=0时i回绕成最大值,i>=0恒真死循环","开-Wall -Wextra会警告sign-compare——又一个「警告全开」的理由;MISRA干脆禁止有无符号混算"],["赋值截断","高位默默丢弃","uint16_t x = 0x12345; 只留0x2345,不报错——协议里长度字段、定时器计数赋值时的静默杀手。编译器警告(-Wconversion)可拦,代价是警告海,车规项目常开"],["浮点转整","截断向零","(int)3.9 = 3、(int)-3.9 = -3(不是四舍五入也不是floor)——控制算法定点化时按需求明确用lround/floor/ceil,别赌默认行为"]]},{"g":"溢出与固定宽度","r":[["无符号回绕","定义明确,善加利用","uint32_t的0xFFFFFFFF+1=0——定义良好。经典妙用:tick时间差 (uint32_t)(now - then) 跨回绕仍正确(os科目tick章呼应)——前提是「减法+无符号+同宽度」三要素"],["有符号溢出","UB!","int的INT_MAX+1不是回绕,是未定义行为——编译器可以假设它不发生并据此优化(if(x+1<x)可能被整个删掉)。累加器、PID积分项用有符号时必须先判限幅再加"],["stdint.h","嵌入式的normal装备","uint8_t/int16_t/uint32_t宽度明确;int在不同平台可能16位(某些DSP)或32位——协议、寄存器、跨平台数据一律固定宽度类型;循环计数等本地变量可用uint32_t或size_t"],["printf的搭子","PRIu32与%zu","printf(\"%d\", (uint32_t)x) 在某些平台是UB——固定宽度类型配inttypes.h的PRIu32宏,size_t配%zu。小事,但车规静态检查会揪"]]},{"g":"对齐与结构体填充(配图)","r":[["对齐规则","各回各的整数倍地址","uint32_t要住4的倍数地址、uint16_t住2的倍数——编译器在结构体成员间塞padding凑对齐,并把结构体总大小补到最大成员对齐的倍数。struct {uint8_t a; uint32_t b; uint16_t c;} 实际12字节,不是7"],["成员排序省内存","从大到小排","把成员按对齐需求从大到小排列,padding最少:上例改为b,c,a → 8字节——大量实例化的结构体(报文池、对象数组),排序就是省RAM"],["packed的代价","省了空间,慢了访问","__attribute__((packed))去掉padding——协议报文映射常用;代价:成员可能非对齐,访问变慢甚至(某些架构)出错。安全法则:packed结构体成员不取地址传给别人用","「结构体直接memcpy成报文发出去」必须packed+固定宽度+确认字节序——三件套缺一,对端解出来就是乱码(总线科目字节序条呼应)"],["sizeof是你的探测器","别猜,量","静态断言锁尺寸:_Static_assert(sizeof(MsgT)==8, \"size!\") ——协议结构体尺寸变化在编译期就报警,别等到线上抓包才发现"]]},{"g":"字节序","r":[["大端小端","低字节放哪","小端(x86/多数ARM默认):低字节在低地址;大端(网络序/Motorola):高字节在低地址。uint32_t 0x12345678 在小端内存里是 78 56 34 12——十六进制dump读内存时先问自己「这是什么端」"],["何时必须处理","跨系统边界","网络协议(网络序=大端)、CAN信号(DBC里Intel/Motorola并存)、文件格式、跨芯片通信——数据跨出本机边界就要明确端序;单机内部自己玩不用管"],["可移植转换","移位拼装最稳","v = buf[0] | (buf[1]<<8) | (buf[2]<<16) | ((uint32_t)buf[3]<<24)——逐字节移位与端序无关(按协议定义写),比强转+条件字节交换可移植。注意buf[3]先转uint32_t再移,否则整型提升后移出int范围又是UB"]]}]},{"t":"函数与中断边界:并发的最小常识","sub":"可重入·原子性·临界区——单片机上的多线程课","map":[["可重入函数","不用全局/static、不调不可重入函数、参数栈上算——中断里才敢调"],["原子性","多字节变量的读写会被撕裂;读改写三步会被插队"],["临界区","关中断保护共享数据;短进短出"],["标准库雷区","printf/malloc/strtok多数不可重入"],["设计模式","单写单读环形缓冲;标志+主循环处理;双缓冲"]],"spine":"中断的本质是「你的代码在任意两条指令之间可能被插入另一段代码」——于是所有「读-改-写」不再安全,所有多字节变量的读写可能只完成一半。这一章是没上RTOS时的并发课;上了RTOS,把「中断」换成「高优先级任务」,道理原样成立(与os科目通信同步章互为表里)。","g":[{"g":"可重入性","r":[["定义","执行到一半再进一次也对","函数被打断后重入(中断里又调它),两次执行互不污染——条件:只用栈上数据(参数与局部变量)、不碰全局/static、不调用不可重入函数。中断服务里调用的每个函数都必须可重入"],["典型不可重入","strtok与静态缓冲","strtok内部记状态(static)、很多库的返回静态缓冲(gmtime等)、带static计数的自写函数——主循环用一半、中断再进,状态互踩。识别方法:看它有没有「记忆」"],["printf的双重罪","不可重入+慢","多数嵌入式libc的printf不可重入且耗时——ISR里printf是双重违规(接os科目RTT条)。真要中断里留痕:写volatile变量或环形日志缓冲,主循环再输出"],["malloc同罪","堆操作不可打断","malloc/free操作全局堆链表,中断里调用=链表腐坏——RTOS下有临界区保护版本,裸机中断里一律禁止"]]},{"g":"原子性与撕裂","r":[["多字节撕裂","读一半被改","32位机上读uint64_t、8位机上读uint16_t——分多条指令完成,中途被中断改写:读到「前一半旧值+后一半新值」的嵌合体。时间戳、编码器计数这类多字节共享变量是重灾区"],["读改写插队","flags |= BIT 不安全","读flags→改→写回三步,中断插在中间改了flags→写回覆盖——第5章寄存器同款问题在变量上重演。counter++同理:一条C语句≠一条指令"],["什么是安全的","单字节+单向","单字节(或字长内对齐单词)volatile变量、且「一方只写一方只读」——如ISR置uint8_t标志、主循环读后清。超出这个安全岛,就要临界区"],["临界区写法","关中断短平快","保存中断状态→关中断→操作共享数据(几条语句!)→恢复状态。「恢复」而不是「打开」:嵌套调用时才不会把外层的关中断意外打开——用芯片/OS提供的enter/exit宏,别手写sei/cli"]]},{"g":"共享数据设计模式","r":[["单写单读环形缓冲","无锁经典","ISR写入head、主循环读取tail,各自只改自己的指针——head/tail用字长内volatile变量,天然无锁。串口收发缓冲的标准姿势;多写者/多读者就必须加锁,别硬套"],["标志位模式","ISR记账,主循环干活","中断只置标志/存数据,复杂处理留给主循环(裸机版的「顶半/底半」,与os科目呼应)——控制中断在μs级离场"],["双缓冲","一块写一块读","采集类:DMA/ISR填缓冲A时,主循环处理缓冲B,填满交换指针——交换动作在临界区内一瞬完成。图像、ADC批量采集的标准结构"],["设计检查三问","评审清单","每个共享变量问:①几方读写?②单次访问原子吗?③读改写有没有保护?——三问过不去的,加临界区或改模式。这三问也是第8章评审清单的核心"]]}]},{"t":"预处理与工程规范:宏、头文件与MISRA","sub":"C的「文本游戏」与车规的纪律","map":[["宏的三坑","参数不加括号;多语句宏;参数副作用"],["do-while(0)","多语句宏的标准包装"],["条件编译","版本裁剪;调试开关;头文件守卫"],["MISRA C","车规C子集:必要规则+建议规则;偏差要走流程"],["静态检查","cppcheck/PC-lint/Polyspace;警告全开是底线"]],"spine":"宏是纯文本替换——预处理器不懂C语法,只做「查找替换」。所有宏的坑都源于此:SQ(a+b) 展开成 a+b*a+b、宏里第二条语句逃出 if 的管辖、MAX(x++,y) 让 x 加了两次。理解「文本替换」四个字,三大坑一眼看穿;而 MISRA 的意义,是把这些「一眼」固化成机器可查的纪律。","g":[{"g":"宏的三大坑","r":[["参数不加括号","运算符优先级劫持","#define SQ(x) x*x → SQ(a+b)=a+b*a+b。规矩:参数与整体都加括号 #define SQ(x) ((x)*(x))——括号不要钱,bug要命"],["多语句宏","if下的逃兵","#define RESET() cnt=0; flag=0; → if(err) RESET(); 只有cnt=0受if管辖。标准解法do{...}while(0)包装:语法上成为单语句,if/else下行为正确——「为什么老代码都裹do-while(0)」的答案"],["参数副作用","展开几次执行几次","#define MAX(a,b) ((a)>(b)?(a):(b)) → MAX(x++,y) 里x++执行两次。规矩:宏参数不带副作用;更好:能用static inline函数就别用宏(类型检查+单次求值,优化后零开销)"],["宏vs typedef vs const","各归各位","常量用const或enum(有类型、可调试);类型别名用typedef(#define uint32 unsigned int 在 uint32* a,b 时炸:b是int!);宏留给条件编译与真正的文本操作(拼接#、字符串化##)"]]},{"g":"条件编译与头文件","r":[["调试开关","集中管理","#if DEBUG_ENABLE 包住调试代码;开关集中在一个config.h——散落各文件的#if 0是工程臭味,三个月后没人敢删"],["版本与平台裁剪","一套代码多个产品","#if defined(PRODUCT_A) 裁剪功能——但分支爆炸是维护噩梦:能用「配置表+运行时判断」就少用条件编译;必须用时,保证每个配置组合都有CI编译覆盖"],["头文件守卫","双保险","#ifndef XXX_H / #define XXX_H / #endif(标准)或#pragma once(方言但普及)——重复包含的重复定义错误从根上灭掉。守卫宏命名与文件名一致,拷贝头文件忘改守卫名=诡异的「声明失踪」"],["最小包含原则","头文件只包含必需","头文件里能用前置声明就不include(减少耦合与编译时间);.c文件把自己的头文件放第一个include——强制验证头文件自包含性。大工程编译提速的第一刀"]]},{"g":"MISRA C与静态检查","r":[["MISRA是什么","车规C子集","MISRA C(2012版主流)一百多条规则,分强制/必要/建议——本课各章的坑几乎都有对应条款:禁递归、禁动态内存、位操作用无符号、禁有无符号混算、单一出口(建议级)……理解了坑,规则就不是八股"],["偏差流程","不是不能违反,是要签字","确有理由违反(如性能关键处),走偏差(deviation)流程:记录理由+评审签字——「有纪律的例外」是车规与作坊的分水岭"],["静态检查工具","机器查大半","cppcheck(免费)、PC-lint/Polyspace(商用,车规常用)对照MISRA自动扫——人查风格,机器查规则。CI里每次提交自动跑,增量零违规"],["检查清单文化","评审三件套","①编译零警告(-Wall -Wextra -Werror)②静态检查零新增违规③人工评审聚焦:共享数据三问(第7章)+ISR边界+指针生命周期——三层漏斗,漏网之鱼所剩无几"]]}]},{"t":"未定义行为:「能跑」不等于「对」","sub":"与编译器优化和平共处","map":[["UB是什么","标准不规定后果:炸、错、或碰巧正确——都合法"],["常见UB清单","有符号溢出;越界;野指针;移位越界;严格别名;序列点"],["优化的逻辑","编译器假设UB不存在,据此大胆变换代码"],["「开O2就坏」","不是编译器bug,是代码里的UB被优化暴露"],["防线","警告全开;UBSan(可仿真);静态分析;不写聪明代码"]],"spine":"未定义行为最迷惑人的地方是:它经常「碰巧能跑」。-O0 下变量老实在内存里、越界正好踩到没人用的地方——一切正常;开 -O2,编译器按「UB不存在」的假设重排了世界,潜伏三年的地雷集中引爆。所以嵌入式圈那句老话:「换个优化等级就出错的代码,先查自己,再怀疑编译器」——后者的概率,大约是买彩票。","g":[{"g":"理解UB","r":[["三种行为等级","实现定义·未指定·未定义","实现定义:编译器文档必须写明(如有符号右移);未指定:几种可能之一(如函数参数求值顺序);未定义:标准彻底放手——程序整体失效都合法。分清等级,才知道哪些能依赖文档、哪些绝对不碰"],["编译器的视角","UB=优化许可证","「有符号溢出是UB」→编译器假设溢出永不发生→ x+1>x 恒真,直接删掉判断。不是编译器恶意,是标准给了它这个权利——你写了UB,等于亲手签了授权书"],["为什么嵌入式尤其危险","没有护栏","桌面OS的段错误至少给个崩溃现场;MCU上UB安静地改掉一块内存,现象在三天后另一个模块爆发——第2章「谁踩了我的变量」的很多案子,凶手就是某处UB"]]},{"g":"高频UB清单(按命中率)","r":[["数组越界","第一大户","读写arr[len]:栈上越界踩相邻变量/返回地址(可能被劫持),全局越界踩邻居(map文件破案)——循环边界off-by-one、strcpy无长度限制是两大来源:一律用带长度版本(strncpy/snprintf)+边界断言"],["野指针与use-after-free","第二大户","第3章三纪律的违反者——配合数据断点与静态分析围捕"],["有符号溢出与移位越界","第5/6章讲过","累加器、定时器差值、移位数变量——回看对应章的防法"],["严格别名规则","隐蔽高手","用不兼容类型的指针访问同一对象(float f; *(int*)&f)是UB——编译器假设不同类型指针不指向同一内存,优化后读到旧值。合法通道:memcpy或union(GCC明确支持)——报文解析代码的第二颗雷(第一颗是对齐)"],["修改字符串字面量","写Flash","char *s = \"abc\"; s[0]='A'; ——字面量在rodata。要可改就 char s[] = \"abc\"(拷到栈/RAM)。一字符之差(*与[]),两个世界"],["序列点问题","i = i++","同一表达式对同一变量多次修改/读写无序:i=i++、f(x++,x)——结果看编译器心情。别炫技,拆成两句"]]},{"g":"防线与工具","r":[["警告即军情","-Wall -Wextra -Werror","编译器认得出大量UB苗头(未初始化、越界常量索引、sign-compare)——警告当错误,新增代码零警告。最便宜的防线,没有之一"],["动态检测","UBSan/ASan在仿真跑","地址消毒(ASan)与UB消毒(UBSan)在目标板资源不够,但可以在QEMU/宿主机单元测试里跑(逻辑代码占大头)——CI里每晚扫一遍,越界与UB在合入前现形(与os科目「仿真与CI」条呼应)"],["静态分析","不运行也能抓","Polyspace能证明「此处必然越界/可能溢出」;cppcheck抓低级错——静态+动态+评审三层网(第8章清单文化)"],["心法","不写聪明代码","「我知道这里溢出会回绕所以故意用」——三个月后维护者不知道。需要技巧处写注释说明依据(标准条款/编译器文档),否则选平直写法:嵌入式代码的美德是无聊"]]}]}],"F":[{"t":"中断共享变量的正确写法","when":"任何「ISR与主循环/任务共享数据」的设计与评审时","s":[{"b":"过安全岛三问","p":"①变量是单字节(或对齐的单字长)吗?②是否严格「一方写一方读」?③有没有读-改-写操作?——三问全「是/无」才在安全岛内。","f":[["单字节+单写单读+无读改写","volatile修饰即可,无需临界区"],["任一不满足","进入下一步选保护方案"]]},{"b":"选保护方案","p":"多字节共享→临界区包住整读整写;读改写(flags、counter)→临界区包三步;数据流式传递→改用单写单读环形缓冲(无锁);批量数据→双缓冲交换。"},{"b":"写对临界区","p":"用enter/exit宏(保存-关闭-恢复中断状态),包住最少语句;临界区内禁调函数、禁循环、禁阻塞——几条语句内必须离场。"},{"b":"volatile逐个补齐","p":"所有ISR触碰的共享变量声明volatile(包括环形缓冲的head/tail)——记住分工:volatile管「编译器别缓存」,临界区管「别被打断」,两者不可互替。"},{"b":"评审与压测","p":"评审用第7章三问过每个共享变量;压测用高频中断+边界数据跑通宵——撕裂类bug平时十天一遇,压测一小时暴露。","trap":"最危险的错觉:「测试没出问题=写对了」——并发bug是概率性的,正确性只能靠设计保证,测试只负责抓漏网之鱼。"}]},{"t":"协议结构体的安全落地","when":"把总线报文/Flash存储映射成C结构体时","s":[{"b":"约定三要素","p":"和对端书面确认:字节序(Intel/Motorola)、对齐方式(packed?)、各字段宽度与偏移——口头「都按默认」等于没约定。"},{"b":"结构体三件套","p":"固定宽度类型(uint8_t/uint16_t…)+ packed属性(封装成宏)+ _Static_assert锁总尺寸——三件套齐了,结构体才配代表协议。","trap":"禁用位域表达协议字段——布局实现定义,跨编译器/跨端必乱(第5章)。多位字段用移位掩码存取。"},{"b":"访问方式选边","p":"性能敏感且平台确认支持非对齐→可控使用packed结构体直接访问;要求可移植→逐字节移位拼装读写(与端序无关,编译器会优化)。","f":[["单平台自family产品","结构体映射,注释标明平台假设"],["跨平台/对外交付","移位拼装,彻底免疫对齐与端序"]]},{"b":"边界与校验","p":"解析入口先查长度(收到的字节数≥结构体尺寸?)、再查字段范围(枚举值合法?长度字段不超缓冲?)——协议解析是越界读写的第一入口,防御式检查不省。"},{"b":"用真实报文回归","p":"抓一组真实trace作为单元测试金标准(含最大值/最小值/异常帧),CI里每次跑——协议代码改一行,全量回归一遍。"}]},{"t":"排查「开优化就出错」","when":"-O0正常、-O2异常,或换编译器后行为变化时","s":[{"b":"先默念咒语","p":"「编译器有bug的概率约等于中彩票」——把怀疑对象锁定为自己代码里的volatile缺失与UB,心态摆正少走三天弯路。"},{"b":"二分定位","p":"对可疑文件单独降优化(Makefile按文件设-O0)二分锁定问题文件;再用#pragma GCC optimize或函数attribute细化到函数级。"},{"b":"查volatile缺失","p":"锁定函数里排查:等待标志的循环、寄存器访问、ISR共享变量——看反汇编确认:变量是否被缓存进寄存器、循环是否被删。","f":[["反汇编里循环消失/只读一次","volatile缺失实锤,补上收工"],["volatile齐全","进入UB排查"]]},{"b":"查UB清单","p":"按命中率过第9章清单:越界(开ASan仿真跑)、有符号溢出、严格别名(报文强转!)、未初始化变量、移位越界——UBSan/静态分析辅助。"},{"b":"修复与固化","p":"修复后在-O0/-O2/-Os三档全部回归;把该案例写进团队踩坑库与检查清单——同类问题下次评审时直接拦截。","trap":"用「保持-O0交付」逃避问题=把地雷原样埋进产品:优化暴露的从来不是新bug,是一直存在的bug。"}]},{"t":"C代码评审检查清单","when":"评审嵌入式C代码,或自查提交前","s":[{"b":"边界与指针","p":"每个数组访问有边界保证吗?每个指针「声明即初始化、free后置NULL、不返回局部地址」吗?字符串操作都是带长度版本吗?"},{"b":"共享与中断","p":"共享变量过第7章三问;ISR里只调可重入函数、无printf/malloc、μs级离场;临界区短进短出且用enter/exit宏。"},{"b":"类型与运算","p":"位操作全无符号;有无符号不混算;小类型运算警惕整型提升;协议字段固定宽度;移位数有界;有符号加法有限幅。"},{"b":"关键字与结构","p":"寄存器/共享变量volatile齐全;只读数据const(大表进Flash);模块私有static;协议结构体三件套(固定宽度+packed宏+静态断言)。"},{"b":"工程纪律","p":"零警告;静态检查零新增;宏参数带括号、多语句do-while(0);头文件守卫+自包含;魔法数字有名字。","trap":"清单的正确用法是「作者自查后再评审」——评审者拿清单抓漏,而不是替作者走清单;评审耗时超过30分钟说明提交批次太大,拆。"}]}]},

{"k":"pl","name":"普拉提","en":"PILATES","no":"16","eqLabel":"动作速查","flLabel":"练习路径","lede":"普拉提不是「温和版健身操」,而是一套有百年历史、自成体系的<strong>身体控制训练法</strong>——创始人约瑟夫·普拉提给它起的原名就叫 Contrology(控制学)。这门课从<strong>发展史与流派</strong>讲起(古典与当代之分,来龙去脉一次说清),建立<strong>核心概念</strong>(呼吸、中立位、脊柱逐节运动),然后进入两大动作库:<strong>垫上普拉提</strong>(经典34式的基础与进阶)与<strong>大器械普拉提</strong>(Reformer、Cadillac、万得椅、梯桶、脊柱矫正器),每个动作给做法、呼吸、要点、常见错误与退阶。与康复理疗教练手册、推拿、健康生活科目互相接线。<strong>内容为学习笔记:急性疼痛期、孕产、骨质疏松等人群请在专业教练/医生指导下练习。</strong>","M":[{"t":"总论:普拉提是什么","sub":"控制学——百年前的「核心训练」先知","fig":"plprin","map":[["一句话定义","以核心控制为中心的低冲击精准训练体系;原名 Contrology"],["六大原则","专注;控制;核心;呼吸;精准;流畅"],["两大分支","垫上(自重,最普及);器械(弹簧辅助/阻力,更精准)"],["与瑜伽的区别","普拉提练控制与核心(动中稳);瑜伽重柔韧冥想(静中定)"],["适合谁","久坐族;体态问题;产后恢复;康复过渡;运动员交叉训练"]],"spine":"普拉提的身份常被误解:它不是拉伸课、不是女性专属、也不只是「练核心」。约瑟夫·普拉提本人是拳击手和体操家,他设计这套体系的目标是「均匀发展的身体、完全的身心控制」——今天的物理治疗界、职业运动队和舞蹈学院都在用它,理由相同:它教会身体「在正确的位置用正确的肌肉」。","g":[{"g":"定义与定位","r":[["Contrology","控制学","约瑟夫给自己体系的命名:通过专注的、精确控制的动作,均匀发展全身肌肉。「普拉提」是他去世后大家对这套方法的称呼——先有理念后有名字,理念就是「控制」二字"],["低冲击·高控制","它难在哪","没有跳跃冲击、不举大重量,难度全在「控制」:慢速、精准、核心全程参与——看着轻松,做标准了小肌群酸到发抖。「简单的动作做精确」正是它的门槛与价值"],["核心先行","Powerhouse","普拉提把腹部、下背、臀、骨盆底这一圈称为「能量屋」(Powerhouse):一切动作由核心启动、由核心稳定——比健身界流行「核心训练」概念早了半个多世纪"],["现代三大应用场景","健身·康复·表演","①大众健身:体态改善、腰颈不适人群的安全训练;②康复领域:物理治疗师用器械普拉提做损伤后过渡训练;③舞蹈/运动员:控制力与不对称纠正——一套体系三个市场,这也是普拉提馆商业模式的基础"]]},{"g":"六大原则(配图,后人从其著作总结)","r":[["专注 Concentration","心到身到","每个动作全程有意识地觉察——「身体听从心的指挥」;走神的一组等于白做。练习时教练不断提示「感受哪里发力」,就是在执行这条"],["控制 Control","不靠惯性","动作全程受控,不甩不坠:慢起慢回,离心阶段(还原)与向心同样认真——与康复科目「2-2-2节奏」同源"],["核心 Centering","由中心发起","一切动作从Powerhouse启动:四肢是末端,核心是发动机——「先稳住中间,再移动两头」"],["呼吸 Breathing","动作的节拍器","呼吸与动作严格配合(通常发力呼气),用横向呼吸保持核心张力(第3章细讲)——约瑟夫:「最重要的是学会正确呼吸」"],["精准 Precision","一次标准胜过十次将就","位置、幅度、对线都有明确标准——普拉提宁可幅度小而准,不要大而歪。「少而精」的动作哲学"],["流畅 Flow","动作如流水","动作之间连贯优雅,无停顿卡壳——整节课像一支编排好的舞;流畅是控制力成熟的外在表现"]]},{"g":"与相邻体系的分界","r":[["vs 瑜伽","动中稳 vs 静中定","瑜伽多为静态保持+柔韧+呼吸冥想,哲学根源印度;普拉提是动态控制+核心稳定,根源西方体操康复——垫子看着像,内核两回事。混着练互补,不冲突"],["vs 力量训练","控制 vs 负荷","撸铁追求渐进负荷长肌肉;普拉提追求神经控制与肌肉均衡——普拉提练不出大围度,但能把「不会发力的肌肉」唤醒。理想组合:普拉提打地基,力量训练盖楼(接康复手册微力量观)"],["vs 康复训练","邻居关系","临床普拉提本就是康复工具箱一员:弹簧「助力」特性让器械普拉提能给虚弱者降难度——这是它与康复理疗手册天然接线的原因;但普拉提教练≠治疗师,急性伤病仍需先就医(红线与康复手册一致)"],["常见误解三连","澄清","「普拉提=女性运动」——创始人是男拳击手,早期学员一半是男舞者;「普拉提=拉伸」——它以力量控制为主、柔韧为辅;「垫上是入门、器械是高级」——垫上自重无辅助,其实更难,器械反而适合入门(第7章展开)"]]}]},{"t":"发展史:从战俘营到全球工作室","sub":"一个人的身体实验,如何变成一个行业","map":[["创始人","约瑟夫·普拉提(1883-1967):德国人;体弱少年自我改造成运动全才"],["起源","一战英国拘留营:带病友锻炼;用床架弹簧给卧床者做阻力——器械雏形"],["纽约时代","1926年与妻子Clara开工作室;舞蹈圈口碑传开(巴兰钦、玛莎·葛兰姆)"],["传承","第一代弟子(Elders)各立门户→古典派与当代派分流"],["行业化","2000年商标案:「Pilates」判为通用名词——行业爆发;进入物理治疗与中国市场"]],"spine":"普拉提的历史有个动人内核:一个从小体弱(哮喘、佝偻病)的德国孩子,用自创的方法把自己练成拳击手、体操家和马戏演员——然后在战俘营里,用病床弹簧帮伤员在床上就能抗阻训练。今天Reformer上那几根弹簧,血统可以一直追到那张病床。","g":[{"g":"约瑟夫·普拉提其人","r":[["体弱的起点","自我改造的原型","1883年生于德国门兴格拉德巴赫,幼年哮喘、佝偻病、风湿热——他遍学体操、拳击、滑雪、潜水,青年时体格好到给解剖挂图当模特。「身体是可以被系统重塑的」——这套信念后来成了整个体系的底色"],["一战拘留营","体系诞生地","一战爆发时他在英国巡演(拳击/马戏),作为德侨被拘留在兰开斯特与曼岛营地——他在营中组织同伴每日锻炼,并把病床的弹簧改装到床架上,让卧床伤病员也能做抗阻练习。流感大流行期间其团队健康状况良好的传说,为他日后声名添了传奇色彩(传说成分,姑妄听之)"],["床与器械的血缘","看家器械的原型","Cadillac(秋千床)至今保留「床+框架+弹簧」的样子——就是战俘营病床的直系后代;Reformer则把「滑动床板+弹簧阻力」做成了专用器械。理解这段历史,就理解了普拉提器械为什么长这样:它们生来就是「康复床」"],["纽约工作室","1926,与Clara","战后经德国(拒绝为新政权训练军队之说流传)移民美国,与后来的妻子Clara在纽约第八大道开设工作室——楼上就是芭蕾舞团排练厅,地利成就了它与舞蹈圈的联姻"]]},{"g":"从小圈子到大行业","r":[["舞蹈圈的口碑","第一批铁粉","巴兰钦(纽约城市芭蕾创始人)送舞者来「见约瑟夫」修伤;现代舞宗师玛莎·葛兰姆也是座上客——舞者带伤高强度工作,普拉提「精准+低冲击+快速恢复」正中要害。此后几十年它一直是舞蹈学院的隐形必修课"],["Clara的角色","被低估的联合创始人","护士出身的Clara温和细致,负责教学与因人调整——许多弟子回忆「约瑟夫定方法,Clara教会我们怎么教人」。普拉提教学法(观察-触觉提示-个体化)的传统多半源自她"],["第一代弟子 Elders","开枝散叶","Romana Kryzanowska(古典正统继承人)、Kathy Grant、Ron Fletcher、Eve Gentry、Carola Trier等各自开馆授徒——师承不同侧重不同,流派分化的种子就此埋下"],["2000年商标案","「普拉提」归全人类","一位继承者曾注册「Pilates」商标并四处诉讼;2000年纽约联邦法院判定该词为通用名称(如同「瑜伽」)——任何人可用。判决后行业井喷:培训体系(BASI、STOTT、Polestar、Peak等)全球扩张,也随之进入中国并在近年爆发式增长"]]},{"g":"流派地图:古典与当代","r":[["古典普拉提","忠于原版","以Romana一脉为代表:严格按约瑟夫的动作清单、顺序与器械规格教学——垫上34式按原序走,强调传承的完整性。优点:体系纯正节奏流畅;局限:部分原版动作(如高强度卷曲)对现代久坐人群偏激进"],["当代普拉提","科学改良","STOTT、BASI、Polestar等体系:结合现代运动科学与康复医学改造——中立位取代部分「印刻位」偏好、动作分级细化、加入退阶变式。今天商业馆和物理治疗诊所的主流;本课动作讲解以当代通行版本为基准,标注古典差异"],["临床普拉提","进康复科的普拉提","物理治疗师主导(如澳洲DMA、Polestar康复方向):把器械普拉提用于腰痛、术后、神经康复的过渡训练——弹簧助力让「还做不了自重训练的人」先动起来。与康复理疗手册的渐进负荷观完全同频"],["怎么选","对学习者的建议","入门不必站队:选认证靠谱、会做评估、给退阶的教练比选流派重要;了解流派的价值在于——看到不同馆动作细节不一致时,知道那是「方言差异」,不是谁错了"]]}]},{"t":"核心概念:普拉提的「语法」","sub":"呼吸·中立位·逐节运动——所有动作的公共地基","map":[["横向呼吸","肋骨向两侧扩张吸气;呼气时肋骨下沉核心收紧;发力配呼气"],["中立位","骨盆与脊柱的自然生理曲度位;耻骨与髂前上棘一个平面"],["印刻位","腰椎轻贴垫面(骨盆略后倾)——仰卧抬腿类的保护位"],["脊柱逐节运动","像车链一节节卷起放下(articulation)——卷起卷落的灵魂"],["肩胛与轴向延伸","肩胛稳定入位;头顶向远处「长高」——每个动作的默认设置"]],"spine":"普拉提动作千变万化,底层语法只有几条:呼吸给核心「充气加压」,中立位给脊柱「找到原点」,逐节运动让脊柱「一节一节说话」,肩胛稳定与轴向延伸给动作「立起骨架」。语法通了,后面两章的动作只是「造句」。","g":[{"g":"呼吸:横向(肋间)呼吸","r":[["怎么做","肋骨开合,不耸肩不鼓肚","双手放肋侧,吸气把气「吸进两侧手掌」——肋骨横向撑开;呼气肋骨下沉内收,同时下腹微微收紧(想象「轻轻拉上一条低腰裤拉链」)。区别于胸式(耸肩)与纯腹式(鼓肚)——横向呼吸让呼吸与核心张力共存"],["为什么这样呼","保压不松核","动作全程需要核心张力,而普通腹式呼吸一吸气肚子就松——横向呼吸把气「装进侧后肋」,腹壁张力不丢。这是普拉提呼吸与瑜伽腹式呼吸的关键差异"],["呼吸配合口诀","发力呼气,准备吸气","一般规则:动作的用力段呼气(卷起时呼)、还原/准备段吸气——呼气时腹横肌自然激活,等于给发力「顺风」。与康复手册「用劲吐气」同一条原理","初学最常见问题是憋气——记不住配合就先保证「别憋气」,节奏错了小事,憋气伤血压(中老年尤其,接康复手册红线)"],["百次呼吸法","短促节拍","Hundred动作用「吸5拍呼5拍」的节奏呼吸——训练呼吸与动作解耦的控制力,也是普拉提呼吸法的招牌应用"]]},{"g":"中立位与印刻位","r":[["骨盆中立位","身体的出厂设置","仰卧屈膝:耻骨联合与两侧髂前上棘构成的三角形平行于地面(想象骨盆是一碗水,不前倒不后倒)——腰下自然留一条小缝隙。中立位下脊柱保持自然生理曲度,是承重与发力的最优位——当代普拉提的默认起点(接教练手册骨盆四态:能找到中立,才谈得上纠偏)"],["印刻位 Imprint","保护性的轻贴","呼气让腰椎轻轻「印」向垫面(骨盆微微后倾)——不是用力压死,是「羽毛落在垫上」。用在双腿离地的仰卧动作(如双腿伸展):腰腹力量不足时防止腰弓离地代偿","古典派偏好印刻、当代派偏好中立——历史「方言」之一;实用判断:腿一伸远腰就拱起离垫→用印刻;控制得住→用中立"],["怎么自查","一碗水与一只手","中立:平躺时手掌插入腰下,恰好一掌厚空隙;印刻:呼气时那只手被轻轻贴住——与康复手册「靠墙腰后间隙」测试同一逻辑,垫上版"]]},{"g":"脊柱逐节运动与稳定要素","r":[["Articulation","像卷车链","卷起(Roll Up)与卷落时,脊柱一节一节离开/回到垫面——不许「整块板」起落。练的是每节椎体的独立控制与深层小肌肉——普拉提改善脊柱僵硬的招牌机制,也是「肩桥」「卷落」类动作的灵魂"],["肩胛稳定","入位再动手","动作前肩胛「后收下沉入口袋」(不耸肩不翻翘)——上肢发力有了稳定平台。与康复手册YTW、教练手册翼状肩胛条互认:普拉提大量动作本身就是肩胛稳定训练"],["轴向延伸 Axial Elongation","一边动一边长高","每个动作默认头顶向远方延伸、尾骨向反向拉长——脊柱在「被拉长的状态」下运动,椎间受力更均匀。教练口令「长高一点」「头顶有根线拉着」说的就是它(接推拿/体态科目的头前伸纠正)"],["骨盆稳定","动腿不动盆","单腿画圈类动作的考题:腿在动,骨盆纹丝不动(双手放髂前上棘自查)——「近端稳定,远端灵活」,普拉提对运动链的核心要求,也正是腰痛人群最缺的能力"]]}]},{"t":"垫上普拉提:最便宜也最诚实","sub":"一张垫子,与自重的博弈","map":[["特点","零器械门槛;自重无辅助——对核心的要求反而最高"],["经典34式","约瑟夫《回归生活》原著动作清单;现代教学拆级重排"],["课程结构","唤醒呼吸→热身卷动→主序列→侧卧/俯卧→整合放松"],["等级","基础(简化变式)→中级(经典完成式)→高级(原版全幅)"],["常见代偿","颈部代偿;腰弓离垫;耸肩;憋气;用惯性甩"]],"spine":"垫上普拉提的悖论:它是门槛最低的入口(一张垫子就够),又是要求最高的考场(没有弹簧帮你,核心弱一分动作就歪一分)。所以现代教学的共识是——垫上从退阶变式起步,别一上来就挑战原版34式:约瑟夫的原版,是给1940年代的舞者写的。","g":[{"g":"垫上体系概览","r":[["经典34式","《Return to Life》","约瑟夫1945年著作列出的完整垫上序列:从Hundred开场到Push Up收尾,一气呵成约半小时——古典派按原序教学。现代人不必执念全套:34式里约三分之一对普通人偏激进(如Jackknife折刀),挑适合的练"],["现代分级","基础/中级/高级","当代体系把每个经典动作配了退阶(缩小幅度/屈膝/减杠杆)与进阶——同一个Roll Up,新手屈膝滚半程、进阶者直腿全程。本课第5章基础库全部给出退阶,照做即可"],["课程结构模板","50分钟的骨架","唤醒(呼吸+骨盆时钟5')→热身(卷落+猫式伸展5')→仰卧核心序列(15')→侧卧系列(10')→俯卧伸展系列(10')→整合与放松(5')——自练照此排,备课也照此排(与康复手册课程结构同构)"],["频率与预期","每周2-3次","每次20-50分钟,6-8周体感明显(核心觉醒、腰背轻松、体态改善)——与康复手册见效时间表一致:普拉提不是速成术,是「重新学会用身体」的课程"]]},{"g":"垫上的常见代偿(教练之眼)","r":[["颈部代偿","脖子比腹肌先累","卷腹类动作脖子酸=颈屈肌在替腹肌打工。纠正:下巴与胸口保持「一拳距离」、视线看大腿方向、必要时单手托头——「脖子累了就休息,不硬撑」是垫上第一军规"],["腰弓离垫","核心失守的警报","仰卧双腿动作中腰下空隙变大、腰部酸胀=腹压兜不住了。纠正:改印刻位、屈膝、缩小腿的幅度——腰的感受优先于动作幅度(红绿灯思维,与康复手册通用)"],["耸肩与憋气","两个默认错误","肩胛忘了「入口袋」、呼吸忘了配合——每个动作开始前默念「肩沉、气顺」两秒钟,比做错十次再纠省力"],["用惯性甩","最隐蔽的作弊","滚动类动作靠甩腿借力、卷起靠猛收脖子起跳——录像自查最有效:慢到「像水里打太极」,惯性自然消失(与康复手册「慢就是快」互认)"]]},{"g":"装备与环境","r":[["垫子","比瑜伽垫厚","普拉提垫建议8-15mm(滚动类动作护脊椎);瑜伽垫太薄,卷起卷落会硌——家里练至少垫两层"],["小道具","锦上添花","弹力圈(Magic Circle,约瑟夫原创道具)、小球、泡沫轴——增加反馈或辅助,但都不是必需:垫上体系的完整性不依赖任何道具"],["着装与时机","贴身+空腹一小时","贴身衣物便于观察对线;饭后一小时再练(大量卷腹动作);晨起脊柱含水多,卷动类幅度从小开始(与康复手册晨间原则一致)"]]}]},{"t":"垫上动作库·基础篇","sub":"十个动作,搭起垫上的骨架","eqfig":"plmatA","map":[["开场","百次拍击 Hundred;骨盆卷动 Pelvic Curl"],["腹部五件套","单腿伸展;双腿伸展;单腿直腿;双腿直腿;十字交叉"],["脊柱","卷起 Roll Up;脊柱前伸 Spine Stretch"],["侧卧","侧踢系列 Side Kick"],["俯卧","天鹅预备 Swan Prep;游泳 Swimming"]],"spine":"基础篇的十个动作覆盖仰卧、侧卧、俯卧三个面向和「稳定+卷动+伸展」三种任务——每天认真做完这一套(约20分钟),垫上普拉提的地基就打下了。记住通用检查单:肩沉、气顺、核心兜住、脖子不抢戏。","g":[{"g":"开场双雄","r":[["百次拍击 The Hundred","垫上第一式","仰卧,双腿抬起屈膝90°(进阶伸直45°),卷起头颈肩,双臂离地小幅快速上下拍动;呼吸「吸5拍呼5拍」,拍满100下。要点:腰贴垫(印刻)、下巴留一拳、拍臂时躯干纹丝不动。退阶:头放下只拍臂/脚踩地。它既是热身(升温促循环)也是核心耐力检测——约瑟夫用它给整套课「点火」","脖子酸就放下头——Hundred练的是核心与呼吸,不是颈椎;拍到脖子发抖还硬撑,是垫上头号错误"],["骨盆卷动 Pelvic Curl(肩桥)","逐节运动教学关","仰卧屈膝,呼气从尾骨开始一节一节卷起脊柱至肩胛下缘成斜板,吸气停,呼气从胸椎开始一节一节落回。要点:靠腹与臀卷,不靠腰弓「顶」;膝盖始终对脚尖。它是articulation的入门课+臀桥的普拉提版(与康复手册臀桥互认,多了「逐节」要求)"]]},{"g":"腹部五件套(Stomach Series)","r":[["单腿伸展 Single Leg Stretch","五件套之首","仰卧卷起上身,一腿屈膝双手轻扶,另一腿斜上伸出;呼气换腿。要点:躯干稳定如石,只有腿在换;伸出的腿越低越难(腰失守就抬高)。退阶:头落地"],["双腿伸展 Double Leg Stretch","伸出去收回来","卷起抱膝→吸气双臂双腿同时伸远(臂向后腿向前)→呼气画圈抱回。要点:伸展瞬间腰不离垫——四肢伸得越远,核心兜得越紧,「星形张力」的经典训练"],["剪刀式 Single Straight Leg","直腿交换","双腿伸直,一腿拉向自己两次轻拉、另一腿下探,交换如剪刀。大腿后侧柔韧+核心稳定二合一;膝可微屈,别为了直腿弓腰"],["双直腿下落 Double Straight Leg","腰的试金石","双腿并拢垂直向上,双手托头;吸气双腿下落到腰能兜住的最低点,呼气拉回。幅度=能力:腰一离垫立刻缩小范围——这是五件套里最挑腰腹的一个,量力"],["十字交叉 Criss-Cross","加入旋转","单腿伸展基础上加躯干旋转:肘找对侧膝。要点:转的是胸廓不是脖子、两侧骨盆钉在垫上——腹斜肌的主打训练,转体质量优先于速度"]]},{"g":"脊柱与侧卧","r":[["卷起 Roll Up","一节一节离开地面","仰卧双臂过头→吸气抬臂,呼气从头颈胸腰逐节卷起,指尖探向脚尖→吸气坐高,呼气逐节卷回。全程慢速无惯性。退阶:屈膝、双手扶腿后侧辅助、或只练「半程卷落」(从坐位慢慢往后卷到极限再回)——卷不起来是正常起点,半程卷落练两周,全程自然解锁","猛甩起身=零分:卷起考的是逐节控制,起不来就退阶,别用脖子和惯性抢答"],["脊柱前伸 Spine Stretch Forward","坐姿的卷","坐直双腿分开,呼气从头顶开始向前「卷」下去(像从头顶浇了杯温水),吸气逐节叠回坐高。练的是坐姿下的逐节控制+大腿后侧柔韧;腰背酸的久坐族做完这个普遍「松一口气」"],["侧踢系列 Side Kick","侧线的稳定考试","侧卧一条直线(耳肩髋踝),上腿抬至髋高做前踢后展:前踢两次弹动、后展拉长。要点:躯干像「夹在两块玻璃间」不许晃、腰侧不塌(腰下可垫毛巾找中立)。臀中肌+侧核心——步态稳定的地基(与康复手册侧抬腿互认,加了动态控制)"]]},{"g":"俯卧伸展","r":[["天鹅预备 Swan Prep","反向练背","俯卧,额头点地手掌撑于肩旁,呼气延伸着抬起头胸(先延伸后抬起,想象「向前够再升起」),吸气落回。要点:臀腿微收稳骨盆、肘贴身、抬的高度=背部力量而非腰的折角——整天弯腰刷手机的人,每天需要这个「反方向」(与麦肯基伸展神似,普拉提版更强调延伸)"],["游泳 Swimming","对侧协调","俯卧四肢伸长,抬起对侧手脚小幅交替打水,配合呼吸数拍。要点:四肢「漂」在延伸里打水,腰不发力硬拗;头顶向前延伸颈部放松。背侧链耐力+对侧协调——鸟狗式的俯卧进阶版"]]}]},{"t":"垫上动作库·进阶篇与编排","sub":"经典完成式,与把动作串成课的方法","eqfig":"plmatB","map":[["滚动类","滚如球 Rolling Like a Ball;海豹 Seal;开卷 Roll Over"],["旋转类","锯 Saw;开瓶器 Corkscrew"],["支撑类","平板与侧板 Side Plank;控制俯撑 Leg Pull"],["王牌","Teaser V字起——垫上普拉提的毕业考"],["编排原则","面向轮换;动静交替;难度波浪;首尾呼应"]],"spine":"进阶动作的通行证不是「练得久」,而是三关自测:①卷起能全程无惯性 ②双直腿下落腰全程贴垫 ③侧踢躯干纹丝不动——三关全过再碰进阶,否则做的只是「歪的高级动作」,不如标准的基础动作值钱。","g":[{"g":"滚动与翻卷","r":[["滚如球 Rolling Like a Ball","按摩脊柱的球","团身抱膝坐,收成「球」向后滚至肩胛再滚回坐稳(不落头颈)。要点:全程保持球形不散架、用呼吸控制节奏(后滚吸、回来呼)、靠腹部而非甩腿。既是脊柱按摩也是核心控制——滚不回来=球散了,抱紧一点再来","垫子要厚!脊柱一节节压过垫面,薄垫硌得练不下去;骨质疏松者跳过所有滚动类动作(安全边界)"],["海豹 Seal","古典收尾彩蛋","滚如球变式:双手从腿内侧绕抱脚踝,滚动间在脚跟相击三下「鼓掌」。控制+幽默感,古典34式的谢幕动作——能优雅完成它,滚动类毕业"],["开卷 Roll Over","卷起的镜像","仰卧双腿垂直,呼气腹部发力把双腿卷过头顶(髋离垫、腿平行地面),吸气逐节放回。腰腹控制力的大考;颈椎问题、高血压者不做(倒置类动作红线)——用「双腿伸展加深版」替代"]]},{"g":"旋转与支撑","r":[["锯 Saw","转+卷的复合","坐姿分腿,吸气躯干旋转,呼气向前卷落、小指「锯」向对侧小脚趾外侧,吸气叠起回正换边。要点:两侧坐骨钉在垫上(转体时对侧臀不离地)——胸椎旋转+呼气末端「拧毛巾式」的深度呼气训练"],["开瓶器 Corkscrew","画圈的腰腹","仰卧双腿并拢垂直,双腿并拢画圆(先小圈),躯干稳定不随圈晃。腹斜肌与骨盆控制的进阶考;腰失守就缩圈或屈膝——圈的大小就是能力的边界"],["侧板 Side Plank/Star","侧线的支撑版","侧撑肘或手,身体一条直线,进阶抬上腿成星形。要点:肩胛入位不塌陷、髋不下坠——侧踢系列的「站起来」版本,肩稳定+侧核心一次到位"],["控制俯撑 Leg Pull Front","平板的普拉提化","平板位单腿交替后抬,骨盆水平不晃。与健身平板的区别:重点不在「撑得久」而在「抬腿时躯干零波动」——又是「近端稳定远端灵活」"]]},{"g":"王牌:Teaser","r":[["Teaser V字起","毕业考","仰卧四肢伸长→呼气同时卷起躯干与双腿,成V字(腿45°,指尖探向脚尖)→控制落回。它把卷起、双腿悬控、平衡、逐节回落全部打包——古典普拉提的招牌照就是它"],["拆解练法","四步登顶","①屈膝单腿Teaser(一脚踩地)②双腿屈膝版③直腿但手扶腿后④完整版——每步练到稳定再进阶,几周到几个月都正常:Teaser是里程碑不是日常,急不来","硬甩上去的V字毫无价值且伤腰——Teaser的分数全在「上去和下来的过程」,不在顶端摆姿势"]]},{"g":"编排:把动作串成课","r":[["面向轮换","仰→侧→俯→坐","按体位分组轮换,减少翻身折腾并均衡刺激:仰卧核心→侧卧侧线→俯卧背线→坐姿旋转/前伸——本课两章动作库已按此归类,直接抓组即用"],["难度波浪","强-缓-强","高强度(五件套)后接缓和(脊柱前伸),再上强度(侧踢)——波浪式安排让核心有微恢复,动作质量不崩;整节课峰值放在中后段(Teaser位)"],["首尾呼应","呼吸开场,伸展收尾","开场:呼吸+骨盆卷动(唤醒);收尾:俯卧伸展+婴儿式或站姿卷落(还原)——与康复手册课程结构完全同构:唤醒→主体→整合"],["自练模板","20分钟基础套餐","Hundred→骨盆卷动→五件套(各8-10次)→卷起×5→脊柱前伸×5→侧踢每侧×8→天鹅预备×6→游泳30秒→站姿卷落收工——每周3次,6周后用第6章三关自测决定进阶"]]}]},{"t":"大器械:弹簧的艺术","sub":"五大器械认门——器械反而更适合入门","fig":["plref","plcad","plchair","plbarrel"],"map":[["五大器械","Reformer核心床;Cadillac秋千床;Wunda Chair万得椅;Ladder Barrel梯桶;Spine Corrector脊柱矫正器"],["弹簧的双面性","既能加阻力(挑战),又能给助力(辅助)——这是器械的灵魂"],["器械vs垫上","垫上全自重最诚实;器械可调节最精准——互为表里"],["课型","私教(器械为主);团课(垫上/Reformer团课)"],["安全","器械必须在指导下使用;弹簧挂扣双确认"]],"spine":"对器械普拉提最大的误解是「高级玩家才碰器械」——恰恰相反:弹簧可以「帮你」完成还做不了的动作(助力),也可以「难为你」(阻力),像一位不知疲倦的辅助教练。所以临床康复用它、零基础入门用它、高手也用它——同一台Reformer,三种人三种弹簧配置。","g":[{"g":"弹簧:器械的灵魂","r":[["阻力与助力","双向的妙处","弹簧拉开越长阻力越大(渐进阻力);但换个方向挂,它又能「托」着你完成动作——如弹簧吊带托腿画圈,腿的重量被部分抵消,虚弱者也能优质完成。「assist与resist一体」是器械普拉提区别于哑铃杠铃的本质"],["弹簧颜色与档位","轻重有码","各品牌用颜色标弹簧强度(如轻/中/重),动作说明常写「1红1蓝」——但品牌间不统一,记「几分力的感觉」比记颜色可靠;换馆换器械,先试弹簧再上量"],["越轻越难的悖论","反直觉考点","很多Reformer核心动作,弹簧越轻越难——弹簧重时它替你稳住滑车,轻了全靠你的核心稳:「减重量」反而是进阶。与撸铁逻辑相反,初学者最容易在这里犯懵"],["安全三查","上器械之前","①弹簧挂扣到位(视觉+手拉双确认)②滑车/踏板行程内无障碍③绳带长度对称——器械课的「课前防跌四查」;调弹簧永远在滑车静止且有承托时进行"]]},{"g":"五大器械认门","r":[["Reformer 核心床","器械之王","滑动床板(滑车)+弹簧+脚杆(footbar)+绳带滑轮:躺坐跪站都能练,动作库五百+,商业馆与康复诊所的主力(下一章专讲)。血统:约瑟夫「万能床」的直系"],["Cadillac 秋千床","床+空中框架","高架四柱床:推杆(push-through bar)、吊带、弹簧从上从下多角度接入——体位选择最多、辅助最充分,康复与私教的利器;战俘营病床的嫡传后代(第2章)"],["Wunda Chair 万得椅","最小的猛兽","一个带弹簧踏板的箱椅:站坐跪撑全方位,支撑面小、自由度高——五大器械里对控制力要求最高的一个,别被体积骗了"],["Ladder Barrel 梯桶","脊柱的圆弧","弧形桶+爬梯:桶面托着脊柱做伸展与侧弯——胸椎伸展不足(驼背)人群的至爱;没有弹簧,靠重力与弧面做文章"],["Spine Corrector 脊柱矫正器","家用友好","小号弧形垫(阶梯桶的轻量版):托腰做胸椎伸展、腹部系列的支撑——五大件里唯一适合家用自购的,价格与占地都友好"]]},{"g":"器械与垫上怎么组合","r":[["互为表里","器械学感觉,垫上验真功","器械的弹簧反馈帮你「找到正确发力」(本体感觉放大器),回到垫上无辅助验证是否真掌握——教学常规:器械私教打基础→垫上自练巩固→定期回器械精调"],["课型与预算","现实建议","器械私教单价高(器械+一对一),预算有限的路径:入门买3-5节器械私教(建立发力感+摸清自己问题)→转垫上团课/自练→阶段性回私教校准。纯自学垫上也可行,本课动作库就是为此准备的——但器械必须有教练在场,不自行摸索"],["与康复手册的接线","同一套语言","器械普拉提的「弹簧助力降难度」=康复手册的「退阶变式」;「渐进加弹簧」=渐进负荷——训练学同源,组合成产品的具体打法见第9章「接线」组"]]}]},{"t":"大器械动作库:经典动作讲解","sub":"Reformer为主,Cadillac/椅/桶各取精华","eqfig":"plmach","fig":["plmach","plmachA","plmachC"],"map":[["Reformer基础","足部系列 Footwork;百次;青蛙与画圈;肘撑划船"],["Reformer经典","长伸展 Long Stretch;大象 Elephant;短脊柱按摩"],["Cadillac","推杆卷落 Roll Down;腿部弹簧系列;悬吊塔式"],["万得椅","踏板压落 Push Down;坐姿足部系列"],["梯桶/矫正器","桶上背伸展;侧弯系列;腹部支撑系列"]],"spine":"器械动作讲解的通用框架与垫上一致:体位-弹簧-呼吸-要点-代偿。多了一条铁律:每换一个动作,先报弹簧配置再上手——器械课出状况,九成出在「上一个动作的弹簧忘了换」。以下动作均为认识与理解用,上器械请在持证教练指导下进行。","g":[{"g":"Reformer 基础系列","r":[["足部系列 Footwork","每节课的第一站","仰卧滑车,双脚踩脚杆(脚跟/脚掌/脚尖/V位四种站位),呼气蹬出吸气收回。看似简单的「腿部推蹬」,练的是:中立位下的下肢发力模式+双侧对称+踝膝髋对线——教练从这里读出你的发力习惯,像体测一样(接教练手册坐站训练:同源动作的器械版)"],["Reformer百次","垫上百次的弹簧版","仰卧握绳带,卷起头胸,双臂拍动配合吸5呼5——绳带弹簧给手臂阻力,核心比垫上版更受挑战;而腿可以搭在脚杆上降低难度:同一动作,难度双向可调——弹簧哲学的活例子"],["青蛙与腿画圈 Frog & Leg Circles","吊带托腿","双脚套入绳带吊环:青蛙(屈伸如蛙泳腿)、画圈(双腿画对称圆)。弹簧托着腿的重量,腰腹压力比垫上直腿动作小得多——腰弱者练腿的安全入口,康复场景高频动作;考点仍是:骨盆稳定,圈画得再小也要圆"],["坐姿划船系列 Rowing","上肢与躯干整合","坐滑车握绳带,多方向划拉(前划/后划/刮胡子/拥抱)——肩胛稳定+躯干直立控制+弹簧渐进阻力:圆肩驼背人群的器械处方(与YTW/划船互认,弹簧版反馈更清晰)"]]},{"g":"Reformer 经典进阶","r":[["长伸展 Long Stretch","移动的平板","面向脚杆俯撑于滑车(手扶脚杆脚蹬肩靠),身体一条直线,呼气推滑车出、吸气拉回——平板支撑+滑动不稳定面:核心抗伸展的王牌。躯干一塌一拱都算失败,幅度小而正才是分数"],["大象 Elephant","折刀式的温柔版","站上滑车,手扶脚杆脚跟压实,身体折成倒V;呼气用腹部把滑车向内拉、吸气控制放出。大腿后侧拉长+下腹启动的复合——口令「用肚子拉,不用腿蹬」,一句话点透它与压腿的区别"],["短脊柱按摩 Short Spine Massage","逐节的极致","双脚吊带,双腿卷过头再逐节放落脊柱(教练全程保护)——脊柱逐节控制+弹簧辅助的经典配合:垫上Roll Over做不了的人,在这里被弹簧「托着」安全体验逐节落——器械做康复过渡的教科书案例;倒置类禁忌人群同样回避"]]},{"g":"Cadillac / 万得椅 / 桶","r":[["Cadillac推杆卷落","Roll Down with Push-Through Bar","坐床上握推杆,呼气逐节卷落吸气叠起——推杆+弹簧给上肢一个「扶手」,脊柱逐节运动获得清晰反馈:卷不下去/起不来的人,在Cadillac上最先找到感觉"],["Cadillac腿部弹簧系列","Leg Springs","仰卧,双脚套下弹簧做蹬伸/画圈/行走——比Reformer吊带阻力方向更多变;产后与腰痛康复的常用系列(骨盆稳住是唯一考点)"],["万得椅踏板压落 Push Down","站姿的核心考","站椅前,双手压踏板下压再控制放回——看似练手臂,实练「站姿下躯干不随弹簧晃动」:小器械大挑战,万得椅的性格缩影"],["梯桶背伸展","驼背的解药","腹部朝下卧于桶面,脚勾梯格,呼气脊柱沿桶弧伸展抬起——桶面托住腰椎,胸椎获得安全的伸展弧线:久坐圆背人群做完普遍直呼「打开了」(与天鹅/麦肯基同向,支撑更充分)"],["矫正器腹部系列","家用精华","坐矫正器前,腰骶贴弧面后仰卷起——弧面把「卷腹」的腰椎压力接走,腹肌孤立感强:家用自购人群的主打系列,配合垫上即可日常轮换"]]}]},{"t":"练习路径与安全边界","sub":"怎么开始·怎么进阶·谁要小心","map":[["入门路径","体验课看馆→3-5节私教建立发力感→团课/自练巩固"],["选馆选教练","看认证;看是否先评估;看会不会给退阶"],["特殊人群","孕产;腰椎间盘问题;骨质疏松;高血压——各有调整清单"],["红线","急性疼痛期先就医;倒置动作禁忌人群;不带伤硬练"],["长期主义","普拉提是「重新学用身体」——以月为单位,以年为习惯"]],"spine":"普拉提行业鱼龙混杂,选教练比选流派重要一百倍。三个试金石:①上课前做不做评估(体态/动作筛查)?②你做不到时给不给退阶变式?③敢不敢说「这个动作你现在不适合」?三题全对,放心跟练;全靠喊口号带操的,再大的馆也绕开。","g":[{"g":"入门路径","r":[["第一步:体验与评估","别跳过","正规馆体验课含简评估(体态观察+基础动作筛查)——教练借此定你的起点;什么都不问直接带练的,是健身操不是普拉提(评估思维与康复教练手册完全一致)"],["第二步:少量私教","建立「发力字典」","3-5节器械私教,目标不是学动作而是建立体感:什么叫核心启动、什么叫中立位、什么叫肩胛入位——这些「字」认识了,后面团课自练才读得懂"],["第三步:固定频率","每周2-3次","团课/自练(垫上模板见第6章)+阶段性私教校准;6-8周一复盘(体态照/腰颈感受/三关自测)——与康复手册复测节奏同频"],["自学者路线","垫上可自学,器械不可以","预算有限:本课垫上两章+视频对照+录像自查,完全可以起步;但大器械必须在教练监护下——弹簧的力量与滑动面,不给「自己摸索」留容错"]]},{"g":"特殊人群调整清单","r":[["孕产","改道具改体位","孕中晚期回避仰卧过久与深度卷腹(改侧卧/坐姿/靠垫斜躺);产后从呼吸与骨盆底激活重启,腹直肌分离者暂缓卷腹类(先做腹横肌激活)——必须跟有孕产培训的教练,这是普拉提最成熟的细分方向之一"],["腰椎间盘问题","方向偏好优先","急性期先就医;缓解期遵循「方向偏好」:多数椎间盘背景者对深度前屈卷腹敏感——卷起类降幅或跳过,多用中立位稳定类(五件套改印刻小幅)与伸展类(天鹅);一切以症状红绿灯为准(康复手册通用)"],["骨质疏松","三个禁区","跳过所有滚动类、深度前屈卷曲类、大幅旋转类(椎体压缩风险);主打:伸展类(天鹅/梯桶)、稳定类(侧踢/游泳)、站姿类——普拉提对骨质疏松有价值,但必须「做减法后的普拉提」"],["高血压/心脑病史","三条军规","不憋气(呼吸配合本是强项,恰好用上)、不做倒置(Roll Over/短脊柱类)、避免长时间头低位——与康复手册血压门槛与红线完全一致,同一套安全体系"]]},{"g":"给已有手册体系的接线","r":[["与康复理疗手册","可以拼成产品","中老年会员:康复手册的体测评估+微力量,配普拉提的呼吸/骨盆卷动/侧踢/天鹅做「控制课」——一横一纵,课程体系立体化;红绿灯与48小时法则全程通用"],["与推拿/健康生活","被动+主动+生活","推拿松解(被动)→普拉提重建控制(主动)→健康生活管睡眠营养(底盘)——三门课的组合拳,对慢性腰颈问题是完整闭环"],["与八段锦太极的分工","如果都练","传统功法重气息与整体协调,普拉提重精准控制与核心——晨练功法、晚课普拉提是不冲突的组合;共同点:都要「慢而专注」,都反对甩与僵"],["一句话总结","普拉提的本质","它教的不是三十四个动作,而是一种身体使用方式:核心先行、脊柱会说话、动作有呼吸——学到这层,垫子和弹簧都只是教具"]]}]}],"F":[{"t":"零基础入门普拉提","when":"想开始练普拉提,不知从哪下手时","s":[{"b":"先过健康筛查","p":"急性疼痛、近期手术、孕产、骨质疏松、高血压——任一命中,先咨询医生并只跟有对应资质的教练;无特殊情况,进入下一步。"},{"b":"选馆三试金石","p":"①课前做评估吗?②做不到给退阶吗?③敢说「这动作你先别做」吗?——三题全对再办卡;顺带看器械保养(滑车顺滑?绳带磨损?)与班容(垫上团课>12人难被照顾)。"},{"b":"3-5节私教建立体感","p":"目标清单:找到横向呼吸、认识中立位与印刻、体验核心启动、学会肩胛入位——「字」认全了再进团课,省一半弯路。","f":[["预算充足","器械私教起步(弹簧反馈快)"],["预算有限","垫上私教或小班,配合本课第3-5章自学"]]},{"b":"固定频率进入循环","p":"每周2-3次,按场景选课程(本页四套课程按难度排列):","f":[["在家只有垫子","新手两周启动课 → 垫上自练课(50分钟);每次课后记录体感"],["能到馆上器械","每周器械课1次(Reformer或Cadillac组合)+垫上自练2次"],["驼背僵硬为主诉","每周加一次梯桶/矫正器伸展课,其余照旧"]]},{"b":"6-8周复盘","p":"三关自测(卷起无惯性/双直腿腰贴垫/侧踢躯干稳)+体态照对比——过关进进阶库,未过关继续基础库,没有丢人这回事。","trap":"最大弯路是「追动作」:三个月硬磕Teaser不如三个月把五件套做到教科书级——普拉提的进度条在质量轴上,不在动作名单上。"}]},{"t":"新手两周启动课(每次20分钟)","fig":"plcourseS","when":"完全零基础的前两周——先把「语法」练进身体,再上完整课程","s":[{"b":"横向呼吸(3分钟)","p":"仰卧屈膝,双手放两侧肋骨:吸气把气「吸进手掌」(肋骨向两侧撑开),呼气肋骨下沉+下腹轻收(拉拉链的感觉)×10——这是全部动作的引擎,练不烦为止。"},{"b":"找中立位与印刻位(3分钟)","p":"骨盆时钟:骨盆小幅前倾后倾画圈×8找到「一碗水端平」的中立位;再呼气轻贴腰椎向垫(印刻)×5——手掌插腰下自查:中立留一掌缝,印刻轻贴手背。"},{"b":"骨盆卷动(4分钟)","p":"呼气从尾骨一节节卷起到肩胛下缘,吸气停,呼气一节节落回×6——第一周做到「能感觉到一节一节」就算达标,高度不重要。"},{"b":"百次退阶(3分钟)","p":"头放在垫上、双脚踩地,只做手臂小幅拍动+吸5呼5的节奏×50——先学会「呼吸打拍子」,第二周再尝试抬头抬腿版。","trap":"脖子一酸立即把头放回垫上——启动阶段的目标是呼吸与核心,不是卷腹。"},{"b":"单腿伸展退阶+侧踢(5分钟)","p":"头落地版单腿伸展每侧×6(专注「躯干纹丝不动」)→侧卧侧踢每侧×6(想象夹在两块玻璃之间)——两个动作都只求「稳」,不求幅度。"},{"b":"婴儿式收尾(2分钟)","p":"跪坐前趴,手臂前伸,深呼吸×5放松腰背——结束时在日历上打个勾。","f":[["两周内每天或隔天完成","第三周转入「垫上自练课(50分钟版)」,退阶起步"],["某个环节始终找不到感觉","带着这个具体问题上1-2节私教,解决了再回来"]],"trap":"两周是「找感觉」不是「练强度」:每次20分钟、动作对了就停,贪多贪快正是这个阶段唯一的失败方式。"}]},{"t":"一节垫上自练课(50分钟版)","fig":"plcourseM","when":"在家/健身房自己练完整一节课时——新手先完成「两周启动课」再进本课程","s":[{"b":"唤醒(5分钟)","p":"仰卧横向呼吸×10→骨盆时钟(骨盆小幅画圈找中立)→骨盆卷动×6——把核心「叫醒」,把脊柱「上油」。"},{"b":"热身卷动(5分钟)","p":"站姿卷落×3(从头顶逐节卷下再叠起)→猫式伸展×6→Hundred(退阶版起步)——心率微升,进入状态。"},{"b":"仰卧主序列(15分钟)","p":"五件套各8-10次(按能力选退阶)→卷起×5→开瓶器或双直腿(三关未过则跳过)——强度峰值段,红绿灯全程在线。","f":[["今天状态好","用完成式,幅度给足"],["昨晚没睡好/腰有感觉","全线退阶,次数减半——「今天少练」永远好过「这周不练」"]]},{"b":"侧卧与俯卧(15分钟)","p":"侧踢系列每侧×8-10(前踢/后展/上抬)→换边→天鹅预备×6→游泳30秒×2——侧线与背线补全,抵消一天的「向前弯」。"},{"b":"整合放松(10分钟)","p":"脊柱前伸×5→婴儿式1分钟→站姿卷落×3收工;可加脊柱矫正器/泡沫轴胸椎伸展2分钟。","trap":"跳过收尾直接冲澡=把「还原脊柱」的最后一步扔了——收尾10分钟正是抵消久坐的主力段,别省。"}]},{"t":"核心床 Reformer 完整课程(55分钟)","fig":"plcourseR","when":"器械私教/小班的标准课骨架——必须在持证教练监护下进行","s":[{"b":"准备与弹簧检查(5分钟)","p":"体感问询(今天哪里紧/酸)→检查滑车行程、绳带对称、弹簧挂扣;确定今日基准弹簧配置并记录。","trap":"器械课铁律:每换一个动作,先报弹簧配置再上手——出状况九成是「上个动作的弹簧忘了换」。"},{"b":"足部系列(10分钟)","p":"仰卧蹬脚杆:脚跟位×10→脚掌位×10→脚尖位×10→V位×10。教练观察双侧对称与踝膝髋对线——这是每节课的「动态体测」。"},{"b":"核心序列(12分钟)","p":"Reformer百次(吸5呼5,拍满100)→青蛙×8→腿画圈每方向×5(吊带托腿,骨盆钉住)。","f":[["腰弱/高龄","腿画圈缩小半径,或腿搭脚杆做百次"],["控制良好","百次腿伸45°,画圈加大半径"]]},{"b":"上肢与躯干(10分钟)","p":"坐姿划船:前划×8→后划×8→拥抱×8(肩胛入位,躯干直立);进阶者加长伸展×6(滑动平板,幅度小而正)。"},{"b":"全身整合(10分钟)","p":"大象×8(用腹拉滑车,不用腿蹬)→短脊柱按摩×5(弹簧辅助逐节,教练全程保护;倒置禁忌人群跳过,换双腿伸展加深版)。"},{"b":"收尾与记录(8分钟)","p":"跪姿胸椎伸展×5+侧腰拉伸每侧30秒→记录今日弹簧档位、动作质量与红绿灯情况——下次课从记录起步。","trap":"下课别急着收弹簧:先把滑车归位锁定、绳带挂好——器械归位习惯与训练本身同等重要(防下一位使用者踩空)。"}]},{"t":"梯桶与脊柱矫正器课程(40分钟)","fig":"plcourseB","when":"胸椎僵硬、驼背体态、久坐人群的「伸展主题课」;无弹簧,靠弧面与重力","s":[{"b":"弧面唤醒(5分钟)","p":"坐脊柱矫正器台阶,腰骶贴弧面,横向呼吸×10→骨盆前后倾×8——先让脊柱认识这条「圆弧轨道」。"},{"b":"矫正器腹部系列(10分钟)","p":"后仰卷起×8×2:呼气逐节卷起、吸气沿弧面控制后仰——弧面把腰椎压力接走,腹肌孤立感强。","f":[["骨质疏松","后仰幅度减半,只做上段卷起"],["控制良好","加手臂过头的全幅版本"]]},{"b":"梯桶背伸展(10分钟)","p":"腹部朝下卧于桶面、脚勾梯格:呼气沿桶弧伸展抬起×6×2——先延伸再抬起,「向前够再升起」。","trap":"抬起高度=背部力量,不是腰的折角——腰有挤压感立即降低幅度。"},{"b":"桶上侧线(8分钟)","p":"侧卧桶面(下侧腰贴弧),上侧手臂过头做侧弯伸展,每侧×5——久坐人最缺的侧链长度在这里补。"},{"b":"髋与收尾(7分钟)","p":"面向桶弓步,后腿搁桶面做髋前侧拉伸每侧30秒→站姿卷落×3放松收工。"}]},{"t":"Cadillac 与万得椅组合课程(50分钟)","fig":"plcourseC","when":"私教场景:辅助最充分的一套——入门与康复过渡的首选组合","s":[{"b":"问询与设置(5分钟)","p":"体感问询+今日目标;调好推杆高度、弹簧档位、椅子踏板分/合与弹簧位置——Cadillac 弹簧从顶上来(辅助),万得椅弹簧在脚下(挑战),一节课吃到两种关系。"},{"b":"Cadillac 推杆卷落(10分钟)","p":"坐床面握推杆:呼气逐节卷落、吸气逐节叠起×6——推杆+弹簧给脊柱逐节运动装上「扶手」,垫上卷不动的人从这里找到感觉。"},{"b":"Cadillac 腿部弹簧(12分钟)","p":"仰卧,双脚套弹簧:蹬伸×10→画圈每方向×5→空中行走×20——骨盆钉住是唯一考点。","f":[["产后/腰痛康复","减档弹簧,幅度减半,重点找骨盆稳定"],["基础良好","单腿版增加抗旋挑战"]]},{"b":"万得椅足部系列(8分钟)","p":"坐椅上双脚踩踏板:慢压慢放×10(脚跟/脚掌两种位置)——坐姿版的发力课,膝盖对准第二脚趾。"},{"b":"万得椅压踏板(8分钟)","p":"站椅前,双手压踏板下压再控制放回×8——考「站姿下躯干不随弹簧晃动」;躯干一晃就减档或改跪姿版。"},{"b":"收尾(7分钟)","p":"Cadillac 顶杆辅助全身悬伸展30秒×2→站姿卷落×3→记录弹簧档位与质量——「升级仪式」在这里宣布:下次给您换重一档。","trap":"辅助充分≠可以走神:弹簧帮的是「完成」,专注帮的才是「练到」——六大原则第一条全程在线。"}]},{"t":"动作学习四步法","when":"自学任何一个新动作(垫上或器械课后复习)时","s":[{"b":"看:拆要素","p":"按「体位-呼吸-发力顺序-幅度边界-常见错误」五要素读动作说明(本课动作库即按此写)——先在脑子里过一遍电影。"},{"b":"拆:退阶起步","p":"直接用该动作的退阶版本开始(屈膝/缩幅/头落地)——第一遍的目标是「顺序对」,不是「幅度满」。"},{"b":"镜与录:自查代偿","p":"侧对镜子或手机录像,对照检查单:肩耸没耸?腰离垫没?脖子抢戏没?靠惯性没?——录像是最诚实的教练。","f":[["发现代偿","回退一档,减幅减次重来"],["动作干净","下一次练习加一档(幅度或次数,一次只加一样)"]]},{"b":"问:留给教练","p":"自查解决不了的疑问(某处总是酸/找不到发力感)记下来,攒给阶段性私教课——带着具体问题上私教,一节顶三节。","trap":"「感觉不到目标肌肉」时别硬加次数——退阶到能感觉到的版本才有效;酸错了地方(脖子/腰)是身体在报错,不是你不够努力。"}]},{"t":"特殊情况的课堂调整","when":"带课或自练中遇到特殊人群/身体信号时","s":[{"b":"课前问询筛查","p":"新学员必问:今天哪里不舒服?近期伤病手术?孕产?血压骨密度情况?——与康复手册体测问询同构;答案决定今天的动作黑名单。"},{"b":"套用人群清单","p":"按第9章清单执行:孕产改体位、椎间盘慎前屈、骨质疏松禁滚动/深屈/大旋转、高血压禁倒置与憋气——黑名单动作直接换替代,不做「小心点试试」。","f":[["拿不准某动作","一律先跳过,课后查证或问医——普拉提动作库够大,永远有替代"],["学员坚持要做","解释风险并记录——教练的责任边界要留痕(与教练手册合规观一致)"]]},{"b":"课中红绿灯","p":"酸胀≤3分继续;明显不适降档(减幅/换退阶/改体位);尖锐痛、放射麻、头晕立即停该动作——停下后按康复手册突发SOP处理。"},{"b":"课后48小时回访","p":"「练完第二天哪里酸?」——酸在目标肌肉(腹/臀/背)=正确;酸在腰颈=动作或幅度要调;明显加重=下次全线降档并排查。"},{"b":"记录与转介","p":"每人一页动作调整档案(黑名单/退阶偏好/进步节点);出现红旗征象(夜痛/麻木/大小便异常)按康复手册红旗流程转介就医——普拉提教练的专业,一半体现在「知道何时不教」。"}]}]}
];

// ── 版本与强制刷新 ──────────────────────────────
// 每次改内容后，把下面这个日期改成当天（或任意递增字符串）即可。
const BUILD='2026-08-21';
(function(){
  const vt=document.getElementById('vertext');
  const btn=document.getElementById('refresh');
  if(vt) vt.textContent=BUILD;
  if(!btn) return;
  // 点击 = 绕过缓存强制重载
  btn.onclick=async()=>{
    btn.classList.add('checking');
    // 尝试清掉 Service Worker 缓存（若有），再带时间戳重载，双保险绕过主屏 App 缓存
    try{
      if(window.caches&&caches.keys){
        const ks=await caches.keys();
        await Promise.all(ks.map(k=>caches.delete(k)));
      }
    }catch(e){}
    const u=location.pathname+'?v='+Date.now();
    location.replace(u);
  };
  // 载入时静默探测线上是否有更新：重新抓取自身（带时间戳绕过缓存），比对 BUILD
  setTimeout(async()=>{
    try{
      const r=await fetch(location.pathname+'?probe='+Date.now(),{cache:'no-store'});
      if(!r.ok) return;
      const t=await r.text();
      const m=t.match(/const BUILD='([^']+)'/);
      if(m&&m[1]&&m[1]!==BUILD){
        btn.classList.add('newver');
        btn.title='有新版本 '+m[1]+'，点击更新';
        if(vt) vt.textContent=BUILD+' → '+m[1];
      }
    }catch(e){/* 离线或本地打开，忽略 */}
  },1500);
})();

function edge(a,b,ra,rb,color,dash){
  const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  const x1=a[0]+ux*ra,y1=a[1]+uy*ra,x2=b[0]-ux*(rb+7),y2=b[1]-uy*(rb+7);
  return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="1.2"${dash?' stroke-dasharray="5 4"':''} marker-end="url(#ah)"/>`;
}

maixiang(){
  // 脉象波形示意：位(浮沉) 数(迟数) 形(滑涩弦紧)
  const wave=(x,y,w,type,col)=>{
    let d='M'+x+' '+y;
    const n=64, step=w/n;
    for(let i=0;i<=n;i++){
      const t=i/n, px=x+i*step;
      let py=y;
      const beat=(k)=>Math.exp(-Math.pow((t*k%1-0.35)*7,2));
      if(type==='fu')      py=y-beat(3)*22;                      // 浮：波峰高、轻取即得
      else if(type==='chen')py=y-beat(3)*9;                      // 沉：波峰低
      else if(type==='chi') py=y-beat(2)*16;                     // 迟：波少
      else if(type==='shuo')py=y-beat(5)*16;                     // 数：波密
      else if(type==='hua') py=y-beat(3.5)*18-Math.sin(t*40)*2;  // 滑：圆滑流利
      else if(type==='se')  py=y-beat(3)*13+((i%5<2)?3:0);       // 涩：艰涩不畅
      else if(type==='xian')py=y-(Math.abs((t*3%1)-0.5)<0.42?18:0); // 弦：端直如按琴弦
      else if(type==='jin') py=y-beat(3.4)*20-((i%4<2)?3:-3);    // 紧：绷急弹指
      d+=' L'+px.toFixed(1)+' '+py.toFixed(1);
    }
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>`;
  };
  const rows=[
