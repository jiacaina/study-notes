<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识图谱汇总 · 高数 / 线代 / 概率</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+SC:wght@300;400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F9; --card:#FFFFFF; --ink:#16202B; --ink-2:#4A5A6A; --ink-3:#8494A3;
  --rule:#E1E6EB; --rule-2:#CBD4DC;
  --indigo:#2E4A7D; --verdigris:#2F6F5E; --rust:#B4472C; --amber:#8A6212;
  --sans:'IBM Plex Sans SC','IBM Plex Sans',system-ui,sans-serif;
  --serif:'IBM Plex Serif',Georgia,serif;
  --mono:'IBM Plex Mono',monospace;
  --accent:var(--indigo);
}
body[data-sub="la"]{--accent:#2F6F5E}
body[data-sub="pr"]{--accent:#6A3E86}
body[data-sub="en"]{--accent:#8C5A17}
body[data-sub="po"]{--accent:#9B2C3E}
body[data-sub="ov"]{--accent:#3D4650}
body[data-sub="tcm"]{--accent:#4F6B3A}
body[data-sub="tcy"]{--accent:#7A5230}
body[data-sub="tcd"]{--accent:#2E6B6B}
body[data-sub="tcf"]{--accent:#8A4A5E}
body[data-sub="tci"]{--accent:#3F5E7A}
body[data-sub="ni"]{--accent:#9E2B25}
body[data-sub="yj"]{--accent:#6B5B95}
body[data-sub="hl"]{--accent:#2E7D5B}
body[data-sub="zj"]{--accent:#A0522D}
body[data-sub="tn"]{--accent:#7A6A9B}
body[data-sub="nj"]{--accent:#9A7614}
body[data-sub="os"]{--accent:#246B8F}
body[data-sub="sh"]{--accent:#46589E}
body[data-sub="cb"]{--accent:#B5721E}
body[data-sub="ec"]{--accent:#5C7A21}
body[data-sub="pl"]{--accent:#925E82}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:214px minmax(0,1fr);max-width:1200px;margin:0 auto}

aside{position:sticky;top:0;height:100vh;padding:30px 20px 22px;border-right:1px solid var(--rule);display:flex;flex-direction:column;overflow-y:auto}
.brand{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.3}
.brand em{display:block;font-style:italic;font-weight:400;font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;margin-top:5px}
.subs{display:flex;flex-direction:column;gap:2px;margin:20px 0 4px}
.sub-b{text-align:left;font-family:var(--sans);font-size:13.5px;color:var(--ink-2);background:none;border:none;border-left:2px solid var(--rule);padding:6px 0 6px 10px;cursor:pointer;border-radius:0}
.sub-b:hover{color:var(--accent)}
.sub-b.on{color:var(--accent);font-weight:500;border-left-color:var(--accent);background:linear-gradient(90deg,rgba(0,0,0,.025),transparent)}
.sub-b span{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em;display:block;margin-top:1px}
nav{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule);flex:1}
nav a{display:flex;gap:9px;align-items:baseline;padding:5px 0;color:var(--ink-2);text-decoration:none;font-size:13px}
nav a:hover{color:var(--accent)}
nav a .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);width:16px;flex:none}
nav a.on{color:var(--accent);font-weight:500}
nav a.on .n{color:var(--rust)}
.side-foot{font-size:11px;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:11px;margin-top:11px;line-height:1.6}
kbd{font-family:var(--mono);font-size:10px;background:#EEF1F4;border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:3px;padding:1px 4px}

main{padding:28px 40px 90px;min-width:0}
.top{display:flex;gap:10px 10px;align-items:center;position:sticky;top:0;background:var(--paper);padding:10px 0 12px;z-index:20;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.crumb{flex:0 0 100%;display:flex;align-items:baseline;gap:9px;margin-bottom:2px;position:relative}
.crumb-btn{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--accent);letter-spacing:.01em;background:none;border:none;padding:2px 4px 2px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-radius:6px}
.crumb-btn:hover{background:var(--card)}
.crumb-btn i{font-style:normal;font-size:11px;color:var(--ink-3);transition:transform .15s}
.crumb-btn.open i{transform:rotate(180deg)}
.crumb span{font-family:var(--sans);font-size:12px;color:var(--ink-3)}
.crumb span::before{content:"·";margin-right:9px;color:var(--rule-2)}
.subpop{position:absolute;top:100%;left:0;margin-top:4px;background:var(--card);border:1px solid var(--rule-2);border-radius:10px;box-shadow:0 8px 28px rgba(20,26,32,.14);padding:6px;z-index:60;display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:2px;max-height:62vh;overflow-y:auto}
.subpop button{font-family:var(--sans);font-size:13px;color:var(--ink);background:none;border:none;border-radius:7px;padding:9px 12px;cursor:pointer;text-align:left;display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.subpop button:hover{background:var(--paper)}
.subpop button.on{background:var(--paper);color:var(--accent);font-weight:500}
.subpop button em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink-3);min-width:9px}
.subpop button small{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.04em}
.seg{display:flex;background:var(--card);border:1px solid var(--rule-2);border-radius:7px;overflow:hidden;flex:none}
.seg button{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);background:none;border:none;padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
#q{flex:1;min-width:150px;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--rule-2);border-radius:7px;padding:8px 12px;outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,74,125,.1)}
.btn{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);background:var(--card);border:1px solid var(--rule-2);border-radius:7px;padding:8px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.act{background:#FBEDE9;border-color:var(--rust);color:var(--rust)}
.tally{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.ver{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:6px 9px}
.ver.checking{opacity:.5}
.ver.newver{color:#fff;background:var(--accent);border-color:var(--accent)}
.tally b{color:var(--rust);font-weight:500}

.lede{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);line-height:1.75;max-width:66ch;margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--rule)}
.lede strong{color:var(--ink);font-weight:600}

section{margin-bottom:42px;scroll-margin-top:calc(var(--toph, 96px) + 12px)}
.sec-h{display:flex;align-items:baseline;gap:11px}
.sec-h .n{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--rust)}
.sec-h h2{font-family:var(--serif);font-size:20px;font-weight:600}
.sec-sub{font-size:12.5px;color:var(--ink-3);margin:3px 0 15px;padding-bottom:11px;border-bottom:2px solid var(--ink)}

/* 思维导图视图 */
.tree{display:flex;align-items:stretch;gap:0}
.root{flex:0 0 130px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--accent);color:#fff;border-radius:9px;padding:12px 10px;position:relative}
.root b{font-size:14px;font-weight:500;line-height:1.4}
.root i{font-family:var(--mono);font-style:normal;font-size:9.5px;opacity:.65;letter-spacing:.1em;margin-bottom:5px}
.root::after{content:'';position:absolute;right:-17px;top:50%;width:17px;height:1px;background:var(--rule-2)}
.limbs{flex:1;min-width:0;margin-left:17px;padding-left:19px;border-left:1px solid var(--rule-2)}
.limb{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:9px 13px;margin-bottom:7px}
.limb:last-child{margin-bottom:0}
.limb:hover{border-color:var(--rule-2)}
.limb::before{content:'';position:absolute;left:-19px;top:20px;width:19px;height:1px;background:var(--rule-2)}
.limb::after{content:'';position:absolute;left:-22px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
.limb b{display:block;font-size:13.5px;font-weight:500;line-height:1.4}
.twigs{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.twig{font-size:12px;color:var(--ink-2);background:#F3F5F7;border-radius:4px;padding:3px 9px;line-height:1.5}
.spine{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--verdigris);background:#F0F5F3;border-radius:7px;padding:9px 13px;margin-top:10px;margin-left:147px}
.fig{background:var(--card);border:1px solid var(--rule);border-radius:9px;padding:14px 12px 10px;margin-top:10px;margin-left:147px}
.cross{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:11px 13px;margin:0 0 14px;background:#F6F4EF;border:1px solid var(--rule-2);border-radius:9px}
.calc{font-family:var(--sans)}
.calc-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px;margin-bottom:14px}
.cf{display:flex;align-items:center;gap:8px}
.cf span{font-size:12px;color:var(--ink-2);min-width:58px;flex-shrink:0}
.cf input,.cf select{font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--paper);border:1px solid var(--rule-2);border-radius:7px;padding:8px 9px;min-width:0;flex:1;-moz-appearance:textfield}
.cf input:focus,.cf select:focus{outline:none;border-color:var(--accent)}
.cf input::-webkit-outer-spin-button,.cf input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cf em{font-style:normal;font-size:11px;color:var(--ink-3);min-width:26px}
.calc-out{border-top:1px solid var(--rule);padding-top:14px}
.c_hint{font-size:12.5px;color:var(--ink-3);text-align:center;padding:14px 0}
.c_grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.c_card{background:var(--paper);border:1px solid var(--rule-2);border-radius:9px;padding:11px 13px}
.c_card b{display:block;font-family:var(--mono);font-size:21px;color:var(--accent);line-height:1.2}
.c_card i{font-style:normal;font-size:11px;color:var(--ink-3);display:block;margin-bottom:5px}
.c_card u{text-decoration:none;font-size:11px;color:var(--ink-2);display:block;margin-top:3px}
.c_zone{margin-top:12px;border:1px solid var(--rule-2);border-radius:9px;overflow:hidden}
.c_zone div{display:flex;align-items:center;gap:10px;padding:7px 12px;font-size:12px;border-bottom:1px solid var(--rule)}
.c_zone div:last-child{border-bottom:none}
.c_zone i{font-style:normal;width:52px;font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.c_zone s{text-decoration:none;flex:1;color:var(--ink-2)}
.c_zone b{font-family:var(--mono);font-size:12.5px}
.c_note{font-size:11px;color:var(--ink-3);line-height:1.7;margin-top:13px;padding-top:11px;border-top:1px solid var(--rule)}
.cross .cl{font-family:var(--sans);font-size:12px;color:var(--ink-3)}
.cbtn{font-family:var(--sans);font-size:12.5px;color:var(--ink);background:var(--card);border:1px solid var(--rule-2);border-radius:7px;padding:6px 10px;cursor:pointer}
.cbtn:hover{border-color:var(--accent);color:var(--accent)}
.cbtn b{font-family:var(--mono);font-size:11px;color:var(--accent);margin-left:6px}
.cbtn.vbtn{background:#F1EFF5;border-color:var(--accent)}
.cdiv{width:1px;height:20px;background:var(--rule-2);margin:0 4px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:6px;line-height:1.5}
.fig .ft{font-family:var(--sans);font-size:13px;font-weight:500}
.fig .fs{font-family:var(--sans);font-size:11px}
body[data-sub="la"] .spine{background:#EEF4F2}
body[data-sub="pr"] .spine{color:#6A3E86;background:#F4F0F7}
body[data-sub="en"] .spine{color:#8C5A17;background:#F7F2E8}
body[data-sub="po"] .spine{color:#9B2C3E;background:#F8EFF1}
body[data-sub="tcm"] .spine{color:#4F6B3A;background:#F1F5EC}
body[data-sub="tcy"] .spine{color:#7A5230;background:#F6F1EB}
body[data-sub="tcd"] .spine{color:#2E6B6B;background:#ECF3F3}
body[data-sub="tcf"] .spine{color:#8A4A5E;background:#F7EFF1}
body[data-sub="tci"] .spine{color:#3F5E7A;background:#EDF1F5}
body[data-sub="ni"] .spine{color:#9E2B25;background:#F9EEEE}
body[data-sub="yj"] .spine{color:#6B5B95;background:#F1EFF5}
body[data-sub="hl"] .spine{color:#2E7D5B;background:#ECF4F0}
body[data-sub="zj"] .spine{color:#A0522D;background:#F7F0EA}
body[data-sub="tn"] .spine{color:#7A6A9B;background:#F2F0F6}
body[data-sub="nj"] .spine{color:#9A7614;background:#F8F3E2}
body[data-sub="os"] .spine{color:#246B8F;background:#EAF2F6}
body[data-sub="sh"] .spine{color:#46589E;background:#EFF1F8}
body[data-sub="cb"] .spine{color:#B5721E;background:#F9F2E6}
body[data-sub="ec"] .spine{color:#5C7A21;background:#F2F5EA}
body[data-sub="pl"] .spine{color:#925E82;background:#F6EFF4}
@media(max-width:700px){
  .tree{flex-direction:column}
  .root{flex:none;flex-direction:row;gap:8px;justify-content:flex-start;text-align:left;padding:9px 12px}
  .root i{margin:0}
  .root::after{display:none}
  .limbs{margin:8px 0 0 8px;padding-left:16px}
  .spine,.fig{margin-left:0}
}

/* 解题流程视图 */
.flow{background:var(--card);border:1px solid var(--rule);border-radius:9px;padding:15px 17px;margin-bottom:10px}
.flow h3{font-family:var(--serif);font-size:15.5px;font-weight:600;margin-bottom:2px}
.flow .when{font-size:12px;color:var(--ink-3);margin-bottom:12px;padding-bottom:9px;border-bottom:1px dashed var(--rule-2)}
.step{position:relative;padding:0 0 13px 26px;border-left:1px solid var(--rule-2);margin-left:6px}
.step:last-child{border-left-color:transparent;padding-bottom:0}
.step::before{content:attr(data-n);position:absolute;left:-9px;top:0;width:17px;height:17px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--mono);font-size:9.5px;display:flex;align-items:center;justify-content:center}
.step b{display:block;font-size:13.5px;font-weight:500;line-height:1.4;margin-top:-1px}
.step>p{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.6}
.forks{margin-top:7px;display:flex;flex-direction:column;gap:4px}
.fork{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:baseline;background:#F4F6F8;border-radius:5px;padding:6px 9px;font-size:12.5px}
.fork .c{font-weight:500;color:var(--accent);white-space:nowrap}
.fork .a{color:var(--ink-2);line-height:1.55;min-width:0}
.trap{margin-top:9px;font-size:12px;color:var(--amber);background:#FDF7EA;border-radius:5px;padding:6px 9px;line-height:1.55}

/* 公式视图 */
.grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--verdigris);margin:18px 0 7px}
.row{display:grid;grid-template-columns:152px minmax(0,1fr) 26px;gap:14px;align-items:start;background:var(--card);border:1px solid var(--rule);border-radius:7px;padding:10px 12px 10px 14px;margin-bottom:6px}
.row:hover{border-color:var(--rule-2)}
.row.flag{border-color:var(--rust);background:#FEFAF9}
.name{font-size:13px;font-weight:500;line-height:1.45}
.name small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.eq{min-width:0;overflow-x:auto;font-size:15px}
.eq .note{display:block;font-family:var(--sans);font-size:11.5px;color:var(--amber);margin-top:5px;line-height:1.5}
.mark{border:none;background:none;cursor:pointer;color:var(--rule-2);font-size:15px;padding:2px;line-height:1}
.mark:hover{color:var(--rust)}
.row.flag .mark{color:var(--rust)}
.hide{display:none!important}
.empty{font-family:var(--serif);font-style:italic;color:var(--ink-3);padding:26px 0}

@media(max-width:880px){
  .wrap{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule)}
  .subs{flex-direction:row;gap:6px}
  .sub-b{flex:1;border-left:none;border-bottom:2px solid var(--rule);padding:6px 4px;text-align:center}
  .sub-b.on{border-left-color:transparent;border-bottom-color:var(--accent);background:none}
  nav{display:flex;flex-wrap:wrap;gap:0 14px}
  .side-foot{display:none}
  main{padding:18px 16px 60px}
  .top{padding:8px 0 10px}
  .crumb-btn{font-size:16.5px}
  .subpop{grid-template-columns:1fr;min-width:200px}
  .crumb{margin-bottom:0}
  #q{flex:1 1 100%;order:5}
  .row{grid-template-columns:1fr 22px}
  .name{grid-column:1}.eq{grid-column:1/-1}.mark{grid-row:1;grid-column:2}
}
@media print{aside,.seg,#q,.btn,.tally,.ver,.mark,.cross{display:none!important}body{background:#fff}main{padding:0}.row,.br{break-inside:avoid}
  .top{position:static;border-bottom:1px solid #ccc;padding:0 0 10px;margin-bottom:16px}
  .crumb b{color:#000}}
</style>
</head>
<body data-sub="gm">
<div class="wrap">
<aside>
  <div class="brand">知识图谱汇总<em>Mind map · Formula · Playbook</em></div>
  <div class="subs" id="subs"></div>
  <nav id="nav"></nav>
  <div class="side-foot"><kbd>/</kbd> 搜索　<kbd>Esc</kbd> 清空<br>点 ○ 标记未掌握<br><kbd>Ctrl</kbd>+<kbd>P</kbd> 打印 PDF</div>
</aside>
<main>
  <div class="top">
    <div class="crumb">
      <button id="curname" class="crumb-btn">—<i>▾</i></button>
      <span id="curview">思维导图</span>
      <div id="subpop" class="subpop hide"></div>
    </div>
    <div class="seg" id="view">
      <button data-v="map" class="on">思维导图</button>
      <button data-v="eq">公式速查</button>
      <button data-v="fl">解题流程</button>
    </div>
    <input id="q" placeholder="搜索公式：泰勒 / 秩 / 格林 / 卡方…" autocomplete="off">
    <button class="btn" id="only">只看标记</button>
    <button class="btn" id="exp" title="导出所有已标记的条目">导出错题本</button>
    <span class="tally"><b id="cnt">0</b> 条</span>
    <button class="btn ver" id="refresh" title="强制拉取最新版本（绕过缓存）">↻ <span id="vertext">v—</span></button>
  </div>
  <p class="lede" id="lede"></p>
  <div id="cross" class="cross hide"></div>
  <div id="body"></div>
  <p class="empty hide" id="empty">没有匹配的内容。换个关键词试试。</p>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
const SUB=[

  {b:"第二步：识别全概率的信号词",p:"「从甲乙丙三个厂进货」「第一次抽到的是…然后第二次」——凡是先要分情况的，都是完备事件组。",
   trap:"完备事件组必须互斥且并起来是全集，漏一个分支概率就不为 1。"},
  {b:"第三步：贝叶斯——先算分母",p:"P(Aᵢ|B) 的分母就是全概率 P(B)。先老老实实算出 P(B)，再回头写分子 P(Aᵢ)P(B|Aᵢ)。"},
  {b:"第四步：独立性的陷阱",p:"互斥 ≠ 独立。两个概率非零的互斥事件一定不独立。看到「独立」才能拆 P(AB) = P(A)P(B)。"},
  {b:"第五步：正难则反",p:"出现「至少有一个」时，几乎总是算对立事件：P(至少一个) = 1 − P(一个都没有)。"}]},

 {t:"随机变量函数的分布：Y = g(X)",when:"已知 X 的分布，求 Y 的分布",s:[
  {b:"第一步：先判断 X 和 Y 的类型",p:"",
   f:[["X 离散","列出 Y 的所有取值，把 X 的概率「搬运」过去；取值重复的要相加"],["X 连续、g 单调","可用公式法：f_Y(y) = f_X(h(y))·|h′(y)|"],["X 连续、g 不单调（如 Y = X²）","必须用分布函数法"]]},
  {b:"第二步：分布函数法（万能，推荐无脑用）",p:"三步：① 写 F_Y(y) = P(Y ≤ y) = P(g(X) ≤ y)；② 把不等式解成关于 X 的范围；③ 用 F_X 表示，再对 y 求导得 f_Y(y)。"},
  {b:"第三步：确定 Y 的取值范围",p:"这是最容易漏的一步。先算出 Y 的值域，在值域外密度直接写 0，必须分段写完整。",
   trap:"Y = X² 时 y < 0 处 f_Y = 0；写答案必须带上分段条件，否则扣分。"},
  {b:"特例：Y = F(X)",p:"若 F 是 X 的分布函数（连续），则 Y 服从 U(0,1)。这是随机数生成的原理，也是常考的小结论。"}]},

 {t:"二维随机变量：边缘、条件与独立",when:"给出联合密度 f(x,y) 或联合分布表",s:[
  {b:"第一步：画出联合密度的非零区域",p:"连续型题目的成败几乎全在这张图上。画错区域，后面每一步都错。"},
  {b:"第二步：求边缘密度",p:"f_X(x) = ∫f(x,y)dy——对 y 积分时，x 视为常数，积分限由图上「过 x 作竖线」穿过区域的上下界确定。",
   trap:"积分限是 x 的函数，不是常数。写完必须检查 ∫f_X(x)dx = 1。"},
  {b:"第三步：判独立",p:"验证 f(x,y) = f_X(x)·f_Y(y) 是否对所有 (x,y) 成立。",
   f:[["非零区域不是矩形（如三角形）","一定不独立，可直接判定"],["区域是矩形且 f 能分离变量","独立"]]},
  {b:"第四步：求 Z = X + Y 的密度",p:"卷积公式 f_Z(z) = ∫f(x, z−x)dx；积分限由「(x, z−x) 落在非零区域内」这个条件解出，通常要对 z 分段讨论。"},
  {b:"第五步：求 P{(X,Y) ∈ D}",p:"化为二重积分 ∬_{D∩非零区域} f(x,y)dxdy——注意是两个区域的交集。"}]},

 {t:"数字特征：期望与方差的计算",when:"求 EX、DX、Cov、ρ",s:[
  {b:"第一步：能否直接查表",p:"若 X 服从常见分布，期望方差直接背出来，不要现算。二项 (np, np(1−p))、泊松 (λ, λ)、指数 (1/λ, 1/λ²)、均匀 ((a+b)/2, (b−a)²/12)、正态 (μ, σ²)。"},
  {b:"第二步：求 E[g(X)] 不必先求 g(X) 的分布",p:"直接用 E[g(X)] = ∫g(x)f(x)dx。这一步能省掉整整一道「求分布」的工作量。"},
  {b:"第三步：方差用简化公式",p:"DX = EX² − (EX)²。先算 EX² = ∫x²f(x)dx，再减。几乎不用定义式。"},
  {b:"第四步：和的期望与方差",p:"这两条的适用条件完全不同，是最大的失分点。",
   f:[["E(X+Y) = EX + EY","永远成立，不需要独立"],["D(X+Y) = DX + DY","仅当 X、Y 不相关（Cov = 0）时成立"],["一般情形","D(X±Y) = DX + DY ± 2Cov(X,Y)"]]},
  {b:"第五步：协方差的算法",p:"Cov(X,Y) = E(XY) − EX·EY。其中 E(XY) = ∬xy·f(x,y)dxdy。若已知 D(X+Y)，也可反解出 Cov。"},
  {b:"第六步：独立与不相关",p:"独立 ⇒ 不相关；不相关不一定独立。唯一的例外：二维正态分布下，二者等价。"}]},

 {t:"参数估计：矩估计与最大似然",when:"给出样本 x₁…xₙ，求未知参数的估计",s:[
  {b:"矩估计：三步",p:"① 算总体的 k 阶矩 EX（含未知参数 θ）；② 令 EX = X̄（样本一阶矩）；③ 解出 θ̂。若有两个参数，再补一个 EX² = (1/n)Σxᵢ²。"},
  {b:"最大似然：四步",p:"① 写似然函数 L(θ) = Πf(xᵢ;θ)；② 取对数 ln L；③ 对 θ 求导令 = 0；④ 解出 θ̂。"},
  {b:"最大似然的陷阱：L 单调时不能求导",p:"若 ln L 关于 θ 单调（典型：均匀分布 U(0,θ)），导数恒不为 0，必须直接分析单调性。",
   f:[["U(0,θ)","L = 1/θⁿ 关于 θ 递减，且要求 θ ≥ max xᵢ ⇒ θ̂ = max{x₁,…,xₙ}"]],
   trap:"这是最大似然的经典陷阱题，见到均匀分布立刻警觉。"},
  {b:"评价估计量：先验无偏性",p:"算 E(θ̂) 是否等于 θ。注意 S²（分母 n−1）是 σ² 的无偏估计，而分母为 n 的样本二阶中心矩不是。"}]},

 {t:"假设检验：五步走",when:"「在显著性水平 α 下，能否认为…」",s:[
  {b:"第一步：提出 H₀ 与 H₁",p:"把「想要推翻的」放 H₀。检验的逻辑是反证法：先假定 H₀ 真，看样本是否落入小概率区域。"},
  {b:"第二步：选检验统计量（看已知条件）",p:"这一步选错就全错。",
   f:[["检验 μ，σ² 已知","u 检验：(X̄−μ₀)/(σ/√n) ~ N(0,1)"],["检验 μ，σ² 未知","t 检验：(X̄−μ₀)/(S/√n) ~ t(n−1)"],["检验 σ²","χ² 检验：(n−1)S²/σ₀² ~ χ²(n−1)"],["检验两个总体方差之比","F 检验"]]},
  {b:"第三步：确定拒绝域（看备择假设）",p:"",
   f:[["H₁: μ ≠ μ₀","双侧，查 α/2 分位数"],["H₁: μ > μ₀ 或 μ < μ₀","单侧，查 α 分位数"]]},
  {b:"第四步：代数据算统计量，与临界值比较",p:"落入拒绝域 ⇒ 拒绝 H₀；否则「没有理由拒绝 H₀」——注意措辞不是「接受 H₀ 为真」。"},
  {b:"第五步：两类错误",p:"第一类（弃真）概率 = α；第二类（取伪）概率 = β。样本量固定时，α 减小 ⇒ β 增大，二者不能同时降低。"}]}
 ]},

 {t:"阅读：一篇文章的完整做法",when:"Part A 每篇的标准流程",s:[
  {b:"第一步：先读题干，不读选项",p:"用 30 秒扫一遍五个题干，圈出专有名词、数字、大写词——这些是回原文定位的锚点。读选项会先入为主，反而干扰判断。"},
  {b:"第二步：带着问题读原文",p:"题目顺序与文章顺序基本一致：第 1 题的答案通常在前两段，第 5 题在最后两段。"},
  {b:"第三步：定位到具体句子",p:"找到锚点所在的那一句，往前后各扩一句。答案几乎总在这三句之内。",
   trap:"注意转折词：but / however 之后才是作者的真实观点，前面往往是别人的说法（常被设成陷阱选项）。"},
  {b:"第四步：用原文比对选项，排除四个错的",p:"不是「选出对的」，而是「排除错的」。对每个选项问一句：原文哪里说了？",
   f:[["找不到出处","无中生有 ⇒ 排除"],["有出处但换了主体","偷换概念 ⇒ 排除"],["有 all / must / only / never","扩大范围 ⇒ 高度可疑"],["说的是原文的话，但答非所问","排除"]]},
  {b:"第五步：正确项的样子",p:"正确答案一定是原文的同义改写（paraphrase），措辞往往更抽象、更保守（可能用 may / tend to / some）。跟原文一字不差的选项反而常是陷阱。"}]},

 {t:"阅读：五种题型的专属打法",when:"识别题型后走对应路线",s:[
  {b:"主旨题：放到最后做",p:"做完其他四题，文章大意自然清楚。答案 = 首段末句（常是全文论点）+ 各段首句的综合。",
   f:[["选项只覆盖某一段","范围过小 ⇒ 排除"],["选项超出文章讨论的范围","范围过大 ⇒ 排除"]]},
  {b:"细节题：回原文逐词比对",p:"绝不能凭印象。定位到句子后，把选项和原文并排逐词对，看是否有偷换。"},
  {b:"推断题：跨一小步，不跨一大步",p:"答案仍在原文里，只是换了说法。若一个选项需要你补充额外假设才成立，它就是错的。"},
  {b:"态度题：只找评价词",p:"忽略事实陈述，只看作者用的形容词和副词（unfortunately / remarkably / merely）。",
   f:[["文中有明显褒/贬词","选对应的 positive / critical"],["作者只陈述事实","选 objective / neutral"],["选项含 indifferent、confused","几乎必错——作者不会漠不关心地写一篇文章"]]},
  {b:"词句义题：抛弃已知词义",p:"回到该词所在句，看它与前后句的逻辑关系（并列取同义、转折取反义、举例取上位概念），据此推断。你熟悉的那个意思，通常就是出题人设的陷阱。"}]},

 {t:"新题型：七选五",when:"5 个空、7 个选项，选 5 个",s:[
  {b:"第一步：通读全部选项，标记「信号词」",p:"在每个选项里圈出：代词（this / these / such / it / they）、逻辑词（however / moreover）、重复的名词。有信号词的选项最好定位。"},
  {b:"第二步：从最容易的空入手",p:"不要按顺序做。先找线索最明显的那个空。",
   f:[["选项以 this / such + 名词 开头","前一句必然出现过这个名词的具体内容"],["选项里有 however","前后句必须是转折关系"],["选项里有 for example","前一句必是一个概括性论断"]]},
  {b:"第三步：只看空格前后两句",p:"不要通读全段。做的是「衔接」，不是「理解」——把注意力集中在空格紧邻的上一句和下一句。"},
  {b:"第四步：做一个划掉一个",p:"选定后立刻从选项池中划掉，剩余选项越少越好判断。最后剩两个干扰项。"},
  {b:"第五步：代回通读检验",p:"把五个答案代回，通读整篇。检查每个代词是否有明确的指代对象、逻辑是否连贯。不通顺就调整。"}]},

 {t:"翻译：六步成文",when:"英译汉划线句",s:[
  {b:"第一步：通读句子，数谓语",p:"和长难句拆解一样：找主干，标出所有从句和修饰成分。"},
  {b:"第二步：切块",p:"以连接词、介词短语、分词短语为界，把长句切成 3–5 个意群。每个意群单独翻译。"},
  {b:"第三步：逐块直译",p:"先不管通顺，把每块的意思落到纸上。生词跳过，不要卡住——采分点是结构，不是某个词。"},
  {b:"第四步：处理四类结构",p:"",
   f:[["定语从句","短则前置译成「…的」；长则独立成句，用「这」或重复先行词衔接"],["被动语态","加泛指主语（人们/我们）、或译成「是…的」、或直接变主动"],["状语从句","一律提到主句之前（中文习惯）"],["代词 it / they / this","必须还原成它指代的具体名词"]]},
  {b:"第五步：调序成中文",p:"按中文语序重排：时间地点原因在前，核心结论在后。译文里不应出现「被…所…」「对于…来说」这类翻译腔。"},
  {b:"第六步：单独通读中文",p:"遮住英文原句，只读你的译文。如果自己读着别扭，阅卷人一定给不了高分。"}]},

 {t:"大作文：25 分钟成文流程",when:"图画/图表作文，160–200 词",s:[
  {b:"审题 3 分钟：确定主题词",p:"看图 + 看提示文字，用一个名词短语概括主题（如 cultural confidence / lifelong learning / environmental protection）。这个词要在全文出现 3–4 次。",
   trap:"跑题是唯一的致命伤。主题词定错，写得再漂亮也是低档。"},
  {b:"列提纲 2 分钟",p:"第二段要写的 2–3 条原因，用中文在草稿上列出关键词即可。有提纲才不会写着写着没话说。"},
  {b:"第一段 3 句：描述",p:"① 描述图画/数据（As is vividly depicted…）；② 点出图中的核心细节；③ 过渡句引出寓意（Simple as the picture is, it conveys a thought-provoking message）。"},
  {b:"第二段 5–6 句：分析（拉分段）",p:"① 总起句（The phenomenon can be attributed to several factors）；② To begin with…（第一层原因）；③ What is more…（第二层）；④ 举例 A case in point is…；⑤ 因果收束（which in turn contributes to…）。"},
  {b:"第三段 2–3 句：总结",p:"① In conclusion, …重申主题；② 建议或展望（Effective measures should be taken to… / Only in this way can we…）。"},
  {b:"检查 2 分钟",p:"主谓一致、时态、单复数、拼写。确认全文至少有一个定语从句、一个状语从句、一处倒装或非谓语。"}]},

 {t:"完形填空：20 空的走法",when:"性价比最低，但要用最短时间拿基础分",s:[
  {b:"第一步：读首句，定基调",p:"首句不设空，它给出全文主题和感情色彩。整篇文章的褒贬会与它一致。"},
  {b:"第二步：通读全文一遍，不填",p:"先了解大意。很多空的线索在后文，逐句填必错。"},
  {b:"第三步：先做「送分空」",p:"",
   f:[["空格前后有 but / however / although","填转折含义的词"],["空格前后有 because / so / thus","填因果含义的词"],["空格与某介词构成固定搭配","直接按搭配填（account for / cope with…）"],["空格所在句与前文重复某概念","填该概念的同义词（词汇复现）"]]},
  {b:"第四步：难空靠逻辑，不靠词义辨析",p:"四个选项词义都懂却选不出，说明你在辨析词义——方向错了。回到空格所在句的前后一句，找逻辑关系。"},
  {b:"第五步：代回通读，检查基调",p:"把 20 个词代回读一遍。凡是感情色彩与全文相反的，重新考虑。"},
  {b:"时间控制",p:"全部控制在 15–18 分钟内。它只值 10 分，不能挤占阅读和作文的时间。"}]}
 ]},

 {t:"单选题：稳拿基础分",when:"16 题 × 1 分",s:[
  {b:"第一步：先看题干问的是什么",p:"注意「根本」「关键」「前提」「实质」「核心」这类限定词——它们决定了唯一答案。",
   f:[["问「根本原因 / 决定作用」","往生产力、经济基础、物质、实践上靠"],["问「实质 / 核心」","辩证法的核心是对立统一；否定的实质是扬弃"],["问「前提 / 基础」","尊重客观规律是发挥主观能动性的前提"]]},
  {b:"第二步：排除表述绝对的选项",p:"出现「都」「一切」「必然」「唯一」「决定一切」时高度警惕——除非是教材原话（如「实践是检验真理的唯一标准」）。"},
  {b:"第三步：排除观点本身错误的",p:"选项若违背基本立场（如「意识决定物质」「英雄创造历史」），无论题干说什么都直接排除。"},
  {b:"第四步：两个都对时，选更贴题干的",p:"政治选择题常出现「都是正确表述，但只有一个回答了本题」——回到题干的关键词。"}]},

 {t:"多选题：全卷最难，也最拉分",when:"17 题 × 2 分，错选不得分",s:[
  {b:"第一步：逐项判断，不做整体感觉",p:"把每个选项当成一道判断题：这句话本身对不对？它和题干有关吗？两问都为「是」才选。"},
  {b:"第二步：三类必错选项",p:"",
   f:[["表述绝对化","「完全」「彻底」「根本上消除」「决定一切」——除非是教材原句"],["观点本身错误","颠倒物质与意识、生产力与生产关系的关系"],["答非所问","本身正确，但与题干问的不是一回事"]]},
  {b:"第三步：两类通常正确的选项",p:"",
   f:[["辩证表述","「既…又…」「在一定条件下相互转化」「是…的统一」——符合辩证法，多半正确"],["教材原话","即使看起来平淡，也要选"]]},
  {b:"第四步：拿不准时宁少勿多",p:"多选题错选不得分、少选得部分分。有把握的选，纯靠猜的宁可放弃。",
   trap:"这是多选题的核心策略：多选一个错的，整题归零；少选一个对的，仍有分。"}]},

 {t:"马原分析题：原理 + 材料",when:"「运用……原理分析材料」",s:[
  {b:"第一步：从设问反推原理",p:"设问里往往直接点了原理名。没点名时，看关键词。",
   f:[["材料讲矛盾、两面、转化","对立统一规律（矛盾的同一性与斗争性、普遍性与特殊性）"],["材料讲积累、突破、临界点","质量互变规律"],["材料讲曲折、螺旋、回归","否定之否定规律"],["材料讲实践、试验、检验","实践与认识的辩证关系；实践是检验真理的唯一标准"],["材料讲规律与人的能动性","客观规律性与主观能动性的辩证统一"]]},
  {b:"第二步：先完整默写原理",p:"不要一上来就分析材料。先把原理的定义、内容、方法论意义完整写出来——这是采分点，写全就有分。"},
  {b:"第三步：材料与原理逐句对应",p:"引用材料中的具体表述（「材料中提到的……体现了……」），把原理的每一层都对应到材料的某一句上。空谈原理不给分，只抄材料也不给分。"},
  {b:"第四步：落脚到方法论",p:"最后一段写「这启示我们……」——把原理转化成实践要求。这是最容易被漏掉的一个采分点。"},
  {b:"格式要求",p:"分点作答，每点前面标序号，原理句加粗或另起一行。卷面清晰本身就是分。"}]},

 {t:"毛中特 / 史纲 / 思修分析题",when:"三科分析题的共同套路",s:[
  {b:"毛中特：三段式",p:"① 是什么——材料反映的现象或政策；② 为什么——用理论（新发展理念、社会主要矛盾、中国式现代化等）解释其必要性；③ 怎么办——结合当年政策提出举措。"},
  {b:"史纲：回到三个「选择」",p:"史纲的分析题最终都在回答：为什么历史和人民选择了马克思主义、选择了中国共产党、选择了社会主义道路和改革开放。先讲史实，再讲结论。"},
  {b:"思修：立场 + 术语",p:"观点必须正面积极。用规范术语（社会主义核心价值观、爱国主义、法治思维、人生价值的社会价值）替代口语化表达。"},
  {b:"通用：把设问拆成小问",p:"设问常含两问（「如何理解……并说明……」）。必须分别作答，各起一段——只答一问，另一半的分直接丢掉。"},

 {t:"用五行分析脏腑传变",when:"题目给出「某脏病及某脏」，问是什么关系",s:[
  {b:"第一步：把脏腑换成五行",p:"肝木、心火、脾土、肺金、肾水。先把题目里的脏腑翻译成五行符号，关系立刻显形。"},
  {b:"第二步：判断二者在五行图上的位置",p:"",
   f:[["相生方向（木→火→土→金→水→木）","是母子关系：母病及子，或子病犯母"],["相克方向（木→土→水→火→金→木）","是相乘：克之太过"],["与相克方向相反","是相侮：反克"]]},
  {b:"第三步：区分相乘与相侮",p:"这是最常考的辨析点。相乘是「顺着克的方向克过头」，相侮是「被克的一方反过来克回去」。",
   f:[["肝旺 → 犯脾","木乘土（相乘）"],["肝旺 → 犯肺","木侮金（相侮，正常是金克木）"],["脾虚 → 肝乘之","土虚木乘（也是相乘，但原因在被克方太弱）"]],
   trap:"相乘的原因有两种：所不胜太强（木旺乘土）或所胜太弱（土虚木乘）。看到「虚」字要想到后者。"},
  {b:"第四步：区分母病及子与子病犯母",p:"生我者为母。肾（水）生肝（木），故肾病及肝 = 母病及子；肝病及肾 = 子病犯母（子盗母气）。"},
  {b:"第五步：导出治法",p:"虚则补其母、实则泻其子。相乘相侮则用抑强扶弱（如抑木扶土）。"}]},

 {t:"分析阴阳失调：四型辨析",when:"给出寒热症状，判断属于哪一型",s:[

  {b:"第二步：再判虚实",p:"这是关键的第二刀。",
   f:[["起病急、症状剧烈、体质壮实、脉有力","实证"],["病程长、症状缓、体倦乏力、脉无力","虚证"]]},
  {b:"第三步：四格定位",p:"寒热 × 虚实 = 四型，一一对应。",
   f:[["实 + 热","阳偏胜（阳盛则热）→ 实热证 → 治以「热者寒之」"],["实 + 寒","阴偏胜（阴盛则寒）→ 实寒证 → 治以「寒者热之」"],["虚 + 寒","阳偏衰（阳虚则寒）→ 虚寒证 → 补阳（益火之源以消阴翳）"],["虚 + 热","阴偏衰（阴虚则热）→ 虚热证 → 补阴（壮水之主以制阳光）"]]},
  {b:"第四步：警惕假象",p:"若寒热症状自相矛盾（如身热却欲盖衣被、四肢厥冷却烦躁口渴），要考虑阴阳格拒。",
   f:[["外假热、内真寒","阴盛格阳 → 真寒假热 → 「热因热用」"],["外假寒、内真热","阳盛格阴 → 真热假寒 → 「寒因寒用」"]],
   trap:"辨别真假的关键在「里证」和舌脉：假象多在四肢与体表，真象多在二便、口渴喜恶与舌脉。"}]},

 {t:"辨识六淫：从症状反推病因",when:"「审证求因」的标准动作",s:[
  {b:"记住每种邪气的「性格」",p:"中医的病因是从症状特点反推的，所以看到某类特征，就想到某种邪气。",
   f:[["起病急、变化快、症状游走不定、动摇（眩晕震颤）","风邪"],["疼痛剧烈、遇寒加重、拘急挛缩、得温则减","寒邪（凝滞、收引）"],["头身困重、分泌物秽浊、病程缠绵反复、症状黏腻","湿邪（重浊、黏滞）"],["口鼻干燥、皮肤皲裂、干咳少痰","燥邪（干涩伤津）"],["高热、面赤、烦躁、出血、发斑、疮疡红肿","火热邪（燔灼、动血、致肿疡）"],["夏季、大汗、气短乏力、口渴","暑邪（炎热、升散、耗气伤津）"]]},
  {b:"注意兼夹",p:"六淫常两种以上同时致病。风为百病之长，最常兼夹：风寒、风热、风湿。"},
  {b:"分清外感与内生",p:"症状相似，但来源不同。",
   f:[["有外感史、起病急、多有表证","外感六淫"],["无外感史、病程长、伴脏腑虚损表现","内生五邪（内风、内寒、内湿、内燥、内火）"]],
   trap:"内风多责之肝（肝阳化风、血虚生风）；内湿多责之脾；内寒多责之脾肾阳虚——内生之邪一定要落到脏腑上。"}]},

 {t:"病机分析的三个层次",when:"拿到一组症状，如何层层推出病机",s:[
  {b:"第一层：邪正盛衰 → 定虚实",p:"先问一句：是邪气盛（实），还是正气虚（虚），还是虚实错杂？这是最粗的一刀，也是最重要的一刀。"},
  {b:"第二层：阴阳失调 → 定寒热",p:"再问：阴阳何者偏胜、何者偏衰？由此得出寒热性质。前两层合起来就是「八纲」中的虚实寒热。"},
  {b:"第三层：气血津液与脏腑 → 定病位与具体机理",p:"最后落实到具体：是气虚还是气滞？是血瘀还是血虚？病位在哪一脏？",
   f:[["气机不畅、胀满走窜","气滞"],["气不摄血、下陷","气虚 / 气陷"],["刺痛固定、肿块、色紫暗","血瘀"],["水湿停聚、痰饮","肺脾肾三脏水液代谢失常"]]},
  {b:"第四步：写成完整病机",p:"标准表述是「病因 + 病位 + 病性 + 邪正关系」，例如「肝郁气滞，横逆犯脾」「脾肾阳虚，水湿内停」。"}]},

 {t:"从病机导出治则",when:"病机定了，治则是推出来的，不是背出来的",s:[
  {b:"第一步：看虚实 → 扶正还是祛邪",p:"",
   f:[["纯实证","祛邪：汗、吐、下、清、消、活血、化痰"],["纯虚证","扶正：益气、养血、滋阴、温阳"],["虚实错杂","攻补兼施，视主次决定先后"]]},
  {b:"第二步：看阴阳 → 损其有余还是补其不足",p:"",
   f:[["阳盛（实热）","热者寒之——损其有余"],["阴盛（实寒）","寒者热之——损其有余"],["阳虚（虚寒）","益火之源以消阴翳——补其不足"],["阴虚（虚热）","壮水之主以制阳光——补其不足"]]},
  {b:"第三步：看真假 → 正治还是反治",p:"症状与本质一致用正治（逆治）；出现假象则用反治（从治）：热因热用、寒因寒用、塞因塞用、通因通用。"},
  {b:"第四步：看缓急 → 治标还是治本",p:"急则治标（如大出血先止血），缓则治本（针对根本病因），标本俱急则兼治。"},
  {b:"第五步：因人因时因地调整",p:"最后做个体化微调：体质、年龄、季节、地域。这是「三因制宜」。"}]},

 {t:"中基的学习路径",when:"这门课不能靠刷题，要靠建立框架",s:[
  {b:"第一步：先建骨架，不要先背细节",p:"用一句话记住全书结构：哲学基础（阴阳五行）→ 生理（藏象、精气血津液、经络）→ 病理（病因、发病、病机）→ 治则。任何知识点都要能挂到这条链上。"},
  {b:"第二步：五脏是重中之重",p:"五脏的功能是全书的核心，后面所有病机都是五脏功能失常的推演。每一脏按「主要功能 + 在体合X + 其华在X + 开窍于X + 在志为X + 在液为X」的固定格式记忆。"},
  {b:"第三步：成对记忆，不要孤立记忆",p:"阴阳偏胜 vs 偏衰、相乘 vs 相侮、正治 vs 反治、脾（喜燥）vs 胃（喜润）——中基的考点几乎都是成对出现的辨析。"},
  {b:"第四步：从条文回到逻辑",p:"《内经》原文（如「邪气盛则实，精气夺则虚」）不只是要背，更要理解它推出了什么治则。背条文而不懂逻辑，考辨析题就会错。"},
  {b:"第五步：用病案倒推",p:"学完病机后，找简单病案自己分析：先定虚实，再定寒热，再定病位，最后推治则。这个过程走通了，中基才算学会。"}]}
 ]},

 {t:"如何记一味药：五步定位法",when:"面对一味新药，按这个顺序拆解",s:[
  {b:"第一步：四气——它是寒的还是热的",p:"先定寒热。这决定了它治什么性质的病：寒凉药治热证，温热药治寒证。这一步定错，后面全错。"},
  {b:"第二步：五味——它有什么作用",p:"味即功能。辛能散能行、甘能补能缓、苦能泄能燥、酸能收能涩、咸能软能下。",
   f:[["辛温","发散风寒（麻黄、桂枝）"],["辛凉","发散风热（薄荷、菊花）"],["苦寒","清热燥湿或泻火（黄连、大黄）"],["甘温","补气助阳（人参、黄芪）"],["甘寒","养阴生津（麦冬、生地）"]]},
  {b:"第三步：升降浮沉——它往哪个方向走",p:"病位在上在表用升浮，在下在里用沉降；病势上逆用降，下陷用升。质轻多升，质重多降。"},
  {b:"第四步：归经——它作用在哪里",p:"同是清热，黄芩清肺（上）、黄连清心胃（中）、黄柏清下焦（下）——归经决定了「同类药为什么不能互换」。"},
  {b:"第五步：由性能推功效",p:"把前四步合起来，功效自然浮现。例如麻黄：辛、温、归肺膀胱经、升浮 → 发汗解表（辛温升浮走表）、宣肺平喘（归肺）、利水消肿（归膀胱）。",
   trap:"这一步是中药学的关键：功效不是孤立背下来的，是从药性推出来的。推得出来，就记得住。"}]},

 {t:"同类药辨析：抓「异」不抓「同」",when:"一类里十几味药，怎么才不混",s:[

  {b:"再抓每味药的「个性」",p:"个性才是考点。记药时只问一句：它比同类药多了什么？",

  {b:"用「要药」标签固化",p:"每类都有几味「第一要药」，先把它们钉死：麻黄（发汗）、石膏（清气分热）、大黄（泻下）、附子（回阳）、半夏（燥湿化痰）、人参（大补元气）、白术（补气健脾）、当归（补血）、天麻（治眩晕）、三七（化瘀止血）。"}]},

   f:[["恶寒喜暖、口不渴、小便清长、舌淡苔白、脉迟","寒证"],["发热喜凉、口渴喜冷饮、小便短赤、舌红苔黄、脉数","热证"]]},
  {b:"第三刀：辨虚实（谁强谁弱）",p:"",
   f:[["症状剧烈、声高气粗、拒按、脉实有力","实证"],["体倦乏力、气短懒言、喜按、脉虚无力","虚证"]]},
  {b:"第四刀：用阴阳统摄",p:"表、热、实归阳；里、寒、虚归阴。至此，八纲的定位完成，可以进入病性辨证与脏腑辨证。"},
  {b:"最后：检查有无假象",p:"若四诊信息自相矛盾（如身热却欲盖衣被、腹胀却喜按），必须停下来考虑真假寒热、真假虚实。"}]},

 {t:"真假辨别：全书最难的一关",when:"症状自相矛盾、脉症不符时",s:[
  {b:"先承认矛盾，不要强行归类",p:"当出现「热象与寒象并见」「实象与虚象并见」时，一定有一方是假象。硬套八纲只会错。"},
  {b:"辨真假虚实的四个着眼点",p:"记住这四条，比记住定义有用得多。",
   f:[["脉","有力无力、有神无神——虚证之脉终究无力"],["舌","舌质胖嫩为虚，苍老坚敛为实"],["症状的喜恶","喜按者虚，拒按者实"],["病程与体质","久病、老弱多虚；新病、壮实多实"]]},
  {b:"两种真假虚实",p:"",
   f:[["真实假虚（大实有羸状）","本质是实：如热结肠胃，邪阻经络，反见神疲肢冷、脉沉伏。但按其腹必硬痛拒按"],["真虚假实（至虚有盛候）","本质是虚：如脾虚不运，反见腹胀便秘。但腹胀时减、喜按，脉虚无力"]]},
  {b:"辨真假寒热的着眼点",p:"假象多现于四肢与体表，真象多现于胸腹、二便、口渴喜恶与舌脉。",
   f:[["真寒假热（阴盛格阳）","身热却欲盖衣被、口渴却喜热饮、脉大却按之无力、舌淡苔白"],["真热假寒（阳盛格阴）","四肢厥冷却胸腹灼热、脉沉却按之有力、口渴喜冷饮、舌红苔黄"]],
   trap:"记住一句话：假象在外，真象在内。摸胸腹、看二便、察舌脉，是揭穿假象的三把钥匙。"}]},

 {t:"看舌象：两半分开看",when:"望舌的标准动作",s:[
  {b:"第一步：分开舌质与舌苔",p:"这是舌诊的第一原则。舌质反映脏腑虚实与气血盛衰（正气）；舌苔反映病邪性质与深浅（邪气）。混在一起看必错。"},
  {b:"第二步：看舌质定虚实寒热",p:"",
   f:[["淡白","虚证、寒证（气血虚或阳虚）"],["淡红","正常"],["红","热证（有苔为实热，少苔无苔为阴虚内热）"],["绛","热盛（营血分热或阴虚火旺）"],["紫暗 / 有瘀斑","血行不畅、瘀血"]]},
  {b:"第三步：看舌苔定邪气",p:"苔色辨性质，苔质辨深浅与津液。",
   f:[["白苔","表证、寒证（白厚腻则为湿浊痰饮）"],["黄苔","里证、热证（黄腻为湿热）"],["灰黑苔","里证重证（润为寒盛，燥为热极）"],["厚苔","邪盛入里；薄苔为邪浅"],["腻苔","湿浊、痰饮、食积"],["剥落苔 / 镜面舌","胃气胃阴大伤（危候）"]]},
  {b:"第四步：合参得出结论",p:"把两半的结论合起来。例如：舌淡胖 + 苔白腻 = 脾肾阳虚，水湿内停；舌红 + 苔黄腻 = 湿热内蕴。"},
  {b:"注意排除染苔",p:"进食牛奶、咖啡、药物、色素后可致假苔色。问诊时要主动排除。"}]},

 {t:"摸脉：六字纲领起手",when:"二十八脉背不下来时的实用路径",s:[
  {b:"第一步：不要一上来就对号入座",p:"新手最大的错误是拿着 28 脉的名称去套。先用最粗的三把尺子定盘。"},
  {b:"第二步：浮沉定病位",p:"轻取即得为浮（表证）；重按始得为沉（里证）。"},
  {b:"第三步：迟数定病性",p:"一息不足四至为迟（寒证）；一息五至以上为数（热证）。"},
  {b:"第四步：有力无力定虚实",p:"这是最关键、也是最容易被忽略的一刀。同样是浮脉：浮而有力为表实，浮而无力为表虚（或虚阳外越）。",
   trap:"「有力无力」几乎能解决一半的脉诊辨证题——迟而有力是实寒，迟而无力是虚寒；数而有力是实热，数而无力是虚热。"},
  {b:"第五步：再加特色脉的修饰",p:"在六字纲领的基础上，识别几个高辨识度的脉象即可。",
   f:[["滑（如珠走盘）","痰饮、食积、实热；亦见于妊娠"],["涩（如刀刮竹）","气滞血瘀、精伤血少"],["弦（如按琴弦）","肝胆病、疼痛、痰饮"],["紧（如转绳索）","实寒、疼痛、宿食"],["结代促","结（迟而止无定数）、代（迟而止有定数，脏气衰微）、促（数而止无定数）"]]},
  {b:"第六步：脉症不符时，判断谁是本质",p:"决定「舍脉从症」还是「舍症从脉」。这需要结合舌象、病程与体质综合判断——这正是四诊合参的意义。"}]},

 {t:"脏腑辨证：定性 × 定位",when:"八纲辨完之后，把病位落到具体脏腑",s:[
  {b:"第一步：用八纲先定性",p:"已经知道了虚实寒热。例如「虚 + 寒」，接下来只需回答：哪一脏的阳虚？"},
  {b:"第二步：按脏腑功能定位",p:"每一脏有其特征性症状，抓住它就能定位。",
   f:[["心悸、失眠、健忘、神志异常","心"],["咳嗽、气喘、鼻塞、自汗易感冒","肺"],["纳呆、腹胀、便溏、乏力、内脏下垂、出血","脾"],["胸胁胀痛、情志抑郁或易怒、眩晕、月经不调、震颤","肝"],["腰膝酸软、耳鸣、二便异常、生殖功能减退、呼多吸少","肾"]]},
  {b:"第三步：定性 + 定位 = 证名",p:"把两者拼起来：腰膝酸冷 + 畏寒 + 五更泄泻 = 肾阳虚；心悸失眠 + 五心烦热 + 舌红少苔 = 心阴虚。"},
  {b:"第四步：考虑兼证",p:"若两脏症状同时突出，是脏腑兼证。",
   f:[["心悸失眠 + 纳少便溏乏力","心脾两虚"],["胸胁胀痛 + 纳呆腹胀便溏","肝郁脾虚（肝木乘脾土）"],["心烦失眠 + 腰膝酸软潮热","心肾不交"],["腰膝冷痛 + 五更泄泻浮肿","脾肾阳虚"]]},
  {b:"第五步：回到中基验证",p:"用中基的病机去检验你的结论是否讲得通。如果推不出病机，说明辨证错了。"}]},

 {t:"中诊的学习路径",when:"这门课的学法与中基不同",s:[
  {b:"四诊靠「记特征」，辨证靠「建框架」",p:"四诊部分（尤其舌脉）必须硬记特征；辨证部分则要建立层层递进的推理框架。两部分的学法完全不同，不要用同一种方法。"},
  {b:"舌诊和脉诊要尽早上手",p:"这两项是纯技能，看书永远学不会。每天看自己和家人的舌象，摸自己的脉，把书上的描述和真实的手感对上号。"},
  {b:"成组记忆证候",p:"脏腑辨证的证候多，但有规律：每一脏都有气虚、阳虚、阴虚、血虚、实热、湿热的组合。抓住「该脏的特征症状 + 虚实寒热的通用症状」这个公式，就不必逐条硬背。"},
  {b:"用病案串联",p:"中诊必须靠病案训练。拿到病案：① 提取四诊信息；② 八纲定性；③ 脏腑定位；④ 写出证名；⑤ 用中基的病机解释一遍。走完这五步，才算真正学会。"},
  {b:"与中基对照着学",p:"中基讲病机（为什么会这样），中诊讲证候（表现出什么）。两本书是一体两面——学中诊时随时回头翻中基，效率会高得多。"}]}
 ]},

{k:"tcf",name:"方剂学",en:"FORMULAS",no:"4",eqLabel:"方剂速查",flLabel:"组方思路",
 lede:"方剂学是<strong>中药学的下一环</strong>：单味药是字，方剂是句子。核心只有两件事——<strong>君臣佐使</strong>（药物如何组合成一个整体）与<strong>治法方证的对应</strong>（什么证用什么方）。背方不能只背药名，要背「配伍意义」：为什么是这几味药，为什么是这个比例。<strong>本手册为教材知识梳理，不构成任何用药建议；具体处方请遵医嘱。</strong>",
 M:[
 {t:"总论：方剂的组成与变化",sub:"君臣佐使：方剂学的第一原理",
  map:[["方剂与治法","法随证立，方从法出；八法：汗、吐、下、和、温、清、消、补"],["君臣佐使","君药主攻；臣药辅助；佐药制约或反佐；使药引经或调和"],["组成变化","药味增减、药量增减、剂型更换"],["剂型","汤、丸、散、膏、丹、酒、露、锭"]],
  fig:"junchen",
  spine:"「法随证立，方从法出」——方剂不是药物的堆砌，而是治法的物化。看一首方，先问它体现的是哪一「法」。",
  fig:["junchen","bafa","peiwu","jixing","jiliang"],
  g:[
  {g:"治法：八法",r:[
   ["汗法","解表","开泄腠理、发汗解表。适用于表证（麻黄汤、桂枝汤、银翘散）"],
   ["吐法","涌吐","涌吐痰涎、宿食、毒物。适用于病位在上、病势急暴者（瓜蒂散）"],
   ["下法","泻下","荡涤肠胃、通泄大便。适用于里实积滞（大承气汤）"],
   ["和法","和解","和解少阳、调和肝脾、调和肠胃（小柴胡汤、逍遥散、半夏泻心汤）"],
   ["温法","祛寒","温里祛寒、回阳救逆（理中丸、四逆汤）"],
   ["清法","清热","清热泻火、凉血解毒（白虎汤、黄连解毒汤）"],
   ["消法","消导","消食导滞、消痞化积、活血消癥（保和丸、枳实消痞丸）"],
   ["补法","补虚","补益气血阴阳（四君子汤、四物汤、六味地黄丸）"]]},
  {g:"入门：怎么读懂一首方的配伍",r:[
   ["背方不能只背药名","考点在这里","真正要理解的是「为什么是这几味、为什么是这个比例」"],
   ["一散一收","桂枝汤","桂枝散、白芍收，两者相反相成，共奏调和营卫之功"],
   ["辛开苦降","半夏泻心汤","干姜半夏辛温开结、黄芩黄连苦寒降泄，寒热并用治寒热错杂"],
   ["补中有泻","六味地黄丸","三补配三泻，滋而不腻。纯补必壅是补法大忌"],
   ["剂量决定君臣","当归补血汤","黄芪五倍于当归，补血方以补气药为君——「有形之血生于无形之气」"],
   ["微量药的画龙点睛","补中益气汤","升麻柴胡用量极小，专司升提下陷之清阳，不是用来解表的"],
   ["气血同治","血府逐瘀汤","活血药必配行气药，「气行则血行」，否则活血力出不来"]]},
  {g:"君臣佐使（必背）",r:[
   ["君药","","针对主病或主证起主要治疗作用的药物。药力最强，用量通常最大"],
   ["臣药","两个作用","① 辅助君药加强治疗主病主证；② 针对兼病或兼证起治疗作用"],
   ["佐药","三种","① 佐助药：协助君臣加强疗效，或治次要症状；② 佐制药：消除或减弱君臣药的毒烈之性；③ 反佐药：与君药性味相反而能在治疗中起相成作用"],
   ["使药","两个作用","① 引经药：引方中诸药直达病所；② 调和药：调和方中诸药（如甘草）"],
   ["麻黄汤示例","经典","麻黄（君，发汗解表宣肺）；桂枝（臣，助麻黄发汗）；杏仁（佐，降气平喘）；炙甘草（使，调和药性）"]]},
  {g:"组成变化",r:[
   ["药味增减","","主证不变，随兼证增减药味。如桂枝汤加葛根，成桂枝加葛根汤"],
   ["药量增减","改变君臣关系","药味相同而用量不同，君臣易位则功效主治全变。如小承气汤与厚朴三物汤（药味相同，量不同）"],
   ["剂型更换","","药味用量相同而剂型不同，作用有缓急之别。如理中丸与人参汤（汤剂力峻，丸剂力缓）"]]}]},

 {t:"解表剂 · 泻下剂 · 和解剂",sub:"祛邪三法：汗、下、和",
  map:[["辛温解表","麻黄汤、桂枝汤、九味羌活汤、小青龙汤"],["辛凉解表","银翘散、桑菊饮、麻杏石甘汤"],["泻下剂","大承气汤、大黄牡丹汤、麻子仁丸、温脾汤"],["和解剂","小柴胡汤、逍遥散、半夏泻心汤"]],
  spine:"承气汤类是「剂量与配伍决定力量」的最佳教材：大、小、调胃三承气，药味只差一两味，泻下之力却天差地别。",
  g:[
  {g:"解表剂",r:[
   ["麻黄汤","辛温发汗","麻黄、桂枝、杏仁、炙甘草。发汗解表、宣肺平喘。主治外感风寒表实证（恶寒发热、无汗而喘、脉浮紧）"],
   ["桂枝汤","调和营卫","桂枝、芍药、生姜、大枣、炙甘草。解肌发表、调和营卫。主治外感风寒表虚证（发热、汗出、恶风、脉浮缓）"],
   ["麻黄汤 vs 桂枝汤","必辨","麻黄汤治表实无汗（发汗）；桂枝汤治表虚有汗（解肌调营卫）。桂枝配芍药，一散一收，是调和营卫的经典配伍"],
   ["小青龙汤","外寒内饮","麻黄、桂枝、干姜、细辛、五味子、半夏、芍药、炙甘草。解表散寒、温肺化饮。主治恶寒发热、咳喘、痰多清稀"],
   ["银翘散","辛凉平剂","连翘、金银花、桔梗、薄荷、竹叶、生甘草、荆芥穗、淡豆豉、牛蒡子、芦根。辛凉透表、清热解毒。主治温病初起"],
   ["桑菊饮","辛凉轻剂","桑叶、菊花、杏仁、连翘、薄荷、桔梗、甘草、芦根。疏风清热、宣肺止咳。主治风温初起、咳嗽为主"],
   ["银翘散 vs 桑菊饮","辨析","银翘散解表清热力强（辛凉平剂），主治发热重；桑菊饮宣肺止咳力强（辛凉轻剂），主治咳嗽为主"],
   ["麻杏石甘汤","","麻黄、杏仁、石膏、炙甘草。辛凉宣泄、清肺平喘。主治肺热咳喘（身热、咳喘、口渴、苔黄）"]]},
  {g:"泻下剂",r:[
   ["大承气汤","峻下热结","大黄、厚朴、枳实、芒硝。峻下热结。主治阳明腑实证：痞、满、燥、实四症俱全"],
   ["三承气对比","高频","大承气（大黄、芒硝、枳实、厚朴）峻下；小承气（大黄、枳实、厚朴，无芒硝）轻下；调胃承气（大黄、芒硝、甘草，无枳朴）缓下"],
   ["大黄牡丹汤","","大黄、牡丹皮、桃仁、冬瓜仁、芒硝。泻热破瘀、散结消肿。主治肠痈初起"],
   ["麻子仁丸","润下","火麻仁、芍药、枳实、大黄、厚朴、杏仁。润肠泄热、行气通便。主治脾约证（肠燥便秘）"],
   ["温脾汤","温下","大黄、附子、干姜、人参、甘草。攻下冷积、温补脾阳。主治阳虚寒积"]]},
  {g:"和解剂",r:[
   ["小柴胡汤","和解少阳","柴胡、黄芩、半夏、人参、炙甘草、生姜、大枣。主治少阳证：往来寒热、胸胁苦满、默默不欲饮食、心烦喜呕、口苦咽干目眩、脉弦"],
   ["逍遥散","调和肝脾","柴胡、当归、白芍、白术、茯苓、炙甘草、烧生姜、薄荷。疏肝解郁、养血健脾。主治肝郁血虚脾弱证"],
   ["半夏泻心汤","调和肠胃","半夏、黄芩、干姜、人参、炙甘草、黄连、大枣。寒热平调、消痞散结。主治寒热错杂之痞证（心下痞、呕、利）",
    "本方是「辛开苦降」的代表：辛温（干姜、半夏）与苦寒（黄芩、黄连）同用，一开一降。"]]}]},

 {t:"清热剂 · 温里剂",sub:"寒热两大阵营：清热与温阳",

  {g:"温里剂",r:[

    "本方即桂枝汤倍芍药加饴糖——同样的药，配伍与剂量一变，从解表方变成了温补方。"],

  {g:"补阴与补阳",r:[

   ["一贯煎","","北沙参、麦冬、当归、生地黄、枸杞子、川楝子。滋阴疏肝。主治肝肾阴虚、肝气不舒之胁痛",

 {t:"理气 · 理血 · 治风 · 祛湿 · 祛痰",sub:"针对具体病邪的方剂",

   ["半夏厚朴汤","","半夏、厚朴、茯苓、生姜、苏叶。行气散结、降逆化痰。主治梅核气（咽中如有物阻）"],

  {g:"理血剂",r:[

    "结构 = 桃红四物汤（活血）+ 四逆散（行气）+ 桔梗牛膝（一升一降）。"],

   ["桃核承气汤","","桃仁、大黄、桂枝、炙甘草、芒硝。逐瘀泻热。主治下焦蓄血证"],
   ["小蓟饮子","","生地、小蓟、滑石、木通、蒲黄、藕节、淡竹叶、当归、山栀子、炙甘草。凉血止血、利水通淋。主治血淋、尿血"]]},
  {g:"治风剂",r:[

    "本方是「引经用药」的示范：川芎治少阳厥阴头痛、白芷治阳明头痛、羌活治太阳头痛——按部位选药。"],
   ["天麻钩藤饮","平息内风","天麻、钩藤、石决明、栀子、黄芩、川牛膝、杜仲、益母草、桑寄生、夜交藤、朱茯神。平肝息风、清热活血、补益肝肾。主治肝阳上亢、肝风上扰"],

  {g:"祛湿剂与祛痰剂",r:[

   ["茵陈蒿汤","退黄","茵陈、栀子、大黄。清热利湿退黄。主治湿热黄疸（阳黄）"],
   ["八正散","","车前子、瞿麦、萹蓄、滑石、栀子、甘草梢、木通、大黄。清热泻火、利水通淋。主治湿热淋证"],
   ["真武汤","温阳利水","茯苓、芍药、白术、生姜、附子。温阳利水。主治阳虚水泛（水肿、心悸、头眩、身𥌗动）"],
   ["二陈汤","祛痰基础方","半夏、橘红、茯苓、炙甘草（加生姜、乌梅）。燥湿化痰、理气和中。主治湿痰证"],
   ["温胆汤","","半夏、竹茹、枳实、陈皮、甘草、茯苓（加生姜、大枣）。理气化痰、和胃利胆。主治胆郁痰扰之虚烦不眠、惊悸"],

 F:[
 {t:"如何背一首方：五问法",when:"面对一首新方，不要先背药名",s:[
  {b:"第一问：它治什么证（方证）",p:"先记住主治证的核心症状。方是为证而设的——记住证，才知道什么时候用这首方。"},
  {b:"第二问：它体现哪一治法",p:"汗、吐、下、和、温、清、消、补——先归到八法之一，方剂的性质立刻清晰。"},
  {b:"第三问：谁是君药",p:"君药是方剂的灵魂。记住君药，就抓住了这首方的主攻方向。麻黄汤的麻黄、白虎汤的石膏、四君子汤的人参、六味地黄丸的熟地。"},
  {b:"第四问：配伍的巧妙之处在哪",p:"这是方剂学真正的考点，也是最容易记住的部分。",
   f:[["桂枝汤","桂枝配芍药，一散一收，调和营卫"],["半夏泻心汤","辛开（干姜、半夏）苦降（黄芩、黄连），寒热平调"],["六味地黄丸","三补三泻，补而不腻"],["补中益气汤","升麻、柴胡量极小，专司升提清阳"],["当归补血汤","黄芪五倍于当归——有形之血生于无形之气"],["血府逐瘀汤","活血药 + 行气药，气行则血行"]]},
  {b:"第五问：它和哪首方容易混",p:"成对记忆。麻黄汤 vs 桂枝汤；银翘散 vs 桑菊饮；四逆汤 vs 当归四逆汤；三承气汤之间。抓住「差在哪一味药、差在哪个病机」。"}]},

 {t:"从证到方：选方五步",when:"辨证结束后，如何选出对应的方",s:[
  {b:"第一步：中诊辨出证",p:"证名必须先明确。「肝郁脾虚」「肾阴虚」「湿热黄疸」——没有证名，就没有选方的依据。"},
  {b:"第二步：由证立法",p:"法随证立。肝郁脾虚 → 疏肝健脾；肾阴虚 → 滋补肾阴；湿热黄疸 → 清热利湿退黄。"},
  {b:"第三步：由法选方",p:"方从法出。每一法都有其代表方。",
   f:[["疏肝健脾","逍遥散"],["滋补肾阴","六味地黄丸"],["清热利湿退黄","茵陈蒿汤"],["温肾暖脾止泻","四神丸"],["益气升陷","补中益气汤"],["活血行气止痛","血府逐瘀汤"]]},
  {b:"第四步：随证加减",p:"基础方定了，再根据兼证增减药味。这是方剂「活用」的关键，也是与背方的分水岭。"},
  {b:"第五步：回头验证",p:"把选定的方拆开，看君臣佐使是否与病机层层对应。对不上，说明辨证或选方有误。",
   trap:"本手册仅为知识梳理。任何实际处方都必须由执业中医师面诊后决定。"}]},

 {t:"类方辨析：抓「差在哪一味」",when:"方剂学最大的失分点",s:[
  {b:"同名不同方",p:"",
   f:[["四逆汤 vs 当归四逆汤","四逆汤（附子、干姜、甘草）治阳衰厥逆；当归四逆汤（无姜附）治血虚寒凝之厥"],["三承气汤","大承气（四药全）峻下；小承气（无芒硝）轻下；调胃承气（无枳朴）缓下"]]},
  {b:"同类不同证",p:"",
   f:[["麻黄汤 vs 桂枝汤","表实无汗 vs 表虚有汗"],["银翘散 vs 桑菊饮","发热重（辛凉平剂）vs 咳嗽重（辛凉轻剂）"],["六味地黄丸 vs 肾气丸","前者滋阴；后者在前者基础上加桂附少许以补阳（少火生气）"],["理中丸 vs 小建中汤","理中丸温中补气；小建中汤温中缓急（重用芍药、饴糖）"]]},
  {b:"加减化裁的规律",p:"很多方是在基础方上加减而来。抓住基础方，其余是变奏。",
   f:[["四君子汤 → 六君子汤","加陈皮、半夏（燥湿化痰）"],["六君子汤 → 香砂六君子汤","再加木香、砂仁（行气）"],["四物汤 → 桃红四物汤","加桃仁、红花（活血）"],["六味地黄丸 → 知柏地黄丸","加知母、黄柏（滋阴降火）"],["六味地黄丸 → 杞菊地黄丸","加枸杞、菊花（养肝明目）"]]},
  {b:"记忆策略",p:"背方剂不要孤立地一首一首背，要成「族」地背：以基础方为核心，把它的所有衍生方挂在旁边。记忆量能减少一半以上。"}]}
 ]},

{k:"tci",name:"中医内科学",en:"TCM INTERNAL MED",no:"5",eqLabel:"病证速查",flLabel:"临证思路",
 lede:"中医内科学是<strong>前四门的总集成</strong>：中基给病机，中诊给辨证，中药给药，方剂给方——内科把它们串起来，落到具体病证上。每个病证的学习结构是固定的：<strong>概念 → 病因病机 → 诊断要点 → 辨证论治（证型 + 治法 + 代表方）</strong>。背的不是病，是「病—证—法—方」这条链。<strong>本手册为教材知识梳理，不构成任何诊疗建议。</strong>",
 M:[
 {t:"总论：内科病证的辨治纲要",sub:"先掌握通用框架，再学具体病证",
  map:[["学习结构","每个病证都按：概念 → 病因病机 → 诊断与鉴别 → 辨证论治（分型 + 治法 + 主方）"],["辨证要点","辨病位（脏腑）、辨病性（虚实寒热）、辨标本缓急"],["治疗原则","治病求本、扶正祛邪、调整阴阳、三因制宜"],["病证分类","肺系、心系、脾胃、肝胆、肾系、气血津液、肢体经络"]],
  spine:"每个病证只需回答四个问题：病位在哪一脏？属虚还是实？分几个证型？每型用什么方？把这四问答完，一个病证就学完了。",
  fig:["bianzheng","gongbu"],
  g:[
  {g:"通用辨证要点",r:[
   ["辨病位","定脏腑","咳喘在肺；心悸胸痹在心；胃痛泄泻在脾胃；胁痛眩晕在肝；水肿腰痛在肾"],
   ["辨病性","定虚实","新病、急病、症状剧烈者多实；久病、体虚、症状缓者多虚。久病多虚实夹杂"],
   ["辨标本缓急","定先后","急则治标（如大出血先止血）；缓则治本；标本俱急则兼治"],
   ["辨病与辨证结合","","先辨病（确定是哪个病证），再辨证（确定是哪个证型）"]]},
  {g:"内科常见病机特点",r:[
   ["久病入络","","病久必瘀。慢性病证多兼血瘀，常需酌加活血药"],
   ["久病及肾","","五脏之伤，穷必及肾。慢性病后期多累及肾"],
   ["脾胃为本","","「有胃气则生」。任何病证的治疗都要顾护脾胃，不可一味攻伐"],
   ["痰瘀互结","","痰与瘀常相兼为病，尤见于慢性疑难病证"]]}]},

 {t:"肺系病证",sub:"感冒、咳嗽、哮病、喘证、肺胀、肺痨",
  map:[["感冒","风寒、风热、暑湿；体虚感冒"],["咳嗽","外感（风寒、风热、风燥）；内伤（痰湿、痰热、肝火、肺阴亏耗）"],["哮病","发作期（冷哮、热哮）；缓解期（肺脾肾虚）"],["喘证","实喘（风寒、痰热、痰浊、肝气）；虚喘（肺虚、肾虚）"]],
  spine:"「五脏六腑皆令人咳，非独肺也」——咳嗽虽病位在肺，但内伤咳嗽的根源常在脾（痰湿）、肝（肝火）、肾（阴虚），治肺不效时要往这三脏找。",
  g:[
  {g:"感冒",r:[
   ["风寒感冒","","恶寒重、发热轻、无汗、鼻塞流清涕、苔薄白、脉浮紧。治法：辛温解表。方：荆防败毒散"],
   ["风热感冒","","发热重、恶寒轻、有汗、咽痛、鼻流浊涕、苔薄黄、脉浮数。治法：辛凉解表。方：银翘散"],
   ["暑湿感冒","夏季","身热、微恶风、汗少、肢体酸重、头昏胀痛、苔黄腻。治法：清暑祛湿解表。方：新加香薷饮"],
   ["气虚感冒","","恶寒较甚、倦怠乏力、反复易感。治法：益气解表。方：参苏饮"]]},
  {g:"咳嗽",r:[
   ["风寒袭肺","外感","咳嗽声重、痰稀白、鼻塞流清涕。治法：疏风散寒、宣肺止咳。方：三拗汤合止嗽散"],
   ["风热犯肺","外感","咳嗽频剧、痰稠黄、咽痛。治法：疏风清热、宣肺止咳。方：桑菊饮"],
   ["风燥伤肺","外感","干咳无痰或痰少黏连、咽干鼻燥。治法：疏风清肺、润燥止咳。方：桑杏汤"],
   ["痰湿蕴肺","内伤","咳嗽痰多、色白黏腻、胸闷、纳呆、苔白腻。治法：燥湿化痰、理气止咳。方：二陈平胃散合三子养亲汤"],
   ["痰热郁肺","内伤","咳嗽气息粗促、痰多质黏色黄、面赤、苔黄腻。治法：清热肃肺、豁痰止咳。方：清金化痰汤"],
   ["肝火犯肺","内伤","上气咳逆阵作、咳时面赤、常感痰滞咽喉、症状随情绪波动。治法：清肺泻肝、顺气降火。方：黛蛤散合黄芩泻白散"],
   ["肺阴亏耗","内伤","干咳、痰少黏白、咳声短促、午后潮热、盗汗。治法：滋阴润肺、化痰止咳。方：沙参麦冬汤"]]},
  {g:"哮病与喘证",r:[
   ["哮病的病理因素","关键","「宿痰伏肺」为夙根，遇诱因引触而发。「哮必兼喘，喘未必兼哮」"],
   ["冷哮","发作期","喉中哮鸣如水鸡声、痰白清稀、形寒怕冷、苔白滑。治法：宣肺散寒、化痰平喘。方：射干麻黄汤"],
   ["热哮","发作期","喉中痰鸣如吼、痰黄黏稠、烦闷、汗出、苔黄腻。治法：清热宣肺、化痰定喘。方：定喘汤"],
   ["缓解期","","肺脾气虚（玉屏风散、六君子汤）；肺肾两虚（生脉地黄汤合金水六君煎）"],
   ["实喘与虚喘的鉴别","必考","实喘：呼吸深长有余、呼出为快、气粗声高、脉数有力；虚喘：呼吸短促难续、深吸为快、气怯声低、脉微弱"],
   ["肾虚喘","虚喘","喘促日久、呼多吸少、动则喘甚、腰膝酸软。治法：补肾纳气。方：金匮肾气丸合参蛤散"]]}]},

 {t:"心系与脾胃病证",sub:"心悸、胸痹、不寐；胃痛、痞满、泄泻、便秘",
  map:[["心悸","心虚胆怯、心血不足、阴虚火旺、心阳不振、水饮凌心、瘀阻心脉、痰火扰心"],["胸痹","心血瘀阻、气滞心胸、痰浊闭阻、寒凝心脉、气阴两虚、心肾阴虚、心肾阳虚"],["不寐","肝火扰心、痰热扰心、心脾两虚、心肾不交、心胆气虚"],["脾胃病","胃痛、痞满、呕吐、泄泻、痢疾、便秘、腹痛"]],
  spine:"胸痹的病机是「本虚标实」：本虚为气血阴阳亏虚，标实为血瘀、痰浊、寒凝、气滞。急性发作时先治标（活血、化痰、散寒），缓解期再治本。",
  g:[
  {g:"心悸",r:[
   ["心虚胆怯","","心悸善惊易恐、坐卧不安、少寐多梦。治法：镇惊定志、养心安神。方：安神定志丸"],
   ["心血不足","","心悸头晕、面色无华、倦怠乏力。治法：补血养心、益气安神。方：归脾汤"],
   ["阴虚火旺","","心悸易惊、心烦失眠、五心烦热、盗汗。治法：滋阴清火、养心安神。方：天王补心丹合朱砂安神丸"],
   ["心阳不振","","心悸不安、胸闷气短、形寒肢冷。治法：温补心阳、安神定悸。方：桂枝甘草龙骨牡蛎汤合参附汤"],
   ["水饮凌心","","心悸眩晕、胸闷痞满、渴不欲饮、下肢浮肿。治法：振奋心阳、化气行水。方：苓桂术甘汤"],
   ["瘀阻心脉","","心悸不安、胸闷不舒、心痛时作、唇甲青紫、舌质紫暗。治法：活血化瘀、理气通络。方：桃仁红花煎"]]},
  {g:"胸痹",r:[
   ["心血瘀阻","","心胸疼痛如刺、痛有定处、入夜为甚、舌质紫暗。治法：活血化瘀、通脉止痛。方：血府逐瘀汤"],
   ["痰浊闭阻","","胸闷重而心痛微、痰多气短、体胖、苔浊腻。治法：通阳泄浊、豁痰宣痹。方：瓜蒌薤白半夏汤合涤痰汤"],
   ["寒凝心脉","","猝然心痛如绞、形寒、天冷易发。治法：辛温散寒、宣通心阳。方：枳实薤白桂枝汤合当归四逆汤"],
   ["气滞心胸","","心胸满闷、隐痛阵发、痛无定处、时欲太息、遇情志不遂时诱发。治法：疏肝理气、活血通络。方：柴胡疏肝散"],
   ["气阴两虚","","心胸隐痛、时作时休、心悸气短、倦怠懒言。治法：益气养阴、活血通脉。方：生脉散合人参养荣汤"],
   ["心肾阳虚","","心悸而痛、胸闷气短、畏寒肢冷、腰酸乏力。治法：温补阳气、振奋心阳。方：参附汤合右归饮"]]},
  {g:"不寐",r:[
   ["肝火扰心","实证","不寐多梦、急躁易怒、目赤口苦、便秘尿黄。治法：疏肝泻火、镇心安神。方：龙胆泻肝汤"],
   ["痰热扰心","实证","心烦不寐、胸闷脘痞、泛恶嗳气、口苦、苔黄腻。治法：清化痰热、和中安神。方：黄连温胆汤"],
   ["心脾两虚","虚证","不易入睡、多梦易醒、心悸健忘、神疲食少。治法：补益心脾、养血安神。方：归脾汤"],
   ["心肾不交","虚证","心烦不寐、入睡困难、心悸多梦、头晕耳鸣、腰膝酸软、五心烦热。治法：滋阴降火、交通心肾。方：六味地黄丸合交泰丸"],
   ["心胆气虚","虚证","虚烦不寐、触事易惊、终日惕惕、胆怯心悸。治法：益气镇惊、安神定志。方：安神定志丸合酸枣仁汤"]]},
  {g:"脾胃病证",r:[
   ["胃痛：寒邪客胃","","胃痛暴作、恶寒喜暖、得温痛减。治法：温胃散寒、行气止痛。方：良附丸"],
   ["胃痛：饮食伤胃","","胃脘疼痛、胀满拒按、嗳腐吞酸。治法：消食导滞、和胃止痛。方：保和丸"],
   ["胃痛：肝气犯胃","","胃脘胀痛、痛连两胁、遇烦恼则痛作。治法：疏肝解郁、理气止痛。方：柴胡疏肝散"],
   ["胃痛：脾胃虚寒","","胃痛隐隐、绵绵不休、喜温喜按、劳累或受凉后发作。治法：温中健脾、和胃止痛。方：黄芪建中汤"],
   ["胃痛：胃阴亏耗","","胃脘隐隐灼痛、饥不欲食、口燥咽干、舌红少津。治法：养阴益胃、和中止痛。方：一贯煎合芍药甘草汤"],
   ["泄泻：脾胃虚弱","","大便时溏时泻、稍进油腻则便次增多、食少神疲。治法：健脾益气、化湿止泻。方：参苓白术散"],
   ["泄泻：肾阳虚衰","五更泻","黎明之前腹痛肠鸣、泻后则安、形寒肢冷。治法：温肾健脾、固涩止泻。方：四神丸"],
   ["泄泻：肝气乘脾","","腹痛肠鸣泄泻、每因情志不遂而发。治法：抑肝扶脾。方：痛泻要方"]]}]},

 {t:"肝胆与肾系病证",sub:"胁痛、黄疸、头痛、眩晕、中风；水肿、淋证、腰痛",
  map:[["胁痛","肝郁气滞、肝胆湿热、瘀血阻络、肝络失养"],["黄疸","阳黄（湿热）与阴黄（寒湿）；急黄（疫毒）"],["眩晕","肝阳上亢、气血亏虚、肾精不足、痰湿中阻、瘀血阻窍"],["中风","中经络与中脏腑；闭证与脱证"],["水肿","阳水（风水、湿毒、水湿、湿热）与阴水（脾阳虚、肾阳虚）"]],
  spine:"眩晕的病机可归为「风、火、痰、虚、瘀」五字；中风则要先分中经络还是中脏腑，再分闭证还是脱证——这一步分错，治法南辕北辙。",
  g:[
  {g:"黄疸与胁痛",r:[
   ["阳黄：热重于湿","","身目俱黄、黄色鲜明如橘、发热口渴、苔黄腻。治法：清热通腑、利湿退黄。方：茵陈蒿汤"],
   ["阳黄：湿重于热","","身目俱黄、头重身困、胸脘痞满、苔厚腻微黄。治法：利湿化浊运脾、佐以清热。方：茵陈五苓散合甘露消毒丹"],
   ["阴黄","","身目俱黄、黄色晦暗如烟熏、纳少脘闷、畏寒神疲、苔白腻。治法：健脾和胃、温化寒湿。方：茵陈术附汤"],
   ["阳黄 vs 阴黄","必辨","阳黄：黄色鲜明如橘、病程短、属湿热；阴黄：黄色晦暗如烟熏、病程长、属寒湿"],
   ["胁痛：肝郁气滞","","胁肋胀痛、走窜不定、随情绪波动。治法：疏肝理气。方：柴胡疏肝散"],
   ["胁痛：瘀血阻络","","胁肋刺痛、痛有定处、入夜尤甚、舌质紫暗。治法：祛瘀通络。方：血府逐瘀汤"]]},
  {g:"眩晕与头痛",r:[
   ["肝阳上亢","","眩晕耳鸣、头目胀痛、急躁易怒、失眠多梦。治法：平肝潜阳、清火息风。方：天麻钩藤饮"],
   ["气血亏虚","","眩晕动则加剧、劳累即发、面色㿠白、神疲乏力。治法：补益气血、调养心脾。方：归脾汤"],
   ["肾精不足","","眩晕日久不愈、精神萎靡、腰膝酸软、耳鸣。治法：滋养肝肾、益精填髓。方：左归丸（偏阴虚）或右归丸（偏阳虚）"],
   ["痰湿中阻","","眩晕、头重昏蒙、胸闷恶心、苔白腻。治法：化痰祛湿、健脾和胃。方：半夏白术天麻汤"],
   ["瘀血阻窍","","眩晕头痛、健忘失眠、面唇紫暗。治法：祛瘀生新、活血通窍。方：通窍活血汤"]]},
  {g:"中风（最重要）",r:[
   ["中经络","无神志改变","半身不遂、口舌歪斜、语言不利，但神志清楚。病情较轻"],
   ["中脏腑","有神志改变","突然昏仆、不省人事，兼见半身不遂。病情危重。分闭证与脱证"],
   ["闭证","实证","牙关紧闭、口噤不开、两手握固、大小便闭、肢体强痉。治法：息风清火、豁痰开窍",
    "闭证再分阳闭（面赤身热、气粗口臭、躁扰不宁、苔黄腻，用羚角钩藤汤合安宫牛黄丸）与阴闭（面白唇暗、静卧不烦、四肢不温、苔白腻，用涤痰汤合苏合香丸）。"],
   ["脱证","虚证，危候","目合口张、鼻鼾息微、手撒肢冷、汗多、二便自遗、脉微欲绝。治法：回阳救阴、益气固脱。方：参附汤合生脉散"],

  {g:"水肿与淋证",r:[
   ["阳水：风水相搏","","眼睑先肿、继及全身、来势迅速、多有恶寒发热。治法：疏风清热、宣肺行水。方：越婢加术汤"],
   ["阳水：水湿浸渍","","全身水肿、下肢明显、按之没指、身体困重。治法：运脾化湿、通阳利水。方：五皮饮合胃苓汤"],
   ["阴水：脾阳虚衰","","身肿日久、腰以下为甚、按之凹陷不易恢复、脘腹胀闷、纳减便溏。治法：健脾温阳利水。方：实脾饮"],
   ["阴水：肾阳衰微","","水肿日久、腰以下甚、心悸气促、腰部冷痛、四肢厥冷。治法：温肾助阳、化气行水。方：济生肾气丸合真武汤"],
   ["阳水 vs 阴水","","阳水：起病急、来势猛、多从头面开始、按之凹陷易复、属实；阴水：起病缓、病程长、多从下肢开始、按之凹陷难复、属虚"],
   ["淋证六种","","热淋、石淋、血淋、气淋、膏淋、劳淋。热淋用八正散；石淋用石韦散；血淋用小蓟饮子；劳淋用无比山药丸"]]}]},

 {t:"气血津液与肢体经络病证",sub:"郁证、血证、消渴、虚劳；痹证、痿证",
  map:[["郁证","肝气郁结、气郁化火、痰气郁结、心神失养、心脾两虚、心肾阴虚"],["血证","按出血部位分：鼻衄、齿衄、咳血、吐血、便血、尿血、紫斑"],["消渴","上消（肺热津伤）、中消（胃热炽盛）、下消（肾阴亏虚、阴阳两虚）"],["痹证","行痹、痛痹、着痹、热痹；久痹（痰瘀痹阻、肝肾两虚）"],["痿证","肺热津伤、湿热浸淫、脾胃虚弱、肝肾亏虚"]],

  g:[
  {g:"郁证与血证",r:[

   ["气郁化火","","急躁易怒、胸闷胁胀、口苦而干、目赤耳鸣。治法：疏肝解郁、清肝泻火。方：丹栀逍遥散"],
   ["痰气郁结","梅核气","咽中如有物梗塞、咯之不出、咽之不下。治法：行气开郁、化痰散结。方：半夏厚朴汤"],
   ["心神失养","脏躁","精神恍惚、心神不宁、悲忧善哭、时时欠伸。治法：甘润缓急、养心安神。方：甘麦大枣汤"],
   ["血证治疗三原则","必背","治火（实火清热泻火、虚火滋阴降火）、治气（实证清气降气、虚证补气益气）、治血（凉血止血、收敛止血、活血止血）"],
   ["咳血：燥热伤肺","","喉痒咳嗽、痰中带血、口干鼻燥。治法：清热润肺、宁络止血。方：桑杏汤"],
   ["便血：脾胃虚寒","","便血紫暗甚则黑色、腹部隐痛、面色无华。治法：健脾温中、养血止血。方：黄土汤"]]},
  {g:"消渴与虚劳",r:[
   ["上消：肺热津伤","","口渴多饮、口干舌燥、尿频量多。治法：清热润肺、生津止渴。方：消渴方"],
   ["中消：胃热炽盛","","多食易饥、口渴、尿多、形体消瘦、大便干燥。治法：清胃泻火、养阴增液。方：玉女煎"],
   ["下消：肾阴亏虚","","尿频量多、混浊如脂膏、腰膝酸软、乏力、头晕耳鸣。治法：滋阴固肾。方：六味地黄丸"],
   ["下消：阴阳两虚","","小便频数、混浊如膏、甚则饮一溲一、面容憔悴、腰膝酸软、畏寒肢冷。治法：滋阴温阳、补肾固涩。方：金匮肾气丸"],
   ["消渴的病机核心","","阴虚为本，燥热为标。二者互为因果：阴愈虚则燥热愈盛，燥热愈盛则阴愈虚"],
   ["消渴的常见并发症","","白内障、雀盲、耳聋（肝肾精血不能上承）；疮疡痈疽（燥热内结、营阴被灼）；中风、水肿"]]},
  {g:"痹证与痿证",r:[

   ["着痹（湿痹）","","肢体关节重着、酸痛、肿胀、肌肤麻木。治法：除湿通络、祛风散寒。方：薏苡仁汤"],
   ["热痹","","关节疼痛、局部灼热红肿、痛不可触、得冷稍舒。治法：清热通络、祛风除湿。方：白虎加桂枝汤"],
   ["痹证 vs 痿证","高频鉴别","痹证以「痛」为主（关节疼痛，可有肌肉萎缩但因痛废用）；痿证以「无力」为主（肢体痿软无力，一般不痛）"],
   ["痿证：肺热津伤","","病起发热之后、突然肢体软弱无力、皮肤干燥、心烦口渴。治法：清热润燥、养阴生津。方：清燥救肺汤"],
   ["痿证：肝肾亏虚","","起病缓慢、下肢痿软无力、腰膝酸软、头晕耳鸣。治法：补益肝肾、滋阴清热。方：虎潜丸"],
   ["治痿独取阳明","经典论述","阳明为五脏六腑之海，主润宗筋。治痿要重视调理脾胃"]]}]}

 F:[
 {t:"临证四步：从症状到处方",when:"中内的标准思维路径",s:[
  {b:"第一步：定病（是哪个病证）",p:"先根据主症确定病名。咳嗽、胸痹、眩晕、水肿——病名定了，讨论的范围就缩小了。",
   f:[["以咳嗽为主症","咳嗽"],["以胸痛憋闷为主症","胸痹"],["以头晕目眩为主症","眩晕"],["突然昏仆兼半身不遂","中风"],["肢体关节疼痛","痹证"],["肢体痿软无力而不痛","痿证"]]},
  {b:"第二步：定证（是哪个证型）",p:"用中诊的八纲与脏腑辨证，把病证分到具体的证型。这一步是全部工作的核心。",
   f:[["先分外感与内伤","外感起病急、病程短、多有表证；内伤起病缓、病程长"],["再分虚实","实证症状剧烈、脉有力；虚证症状缓、脉无力"],["再定脏腑","按各脏腑的特征症状定位"]]},
  {b:"第三步：立法（确定治法）",p:"法随证立。证型确定后，治法几乎是自动导出的：痰湿蕴肺 → 燥湿化痰；肝阳上亢 → 平肝潜阳；脾胃虚寒 → 温中健脾。"},
  {b:"第四步：选方（方从法出）",p:"每个治法对应代表方。代表方必须背熟——它是「证—法—方」这条链的终点。"},
  {b:"第五步：随证加减",p:"基础方定了，再根据兼症加减。这是从「会背」到「会用」的分水岭。",
   trap:"本手册仅为知识梳理。任何实际诊疗都必须由执业中医师面诊后进行。"}]},

 {t:"高频鉴别：这几组必须分清",when:"中内考试的失分重灾区",s:[
  {b:"实喘 vs 虚喘",p:"实喘：呼吸深长有余、呼出为快、气粗声高、脉数有力；虚喘：呼吸短促难续、深吸为快、气怯声低、脉微弱。",
   trap:"「呼出为快」是实，「深吸为快」是虚——这是最经典的一组鉴别。"},
  {b:"中风：闭证 vs 脱证",p:"闭证「握固」（牙关紧闭、两手握固）属实，宜开窍；脱证「撒手」（手撒、口张、遗尿、汗多）属虚，宜固脱。",
   trap:"这一组判错，用药方向完全相反，后果最严重。"},
  {b:"黄疸：阳黄 vs 阴黄",p:"阳黄黄色鲜明如橘、病程短、属湿热（茵陈蒿汤）；阴黄黄色晦暗如烟熏、病程长、属寒湿（茵陈术附汤）。"},
  {b:"水肿：阳水 vs 阴水",p:"阳水起病急、从头面开始、按之易复、属实；阴水起病缓、从下肢开始、按之难复、属虚。"},
  {b:"痹证 vs 痿证",p:"痹证以「痛」为主，痿证以「无力」为主且一般不痛。这是两个完全不同的病。"},
  {b:"哮病 vs 喘证",p:"哮以喉中哮鸣有声为特征（发作性），喘以呼吸困难为特征。哮必兼喘，喘未必兼哮。"}]},

 {t:"中内的学习方法",when:"这门课信息量最大，必须有方法",s:[
  {b:"用固定的表格结构记每个病证",p:"病名 → 病因病机 → 每个证型（主症 + 治法 + 代表方）。所有病证都套这个模板，记忆才有秩序。"},
  {b:"抓「证—法—方」的三元组",p:"这是中内的最小记忆单元。不要孤立记方名，要记「肝阳上亢 → 平肝潜阳 → 天麻钩藤饮」这个整体。"},
  {b:"横向串联同一首方",p:"一首方常出现在多个病证中，串起来记忆效率翻倍。",
   f:[["归脾汤","心悸（心血不足）、不寐（心脾两虚）、眩晕（气血亏虚）、血证（气不摄血）"],["血府逐瘀汤","胸痹（心血瘀阻）、胁痛（瘀血阻络）、头痛（瘀血头痛）"],["六味地黄丸","眩晕（肾精不足）、消渴（下消）、腰痛（肾阴虚）"],["半夏白术天麻汤","眩晕（痰湿中阻）、头痛（痰浊头痛）"],["柴胡疏肝散","胃痛（肝气犯胃）、胁痛（肝郁气滞）、郁证（肝气郁结）、胸痹（气滞心胸）"]]},
  {b:"回头串起前四门",p:"遇到不理解的证型，回中基查病机、回中诊查证候、回中药查药性、回方剂查配伍。中内是集成课，孤立地学必然学不透。"},

{"k": "zj", "name": "针灸学", "en": "ACUPUNCTURE", "no": "6", "eqLabel": "腧穴速查", "flLabel": "取穴与配穴", "lede": "针灸学是中医里<strong>动手性最强</strong>的一门：它把经络理论落到具体的穴位定位、刺灸手法与配穴处方上。学习路径是——<strong>先会定位（骨度分寸与体表标志）→ 再懂主治规律（分经·分部）→ 最后学配穴组方</strong>。本手册与中基「经络」章互补：那里讲经络<strong>理论</strong>，这里讲腧穴<strong>应用</strong>。<strong>重要说明：针刺是有创医疗操作，必须由取得执业资质者施行。本手册仅供理论学习与文化了解，不可据此自行针刺或为他人施针。艾灸、拔罐、按压虽风险较低，也有明确禁忌，操作前请充分了解。</strong>", "M": [{"t": "总论：针灸学的框架", "sub": "先知道这门课在学什么", "fig": "zjsanquan", "map": [["三大板块", "经络腧穴（在哪）· 刺灸方法（怎么做）· 针灸治疗（治什么）"], ["与中基的分工", "中基讲经络理论与循行，针灸学讲腧穴定位、手法与处方"], ["学习次第", "定位 → 主治规律 → 特定穴 → 配穴处方 → 病证治疗"], ["源流", "《黄帝内经》奠基 · 《针灸甲乙经》（皇甫谧）第一部针灸专著 · 《针灸大成》（杨继洲）集大成"], ["十二经速记","名字=手/足+三阴三阳+脏腑;顺序:肺大胃脾心小肠,膀肾包焦胆肝续;走向四句;三个圈(见图)"]], "spine": "针灸学的核心不是背穴名，而是三件事：穴在哪、能治什么、几个穴怎么配起来用。定位不准，后面全是空谈。", "g": [{"g": "三大板块", "r": [["经络腧穴", "基础", "十四经腧穴的定位、归经、主治。这是全部内容的地基"], ["刺法灸法", "技术", "毫针刺法、艾灸、拔罐、三棱针、皮肤针等操作方法与禁忌"], ["针灸治疗", "应用", "治疗原则、选穴配穴规律、各科常见病证的处方"]]}, {"g": "重要典籍", "r": [["《黄帝内经》", "理论奠基", "《灵枢》又称《针经》，系统论述经络腧穴与刺法"], ["《针灸甲乙经》", "晋·皇甫谧", "现存最早的针灸学专著，厘定腧穴 349 个"], ["《铜人腧穴针灸图经》", "宋·王惟一", "并铸针灸铜人，用于教学与考核"], ["《针灸大成》", "明·杨继洲", "集明以前针灸之大成，流传最广"]]}, {"g":"十二经快速记忆:三条规律","r":[["规律一:名字是拼出来的","手足+三阴三阳+脏腑","每条经名=手/足+三阴三阳+脏腑,如「手太阴肺经」。只需记两条对应:阴经属脏、行四肢内侧;阳经属腑、行外侧。内侧从前到后=太阴、厥阴、少阴;外侧从前到后=阳明、少阳、太阳——任何一条经的名字和大致位置都能现场推出来,不用背"],["规律二:顺序口诀","肺大胃脾心小肠,膀肾包焦胆肝续","气血从肺经出发依次流经十二经,循环回到肺。别当字符串死背——配着下方「三个圈」理解:四条经一组,每组画一个「胸→手→头→足→胸」的大圈,十二经正好三个圈"],["表里配对不用单独背","口诀里两两相邻","肺—大肠、胃—脾、心—小肠、膀胱—肾、心包—三焦、胆—肝:口诀里每相邻两经就是一对表里(一脏一腑、一阴一阳),交接处正好完成一次阴阳转换"],["规律三:走向四句","举手定阴阳","手三阴从胸走手,手三阳从手走头;足三阳从头走足,足三阴从足走胸腹。双手上举时阴经全向上、阳经全向下——站起来在自己身上比划一遍,动作记忆比看图十遍都牢"],["进阶挂钩:十二时辰","子午流注","寅时(3—5点)起于肺经,一个时辰一经:寅肺卯大肠、辰胃巳脾、午心未小肠、申膀胱酉肾、戌心包亥三焦、子胆丑肝——既是二次复习,又解释了「凌晨三四点醒与肺有关」这类说法的出处"],["三天记忆计划","每天一个圈","第一天:肺大胃脾(圈一)+走向四句;第二天:心小膀肾(圈二)+表里配对;第三天:包焦胆肝(圈三)+时辰挂钩。之后只做「身上摸行」复习:沿每条经的大致路线在自己身上摸一遍","别第一天就贪多背穴位——先把十二条「河道」的框架立起来;穴位是河道上的码头,后学"]]}, {"g": "学习建议（面向自学者）", "r": [["先解剖后穴位", "关键", "很多穴位以肌肉、肌腱、骨性标志定位。对照解剖图学，比死记文字描述有效得多"], ["在自己身上找", "", "按图找到大致位置后按压，有酸胀感（得气感）的点通常就在附近"], ["先学少而精", "", "先掌握四总穴、常用特定穴约 30–50 个，比泛泛记住三百多个穴名有用"], ["理论可自学，操作须师承", "边界", "定位、主治、配穴可以自学；针刺手法必须有资质者手把手带教"]]}]}, {"t": "腧穴定位法", "sub": "不会定位，其余都是空谈", "map": [["骨度分寸法", "把身体各部位折算成固定等份，不受高矮胖瘦影响"], ["体表标志法", "固定标志（骨节、五官）与活动标志（肌腱、皮纹）"], ["指寸法", "以患者本人的手指宽度作尺，方便但精度较低"], ["简便取穴法", "一些约定俗成的快捷方法"]], "spine": "「同身寸」的意思是：用<strong>被取穴者自己</strong>的身体比例作尺子。高个子的一寸比矮个子长——所以千万不要用自己的手去量别人。", "fig": "gudu", "g": [{"g": "骨度分寸：常用折量（记这几条就够）", "r": [["前发际至后发际", "12 寸", "头部纵向定位的基准"], ["两乳头之间", "8 寸", "胸部横向定位（女性以锁骨中线为准）"], ["胸剑联合至脐中", "8 寸", "上腹部纵向"], ["脐中至耻骨联合上缘", "5 寸", "下腹部纵向"], ["腋前纹头至肘横纹", "9 寸", "上臂"], ["肘横纹至腕横纹", "12 寸", "前臂——内关、外关等常用穴的基准"], ["耻骨联合上缘至股骨内上髁", "18 寸", "大腿内侧"], ["胫骨内侧髁下方至内踝尖", "13 寸", "小腿内侧——三阴交的基准"], ["腘横纹至外踝尖", "16 寸", "小腿外侧——足三里的基准"]]}, {"g": "体表标志法", "r": [["固定标志", "不随姿势变", "五官、乳头、脐、指甲、骨节突起（如肩峰、髂前上棘、内外踝尖）"], ["活动标志", "需摆特定姿势", "张口时耳屏前凹陷取听宫；屈肘时肘横纹外端取曲池；握拳时掌横纹头取后溪"], ["实用提示", "", "很多穴位描述里的「凹陷处」「肌腱之间」，都要靠手指触摸确认，光看图不够"]]}, {"g": "指寸法（同身寸）", "r": [["中指同身寸", "1 寸", "中指屈曲时，中节内侧两端纹头之间的距离"], ["拇指同身寸", "1 寸", "拇指指间关节的横向宽度"], ["横指同身寸（一夫法）", "3 寸", "食、中、无名、小指并拢，以中指中节横纹为准的四指宽度"], ["重要前提", "常见错误", "必须用<strong>被取穴者本人</strong>的手指。给别人取穴时用自己的手，会有明显误差"], ["精度局限", "", "指寸法方便但不够精确，宜与骨度分寸法互相参照"]]}, {"g": "几个简便取穴法", "r": [["列缺", "两手虎口交叉", "一手食指压在另一手腕后桡骨茎突上，食指尖下凹陷处"], ["百会", "两耳尖连线中点", "与头部前后正中线的交点"], ["风市", "直立垂手", "中指尖所到之处，大腿外侧"], ["足三里", "外膝眼下 3 寸", "胫骨前嵴外一横指处；也可用一夫法从犊鼻向下量"], ["合谷", "拇食指并拢", "肌肉隆起最高点；或用另一手拇指指间关节横纹对准虎口边缘，拇指尖下即是"]]}]}, {"t": "腧穴的分类与主治规律", "sub": "记规律，而不是记三百个穴", "map": [["三大类", "十四经穴（有归经）· 奇穴（有定位无归经）· 阿是穴（以痛为腧）"], ["分经主治", "同一条经的穴位，主治有共性"], ["分部主治", "同一部位的穴位，主治有共性"], ["近治·远治·特殊作用", "腧穴主治的三个层次"]], "spine": "腧穴主治有两条线索:<strong>分经</strong>（这条经能治什么）和<strong>分部</strong>（这个部位能治什么）。任何一个穴的主治,基本都能从这两条推出来。", "g": [{"g": "腧穴的三大类", "r": [["十四经穴", "362 个", "归属十二正经与任督二脉，有固定名称、定位与归经"], ["经外奇穴", "", "有固定名称与定位，但不归入十四经。如印堂、太阳、四神聪、十宣"], ["阿是穴", "以痛为腧", "无固定名称与定位，以压痛点或反应点取穴。多用于痛证"]]}, {"g": "主治规律的三个层次", "r": [["近治作用", "所有腧穴共有", "能治疗所在部位及邻近组织器官的病证。如眼周穴治眼病、胃部穴治胃病"], ["远治作用", "十四经穴特有", "尤其肘膝以下的穴位，能治疗本经循行所过部位的远端病证。如合谷治面口、足三里治肚腹"], ["特殊作用", "部分穴位具有", "双向调节（如天枢既治泄泻又治便秘）；特异性治疗（如大椎退热、至阴矫正胎位）"]]}, {"g": "分经主治：各经的共性", "r": [["手三阴", "肺经治肺喉·心包经治心胃神志·心经治心与神志", "三经共治胸部病"], ["手三阳", "大肠经治前头鼻口齿·三焦经治侧头胁肋·小肠经治后头肩胛神志", "三经共治咽喉热病"], ["足三阳", "胃经治前头口齿咽喉胃肠·胆经治侧头耳胁肋·膀胱经治后头背腰（背俞并治脏腑）", "三经共治神志病与热病"], ["足三阴", "脾经治脾胃·肝经治肝·肾经治肾肺咽喉", "三经共治腹部病与妇科病"], ["任督二脉", "任脉治回阳固脱、强壮作用·督脉治中风昏迷、热病、头面病", "二脉共治神志病、脏腑病、妇科病"]]}, {"g": "分部主治：各部位的共性", "r": [["头面颈项", "", "局部器官病证（眼耳鼻口齿咽喉）+ 神志病"], ["胸膺胁腹", "", "相应内脏病证。上腹治胃、下腹治肠与泌尿生殖"], ["肩背腰骶", "", "背俞穴治相应脏腑；腰骶部治肾、膀胱、肠与妇科"], ["四肢", "", "肘膝以下穴位除治局部外，还有远治作用；肘膝以上多治局部"]]}]}, {"t": "特定穴详解", "sub": "最有实用价值的一批穴", "map": [["五输穴", "井荥输经合，全在肘膝以下"], ["原络郄", "原穴诊脏腑 · 络穴通表里 · 郄穴治急症"], ["俞募八会", "背俞在后、募穴在前、八会各主一类"], ["下合与交会", "六腑下合于足三阳 · 交会穴一穴通多经"]], "spine": "特定穴是针灸的「常用词汇表」。三百多个穴不必都记，但这一百来个特定穴的规律必须熟——临床配穴基本都从这里出。", "g": [{"g": "五输穴（每经 5 个，共 60 个）", "r": [["井穴", "所出为井", "位于指趾末端。主治：心下满、神志急症（急救开窍、点刺放血）"], ["荥穴", "所溜为荥", "掌指（跖趾）关节之前。主治：身热——清热要穴"], ["输穴", "所注为输", "掌指（跖趾）关节之后。主治：体重节痛——关节痛、湿证"], ["经穴", "所行为经", "腕踝附近或前臂胫部。主治：喘咳寒热——咽喉肺系病"], ["合穴", "所入为合", "肘膝附近。主治：逆气而泄——六腑病、腹泻呕逆"], ["五行配属", "必背", "阴经：井木→荥火→输土→经金→合水；阳经：井金→荥水→输木→经火→合土"], ["子母补泻", "应用", "虚补其母、实泻其子。如肺（金）虚，补本经母穴太渊（输土，土生金）"]]}, {"g": "原穴·络穴·郄穴", "r": [["原穴", "脏腑原气留止处", "十二原穴多在腕踝附近。既可诊察脏腑病变，也可治疗本脏腑病"], ["十二原穴", "可背", "肺太渊·心包大陵·心神门·大肠合谷·三焦阳池·小肠腕骨·脾太白·肝太冲·肾太溪·胃冲阳·胆丘墟·膀胱京骨"], ["络穴", "一络通两经", "由本经别走相表里之经的联络点。可同治表里两经病证"], ["原络配穴", "主客配穴", "先病经取原穴（主），后病经取络穴（客）。如肺经先病取太渊，配大肠经络穴偏历"], ["郄穴", "气血深聚处", "共 16 个。<strong>阴经郄穴治血证，阳经郄穴治急性痛证</strong>"], ["常用郄穴", "", "孔最（肺·咯血）· 郄门（心包·心痛）· 梁丘（胃·急性胃痛）· 地机（脾·痛经）"]]}, {"g": "背俞穴·募穴·八会穴", "r": [["背俞穴", "位于背部膀胱经", "脏腑之气输注于背腰部。多治脏病（阴病），也可诊察"], ["常用背俞", "", "肺俞·心俞·肝俞·胆俞·脾俞·胃俞·肾俞·大肠俞·膀胱俞"], ["募穴", "位于胸腹部", "脏腑之气结聚于胸腹。多治腑病（阳病）"], ["常用募穴", "", "中府（肺）· 膻中（心包）· 巨阙（心）· 期门（肝）· 日月（胆）· 章门（脾）· 中脘（胃）· 天枢（大肠）· 关元（小肠）· 中极（膀胱）· 京门（肾）· 石门（三焦）"], ["俞募配穴", "前后配穴", "背俞（后）配腹募（前），一阴一阳，治本脏腑病。如胃病取胃俞配中脘"], ["八会穴", "八类精气所会", "脏会章门·腑会中脘·气会膻中·血会膈俞·筋会阳陵泉·脉会太渊·骨会大杼·髓会绝骨"]]}, {"g": "下合穴·八脉交会穴·交会穴", "r": [["下合穴", "合治内腑", "六腑之气下合于足三阳经的穴位。六腑病多取下合穴"], ["六个下合穴", "", "胃—足三里 · 大肠—上巨虚 · 小肠—下巨虚 · 胆—阳陵泉 · 膀胱—委中 · 三焦—委阳"], ["八脉交会穴", "通奇经", "四肢部八穴各通一条奇经，常两两配伍"], ["八穴配对", "可背", "公孙—内关（心胸胃）· 后溪—申脉（目内眦颈项耳肩）· 足临泣—外关（目外眦颊颈耳后肩）· 列缺—照海（肺系咽喉胸膈）"], ["交会穴", "一穴通多经", "两经或多经交会处的穴位。如三阴交为足三阴交会，故能同调肝脾肾"]]}]}, {"t": "刺法灸法", "sub": "操作层面：了解原理与禁忌", "map": [["毫针刺法", "进针·行针·得气·补泻·留针出针"], ["灸法", "艾炷灸·艾条灸·温针灸；温经散寒、扶阳固脱"], ["其他疗法", "拔罐·三棱针·皮肤针·耳针"], ["禁忌与意外处理", "部位禁忌·状态禁忌·晕针等处理"]], "spine": "这一章的内容<strong>只用于理解原理</strong>。针刺属有创操作，必须由执业者施行——即便是艾灸、拔罐，也有明确禁忌，不了解就动手容易出事。", "fig": "zhenci", "g": [{"g": "毫针刺法要点（理论了解）", "r": [["得气", "针刺的关键", "医者感到针下沉紧，患者感到酸、麻、胀、重。「气至而有效」"], ["针刺角度", "", "直刺（90°，肌肉丰厚处）· 斜刺（45°，肌肉浅薄或近内脏处）· 平刺（15°，皮薄如头面）"], ["深浅原则", "", "因部位、体型、病情、季节而异。胸背腰部尤须谨慎——过深可致气胸等严重后果"], ["基本补泻", "", "徐疾（慢进快出为补）· 提插（重插轻提为补）· 捻转（拇指向前为补）· 迎随（顺经为补）· 开阖（出针按闭针孔为补）"], ["留针与出针", "", "一般留 15–30 分钟；出针后按压针孔，核对针数以防遗漏"]]}, {"g": "灸法", "r": [["作用特点", "", "温经散寒、扶阳固脱、消瘀散结、防病保健。<strong>虚寒证尤宜</strong>"], ["艾炷灸", "", "直接灸（瘢痕灸/无瘢痕灸）与间接灸（隔姜、隔蒜、隔盐、隔附子饼）"], ["艾条灸", "家用最常见", "温和灸（悬定不动）· 雀啄灸（上下如鸟啄）· 回旋灸（往复移动）"], ["温针灸", "", "针柄上置艾绒点燃，针灸并用，适于既需留针又需温通者"], ["常用保健穴", "", "足三里、关元、气海、神阙（神阙禁针宜灸）"], ["灸的禁忌", "务必知道", "实热证、阴虚发热者慎灸；颜面五官、大血管处、孕妇腰骶及下腹部禁灸；过饥过饱过劳时不宜"]]}, {"g": "其他常用疗法", "r": [["拔罐", "", "以负压吸附体表。适用于风寒湿痹、腰背肩痛。皮肤破损、高热抽搐、孕妇腹腰骶部禁用"], ["三棱针", "点刺放血", "用于实证、热证、瘀证、急症。如少商点刺治咽喉肿痛。体虚、孕妇、凝血障碍者禁用"], ["皮肤针（梅花针）", "叩刺", "轻叩皮肤，用于头痛、失眠、皮肤病等"], ["耳针", "", "耳廓上的反应点。常用于止痛、戒断、调节功能"], ["穴位按压", "风险最低", "不用器械，按揉穴位。适合自我保健，但同样需注意孕妇禁忌穴"]]}, {"g": "禁忌与意外（重点）", "r": [["部位禁忌", "最需警惕", "眼区、项部（风府哑门深部为延髓）、胸背（气胸风险）、大血管处、乳中、脐中——这些部位的针刺必须由受过专门训练者操作"], ["孕妇禁忌", "", "合谷、三阴交、昆仑、至阴等；腰骶部与下腹部穴位禁针禁灸"], ["状态禁忌", "", "过饥、过饱、大醉、大怒、大惊、过劳、极度虚弱时不宜针刺"], ["晕针", "最常见意外", "表现：头晕目眩、面色苍白、心慌、恶心、出冷汗甚至晕厥。处理：立即起针、平卧、保暖、饮温水；严重者立即送医"], ["其他意外", "", "滞针、弯针、断针、血肿、气胸——每一种都有相应处理，但预防的关键是规范操作与充分了解解剖"], ["核心提醒", "", "以上内容用于理解风险所在。<strong>请勿自行针刺或为他人施针</strong>——针刺造成的气胸、神经损伤、感染均为真实且严重的风险"]]}]}, {"t": "针灸治疗总论", "sub": "从辨证到处方", "map": [["治疗原则", "补虚泻实·清热温寒·治病求本·三因制宜"], ["选穴原则", "近部选穴·远部选穴·辨证选穴·对症选穴"], ["配穴方法", "按部位配·按经脉配"], ["处方组成", "主穴 + 配穴，主次分明"]], "spine": "针灸处方和方剂一样讲君臣佐使：先定<strong>主穴</strong>（针对主证），再加<strong>配穴</strong>（针对兼证或加强疗效）。穴不在多，在于对证。", "g": [{"g": "治疗原则", "r": [["补虚泻实", "总纲", "虚则补之（补法、灸法）· 实则泻之（泻法、点刺放血）· 陷下则灸之 · 菀陈则除之"], ["清热温寒", "", "热则疾之（浅刺疾出或点刺出血）· 寒则留之（深刺久留，或加灸）"], ["治病求本", "", "急则治标、缓则治本、标本同治"], ["三因制宜", "", "因时、因地、因人。如夏季宜浅刺、冬季宜深刺；老幼体弱者手法宜轻"]]}, {"g": "选穴原则", "r": [["近部选穴", "局部", "在病痛局部或邻近取穴。如胃痛取中脘、眼病取睛明"], ["远部选穴", "循经", "在肘膝以下、本经或表里经取穴。如胃痛取足三里、牙痛取合谷"], ["辨证选穴", "按证", "针对全身证候取穴。如阴虚取太溪、气虚取气海足三里、失眠取神门"], ["对症选穴", "经验", "针对某一症状的经验效穴。如发热取大椎、呕吐取内关、便秘取支沟"]]}, {"g": "配穴方法", "r": [["前后配穴", "俞募配穴属此", "胸腹与背腰穴相配。如胃病取中脘（前）配胃俞（后）"], ["上下配穴", "最常用", "上肢与下肢穴相配。如胃痛取内关（上）配足三里（下）；八脉交会穴配对亦属此"], ["左右配穴", "", "双侧同名穴同用（多数情况），或健侧取穴（如面瘫初期）"], ["表里配穴", "原络配穴属此", "相表里的两经穴相配。如肺病取太渊（肺原）配偏历（大肠络）"], ["本经配穴", "", "病变脏腑所属经脉上取多穴。如肝阳头痛取太冲、行间、侠溪"]]}, {"g": "处方举例（理解结构用）", "r": [["感冒", "", "主穴：列缺、合谷、大椎、风池　｜　风寒加风门；风热加曲池、尺泽"], ["胃痛", "", "主穴：中脘、内关、足三里　｜　寒邪加梁丘；食积加下脘；肝气犯胃加太冲"], ["失眠", "", "主穴：神门、三阴交、百会、安眠　｜　心脾两虚加心俞、脾俞；心肾不交加太溪"], ["腰痛", "", "主穴：委中、肾俞、大肠俞、阿是穴　｜　寒湿加腰阳关；肾虚加命门、太溪"], ["提醒", "必读", "以上仅为理解处方结构的示例，非诊疗建议。实际治疗须经执业中医师面诊辨证后施行"]]}]}, {"t": "自学者能做什么、不能做什么", "sub": "一条清晰的边界", "map": [["可以学", "理论·定位·主治规律·配穴思路·经络养生知识"], ["可以做", "穴位按压·适度艾灸（了解禁忌后）"], ["不要做", "自行针刺·为他人施针·用针灸替代正规治疗"], ["何时必须就医", "急症·不明原因疼痛·症状持续或加重"]], "spine": "把针灸当兴趣学，最合适的落点是<strong>理解经络与穴位的规律</strong>，以及用按压、艾灸做日常保健。针刺这一步，交给有资质的人。", "g": [{"g": "可以放心学的部分", "r": [["经络循行与腧穴定位", "", "这是纯知识，学得越扎实越好。在自己身上找穴位也很安全"], ["主治规律与配穴思路", "", "理解「为什么合谷治面口」比记住结论更有价值"], ["经典条文与源流", "", "《内经》《甲乙经》《针灸大成》的相关论述"], ["经络养生常识", "", "如按时作息与十二时辰流注的对应、常用保健穴的位置"]]}, {"g": "风险较低、但需了解禁忌的操作", "r": [["穴位按压（指压）", "最安全", "用拇指或食指按揉，以有酸胀感为度，每穴 1–2 分钟。孕妇仍须避开合谷、三阴交等"], ["艾条温和灸", "需通风防烫", "距皮肤 2–3 厘米，以温热舒适不灼痛为度。注意：实热证、阴虚发热者不宜；颜面、大血管处、孕妇腰骶下腹禁灸"], ["注意事项", "", "糖尿病患者末梢感觉迟钝，艾灸易烫伤；皮肤感觉障碍者同理，务必格外小心"]]}, {"g": "明确不要做的事", "r": [["自行针刺", "风险真实存在", "针刺可致气胸、神经血管损伤、感染。胸背部尤其危险——这不是危言耸听"], ["为家人朋友施针", "", "无论出于什么好意。没有执业资质施针，法律与安全风险都由你承担"], ["用针灸替代正规治疗", "", "针灸有其适应范围。急症、感染、肿瘤、外伤等必须先看西医"], ["相信「包治百病」的说法", "", "任何声称针灸能治愈一切的说法都不可信"]]}, {"g": "什么情况必须先就医", "r": [["急性剧烈疼痛", "", "尤其胸痛、腹痛、剧烈头痛——可能是急症"], ["不明原因的症状", "", "持续消瘦、发热、出血、肿块"], ["症状持续或加重", "", "保健性的按压艾灸一两周无改善，应就医查因"], ["已确诊疾病", "", "针灸作为辅助手段时，也应告知主治医生，避免与治疗方案冲突"]]}]}], "F": [{"t": "怎么在自己身上找到一个穴位", "when": "定位的标准动作", "s": [{"b": "第一步：先看它属于哪条经", "p": "确定经脉走向，就把范围缩小到一条线上了。", "f": [["上肢内侧", "手三阴：太阴肺（前）· 厥阴心包（中）· 少阴心（后）"], ["上肢外侧", "手三阳：阳明大肠（前）· 少阳三焦（中）· 太阳小肠（后）"], ["下肢外侧", "足三阳：阳明胃（前）· 少阳胆（中）· 太阳膀胱（后）"], ["下肢内侧", "足三阴：太阴脾（前）· 厥阴肝（中）· 少阴肾（后）"]]}, {"b": "第二步：找骨性标志或肌腱", "p": "绝大多数穴位的描述都以标志起算。先摸到标志，再量距离。", "f": [["常用标志", "肘横纹、腕横纹、内外踝尖、髌骨、肩峰、髂前上棘"], ["活动标志", "屈肘取曲池、张口取听宫、握拳取后溪"]]}, {"b": "第三步：用骨度分寸折算", "p": "记住关键几条：肘横纹到腕横纹 12 寸、腘横纹到外踝尖 16 寸、脐到耻骨联合 5 寸。", "trap": "同身寸必须用被取穴者本人的手指或身体比例。给别人取穴时用自己的手量，误差会很大。"}, {"b": "第四步：按压确认", "p": "按到有明显酸、胀、重感（不是单纯的痛），通常就是穴位所在。左右对比更容易分辨。"}, {"b": "第五步：对照解剖图复核", "p": "文字描述容易理解偏差。找到后对照标准腧穴图谱确认一次，形成正确的肌肉记忆。"}]}, {"t": "从主治规律推断一个穴能治什么", "when": "不必死背主治条目", "s": [{"b": "① 看它在哪个部位——近治作用", "p": "所有穴位都能治所在部位及邻近器官的病。眼周穴治眼病、腹部穴治肠胃。"}, {"b": "② 看它属哪条经——远治作用", "p": "肘膝以下的穴位，能治本经循行所过的远端部位。", "f": [["合谷（大肠经）", "大肠经上行至面部 → 治面口病"], ["足三里（胃经）", "胃经过腹部 → 治肚腹病"], ["委中（膀胱经）", "膀胱经挟脊柱 → 治腰背病"], ["列缺（肺经）", "通任脉、经脉过头项 → 治头项病"]]}, {"b": "③ 看它是不是特定穴——特殊规律", "p": "", "f": [["五输穴", "井治神志急症·荥治热·输治痛·经治咳喘·合治腑病"], ["原穴", "治本脏腑病，兼可诊察"], ["络穴", "同治表里两经"], ["郄穴", "阴经治血证·阳经治急痛"], ["背俞·募穴", "治对应脏腑病"], ["下合穴", "治六腑病"]]}, {"b": "④ 综合三条得出主治", "p": "例：内关是心包经络穴、八脉交会通阴维。所以能治心胸病（本经）、胃病（通阴维、络三焦）、恶心呕吐（经验效穴）——三条线索都指向「心胸胃」。"}, {"b": "⑤ 反向验证", "p": "背下来的主治如果推不出来，多半是记错了，或者属于经验效穴（如至阴矫正胎位），需单独记。"}]}, {"t": "配一张针灸处方的思路", "when": "和开方剂是同一套逻辑", "s": [{"b": "第一步：辨证", "p": "先用中诊那一套：定病位（脏腑经络）、定病性（虚实寒热）。没有辨证就没有处方。"}, {"b": "第二步：定主穴", "p": "针对主证，通常 2–4 个。", "f": [["近部取穴", "病变局部或邻近"], ["远部取穴", "本经肘膝以下的特定穴"], ["常用组合", "局部 + 远端，是最基本的搭配"]]}, {"b": "第三步：加配穴", "p": "针对兼证或加强疗效。", "f": [["辨证配穴", "阴虚加太溪·气虚加气海·血瘀加血海"], ["对症配穴", "发热加大椎·呕吐加内关·失眠加神门"]]}, {"b": "第四步：定手法", "p": "虚证用补法、可加灸；实证用泻法、热证可点刺放血。"}, {"b": "第五步：核对禁忌", "p": "孕妇禁忌穴、危险部位、患者当前状态（过饥过饱大醉大怒等）。", "trap": "这一步不能省。处方再对，碰到禁忌也不能施行。"}, {"b": "重要边界", "p": "以上是理解处方结构的思路。实际治疗必须由执业中医师面诊辨证后施行，本手册不能作为诊疗依据。"}]}, {"t": "自我保健：安全的做法", "when": "把针灸知识用起来的正确方式", "s": [{"b": "首选穴位按压", "p": "最安全，随时可做。用拇指按揉，以酸胀为度，每穴 1–2 分钟。", "f": [["足三里", "健脾胃、强壮保健——最常用的保健穴"], ["合谷", "面口疾患、头痛（孕妇禁用）"], ["内关", "心悸、恶心呕吐、晕车"], ["三阴交", "妇科、失眠、脾胃（孕妇禁用）"], ["太冲", "情绪不畅、头痛目赤"], ["百会", "头晕、精神不振"]]}, {"b": "其次是艾条温和灸", "p": "距皮肤 2–3 厘米，温热舒适为度，每穴 10–15 分钟。适合虚寒体质。", "f": [["常用保健穴", "足三里、关元、气海、命门"], ["必须通风", "艾烟较大，注意开窗"], ["防烫伤", "随时感受温度；糖尿病或皮肤感觉迟钝者尤须小心"]]}, {"b": "务必避开的情况", "p": "", "f": [["孕妇", "合谷、三阴交、昆仑、至阴等禁用；腰骶及下腹部禁针禁灸"], ["实热·阴虚发热", "不宜艾灸"], ["皮肤破损·感染", "局部不做任何操作"], ["过饥过饱·大醉·极度疲劳", "暂缓"]]}, {"b": "绝对不要自行针刺", "p": "这是本章最重要的一条。理论可以学，针不要碰。", "trap": "针刺致气胸、神经损伤、感染都是真实发生过的事故，且多发生在「自认为学会了」的人身上。这一步必须交给有执业资质者。"}, {"b": "出现这些情况请就医", "p": "急性剧烈疼痛、不明原因症状、保健两周无改善、或已确诊疾病需要治疗时。"}]}]},

{"k": "tn", "name": "推拿按摩", "en": "TUINA MASSAGE", "no": "7", "eqLabel": "手法速查", "flLabel": "操作路径", "lede": "推拿（按摩）是中医<strong>唯一不用器械、可以自己上手</strong>的外治法。它和针灸同属外治，但作用方式不同：针灸靠刺激穴位，推拿靠<strong>手法作用于经络、穴位与筋骨</strong>。学习路径是——<strong>先练手法（力度与节奏）→ 再懂适应证与禁忌 → 最后学部位操作与配伍</strong>。手法是这门课的核心：同一个动作，力度、频率、着力点不同，效果可能完全相反。<strong>本手册为理论与自我保健知识，不构成诊疗建议。急性外伤、骨折、肿瘤、感染、严重骨质疏松等情况严禁推拿；颈椎与腰椎的扳法类手法必须由专业人员施行，外行操作可致严重损伤。不适请及时就医。</strong>", "M": [{"t": "总论：推拿的原理与特点", "sub": "它凭什么起作用", "map": [["作用途径", "疏通经络 · 行气活血 · 理筋整复 · 调和脏腑"], ["与针灸的异同", "同属外治、同用经络理论；针灸靠针刺，推拿靠手法"], ["优势", "无创、无药、随时可做、可自我操作"], ["局限", "不能替代药物与手术；对器质性病变作用有限"]], "spine": "推拿的核心是<strong>手法</strong>，不是穴位。同一个穴，用不同力度和节奏去按，效果可以完全不同——所以练手法比背穴位重要。", "g": [{"g": "推拿的作用途径", "r": [["疏通经络", "", "手法刺激沿经络传导，改善气血运行。所谓「不通则痛，通则不痛」"], ["行气活血", "", "局部按揉促进血液循环，缓解肌肉痉挛与代谢产物堆积"], ["理筋整复", "骨伤科方向", "调整筋（肌肉、肌腱、韧带）与骨关节的位置关系。此类手法专业性最强"], ["调和脏腑", "", "通过背俞穴、腹部等区域的手法，间接影响脏腑功能"], ["现代解释", "参考", "改善局部血液循环、松解肌筋膜粘连、降低肌张力、通过神经反射调节——与传统解释并不矛盾"]]}, {"g": "与针灸的异同", "r": [["相同点", "", "同属外治法；同用经络腧穴理论；同讲辨证论治与补泻"], ["不同点：工具", "", "针灸用针与艾；推拿只用手（部分用肘、膝或简单器具）"], ["不同点：作用面", "", "针灸作用点集中且深；推拿作用面广，可覆盖肌肉、筋膜、关节"], ["不同点：风险", "关键区别", "针刺有创，必须执业者施行；<strong>基础推拿手法风险低，可自学自用</strong>（但扳法类除外）"], ["常配合使用", "", "临床上针灸与推拿常合用，或先推拿放松再针刺"]]}, {"g": "适应范围与局限", "r": [["最适合", "效果较明确", "颈肩腰腿痛、肌肉劳损、落枕、软组织慢性劳损、疲劳缓解"], ["有一定帮助", "", "失眠、头痛、消化不良、痛经、小儿积食（小儿推拿另有体系）"], ["作用有限", "理性认识", "器质性病变（骨折、肿瘤、感染）、内脏实质性疾病"], ["不能替代", "必须明确", "推拿是辅助手段。已确诊疾病的治疗方案须由医生决定，不可用推拿代替"]]}]}, {"t": "基本手法", "sub": "这一章是全书的核心", "map": [["六大类", "摆动类 · 摩擦类 · 挤压类 · 振动类 · 叩击类 · 运动关节类"], ["手法要求", "持久 · 有力 · 均匀 · 柔和 · 深透"], ["常用手法", "㨰法 · 揉法 · 按法 · 拿法 · 推法 · 摩法 · 擦法 · 点法 · 拍法"], ["自学重点", "揉、按、拿、推、点五法最实用且最安全"]], "spine": "手法的八字要领:<strong>持久、有力、均匀、柔和</strong>,最终达到<strong>深透</strong>。「有力」不等于用蛮力——力量要能渗进去,而不是压在表面。", "fig": ["shoufa","shoufadong"], "g": [{"g": "手法的基本要求（八字要领）", "r": [["持久", "", "手法能维持一定时间不变形。这靠的是耐力和正确姿势，不是硬撑"], ["有力", "最易误解", "是「恰当的力」而非「最大的力」。力量应根据部位、体质、病情调整"], ["均匀", "", "动作节奏一致、力量平稳，不忽快忽慢、忽轻忽重"], ["柔和", "", "轻而不浮、重而不滞。动作连贯圆活，避免生硬粗暴"], ["深透", "目标", "力量能透过皮肤作用到深层组织。「深透」是前四条做好后的结果，不是刻意加重"]]}, {"g": "最实用的五个手法（自学优先掌握）", "r": [["揉法", "用得最多", "以指腹或掌根着力，带动皮下组织做<strong>环旋</strong>运动。不是在皮肤上摩擦，而是带着皮肤一起动"], ["按法", "", "以指或掌垂直向下用力，由轻到重，稳而持续。常与揉法合用为「按揉」"], ["拿法", "", "拇指与其余手指相对用力，捏住肌肉提起后再放松，一紧一松。常用于颈项、肩部"], ["推法", "", "以指、掌或肘着力，沿一定方向<strong>直线</strong>推进。需借助介质（推拿油、爽身粉）防止擦伤"], ["点法", "", "以指端或屈曲的指间关节着力，集中一点垂直按压。刺激较强，适合穴位"]]}, {"g": "其他常见手法（了解即可）", "r": [["㨰法", "专业性强", "以手背近小指侧着力，往返滚动。是推拿的代表性手法，但需专门训练"], ["摩法", "最轻柔", "以指腹或掌面在体表做环形摩擦，<strong>不带动皮下组织</strong>。常用于腹部"], ["擦法", "产热", "以掌或大小鱼际直线往返摩擦，以透热为度。需用介质，注意别擦破皮"], ["拍法", "", "五指并拢微屈成虚掌，平稳拍打。声音清脆而不痛"], ["运动关节类", "⚠ 需专业", "摇法、扳法、拔伸法。<strong>扳法（尤其颈椎、腰椎）风险高，禁止自学操作</strong>"]]}, {"g": "摩法与揉法的区别（最常混淆）", "r": [["摩法", "浅", "手在皮肤表面滑动，不带动皮下。作用轻柔表浅，适合腹部、胸胁"], ["揉法", "深", "手带着皮肤一起做环旋，皮下组织跟着动。作用较深，适合肌肉"], ["判断方法", "实用", "看你手下的皮肤有没有跟着一起转——跟着转是揉，滑过去是摩"]]}]}, {"t": "常用部位操作", "sub": "按部位学，比按病学更实用", "map": [["头面颈项", "头痛、失眠、颈部僵硬"], ["肩背腰", "最常见的劳损部位"], ["四肢", "上下肢的常规放松"], ["胸腹", "保健与消化"]], "spine": "自我保健按部位学最省事:哪里不舒服就学哪里的操作流程,不必先背一堆病名。", "fig": ["baojian","mofu"], "g": [{"g": "头面与颈项", "r": [["开天门", "起手式", "两拇指交替从两眉中间（印堂）直推至前发际，约 30 次。醒神明目"], ["推坎宫", "", "两拇指自眉头沿眉弓分推至眉梢，约 30 次"], ["按揉太阳", "", "两拇指或中指按揉太阳穴，力度适中，1–2 分钟。缓解头痛眼疲劳"], ["按揉风池", "颈部要穴", "两拇指按揉枕骨下、胸锁乳突肌与斜方肌之间的凹陷，1–2 分钟"], ["拿颈项", "", "一手拿捏颈后两侧肌肉，自上而下，反复 5–10 遍。缓解颈部僵硬"], ["扫散法", "", "五指分开如爪，从头维沿侧头部向后扫散，两侧各 20–30 次"], ["注意", "", "颈部力度宜轻柔；<strong>不要做快速转头或扳颈的动作</strong>——有椎动脉与脊髓损伤风险"]]}, {"g": "肩背与腰部", "r": [["按揉肩井", "", "位于大椎与肩峰连线中点。拇指按揉或拿捏，1–2 分钟。孕妇禁用"], ["拿肩井", "", "四指与拇指相对，捏起斜方肌上部再放松，反复 10–20 次"], ["按揉肩胛内侧", "", "沿脊柱旁开约两指宽处（膀胱经第一侧线）自上而下按揉"], ["掌根揉腰", "", "双掌根置于腰部两侧（肾俞附近），上下揉动 1–2 分钟"], ["擦命门", "补肾阳", "掌根横擦腰骶部，以透热为度。虚寒腰痛适用；实热者不宜"], ["按揉腰阳关·大肠俞", "", "局部按揉配合，缓解腰肌劳损"], ["注意", "⚠ 重要", "急性腰扭伤 24 小时内、腰椎间盘突出急性期<strong>不要自行推拿</strong>，先就医明确诊断"]]}, {"g": "四肢", "r": [["拿上肢", "", "从肩部向下拿捏至手腕，反复 3–5 遍"], ["按揉曲池·手三里", "", "肘部常用穴，缓解前臂酸胀"], ["按揉合谷", "", "虎口处，面口疾患与头痛常用。<strong>孕妇禁用</strong>"], ["拿下肢", "", "从大腿向下拿捏至小腿，反复 3–5 遍"], ["按揉足三里", "保健第一穴", "外膝眼下 3 寸，胫骨前嵴外一横指。每天 1–2 分钟"], ["按揉三阴交", "", "内踝尖上 3 寸，胫骨内侧后缘。妇科与失眠常用。<strong>孕妇禁用</strong>"], ["按揉涌泉", "", "足底前 1/3 凹陷处。睡前按揉助眠"]]}, {"g": "胸腹", "r": [["摩腹", "最常用", "掌心贴腹，以脐为中心顺时针摩动 3–5 分钟。促进消化"], ["方向说明", "有讲究", "顺时针与结肠走向一致，多用于便秘；逆时针有时用于腹泻。日常保健顺时针即可"], ["按揉中脘", "", "脐上 4 寸。胃脘不适常用"], ["按揉天枢", "", "脐旁 2 寸。调理肠道，便秘腹泻皆可用"], ["按揉气海·关元", "", "脐下 1.5 寸与 3 寸。培元固本，虚寒体质适宜"], ["注意", "", "饭后 1 小时内不宜摩腹；腹部有肿块、剧痛、不明原因包块时禁止推拿，应立即就医"]]}]}, {"t": "常见问题的自我操作", "sub": "把手法用起来", "map": [["颈肩不适", "久坐族最常见"], ["腰部酸胀", "劳损与久坐"], ["头痛失眠", "放松类操作"], ["消化不良", "摩腹与足三里"]], "spine": "自我推拿的定位是<strong>缓解与保健</strong>,不是治疗。做完舒服、能坚持,就达到目的了;想解决根本问题,还得靠调整姿势、运动和作息。", "fig": "jianjinglu", "g": [{"g": "颈肩僵硬（久坐族）", "r": [["总时长", "", "5–10 分钟，每天 1–2 次"], ["① 拿颈项", "", "一手拿捏颈后肌肉，自上而下 5–10 遍"], ["② 按揉风池", "", "两拇指按揉 1 分钟，酸胀为度"], ["③ 拿肩井", "", "捏起斜方肌再放松，10–20 次"], ["④ 按揉肩胛内侧", "", "沿脊柱两侧自上而下按揉 1–2 分钟"], ["⑤ 缓慢活动颈部", "", "前后左右缓慢转动，<strong>切忌快速甩头或听响声</strong>"], ["根本办法", "实话", "手法只能缓解。真正管用的是每小时起身活动、调整屏幕高度、加强颈背肌力量"]]}, {"g": "腰部酸胀（非急性损伤）", "r": [["前提", "必读", "仅适用于<strong>慢性劳损或久坐后的酸胀</strong>。急性扭伤、剧痛、伴下肢麻木者请先就医"], ["① 掌根揉腰", "", "双掌根置腰部两侧，上下揉动 1–2 分钟"], ["② 按揉肾俞·大肠俞", "", "拇指按揉，各 1 分钟"], ["③ 擦腰骶", "", "掌根横擦至透热。虚寒型腰痛尤宜"], ["④ 按揉委中", "「腰背委中求」", "腘窝横纹中点，按揉 1 分钟"], ["⑤ 拿下肢", "", "自大腿向下拿捏至小腿，3–5 遍"], ["配合", "", "热敷、核心肌群训练、避免久坐与弯腰搬重物"]]}, {"g": "头痛与失眠", "r": [["头痛（紧张性）", "", "开天门 → 推坎宫 → 按揉太阳 → 按揉风池 → 扫散侧头部，共 5–8 分钟"], ["按部位选穴", "参考经络", "前额痛加印堂、攒竹；两侧痛加率谷、太阳；后头痛加风池、天柱；巅顶痛加百会、太冲"], ["失眠", "睡前做", "按揉神门（腕横纹尺侧）→ 按揉三阴交 → 摩腹 → 按揉涌泉，共 10 分钟"], ["加分项", "", "配合规律作息、睡前离屏、卧室环境调整（见健康生活·睡眠章）"], ["何时就医", "", "头痛突然剧烈、伴呕吐或视物模糊、或性质改变时，立即就医——不要按摩"]]}, {"g": "消化不良与便秘", "r": [["摩腹", "核心操作", "顺时针摩腹 3–5 分钟，力度轻柔，以腹部温热舒适为度"], ["按揉中脘·天枢", "", "各 1 分钟"], ["按揉足三里", "", "「肚腹三里留」，1–2 分钟"], ["便秘加", "", "按揉支沟（腕背横纹上 3 寸）、大横"], ["时机", "", "饭后 1 小时后进行；晨起空腹摩腹对便秘效果较好"], ["注意", "", "腹痛剧烈、有包块、便血、体重下降者<strong>禁止推拿，须立即就医</strong>"]]}]}, {"t": "禁忌与安全边界", "sub": "这一章比手法更重要", "map": [["绝对禁忌", "不能做的情况"], ["相对禁忌", "需谨慎或避开局部"], ["危险手法", "扳法类必须由专业人员施行"], ["出现意外怎么办", "及时就医的信号"]], "spine": "推拿最大的风险不是手法太轻,而是<strong>在不该做的时候做了</strong>。禁忌比技巧重要——记住这一章,比记住十个手法有用。", "fig": "weixianbu", "g": [{"g": "绝对禁忌：这些情况不要推拿", "r": [["急性外伤·骨折·脱位", "", "可能加重损伤或造成二次伤害"], ["肿瘤", "", "可能促进扩散"], ["急性感染·皮肤病变", "", "局部红肿热痛、疖肿、湿疹、烫伤、开放性伤口"], ["严重骨质疏松", "", "轻微外力即可致骨折"], ["出血性疾病·正在抗凝治疗", "", "血友病、血小板减少、服华法林等抗凝药者易致出血"], ["急腹症", "", "阑尾炎、肠梗阻、消化道穿孔等——推拿会延误抢救"], ["严重心脑血管疾病急性期", "", "心梗、脑出血、脑梗急性期"], ["妊娠期", "", "腰骶部、腹部禁推；合谷、三阴交、肩井等穴禁用"]]}, {"g": "相对禁忌：需要谨慎", "r": [["高血压未控制", "", "避免颈部与头部强刺激手法"], ["糖尿病", "", "末梢感觉减退，力度不易把握，且皮肤易破损感染"], ["极度疲劳·空腹·饱食", "", "易发生晕厥。饭后 1 小时内不宜"], ["老年人与儿童", "", "力度须明显减轻。小儿推拿另有独立体系，手法与成人不同"], ["酒后", "", "感觉迟钝，易受伤而不自知"]]}, {"g": "危险手法：不要自学操作", "r": [["颈椎扳法", "风险最高", "可致椎动脉夹层、脊髓损伤，严重者致残致死。<strong>绝对不要自己或让非专业人员做</strong>"], ["腰椎扳法", "", "可加重椎间盘突出或致神经损伤"], ["「听响声」的迷思", "重要澄清", "关节弹响不等于「复位成功」，也不是治疗有效的标志。刻意追求响声非常危险"], ["暴力手法", "", "任何让你疼得受不了的手法都是错的。「越痛越有效」是彻底的误解"], ["按摩后越来越痛", "警示", "正常推拿后应感觉放松。若疼痛加重、出现麻木无力，立即停止并就医"]]}, {"g": "出现这些情况立即就医", "r": [["肢体麻木·无力", "", "可能是神经受压或损伤"], ["剧烈疼痛不缓解", "", "尤其推拿后新出现或明显加重的疼痛"], ["头晕·恶心·视物模糊", "", "颈部操作后出现，警惕椎动脉问题"], ["大小便功能异常", "急症", "伴腰腿痛时，可能是马尾综合征——需紧急处理"], ["局部青紫肿胀", "", "可能是软组织损伤或出血"], ["一句话原则", "", "推拿是让人舒服的。<strong>任何「越做越糟」的情况都是停止的信号</strong>"]]}]}, {"t": "小儿推拿简介", "sub": "独立体系，仅作了解", "map": [["与成人的区别", "穴位形态不同（有点、线、面）；手法轻柔；次数多"], ["常用穴位", "脾经、肺经、大肠、三关、六腑、七节骨等"], ["适用范围", "积食、腹泻、便秘、咳嗽、夜啼等功能性问题"], ["重要边界", "发热、感染、器质性疾病必须就医"]], "spine": "小儿推拿是一套独立体系,穴位和手法都与成人不同。<strong>本章仅作了解</strong>——给孩子做之前,强烈建议先接受正规指导。", "g": [{"g": "与成人推拿的主要区别", "r": [["穴位形态", "最大不同", "除点状穴外，还有线状穴（如三关、天河水）和面状穴（如脾经在拇指螺纹面）"], ["手法特点", "", "轻柔、快速、次数多。常以「次」计（如推三关 100–300 次）"], ["需用介质", "防擦伤", "滑石粉、爽身粉或推拿油。小儿皮肤娇嫩，干推易损伤"], ["适用年龄", "", "一般为 6 岁以下，年龄越小效果相对越明显"]]}, {"g": "常见应用（了解性质）", "r": [["积食", "", "清大肠、揉板门、摩腹、捏脊"], ["腹泻", "", "补脾经、推上七节骨、揉龟尾"], ["便秘", "", "清大肠、推下七节骨、摩腹（顺时针）"], ["咳嗽", "", "清肺经、揉膻中、揉肺俞"], ["捏脊", "最常用", "沿脊柱两侧自下而上捏提皮肤，3–5 遍。健脾和胃、增强体质"]]}, {"g": "必须遵守的边界", "r": [["发热必须查因", "", "小儿发热原因复杂，须先就医明确诊断，不可只靠推拿"], ["这些情况禁止推拿", "", "急性感染、皮肤破损、骨折、出血性疾病、严重营养不良"], ["不能替代治疗", "", "肺炎、腹泻脱水、川崎病等必须及时就医。延误可致严重后果"], ["建议先学再做", "诚恳建议", "小儿推拿看似简单，但穴位定位与手法力度都需要指导。给孩子做之前，请先接受正规培训或咨询专业人员"]]}]}], "F": [{"t": "练手法：从揉法开始", "when": "手法是这门课唯一需要「练」的东西", "s": [{"b": "为什么先练揉法", "p": "它是用得最多、最安全、最能体会「深透」的手法。揉法练好了，按、拿、推都容易上手。"}, {"b": "动作要领", "p": "以拇指指腹或掌根着力，<strong>带动皮下组织</strong>做环旋运动。", "f": [["着力点", "指腹（小面积）或掌根（大面积）"], ["方向", "顺时针或逆时针均可，保持一致"], ["频率", "每分钟约 120–160 次，节奏均匀"], ["关键", "皮肤要跟着手一起动——如果只是在皮肤上滑过，那是摩法不是揉法"]]}, {"b": "在自己身上练", "p": "先在大腿外侧练——面积大、耐受度高、不易出错。感受「力量透进去」与「只压在表面」的区别。"}, {"b": "力度怎么把握", "p": "以<strong>酸胀舒适</strong>为度。", "f": [["太轻", "只有皮肤感觉，没有酸胀感"], ["合适", "明显酸胀，但能放松承受，做完感觉轻松"], ["太重", "疼痛难忍、屏气、肌肉反射性绷紧——这时效果反而变差"]], "trap": "「越痛越有效」是彻底的误解。疼痛会引起肌肉保护性收缩，反而妨碍放松。"}, {"b": "练到什么程度算会", "p": "连续揉 3 分钟手不酸、力度均匀不忽轻忽重、被揉的人觉得舒服——达到这三条就可以用了。"}]}, {"t": "给自己做一次颈肩放松", "when": "久坐族最实用的一套，5–10 分钟", "s": [{"b": "准备", "p": "坐姿端正，肩膀放松下沉。可先热敷 5 分钟效果更好。"}, {"b": "① 拿颈项 5–10 遍", "p": "一手拇指与其余四指相对，捏住颈后两侧肌肉，提起后放松，自上而下。"}, {"b": "② 按揉风池 1 分钟", "p": "两拇指抵在枕骨下的凹陷处（胸锁乳突肌与斜方肌之间），向内上方按揉，酸胀为度。"}, {"b": "③ 拿肩井 10–20 次", "p": "四指与拇指相对，捏起肩上斜方肌再放松。孕妇跳过此步。"}, {"b": "④ 按揉肩胛内侧 1–2 分钟", "p": "用对侧手（或按摩球靠墙）沿脊柱旁开两指处自上而下按揉。"}, {"b": "⑤ 缓慢活动颈部", "p": "前后屈伸、左右侧屈、缓慢旋转，各 5 次。动作要慢。", "trap": "切忌快速甩头、猛力转颈、或刻意追求「咔哒」响声——椎动脉与颈髓损伤多由此而来。"}, {"b": "做完之后", "p": "应感觉肩颈轻松、活动度改善。若反而更痛或出现头晕手麻，立即停止并就医。"}]}, {"t": "判断「这个情况能不能做推拿」", "when": "动手前的自检清单", "s": [{"b": "第一问：是急性还是慢性？", "p": "急性外伤 24–48 小时内一律不推。这时候该做的是休息、冰敷、必要时就医。", "f": [["慢性劳损·久坐酸胀", "可以做"], ["急性扭伤·刚受伤", "不做，先冷敷就医"]]}, {"b": "第二问：有没有绝对禁忌？", "p": "逐条过一遍。有任何一条就不要做。", "f": [["骨折·脱位·肿瘤", "禁"], ["急性感染·皮肤破损", "禁（至少避开局部）"], ["严重骨质疏松", "禁"], ["出血性疾病·服抗凝药", "禁"], ["急腹症·剧烈腹痛", "禁，立即就医"], ["心脑血管急性期", "禁"], ["妊娠期", "腰骶腹部禁；合谷三阴交肩井禁"]]}, {"b": "第三问：症状明确吗？", "p": "不明原因的疼痛、包块、麻木、消瘦——先查清楚再说。推拿可能掩盖症状、延误诊断。", "trap": "最危险的情况是把内脏疾病当成「肌肉酸痛」去按。心梗可表现为左肩背痛，主动脉夹层可表现为剧烈背痛——按摩不但无效，还会延误抢救。"}, {"b": "第四问：是不是危险手法？", "p": "任何涉及颈椎、腰椎的扳法、快速旋转、追求响声的操作——不要自己做，也不要找无资质的人做。"}, {"b": "通过四问才动手", "p": "四条都没问题，才做基础的揉、按、拿、推。有任何疑问，选择不做——不做的风险永远低于做错。"}]}, {"t": "日常保健：一套五分钟的组合", "when": "不针对具体症状，日常维护用", "s": [{"b": "适合什么时候做", "p": "晚上洗澡后、睡前，或久坐后起身时。"}, {"b": "① 摩腹 2 分钟", "p": "掌心贴腹，以脐为中心顺时针摩动。力度轻柔，腹部温热为度。饭后 1 小时内不做。"}, {"b": "② 按揉足三里 1 分钟", "p": "双侧各 1 分钟。外膝眼下 3 寸，胫骨前嵴外一横指。中医保健第一要穴。"}, {"b": "③ 按揉三阴交 1 分钟", "p": "内踝尖上 3 寸，胫骨内侧后缘。孕妇跳过。"}, {"b": "④ 按揉涌泉 1 分钟", "p": "足底前 1/3 凹陷处。睡前做有助入睡。"}, {"b": "⑤ 干洗脸 30 次", "p": "两手搓热后从下向上摩面部，醒神。", "trap": "保健推拿贵在坚持而非力度。每天 5 分钟做一个月，胜过一次做半小时。"}]}]},

{"k": "yj", "name": "易经", "en": "I CHING", "no": "9", "eqLabel": "卦爻速查", "flLabel": "读卦思路", "lede": "易经不是知识点的罗列，而是一套<strong>符号系统</strong>加一套<strong>解读规则</strong>。符号从简到繁：阴阳两爻 → 八卦（三爻）→ 六十四卦（六爻）；解读分四路：<strong>象</strong>（卦象所征）、<strong>数</strong>（爻位与变化）、<strong>理</strong>（义理哲学）、<strong>占</strong>（占筮之用）。学易的主线是——<strong>先识符号（爻·卦），再懂结构（卦位·爻位），最后通读法（象数理占）</strong>。历代对易有两大取向：象数派重推演，义理派重哲理，本手册两者并陈。<strong>本手册为文化经典的知识梳理，象数占筮部分仅作传统文化介绍，不构成任何决策依据。</strong>", "M": [{"t": "总论：易的源流与三易", "sub": "先弄清「易」是什么、由谁写、分哪几部分", "map": [["易之三义", "简易、变易、不易——一个「易」字的三层含义"], ["三易", "连山（夏）、归藏（商）、周易（周），今存周易"], ["人更三圣", "伏羲画卦、文王演卦作卦辞、孔子作十翼"], ["经与传", "《易经》（六十四卦卦爻辞）+《易传》（十翼，解经之作）"], ["两大学派", "象数派（重卦象推演）与义理派（重哲学义理）"]], "spine": "「易」有三义：变易（万物皆变，是易的核心）、简易（以简驭繁）、不易（变中有不变之理）。理解这三义，才知道易经既是占筮书，也是哲学书。", "g": [{"g": "易的基本含义", "r": [["变易", "核心义", "天地万物永远处在运动变化之中——这是易经的根本世界观"], ["简易", "", "以阴阳两个符号、八个基本卦，推演万事万物，执简驭繁"], ["不易", "", "变化之中有恒常之理（如阴阳消长的规律本身不变）"], ["一阴一阳之谓道", "《系辞》", "阴阳的对立统一是易理的总纲"]]}, {"g": "成书与作者", "r": [["人更三圣", "传统说法", "伏羲画八卦；周文王（一说加周公）演为六十四卦并作卦爻辞；孔子作《易传》"], ["世历三古", "", "上古（伏羲）、中古（文王）、下古（孔子）"], ["三易", "", "《连山》（夏，首艮）、《归藏》（商，首坤）、《周易》（周，首乾）。前两者已佚，今传《周易》"], ["周易命名", "两说", "一说「周」指周代；一说「周」为周普、周遍之意（郑玄主此说）"]]}, {"g": "经传结构", "r": [["《易经》（经）", "", "六十四卦，每卦含卦画、卦名、卦辞及六爻爻辞。分上经三十卦、下经三十四卦"], ["《易传》（传）", "即十翼", "解释《易经》的十篇文字，相传为孔子及其后学所作"], ["十翼", "必背", "《彖》上下、《象》上下、《系辞》上下、《文言》、《说卦》、《序卦》、《杂卦》——共七种十篇"], ["彖传 vs 象传", "", "彖传释卦辞、断一卦之义；象传分大象（释卦象）与小象（释爻辞）"]]}, {"g": "两大学派", "r": [["象数派", "", "重卦象、爻位、数的推演，与占筮、天文历法结合。代表：汉代京房、宋代邵雍"], ["义理派", "", "重卦爻辞蕴含的哲学义理与人事道理。代表：王弼（扫象阐理）、程颐《伊川易传》"], ["理象数合一", "", "朱熹《周易本义》主张义理与象数并重，为后世通行注本"]]}], "fig": "bagua"}, {"t": "阴阳与八卦", "sub": "符号系统的地基：从两爻到八卦", "map": [["两仪", "阳爻（—）与阴爻（--）；阳奇阴偶"], ["四象", "太阳、少阴、少阳、太阴（两爻的四种组合）"], ["八卦", "乾兑离震巽坎艮坤（三爻的八种组合）"], ["八卦取象", "天泽火雷风水山地；及其性情、家庭、方位类象"], ["先天与后天", "先天八卦（伏羲，明体）；后天八卦（文王，致用）"]], "spine": "八卦的生成是一条严整的二分链：太极 → 两仪（阴阳）→ 四象 → 八卦，每一步都是「一分为二」。记住这条链，八卦不必死背。", "fig": "shengbagua", "g": [{"g": "生成次序", "r": [["太极生两仪", "", "太极动而生阳，静而生阴。阳爻「—」为奇，阴爻「--」为偶"], ["两仪生四象", "", "阳上加阳阴 → 太阳、少阴；阴上加阳阴 → 少阳、太阴"], ["四象生八卦", "", "每象再加一爻，成三爻之卦。「易有太极，是生两仪，两仪生四象，四象生八卦」"], ["爻的读法", "关键", "三爻从下往上数：初爻（下）、中爻、上爻。卦的解读顺序也是自下而上"]]}, {"g": "八卦速记（取象歌）", "r": [["乾 ☰", "三连", "乾三连——三阳爻。象天，性健，为父，居西北（后天）"], ["坤 ☷", "六断", "坤六断——三阴爻。象地，性顺，为母，居西南"], ["震 ☳", "仰盂", "震仰盂——下阳上二阴。象雷，性动，为长男，居东"], ["艮 ☶", "覆碗", "艮覆碗——上阳下二阴。象山，性止，为少男，居东北"], ["离 ☲", "中虚", "离中虚——中阴上下阳。象火，性丽（附着），为中女，居南"], ["坎 ☵", "中满", "坎中满——中阳上下阴。象水，性陷，为中男，居北"], ["兑 ☱", "上缺", "兑上缺——上阴下二阳。象泽，性悦，为少女，居西"], ["巽 ☴", "下断", "巽下断——下阴上二阳。象风，性入，为长女，居东南"]]}, {"g": "八卦类象", "r": [["自然", "", "乾天、坤地、震雷、巽风、坎水、离火、艮山、兑泽"], ["性情", "", "乾健、坤顺、震动、巽入、坎陷、离丽、艮止、兑悦"], ["家庭", "", "乾父、坤母；震长男、坎中男、艮少男；巽长女、离中女、兑少女"], ["身体", "", "乾首、坤腹、震足、巽股、坎耳、离目、艮手、兑口"]]}, {"g": "先天与后天八卦", "r": [["先天八卦", "伏羲，主对待", "乾南坤北、离东坎西。讲阴阳对待、天地定位，为「体」"], ["后天八卦", "文王，主流行", "离南坎北、震东兑西。配四时方位、讲五行流转，为「用」，占筮多用之"], ["两者关系", "", "先天为体、后天为用；先天明其对待之象，后天明其流行之序"]]}]}, {"t": "六十四卦：结构与卦序", "sub": "八卦相重成六十四卦：易的完整符号体系", "map": [["重卦", "八卦两两相重（上卦·下卦），得六十四卦、三百八十四爻"], ["上下卦", "内卦（下，主自身）与外卦（上，主外境）"], ["卦序", "上经三十卦（首乾坤）、下经三十四卦（首咸恒）"], ["错综复杂", "错卦、综卦、互卦——卦与卦之间的变换关系"], ["序卦逻辑", "《序卦传》揭示六十四卦相承的义理次序"]], "spine": "六十四卦不是随机排列：《序卦传》用「物极必反、相生相成」的逻辑把它们串成一条链——如泰极否来、剥极复生，卦序本身就是一套变化哲学。", "fig": "liushisi", "g": [{"g": "重卦的构成", "r": [["八卦相重", "", "上卦（外卦）+ 下卦（内卦），八八相重得六十四卦"], ["六爻", "", "每卦六爻，自下而上为：初、二、三、四、五、上"], ["内外卦", "", "内卦（下三爻）多主内、主己、主始；外卦（上三爻）多主外、主人、主终"], ["三才", "", "六爻分三才：初二为地、三四为人、五上为天，各以阴阳分之"]]}, {"g": "上下经", "r": [["上经", "三十卦", "首乾坤（天地），终坎离（水火）。多言天道"], ["下经", "三十四卦", "首咸恒（夫妇），终既济未济。多言人事"], ["首乾坤", "", "乾坤为易之门户，「天尊地卑，乾坤定矣」，是理解全易的纲领"], ["终未济", "深意", "下经不终于「既济」（已成）而终于「未济」（未成）——寓意变化无穷、生生不息"]]}, {"g": "卦变关系（象数）", "r": [["错卦（旁通）", "", "六爻阴阳全变。如乾的错卦为坤。反映事物的对立面"], ["综卦（反卦）", "", "把整个卦上下颠倒。如屯卦倒过来是蒙卦。反映从对方角度看问题"], ["互卦", "", "取二三四爻为下卦、三四五爻为上卦，另成一卦。揭示卦中潜藏之象"], ["序卦相承", "", "《序卦传》：「有天地然后万物生焉」——用因果相承之理排定卦序"]]}, {"g": "几个重要的卦", "r": [["乾卦", "纯阳", "元亨利贞。象天，君子自强不息。用九：见群龙无首，吉"], ["坤卦", "纯阴", "君子厚德载物。象地，柔顺承天。用六：利永贞"], ["泰 与 否", "一组对反", "泰（地天泰）：天地交而万物通；否（天地否）：天地不交而万物不通。「否极泰来」出此"], ["既济 与 未济", "终卦", "既济（水火既济）：事已成而防其变；未济（火水未济）：事未成而含生机"]]}]}, {"t": "爻位与读卦法则", "sub": "读懂一卦的关键：爻的位置决定吉凶", "map": [["爻位", "初二三四五上；奇位为阳位，偶位为阴位"], ["当位", "阳爻居阳位、阴爻居阴位为「当位」（正）"], ["中正", "二爻五爻居中；既中又正为最善"], ["应与比", "初四、二五、三上相应；相邻两爻相比"], ["承乘", "阴爻在阳爻之下为承，在其上为乘"]], "spine": "读爻的四把尺子——当位、得中、有应、承乘——共同决定一爻的吉凶。其中「中」比「正」更重要：得中者即使不当位，也往往无咎。", "fig": "yaowei", "g": [{"g": "爻位的基本规定", "r": [["爻位阴阳", "", "初、三、五为阳位（奇）；二、四、上为阴位（偶）"], ["当位（得正）", "", "阳爻居阳位、阴爻居阴位为当位，象征守正，多吉"], ["不当位（失正）", "", "阳爻居阴位、阴爻居阳位为不当位，象征失正，多有咎（但非绝对）"], ["贵中", "关键", "二爻为下卦之中，五爻为上卦之中。居中者最善，「中」的价值高于「正」"], ["中正", "最善", "既得中又当位（如九五：阳爻居第五位，既中又正），是最理想的爻位"]]}, {"g": "爻际关系", "r": [["应", "", "初与四、二与五、三与上两两相应。一阴一阳则「有应」（相助），同性则「无应」（敌应）"], ["比", "", "相邻两爻的关系。阴阳相邻则相亲（相比）"], ["承", "", "阴爻在阳爻之下曰「承」——以柔承刚，多为顺"], ["乘", "", "阴爻在阳爻之上曰「乘」——以柔乘刚，多为逆、为不安"], ["九五之尊", "", "第五爻居上卦之中、为一卦之君位。阳爻居之（九五）最尊贵"]]}, {"g": "读卦的一般顺序", "r": [["一看卦象", "", "上下二卦是什么，两象相合是何情景（如水在火上为既济）"], ["二看卦名卦辞", "", "卦名点出主题，卦辞（彖辞）断一卦总体吉凶"], ["三看六爻", "自下而上", "逐爻看爻位、爻辞，注意当位、得中、应比"], ["四看主爻", "", "一卦常有主爻（多为五爻或卦中特异之爻），主爻定全卦之义"]]}, {"g": "爻辞常用断语", "r": [["吉凶悔吝", "", "吉（善）、凶（恶）、悔（由凶趋吉的转机）、吝（由吉趋凶的先兆）"], ["无咎", "", "本有过失，但善于补救则无灾。「无咎者，善补过也」"], ["元亨利贞", "四德", "元（始、大）、亨（通）、利（宜、和）、贞（正、固）。乾卦四德，亦为断辞"], ["厉·孚·贞吉", "", "厉（危）、孚（诚信）、贞吉（守正则吉）"]]}]}, {"t": "易传（十翼）与易理", "sub": "从占筮之书到哲学经典：孔门的义理阐发", "map": [["系辞传", "易之通论，阐发易理与筮法总纲"], ["彖传与象传", "释卦辞、卦象与爻辞"], ["文言传", "专释乾坤两卦，发挥其德义"], ["说卦·序卦·杂卦", "说卦（八卦性情方位）、序卦（卦序之理）、杂卦（错杂论卦义）"], ["核心义理", "天人合一、生生之德、变通趣时、中正之道"]], "spine": "《易传》把占筮之书提升为哲学：「一阴一阳之谓道」「生生之谓易」「穷则变，变则通，通则久」——这几句是中国哲学变化观、辩证思维的总源头。", "g": [{"g": "十翼分述", "r": [["彖传", "上下二篇", "解释卦名、卦辞，总断一卦之义。「彖者，言乎象者也」"], ["象传", "上下二篇", "大象释卦象、明取法之道（如「天行健，君子以自强不息」）；小象释各爻爻辞"], ["系辞传", "上下二篇", "易之总论。论易之起源、原理、筮法、圣人之道，哲理最富"], ["文言传", "", "专释乾、坤两卦，深发其义理，为儒家伦理张本"], ["说卦传", "", "阐述八卦的性情、方位、类象——象数派的重要依据"], ["序卦传", "", "说明六十四卦排列的次序与义理逻辑"], ["杂卦传", "", "不依卦序、错杂两卦对举，以简语揭示卦义（如「乾刚坤柔」）"]]}, {"g": "核心哲学命题", "r": [["一阴一阳之谓道", "《系辞》", "阴阳的对立统一即是「道」——中国哲学本体论的核心命题"], ["生生之谓易", "", "天地之大德曰生，变化不息、创生不已，即是「易」"], ["穷则变，变则通，通则久", "", "
